/* The (i): small, quiet, drawn not typed so it sits dead centre. */
html body #view .edrms-has-i .edrms-i,html body #view [class] .edrms-i,html body #view .edrms-i{letter-spacing:0!important;text-transform:none!important;text-indent:0!important;box-sizing:border-box!important;display:inline-flex!important;align-items:center!important;justify-content:center!important;width:13px!important;height:13px!important;padding:0!important;border:1px solid #d3dce6!important;color:#a3b1c0!important;background:transparent!important;box-shadow:none!important;line-height:1!important;font:700 10px/1 "Segoe UI",sans-serif!important}

html body #view .edrms-i:hover::after,html body #view .edrms-i:focus::after{box-sizing:border-box!important;width:240px!important;max-width:240px!important;white-space:normal!important;text-align:left!important;text-transform:none!important;letter-spacing:0!important;right:auto!important;left:var(--tipx,-224px)!important;top:18px!important;z-index:1000!important}
</style>
<script>
(function(){
  var SVG='<svg viewBox="0 0 8 10" width="8" height="10" aria-hidden="true" style="display:block;width:8px;height:10px"><circle cx="4" cy="1.4" r="1.3" fill="currentColor"/><rect x="2.9" y="3.6" width="2.2" height="6.4" rx="0.6" fill="currentColor"/></svg>';
  var KTIP={"unique visitors":"The number of different people who opened at least one EDRMS site in the last 180 days. A person who opened several sites is counted once."};
  var TIP={
    "approximate headcount":"The approximate number of people in each Department, Office, RM or RO, as provided by RAC.",
    "users active in the last 180 days":"People who opened or edited a file in an EDRMS site at least once in the last 180 days.",
    "no access in 180 days (approx)":"An estimate of the people who have not opened any EDRMS site in the last 180 days: the approximate headcount minus the active users.",
    "departments, offices, rms and ros in the list":"The number of Departments, Offices, RMs and ROs shown in the table below.",
    "completed training":"The number of people who have completed the EDRMS training course.",
    "training completion":"The share of the approximate headcount who have completed the EDRMS training course.",
    "documents":"All files stored in EDRMS sites for the Departments, Offices, RMs and ROs shown.",
    "records declared":"Documents that have been declared as official records in EDRMS.",
    "declaration rate":"Records declared as a share of all documents stored in EDRMS.",
    "unique users declaring records":"The number of different people who have declared at least one record in EDRMS."
  };
  function norm(t){return (t||"").replace(/\s+/g," ").trim().toLowerCase();}
  function mk(text){var i=document.createElement("span");i.className="edrms-i";i.innerHTML=SVG;i.setAttribute("tabindex","0");i.setAttribute("role","img");i.setAttribute("aria-label",text);i.setAttribute("data-tip",text);i.addEventListener("click",function(e){e.stopPropagation();i.focus();});return i;}
  function run(){
    document.querySelectorAll("#view .edrms-i").forEach(function(i){
      if(!i.querySelector("svg"))i.innerHTML=SVG;
      var lab=i.parentElement, t=lab?norm((lab.textContent||"")):"";
      if(KTIP[t]&&i.getAttribute("data-tip")!==KTIP[t]){i.setAttribute("data-tip",KTIP[t]);i.setAttribute("aria-label",KTIP[t]);}
    });
    document.querySelectorAll("#view #bw-drill .tile").forEach(function(t){
      if(t.querySelector(".edrms-i"))return;
      var lab=t.querySelector(".tl");if(!lab)return;
      var text=TIP[norm(lab.textContent)];if(!text)return;
      lab.appendChild(mk(text));t.classList.add("edrms-has-i","edrms-tile-i");
    });
  }
  function tipSide(e){
    var i=e.target&&e.target.closest&&e.target.closest(".edrms-i");if(!i)return;
    var r=i.getBoundingClientRect(),side=document.getElementById("side"),sr=side?side.getBoundingClientRect():null;
    var edge=(sr&&sr.width&&sr.right<window.innerWidth/2)?sr.right:0;
    var want=r.right+4-240,min=edge+8,max=window.innerWidth-248;
    var x=Math.min(Math.max(want,min),Math.max(min,max));
    i.style.setProperty("--tipx",Math.round(x-r.left)+"px");
  }
  document.addEventListener("mouseover",tipSide,true);document.addEventListener("focusin",tipSide,true);
  var busy=false;
  new MutationObserver(function(){if(busy)return;busy=true;requestAnimationFrame(function(){requestAnimationFrame(function(){run();busy=false;});});}).observe(document.documentElement,{childList:true,subtree:true});
  if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",run);else run();
})();
</script>
