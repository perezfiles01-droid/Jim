/* ===================================================================
   Project Insights. Rebuilt 16 Aug 2026 to the client's own slides.

   Three of their drawings govern this screen. Two are the sovereign and
   nonsovereign tables, keyed on project number and project name, with
   four measures whose column names are used here verbatim. The third is
   Project Insights slide 1: a project name header, an eight field
   profile grid, seven clickable top panel tiles, and three charts, a
   users pie, the record declaration trend and a documents against
   records comparison read site by site.

   Their note on the tiles says "Clickable top panel stats to show data;
   see Departmental Insights for template", so the tiles open a drill
   table beneath them exactly as Department Insights does.

   What has not changed is the blocker. Nothing anywhere classifies a
   site as a project site, let alone maps it to a project number, and
   their slide 1 adds a second missing source: facility type, modality,
   country, status, effectivity and closing dates all live in an ADB
   project system that has never been named in this work. The figures
   here are illustrative and the checker workbook records that.
   =================================================================== */
DASHBOARDS.pj=(function(){
  const BW=DASHBOARDS.bw.summary;

  /* The projects come from Bank-wide, which owns them because PPT s36 and s37
     are Bank-wide screens. Reading them rather than keeping a second copy is
     what stops this dashboard and that one disagreeing about a project. */
  const PROJECTS=BW.projectRows;

  /* ===== sites within a project =====
     The comparison chart on their slide 1 is read site by site, so a project
     needs its sites broken out. Every measure is split from the project total
     and the remainder lands on the first site, so the site rows always add
     back up to the project. A declaration rate that varies between sites is
     the whole point of the chart: their drawing shows 100 percent, 60 percent
     and 20 percent side by side. */
  function split(total,weights){
    const s=weights.reduce((a,b)=>a+b,0);
    const out=weights.map(w=>Math.max(1,Math.round(total*w/s)));
    out[0]+=total-out.reduce((a,b)=>a+b,0);
    if(out[0]<0)out[0]=0;
    return out;
  }
  /* Fixed weights, so a site keeps the same shape between draws. The declared
     weights deliberately differ from the document weights, which is what makes
     one site declare nearly everything and another very little. */
  const DOC_W=[5,4,3,3,2], REC_W=[5,2,4,1,3];
  const SITES={};
  PROJECTS.forEach(p=>{
    const n=p.sites;
    const docs=split(p.docs,DOC_W.slice(0,n));
    const rec=split(p.rec,REC_W.slice(0,n));
    const phys=split(p.phys,REC_W.slice(0,n));
    const users=split(p.users,DOC_W.slice(0,n));
    const vis=split(p.visitors,DOC_W.slice(0,n));
    SITES[p.no]=docs.map((d,i)=>({
      name:p.no+" site "+(i+1),
      docs:d,
      /* A site can never declare more than it holds. Without this clamp the
         two independent splits can cross and print a rate above 100 percent,
         which is the kind of plausible wrong number that survives review. */
      rec:Math.min(d,rec[i]),
      phys:Math.min(d,phys[i]), users:users[i], visitors:vis[i]
    }));
    /* Whatever the clamp took off the declared total is returned to the first
       site that has room, so the site rows still sum to the project. */
    let short=p.rec-SITES[p.no].reduce((a,s)=>a+s.rec,0);
    for(const s of SITES[p.no]){ if(short<=0)break;
      const room=s.docs-s.rec; const add=Math.min(room,short); s.rec+=add; short-=add; }
  });
  PROJECTS.forEach(p=>{
    const s=SITES[p.no];
    console.assert(s.reduce((a,x)=>a+x.docs,0)===p.docs,
      "Site documents must total the project document count, "+p.no);
    console.assert(s.reduce((a,x)=>a+x.rec,0)===p.rec,
      "Site declarations must total the project declared count, "+p.no);
    console.assert(s.every(x=>x.rec<=x.docs),
      "A site can never declare more records than it holds documents, "+p.no);
  });

  /* The user mix is the client's own split from their pie: staff three
     quarters, consultants a sixth, contractors the rest. */
  const MIX=[{k:"Staff",w:0.75,c:"var(--blue)"},
             {k:"Consultants",w:0.17,c:"var(--green)"},
             {k:"Contractors",w:0.08,c:"var(--teal)"}];
  function mixFor(p){
    const parts=split(p.users,MIX.map(m=>Math.round(m.w*1000)));
    return MIX.map((m,i)=>({label:m.k,value:parts[i],color:m.c}));
  }

  let facility="Sovereign";
  let selected=PROJECTS[0].no;
  let openKpi="sites";

  const inScope=()=>PROJECTS.filter(p=>p.facility===facility);
  const P=()=>PROJECTS.find(p=>p.no===selected);
  const sum=(list,k)=>list.reduce((a,p)=>a+p[k],0);
  const PCT=(a,b)=>b?(a/b*100):0;

  /* ===== the sovereign and nonsovereign tables =====
     Column names are the client's, word for word. A row opens that project in
     the profile panel below, which is what their clickable note asks for. */
  const PCOLS=["Project number and name","Number of EDRMS SharePoint sites",
               "Total number of documents","Total number of records declared",
               "Total number of physical counterparts"];

  function drawList(){
    const rows=inScope();
    document.getElementById("pj-list").innerHTML=
      `<div class="dhead">`+PCOLS.map((c,i)=>
        `<div class="${i?"num":""}">${c}</div>`).join("")+`</div>`+
      rows.map(p=>`<div class="drow go${p.no===selected?" on":""}" data-no="${p.no}"
          role="link" tabindex="0" title="Open the profile for ${p.no}">
        <div class="dn"><span class="lk">${p.no}</span><small>${p.name}</small></div>
        <div class="num">${F(p.sites)}</div><div class="num">${F(p.docs)}</div>
        <div class="num">${F(p.rec)}</div><div class="num">${F(p.phys)}</div></div>`).join("")+
      `<div class="dtot"><div>${facility} projects, total</div>
        <div class="num">${F(sum(rows,"sites"))}</div><div class="num">${F(sum(rows,"docs"))}</div>
        <div class="num">${F(sum(rows,"rec"))}</div><div class="num">${F(sum(rows,"phys"))}</div></div>`;

    document.querySelectorAll("#pj-list .drow.go").forEach(el=>{
      const go=()=>{ selected=el.dataset.no; drawList(); drawProfile(); };
      el.onclick=go;
      el.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();go();}};
    });
  }

  /* ===== the seven top panel tiles, and the drill behind each =====
     Labels are the client's own wording from their slide. All seven are
     clickable, because on their drawing all seven are underlined, so every
     one carries the tap chevron and its own handler. */
  const TILES=[
    {k:"sites",   lab:"Total number of sites created",                  val:p=>F(p.sites)},
    {k:"users",   lab:"Total number of EDRMS users",                    val:p=>F(p.users)},
    {k:"visitors",lab:"Total number of site visitors",                  val:p=>F(p.visitors)},
    {k:"docs",    lab:"Total number of documents in EDRMS",             val:p=>F(p.docs)},
    {k:"rec",     lab:"Total number of records declared in EDRMS",      val:p=>F(p.rec)},
    {k:"phys",    lab:"Total number of physical counterparts identified",val:p=>F(p.phys)},
    {k:"due",     lab:"Total number of records due for disposal",       val:p=>F(p.due)},
  ];

  const DRILL={
    sites:{title:"Sites created for this project",
      cols:["Site","Documents","Records declared","Counterparts","Declaration rate"],
      rows:p=>SITES[p.no].map(s=>[s.name,F(s.docs),F(s.rec),F(s.phys),
        PCT(s.rec,s.docs).toFixed(1)+"%"])},
    users:{title:"EDRMS users on this project",
      cols:["Site","Users","Staff","Consultants","Contractors"],
      rows:p=>SITES[p.no].map(s=>{
        const st=Math.round(s.users*0.75), cs=Math.round(s.users*0.17);
        return [s.name,F(s.users),F(st),F(cs),F(Math.max(0,s.users-st-cs))];})},
    visitors:{title:"Site visitors on this project",
      cols:["Site","Visitors","Users","Visitors per user","Documents"],
      rows:p=>SITES[p.no].map(s=>[s.name,F(s.visitors),F(s.users),
        (s.visitors/Math.max(1,s.users)).toFixed(2),F(s.docs)])},
    docs:{title:"Documents held on this project",
      cols:["Site","Documents","Share of project","Records declared","Not declared"],
      rows:p=>SITES[p.no].map(s=>[s.name,F(s.docs),PCT(s.docs,p.docs).toFixed(1)+"%",
        F(s.rec),F(s.docs-s.rec)])},
    rec:{title:"Records declared on this project",
      cols:["Site","Records declared","Share of project","Documents","Declaration rate"],
      rows:p=>SITES[p.no].map(s=>[s.name,F(s.rec),PCT(s.rec,p.rec).toFixed(1)+"%",
        F(s.docs),PCT(s.rec,s.docs).toFixed(1)+"%"])},
    phys:{title:"Physical counterparts identified on this project",
      cols:["Site","Counterparts","Records declared","Share with a counterpart","Documents"],
      rows:p=>SITES[p.no].map(s=>[s.name,F(s.phys),F(s.rec),
        PCT(s.phys,s.rec).toFixed(1)+"%",F(s.docs)])},
    due:{title:"Records due for disposal on this project",
      cols:["Site","Records due","Records declared","Share due","Counterparts"],
      rows:p=>{
        const parts=split(p.due,SITES[p.no].map(s=>s.rec));
        return SITES[p.no].map((s,i)=>[s.name,F(parts[i]),F(s.rec),
          PCT(parts[i],s.rec).toFixed(2)+"%",F(s.phys)]);}},
  };

  function drawTiles(){
    const p=P();
    document.getElementById("pj-kpis").innerHTML=
      `<div class="kpigrp act">
         <div class="gh"><b>Open a breakdown</b><span>${TILES.length} cards, each opens the table beneath</span></div>
         <div class="kpis">${TILES.map(t=>
           `<div class="kpi ${t.k===openKpi?"on":""}" data-k="${t.k}"><div class="lab">${t.lab}</div>
              <div class="val">${t.val(p)}</div><div class="tap">&#9662; Click to open</div></div>`).join("")}</div>
       </div>`;
  }

  /* Per card, updating the rail in place rather than rebuilding the grid, for
     the same reason as the other dashboards: rebuilding destroys the node
     being clicked part way through the event and the selection is lost. */
  function wireTiles(){
    document.querySelectorAll("#pj-kpis .kpi[data-k]").forEach(card=>{
      card.onclick=()=>{
        openKpi=card.dataset.k;
        document.querySelectorAll("#pj-kpis .kpi[data-k]").forEach(el=>
          el.classList.toggle("on",el.dataset.k===openKpi));
        drawDrill();
      };
    });
  }

  function drawDrill(){
    const p=P(), d=DRILL[openKpi], rows=d.rows(p);
    document.getElementById("pj-drill").innerHTML=
      `<div class="ptitle">${d.title}</div>
       <div class="psub">Every site carrying this project, and what it holds.</div>
       <div class="scrollx"><div class="dtab" style="--dc:190px repeat(${d.cols.length-1},1fr)">
         <div class="dhead">${d.cols.map((c,i)=>
           `<div class="${i?"num":""}">${c}</div>`).join("")}</div>
         ${rows.map(r=>`<div class="drow">${r.map((c,j)=>
           j?`<div class="num">${c}</div>`:`<div class="dn">${c}</div>`).join("")}</div>`).join("")}
       </div></div>`;
  }

  function drawProfile(){
    const p=P();
    document.getElementById("pj-pname").textContent=p.name;
    document.getElementById("pj-profile").innerHTML=[
      ["Facility type",p.facility],["Project number",p.no],
      ["Project type, modality of assistance",p.modality],["Modality number",p.modNo],
      ["Country or economy",p.country],["Project status",p.status],
      ["Effectivity date",p.effective],["Closing date, actual",p.closing],
    ].map(([k,v])=>`<div class="pf"><div class="k">${k}</div><div class="v">${v}</div></div>`).join("");
    drawTiles(); wireTiles(); drawDrill();
    drawMix(); drawTrend(); drawCompare();
  }

  /* ===== the three charts on their slide 1 ===== */
  function drawMix(){
    const p=P(), parts=mixFor(p);
    document.getElementById("pj-mix").innerHTML=CHART.donut(parts,
      {centreValue:F(p.users),centreLabel:"users",size:170});
  }

  /* Cumulative, matching the Records Declaration Trend on Bank-wide and the
     curve the client drew on this slide. The project's monthly shape is the
     bank-wide one scaled to its own declared total, so the last point of the
     curve is the project's declared count and not an unrelated number. */
  function drawTrend(){
    const p=P();
    const share=p.rec/DATA.MONTH_VALUES.reduce((a,v)=>a+v,0);
    const monthly=DATA.MONTH_VALUES.map(v=>Math.round(v*share));
    monthly[monthly.length-1]+=p.rec-monthly.reduce((a,v)=>a+v,0);
    let run=0;
    const pts=DATA.MONTH_VALUES.map((v,i)=>{
      run+=monthly[i];
      return {label:DATA.MONTH_FULL[i],short:DATA.MONTH_LABELS[i],value:run};
    });
    console.assert(pts[pts.length-1].value===p.rec,
      "The project declaration curve must end at the project declared count");
    document.getElementById("pj-trend").innerHTML=CHART.area(pts,{height:200});
  }

  /* Documents against records declared, site by site, with the declaration
     rate alongside. Their drawing puts the rate on a second axis; two bars
     and a printed percentage says the same thing without a dual axis, which
     Power BI supports but reads badly at this width. */
  function drawCompare(){
    const p=P(), sites=SITES[p.no];
    const mx=Math.max(...sites.map(s=>s.docs),1);
    document.getElementById("pj-cmp").innerHTML=sites.map(s=>`
      <div class="cmp">
        <div class="cl">${s.name}<small>${PCT(s.rec,s.docs).toFixed(1)}% declared</small></div>
        <div class="cbars">
          <div class="cbar" style="width:${Math.max(4,100*s.docs/mx)}%;background:var(--orange)">${F(s.docs)}</div>
          <div class="cbar" style="width:${Math.max(4,100*s.rec/mx)}%;background:var(--green)">${F(s.rec)}</div>
        </div>
      </div>`).join("");
  }

  const html=`<section class="dash-pj">
    <div class="band">
      <h2>Project insights</h2>
      <div class="bd">How project sites are being used and maintained.</div>
    </div>

    <div class="band">
      <h2>Projects</h2>
      <div class="bd">Sovereign and nonsovereign projects, keyed by project number and project name.</div>
    </div>
    <div class="panel">
      <div class="ptitle">Total number of active EDRMS SharePoint sites by project</div>
      <div class="psub">Click a project to open its profile below.</div>
      <div class="toolbar">
        <span class="lbl">Facility type</span>
        <select id="pj-fac">
          <option value="Sovereign">Sovereign projects</option>
          <option value="Nonsovereign">Nonsovereign projects</option>
        </select>
        <button class="resetbtn" id="pj-reset">Reset</button>
      </div>
      <div class="scrollx"><div class="dtab wide" id="pj-list"></div></div>
    </div>

    <div class="band">
      <h2>Project profile</h2>
      <div class="bd">Profile, activity and recordkeeping for one project.</div>
    </div>
    <div class="panel">
      <div class="ptitle" id="pj-pname"></div>
      <div class="psub">Profile, activity and recordkeeping for one project.</div>
      <div class="toolbar">
        <span class="lbl">Project</span>
        <select id="pj-sel"></select>
      </div>
      <div class="profile" id="pj-profile"></div>
      <div id="pj-kpis"></div>
    </div>
    <div class="panel" id="pj-drill"></div>
    <div class="panel">
      <div class="ptitle">Users, declaration trend and documents against records</div>
      <div class="psub">The user mix, records declared over time, and how each site compares.</div>
      <div class="crow">
        <div class="chart"><div class="ctitle">Number of users</div><div id="pj-mix"></div></div>
        <div class="chart"><div class="ctitle">Record declaration trend</div><div id="pj-trend"></div></div>
      </div>
      <div class="ctitle" style="margin-top:18px">Comparison: documents against records declared</div>
      <div class="legend">
        <span><i style="background:var(--orange)"></i>Number of documents</span>
        <span><i style="background:var(--green)"></i>Number of records declared</span>
      </div>
      <div id="pj-cmp"></div>
    </div>
  </section>`;

  function init(){
    const fac=document.getElementById("pj-fac");
    const sel=document.getElementById("pj-sel");
    function fillSel(){
      sel.innerHTML=PROJECTS.map(p=>
        `<option value="${p.no}" ${p.no===selected?"selected":""}>${p.no} - ${p.country}</option>`).join("");
    }
    /* Switching facility type moves the selected project into the list being
       shown, so the table and the profile below it never disagree about which
       project the reader is looking at. */
    fac.onchange=e=>{
      facility=e.target.value;
      if(!inScope().some(p=>p.no===selected))selected=inScope()[0].no;
      fillSel(); drawList(); drawProfile();
    };
    sel.onchange=e=>{
      selected=e.target.value;
      const p=P();
      if(p.facility!==facility){facility=p.facility;fac.value=facility;}
      drawList(); drawProfile();
    };
    document.getElementById("pj-reset").onclick=()=>{
      facility="Sovereign"; selected=inScope()[0].no; openKpi="sites";
      fac.value=facility; fillSel(); drawList(); drawProfile();
    };
    fac.value=facility;
    fillSel(); drawList(); drawProfile();
  }

  return {
    ver:"Project Insights Dashboard",
    crumb:"Project Insights",
    asof:"Data as of Mon 20 Jul 2026 23:59, refreshed Tue 21 Jul 06:00",
    summary:{projects:PROJECTS.length,
      sovereign:PROJECTS.filter(p=>p.facility==="Sovereign").length,
      nonsovereign:PROJECTS.filter(p=>p.facility==="Nonsovereign").length},
    /* Called by openDashboard() when a reader clicks the sovereign or
       nonsovereign row on Bank-wide, so they land on that facility type. */
    focus(fac){
      if(fac!=="Sovereign"&&fac!=="Nonsovereign")return;
      facility=fac;
      if(!inScope().some(p=>p.no===selected))selected=inScope()[0].no;
    },
    html,init
  };
})();

   ================================================================= */
/* ===================================================================
   Institutional File Plan Insights. PPT s29 to s31 and s47 to s52.

   Two blockers stacked on each other, which is why this is the longest
   lead time item in the client's deck.

   First, the five categories exist in neither system. The SharePoint term
   store holds six dropdown value sets, sixteen terms, one level deep.
   Purview holds fifty three retention labels as a flat list. Neither is
   an institutional file plan.

   Second, and worse, even if the client says tomorrow where the file plan
   lives, nothing links a term to a library or to a document. The file plan
   table has no join key and the document table carries no TermId. Every
   figure on PPT s47 to s52 needs that join, so it is a design change and a
   scan change rather than a report change.
   =================================================================== */
DASHBOARDS.fp=(function(){
  const BW=DASHBOARDS.bw.summary;

  /* The five categories are the client's, from PPT s47. The terms under them
     are their own examples from s48 to s52, extended so each category has
     enough rows to read as a list rather than a placeholder. */
  const PLAN=[
    {cat:"Institutional Management", terms:["Annual Meetings","Board Papers","Executive Correspondence",
      "Governance and Oversight","Institutional Policies"]},
    {cat:"Administration", terms:["Budgeting","Facilities","Procurement","Travel","Records and Archives"]},
    {cat:"People Management", terms:["Learning and Development","Recruitment","Staff Records",
      "Benefits and Payroll"]},
    {cat:"Programs and Operations", terms:["Portfolio Management","Country Planning","Loan Agreements",
      "Project Completion","Safeguards","Technical Assistance"]},
    {cat:"Other", terms:["Photos and Audiovisual","Legacy Content","Unclassified"]},
  ];

  function split(total,weights){
    const s=weights.reduce((a,b)=>a+b,0);
    const out=weights.map(w=>Math.max(1,Math.round(total*w/s)));
    out[0]+=total-out.reduce((a,b)=>a+b,0);
    return out;
  }

  /* Every term gets a share of the bank-wide totals, so the categories sum to
     the whole and the panel cannot quietly disagree with Records Management. */
  const FLAT=[];
  PLAN.forEach(c=>c.terms.forEach(t=>FLAT.push({cat:c.cat,term:t})));
  const w=FLAT.map((f,i)=>1+((i*7+f.term.length)%9)*0.34);
  const recS=split(DATA.DECLARED,w), docS=split(DATA.DOCUMENTS,w),
        physS=split(DATA.WITH_PHYSICAL,w), libS=split(267,w), depS=split(96,w);
  FLAT.forEach((f,i)=>{f.rec=recS[i];f.docs=docS[i];f.phys=physS[i];f.libs=libS[i];f.depts=depS[i];});
  const CATTOT=PLAN.map(c=>{
    const rows=FLAT.filter(f=>f.cat===c.cat);
    return {cat:c.cat, terms:rows.length,
      rec:rows.reduce((a,r)=>a+r.rec,0), docs:rows.reduce((a,r)=>a+r.docs,0),
      phys:rows.reduce((a,r)=>a+r.phys,0), libs:rows.reduce((a,r)=>a+r.libs,0),
      depts:Math.max(...rows.map(r=>r.depts))};
  });
  console.assert(CATTOT.reduce((a,c)=>a+c.rec,0)===DATA.DECLARED,
    "File plan categories must total the declared record count");
  console.assert(CATTOT.reduce((a,c)=>a+c.docs,0)===DATA.DOCUMENTS,
    "File plan categories must total the document count");

  const TOTAL_TERMS=FLAT.length;
  let cat=PLAN[0].cat;

  function drawCats(){
    document.getElementById("fp-cats").innerHTML=
      `<div class="dhead"><div>Category</div><div class="num">Terms</div>
        <div class="num">Departments</div><div class="num">Libraries</div>
        <div class="num">Documents</div><div class="num">Records declared</div>
        <div class="num">Counterparts</div></div>`+
      CATTOT.map(c=>`<div class="drow"><div class="dn">${c.cat}</div>
        <div class="num">${F(c.terms)}</div><div class="num">${F(c.depts)}</div>
        <div class="num">${F(c.libs)}</div><div class="num">${F(c.docs)}</div>
        <div class="num">${F(c.rec)}</div><div class="num">${F(c.phys)}</div></div>`).join("")+
      `<div class="dtot"><div>Total</div><div class="num">${F(TOTAL_TERMS)}</div>
        <div class="num">${F(96)}</div>
        <div class="num">${F(CATTOT.reduce((a,c)=>a+c.libs,0))}</div>
        <div class="num">${F(DATA.DOCUMENTS)}</div><div class="num">${F(DATA.DECLARED)}</div>
        <div class="num">${F(DATA.WITH_PHYSICAL)}</div></div>`;
  }

  function drawTerms(){
    const rows=FLAT.filter(f=>f.cat===cat);
    document.getElementById("fp-terms").innerHTML=
      `<div class="dhead"><div>Term, top level</div><div class="num">Departments</div>
        <div class="num">Libraries</div><div class="num">Documents</div>
        <div class="num">Records declared</div><div class="num">Counterparts</div></div>`+
      rows.map(t=>`<div class="drow"><div class="dn">${t.term}<small>${cat}</small></div>
        <div class="num">${F(t.depts)}</div><div class="num">${F(t.libs)}</div>
        <div class="num">${F(t.docs)}</div><div class="num">${F(t.rec)}</div>
        <div class="num">${F(t.phys)}</div></div>`).join("")+
      `<div class="dtot"><div>${cat} total</div>
        <div class="num"></div>
        <div class="num">${F(rows.reduce((a,r)=>a+r.libs,0))}</div>
        <div class="num">${F(rows.reduce((a,r)=>a+r.docs,0))}</div>
        <div class="num">${F(rows.reduce((a,r)=>a+r.rec,0))}</div>
        <div class="num">${F(rows.reduce((a,r)=>a+r.phys,0))}</div></div>`;
  }

  function drawCatCharts(){
    document.getElementById("fp-tree").innerHTML=CHART.treemap(
      CATTOT.map(c=>({label:c.cat,value:c.rec})),{height:250});
    document.getElementById("fp-donut").innerHTML=CHART.donut(
      CATTOT.map(c=>({label:c.cat,value:c.rec})),
      {centreValue:F(DATA.DECLARED),centreLabel:"declared records",size:150});
  }

  function drawUsage(){
    const sorted=[...FLAT].sort((a,b)=>b.rec-a.rec);
    const top=sorted.slice(0,6), bottom=sorted.slice(-6).reverse();
    const mx=top[0].rec;
    const bar=(list,colour)=>CHART.hbars(
      list.map(t=>({label:t.term,sub:t.cat,value:t.rec,color:colour})));
    document.getElementById("fp-top").innerHTML=bar(top,"var(--blue)");
    document.getElementById("fp-bottom").innerHTML=bar(bottom,"var(--orange)");
  }

  const html=`<section class="dash-fp">
    <div class="band">
      <h2>Institutional file plan insights</h2>
      <div class="bd">How file plan terms are being applied across sites and libraries.</div>
    </div>


    <div class="kpis" id="fp-kpis"></div>

    <div class="band">
      <h2>Terms by category</h2>
      <div class="bd">The five top level groupings of the institutional file plan.</div>
    </div>
    <div class="panel">
      <div class="ptitle">The five categories</div>
      <div class="psub">Sized by records declared against each category.</div>
      <div class="crow" style="margin-bottom:16px">
        <div class="chart wide"><div class="ctitle">Records declared by category</div><div id="fp-tree"></div></div>
        <div class="chart"><div class="ctitle">Share of the declared holding</div><div id="fp-donut"></div></div>
      </div>
      <div class="scrollx"><div class="dtab" style="--dc:230px repeat(6,1fr)" id="fp-cats"></div></div>
    </div>

    <div class="band">
      <h2>Terms within a category</h2>
      <div class="bd">The terms within each category, and how heavily each is used.</div>
    </div>
    <div class="panel">
      <div class="ptitle">Top level terms</div>
      <div class="psub">Choose a category to see its terms.</div>
      <div class="toolbar">
        <span class="lbl">Category</span>
        <select id="fp-cat"></select>
      </div>
      <div class="scrollx"><div class="dtab" style="--dc:230px repeat(5,1fr)" id="fp-terms"></div></div>
    </div>

    <div class="band">
      <h2>Term usage</h2>
      <div class="bd">Which terms are being used, and which are candidates for review or deletion.</div>
    </div>
    <div class="panel">
      <div class="ptitle">Most used terms</div>
      <div class="psub">By records declared against the term.</div>
      <div id="fp-top"></div>
    </div>
    <div class="panel">
      <div class="ptitle">Least used terms</div>
      <div class="psub">The least applied terms, as candidates for review or deletion.</div>
      <div id="fp-bottom"></div>
    </div>

    <div class="band">
      <h2>Declaration by classification and business process</h2>
      <div class="bd">How declared records divide across classification and business process.</div>
    </div>
    <div class="panel">
      <div class="ptitle">Records declared by classification and by business process</div>
      <div class="psub">How declared records divide across the file plan and the business processes behind it.</div>
      <div class="tiles">
        <div class="tile"><div class="tl">Records by classification</div><div class="tv">${F(DATA.DECLARED)}</div></div>
        <div class="tile"><div class="tl">Records by business process</div><div class="tv">${F(Math.round(DATA.DECLARED*0.83))}</div></div>
        <div class="tile"><div class="tl">Classified records</div><div class="tv">${F(Math.round(DATA.DECLARED*0.83))}</div></div>
        <div class="tile"><div class="tl">Unclassified records</div><div class="tv">${F(DATA.DECLARED-Math.round(DATA.DECLARED*0.83))}</div></div>
      </div>
    </div>
  </section>`;

  function init(){
    document.getElementById("fp-kpis").innerHTML=[
      ["Total Terms",F(TOTAL_TERMS)],
      ...CATTOT.slice(0,3).map(c=>[c.cat+" Terms",F(c.terms)]),
    ].map(([l,v])=>`<div class="kpi stat"><div class="lab">${l}</div><div class="val">${v}</div>
      <div class="sub">Across the institutional file plan</div></div>`).join("");
    const sel=document.getElementById("fp-cat");
    sel.innerHTML=PLAN.map(c=>`<option value="${c.cat}">${c.cat}</option>`).join("");
    sel.onchange=e=>{cat=e.target.value;drawTerms();};
    drawCats();drawTerms();drawUsage();drawCatCharts();
  }

  return {
    ver:"Institutional File Plan Dashboard",
    crumb:"Institutional File Plan Insights",
    asof:"Data as of Mon 20 Jul 2026 23:59, refreshed Tue 21 Jul 06:00",
    summary:{totalTerms:TOTAL_TERMS,categories:PLAN.length},
    html,init
  };
})();


/* =================================================================
   retentiondisposal.js
   ================================================================= */
/* ===================================================================
   Retention and Disposal Insights. PPT s32 and s44 to s46.

   The closest match of the six to something already built, and the one
   needing the least surgery. The existing Retention and File Plan
   dashboard stays mounted until the client chooses between them.

   Split into a permanent screen and a temporary screen, which is the
   client's shape. Everything about due dates is sourceable today.
   Everything about a disposal having happened is not, because the design
   has no DisposalStatus and the EDRMS application has no field to fill it.
   =================================================================== */
DASHBOARDS.rd=(function(){
  const BW=DASHBOARDS.bw.summary;

  function split(total,weights){
    const s=weights.reduce((a,b)=>a+b,0);
    const out=weights.map(w=>Math.max(1,Math.round(total*w/s)));
    out[0]+=total-out.reduce((a,b)=>a+b,0);
    return out;
  }

  const PERM_REC=DATA.PERMANENT;
  const TEMP_REC=DATA.LABEL_TOTAL-DATA.PERMANENT;
  const PERM_PHYS=Math.round(DATA.WITH_PHYSICAL*0.21);
  const TEMP_PHYS=DATA.WITH_PHYSICAL-PERM_PHYS;

  /* Temporary retention terms carry a duration, which is what the client drew
     on PPT s46 as "5, 10, 20, 5 etc years". Permanent carries none. */
  const TEMP=[
    {term:"Programs and Operations",label:"10 years after declaration",years:10},
    {term:"Administration",         label:"5 years after declaration", years:5},
    {term:"People Management",      label:"7 years after separation",  years:7},
    {term:"Institutional Management",label:"20 years after closure",   years:20},
    {term:"Other",                  label:"3 years after declaration", years:3},
  ];
  const PERM=[
    {term:"Institutional Management",note:"Board and governance records"},
    {term:"Programs and Operations", note:"Completed project records"},
    {term:"Administration",          note:"Approved policies"},
  ];
  const tw=TEMP.map((t,i)=>1+((i*5+t.term.length)%7)*0.3);
  const tRec=split(TEMP_REC,tw), tPhys=split(TEMP_PHYS,tw),
        tDue=split(DATA.DUE_NEXT_12,tw), tLibs=split(203,tw), tDept=split(64,tw);
  TEMP.forEach((t,i)=>{t.rec=tRec[i];t.phys=tPhys[i];t.due=tDue[i];t.libs=tLibs[i];t.depts=tDept[i];});
  const pw=PERM.map((t,i)=>1+((i*4+t.term.length)%5)*0.4);
  const pRec=split(PERM_REC,pw), pPhys=split(PERM_PHYS,pw), pLibs=split(64,pw), pDept=split(32,pw);
  PERM.forEach((t,i)=>{t.rec=pRec[i];t.phys=pPhys[i];t.libs=pLibs[i];t.depts=pDept[i];});

  console.assert(PERM_REC+TEMP_REC===DATA.LABEL_TOTAL,
    "Permanent plus temporary must total every labelled record");
  console.assert(TEMP.reduce((a,t)=>a+t.due,0)===DATA.DUE_NEXT_12,
    "Temporary retention terms must carry every record due for disposal");
  console.assert(PERM.reduce((a,t)=>a+t.rec,0)===PERM_REC,
    "Permanent terms must total the permanent record count");

  let mode="temporary";

  function drawTerms(){
    const temp=mode==="temporary";
    const rows=temp?TEMP:PERM;
    document.getElementById("rd-terms").innerHTML=
      `<div class="dhead"><div>Term, top level</div><div class="num">Departments</div>
        <div class="num">Libraries</div><div class="num">Records declared</div>
        <div class="num">Counterparts</div><div class="num">${temp?"Retention label":"Retention"}</div>
        <div class="num">${temp?"Due for disposal":"Due"}</div><div class="num">Disposed</div></div>`+
      rows.map(t=>`<div class="drow"><div class="dn">${t.term}${t.note?`<small>${t.note}</small>`:""}</div>
        <div class="num">${F(t.depts)}</div><div class="num">${F(t.libs)}</div>
        <div class="num">${F(t.rec)}</div><div class="num">${F(t.phys)}</div>
        <div class="num">${temp?t.label:"Permanent"}</div>
        <div class="num">${temp?F(t.due):"never"}</div>
        <div class="num">${temp?F(Math.round(t.due*0.42)):"0"}</div></div>`).join("")+
      `<div class="dtot"><div>${temp?"Temporary":"Permanent"} total</div>
        <div class="num"></div>
        <div class="num">${F(rows.reduce((a,t)=>a+t.libs,0))}</div>
        <div class="num">${F(rows.reduce((a,t)=>a+t.rec,0))}</div>
        <div class="num">${F(rows.reduce((a,t)=>a+t.phys,0))}</div>
        <div class="num"></div>
        <div class="num">${temp?F(DATA.DUE_NEXT_12):"never"}</div>
        <div class="num">${temp?F(Math.round(DATA.DUE_NEXT_12*0.42)):"0"}</div></div>`;
    document.getElementById("rd-mode-note").textContent=temp
      ? "Temporary retention carries a duration, so every record under it eventually falls due. The durations below are the ones the client drew on PPT s46."
      : "Permanent retention never falls due for disposal, which is why the whole disposal pipeline excludes it.";
  }

  const html=`<section class="dash-rd">
    <div class="band">
      <h2>Retention and disposal insights</h2>
      <div class="bd">Records approaching disposal, retention labels, and disposal progress.</div>
    </div>

    <div class="kpis" id="rd-kpis"></div>

    <div class="band">

  function drawSplit(){
    document.getElementById("rd-split").innerHTML=CHART.stacked([
      {label:"Temporary retention",value:TEMP_REC,color:"var(--blue)"},
      {label:"Permanent retention",value:PERM_REC,color:"var(--greyblue)"},
    ],{caption:F(DATA.LABEL_TOTAL)+" declared records"});
    document.getElementById("rd-windows").innerHTML=CHART.columns([
      {label:"30 days",value:DATA.DUE_30,color:"var(--orange)"},
      {label:"90 days",value:DATA.DUE_90,color:"var(--blue)"},
      {label:"12 months",value:DATA.DUE_NEXT_12,color:"var(--deepblue)"},
      {label:"Beyond retention",value:DATA.BEYOND_RETENTION,color:"var(--mut)"},
    ],{height:150});
  }

  function init(){
    document.getElementById("rd-kpis").innerHTML=[
      ["Records Due for Disposal",F(DATA.DUE_NEXT_12),"Next 12 months"],
      ["Next Due Date",DATA.NEXT_DUE?DATA.NEXT_DUE:"see Retention","Earliest scheduled disposal"],
      ["Permanent Retention",F(PERM_REC),"Retained permanently"],
      ["Records Disposed",F(Math.round(DATA.DUE_NEXT_12*0.42)),"Completed in the last 12 months"],
    ].map(([l,v,s])=>`<div class="kpi stat"><div class="lab">${l}</div><div class="val">${v}</div>
      <div class="sub">${s}</div></div>`).join("");
    const sel=document.getElementById("rd-mode");
    sel.onchange=e=>{mode=e.target.value;drawTerms();};
    drawTerms();drawSplit();
  }

  return {
    ver:"Retention and Disposal Dashboard",
    crumb:"Retention and Disposal Insights",
    asof:"Data as of Mon 20 Jul 2026 23:59, refreshed Tue 21 Jul 06:00",
    summary:{permanent:PERM_REC,temporary:TEMP_REC,due:DATA.DUE_NEXT_12},
    html,init
  };
})();

/* ===================================================================
   Shell: left nav switches which dashboard is mounted. Only one
   dashboard is in the DOM at a time, which is why both can keep their
   original element ids untouched.
   =================================================================== */
function switchTo(key){
  const d=DASHBOARDS[key];
  if(!d)return;
  document.getElementById("view").innerHTML=d.html;
  document.getElementById("side-ver").textContent=d.ver;
  document.getElementById("crumb-b").textContent=d.crumb;
  document.getElementById("asof").textContent=d.asof;
  document.querySelectorAll("#nav a[data-d]").forEach(a=>a.classList.toggle("on",a.dataset.d===key));
  d.init();
}
document.querySelectorAll("#nav a[data-d]").forEach(a=>a.onclick=()=>switchTo(a.dataset.d));
switchTo("bw");
</script>
