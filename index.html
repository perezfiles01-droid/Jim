/* ===================================================================
   Format and Storage
   Built from the approved mockup. Must be defined after DASHBOARDS.rm,
   because it asserts against that dashboard's declared records total.
   =================================================================== */
DASHBOARDS.fs=(function(){
  /* Average file size is DERIVED, never stored: storageGB * 1024 / files. */
  const FORMATS=[
    {label:"PDF",                files:8200, gb:9.6},
    {label:"Word",               files:5100, gb:3.0},
    {label:"Excel",              files:3050, gb:2.7},
    {label:"Email (.msg / .eml)",files:2100, gb:0.6},
    {label:"PowerPoint",         files:1350, gb:5.9},
    {label:"Image files",        files:980,  gb:3.6},
    {label:"Video files",        files:466,  gb:20.5},
    {label:"All other formats",  files:400,  gb:0.8},
  ];
  const avgOf=f=>f.files?f.gb*1024/f.files:0;
  const TOT_FILES=FORMATS.reduce((a,f)=>a+f.files,0);
  const TOT_GB=FORMATS.reduce((a,f)=>a+f.gb,0);
  const TOT_AVG=TOT_FILES?TOT_GB*1024/TOT_FILES:0;

  /* The format file counts are a decomposition of Total Declared Records on the
     Records Management dashboard. If the department data over there ever
     changes, this fires so the two dashboards cannot silently drift apart. */
  console.assert(TOT_FILES===DASHBOARDS.rm.annualRec,
    `Format and Storage total files (${TOT_FILES}) does not match Records Management declared records (${DASHBOARDS.rm.annualRec})`);

  const COLS=[{k:"files",label:"Number of files"},{k:"gb",label:"Storage (GB)"},{k:"avg",label:"Avg file size (MB)"}];
  const valOf={files:f=>f.files, gb:f=>f.gb, avg:f=>avgOf(f)};
  const fmtOf={files:f=>F(f.files), gb:f=>f.gb.toFixed(1)+" GB", avg:f=>avgOf(f).toFixed(1)};

  let field="files",dir="desc";

  function drawTable(){
    document.querySelectorAll("#fs-field button").forEach(b=>b.classList.toggle("on",b.dataset.f===field));
    document.getElementById("fs-dir").innerHTML=(dir==="desc"?'▼ Highest first':'▲ Lowest first');
    const rows=[...FORMATS].sort((a,b)=>dir==="desc"?valOf[field](b)-valOf[field](a):valOf[field](a)-valOf[field](b));
    const mx={};COLS.forEach(c=>{mx[c.k]=Math.max(...FORMATS.map(f=>valOf[c.k](f)),0.0001);});
    let h=`<div class="fhead"><span>Format</span>`+
      COLS.map(c=>`<span class="num ${c.k===field?'on':''}" data-col="${c.k}">${c.label}</span>`).join("")+`</div>`;
    h+=rows.map(f=>`<div class="frow"><span class="fname">${f.label}</span>`+
      COLS.map(c=>{const w=Math.max(2,100*valOf[c.k](f)/mx[c.k]);
        return `<span class="fcell"><i class="fbar" style="width:${w}%"></i><b>${fmtOf[c.k](f)}</b></span>`;}).join("")+
      `</div>`).join("");
    h+=`<div class="ftot"><span class="fname">Total</span><span class="tv">${F(TOT_FILES)}</span><span class="tv">${TOT_GB.toFixed(1)} GB</span><span class="tv">${TOT_AVG.toFixed(1)}</span></div>`;
    document.getElementById("fs-table").innerHTML=h;
  }
  function drawRecords(){
    const rows=[...FORMATS].sort((a,b)=>b.files-a.files);
    const mx=Math.max(...rows.map(r=>r.files),1);
    document.getElementById("fs-records").innerHTML=rows.map(r=>{
      const pct=TOT_FILES?r.files/TOT_FILES*100:0;
      return `<div class="rbar"><div class="rl">${r.label}</div>
        <div class="rt"><div class="rf" style="width:${Math.max(2,100*r.files/mx)}%"></div></div>
        <div class="rv"><b>${F(r.files)}</b><span> · ${pct.toFixed(1)}%</span></div></div>`;}).join("");
  }

  const html=`<section class="dash-fs">
    <div class="band">
      <h2>Storage footprint by file format</h2>
      <div class="bd">Which file formats consume the most storage across EDRMS compliant sites, and how declared records break down by format.</div>
    </div>
    <div class="kpis">
      <div class="kpi stat"><div class="lab">Storage Consumed by Format</div><div class="val" id="kpi-fsgb"></div><div class="sub" id="sub-fsgb"></div></div>
    </div>
    <div class="panel">
      <div class="ptitle">Storage consumed by format</div>
      <div class="psub">File formats ranked by number of files, storage consumed, and average file size. Bars are scaled within each column, so the longest bar in a column is that column's largest value.</div>
      <div class="sortrow"><span class="lbl">Sort by</span>
        <div class="segctl" id="fs-field"><button data-f="files">Files</button><button data-f="gb">Storage</button><button data-f="avg">Avg file size</button></div>
        <button class="dirbtn" id="fs-dir"></button></div>
      <div class="ftab" id="fs-table"></div>
    </div>

    <div class="kpis">
      <div class="kpi stat"><div class="lab">Most Common Format</div><div class="val" id="kpi-fstop"></div><div class="sub" id="sub-fstop"></div></div>
    </div>
    <div class="panel">
      <div class="ptitle">Declared records by format</div>
      <div class="psub">Declared records broken down by file format, as a count and as a share of all declared records.</div>
      <div id="fs-records"></div>
    </div>
  </section>`;

  function init(){
    document.getElementById("kpi-fsgb").textContent=TOT_GB.toFixed(1)+" GB";
    const top=FORMATS.reduce((a,b)=>b.files>a.files?b:a);
    const heaviest=FORMATS.reduce((a,b)=>b.gb>a.gb?b:a);
    document.getElementById("kpi-fstop").textContent=top.label;
    document.getElementById("sub-fsgb").textContent=
      `Across ${FORMATS.length} formats and ${F(TOT_FILES)} files. ${heaviest.label} takes the most space`;
    /* The finding this dashboard exists to make: the format people see most is
       not the one filling the disk. Stated on the card, not just in the panel. */
    document.getElementById("sub-fstop").textContent=
      `${F(top.files)} files, ${(top.files/TOT_FILES*100).toFixed(0)} percent of all records`;
    document.querySelectorAll("#fs-field button").forEach(b=>b.onclick=()=>{field=b.dataset.f;drawTable();});
    document.getElementById("fs-dir").onclick=()=>{dir=dir==="desc"?"asc":"desc";drawTable();};
    drawTable();drawRecords();
  }

  return {
    ver:"Format and Storage Dashboard",
    crumb:"Format and Storage Dashboard",
    asof:"Data as of Sun 05 Jul 2026 23:59 · refreshed Mon 06 Jul 06:00",
    /* Read by the Overview dashboard. Derived from the same array this
       dashboard renders, so a summary figure can never drift from the detail. */
    summary:{
      totalFiles:TOT_FILES,
      totalGB:TOT_GB,
      avgFileSizeMB:TOT_AVG,
      formatCount:FORMATS.length,
      formats:FORMATS.map(f=>({label:f.label,files:f.files,gb:f.gb}))
    },
    html,init
  };
})();

/* ===================================================================
   Overview
   An executive summary of the other dashboards. Must be defined after
   them, because every figure it shows is read from their exported
   `summary` objects rather than restated here. That is deliberate: a
   summary that keeps its own copy of the numbers drifts away from the
   detail it claims to summarise the first time either side is edited.
   =================================================================== */
DASHBOARDS.ov=(function(){
  const RM=DASHBOARDS.rm.summary;
  const SL=DASHBOARDS.sl.summary;
  const FS=DASHBOARDS.fs.summary;

  /* Cross dashboard checks. These fire in the console rather than on the page,
     so a broken figure is caught during verification instead of by a reader. */
  console.assert(RM.declared===FS.totalFiles,
    `Overview: declared records (${RM.declared}) and format file total (${FS.totalFiles}) disagree`);
  console.assert(RM.withPhysical+RM.withoutPhysical===RM.declared,
    "Overview: physical counterpart split does not sum to declared records");
  console.assert(SL.libraryRecords+SL.libraryUndeclared===SL.libraryDocuments,
    "Overview: library declaration split does not sum to library documents");
  console.assert(Math.abs(FS.formats.reduce((a,f)=>a+f.gb,0)-FS.totalGB)<0.05,
    "Overview: format storage does not sum to the storage total");

  const GB=n=>n.toFixed(1)+" GB";
  const PCT=(v,t)=>t?(v/t*100):0;

  /* ===== chart primitives, all mapped to native Power BI visuals ===== */

  /* Donut chart. Power BI equivalent: Donut chart. */
  function arcSeg(cx,cy,rO,rI,a0,a1,fill,title){
    const large=(a1-a0)>Math.PI?1:0;
    const pt=(r,a)=>[(cx+r*Math.cos(a)).toFixed(2),(cy+r*Math.sin(a)).toFixed(2)];
    const [x0,y0]=pt(rO,a0),[x1,y1]=pt(rO,a1),[x2,y2]=pt(rI,a1),[x3,y3]=pt(rI,a0);
    return `<path d="M${x0} ${y0}A${rO} ${rO} 0 ${large} 1 ${x1} ${y1}L${x2} ${y2}A${rI} ${rI} 0 ${large} 0 ${x3} ${y3}Z" fill="${fill}"><title>${title}</title></path>`;
  }
  function donut(items,o){
    o=o||{};
    const size=o.size||168, th=o.thickness||32, cx=size/2, cy=size/2, rO=size/2, rI=size/2-th;
    const total=items.reduce((a,i)=>a+i.value,0)||1;
    let a=-Math.PI/2, out="";
    items.forEach(i=>{
      const frac=i.value/total;
      if(frac<=0)return;
      const a1=a+frac*Math.PI*2;
      if(frac>0.9995){
        /* a single full slice would collapse the arc endpoints onto each other,
           so draw it as a stroked circle instead */
        out+=`<circle cx="${cx}" cy="${cy}" r="${(rO+rI)/2}" fill="none" stroke="${i.color}" stroke-width="${th}"><title>${i.label}</title></circle>`;
      }else{
        out+=arcSeg(cx,cy,rO,rI,a,a1,i.color,`${i.label}: ${o.fmt?o.fmt(i.value):F(i.value)}`);
      }
      a=a1;
    });
    const centre=o.centreValue
      ? `<text x="${cx}" y="${cy-1}" text-anchor="middle" font-size="20" font-weight="700" fill="#10243E" style="font-variant-numeric:tabular-nums">${o.centreValue}</text>
         <text x="${cx}" y="${cy+16}" text-anchor="middle" font-size="10" fill="#6B7A8C">${o.centreLabel||""}</text>`
      : "";
    return `<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}" style="display:block;flex:0 0 auto">${out}${centre}</svg>`;
  }
  function legend(items,fmt){
    const total=items.reduce((a,i)=>a+i.value,0)||1;
    return `<div class="dleg">`+items.map(i=>
      `<div class="dlrow"><span class="sw" style="background:${i.color}"></span>
        <span class="dlab" title="${i.label}">${i.label}</span>
        <span class="dval">${fmt(i.value)}</span>
        <span class="dpct">${PCT(i.value,total).toFixed(1)}%</span></div>`).join("")+`</div>`;
  }
  function donutCard(items,o,fmt){
    return `<div class="cwrap">${donut(items,o)}${legend(items,fmt)}</div>`;
  }

  /* Ranked horizontal bars. Power BI equivalent: Clustered bar chart. */
  function topBars(items,fmt){
    const mx=Math.max(...items.map(i=>i.value),1);
    return items.map(i=>`<div class="tbar">
      <div class="tl"><b>${i.label}</b>${i.name?`<small>${i.name}</small>`:""}</div>
      <div class="tt"><div class="tf" style="width:${Math.max(3,100*i.value/mx)}%"></div></div>
      <div class="tv">${fmt(i.value)}</div></div>`).join("");
  }

  /* Two magnitudes on one shared scale, so the gap between them is the message.
     Power BI equivalent: Clustered bar chart. */
  function gapBars(rows,fmt){
    const mx=Math.max(...rows.map(r=>r.value),1);
    return rows.map(r=>`<div class="gap">
      <div class="gl"><span>${r.label}</span><b>${fmt(r.value)}</b></div>
      <div class="gt"><div class="gf" style="width:${Math.max(0.4,100*r.value/mx)}%;background:${r.color}"></div></div>
    </div>`).join("");
  }

  /* ===== palette, taken from the ADB tokens only ===== */
  const C={blue:"#0072BC",teal:"#00A5A8",deep:"#1B5E82",green:"#5CA943",grey:"#9DB8D2",faint:"#C7D3E0",orange:"#E8763C"};

  /* The same five formats appear in both format donuts, with the same colours,
     so the two can be read against each other. Grouping the tail into one slice
     also keeps each donut readable, which eight slices would not be. */
  const FMT_TOP=[...FS.formats].sort((a,b)=>b.gb-a.gb).slice(0,5);
  const FMT_REST=FS.formats.filter(f=>!FMT_TOP.includes(f));
  const FMT_COLORS=[C.blue,C.teal,C.deep,C.green,C.grey];
  const storageSlices=FMT_TOP.map((f,i)=>({label:f.label,value:f.gb,color:FMT_COLORS[i]}))
    .concat([{label:"All other formats",value:FMT_REST.reduce((a,f)=>a+f.gb,0),color:C.faint}]);
  const fileSlices=FMT_TOP.map((f,i)=>({label:f.label,value:f.files,color:FMT_COLORS[i]}))
    .concat([{label:"All other formats",value:FMT_REST.reduce((a,f)=>a+f.files,0),color:C.faint}]);

  console.assert(Math.abs(storageSlices.reduce((a,s)=>a+s.value,0)-FS.totalGB)<0.05,
    "Overview: storage donut does not sum to the storage total");
  console.assert(fileSlices.reduce((a,s)=>a+s.value,0)===FS.totalFiles,
    "Overview: file donut does not sum to the file total");

  /* The single most useful comparison in the data: the format that dominates
     storage is not the format that dominates the file count. */
  const bigStorage=storageSlices[0];
  const bigStorageFiles=fileSlices[0];
  const bigFiles=[...fileSlices].sort((a,b)=>b.value-a.value)[0];

  const html=`<section class="dash-ov">
    <div class="band">
      <h2>Executive summary</h2>
      <div class="bd">One view of how the EDRMS is being adopted across the bank. Each section below summarises a dashboard: open that dashboard for the full detail, filters, and drill down.</div>
    </div>

    <div class="kpis" id="ov-kpis"></div>

    <div class="panel">
      <div class="phead">
        <div>
          <div class="ptitle">Records Management</div>
          <div class="psub">How much of the content held in EDRMS compliant sites has been formally declared as a record, and which departments are declaring it.</div>
        </div>
        <button class="golink" data-go="rm">Open Records Management &rsaquo;</button>
      </div>
      <div class="crow">
        <div class="chart">
          <div class="ctitle">Declared records by physical counterpart</div>
          <div id="ov-rm-donut"></div>
        </div>
        <div class="chart">
          <div class="ctitle">Declared against everything held</div>
          <div id="ov-rm-gap"></div>
        </div>
        <div class="chart wide">
          <div class="ctitle">Top 5 departments by declared records</div>
          <div id="ov-rm-top"></div>
        </div>
      </div>
    </div>

    <div class="panel">
      <div class="phead">
        <div>
          <div class="ptitle">Sites and Libraries</div>
          <div class="psub">How far the compliant site rollout has reached, and how thoroughly the libraries inside those sites are declaring their content.</div>
        </div>
        <button class="golink" data-go="sl">Open Sites and Libraries &rsaquo;</button>
      </div>
      <div class="crow">
        <div class="chart">
          <div class="ctitle">Library content declared as records</div>
          <div id="ov-sl-donut"></div>
        </div>
        <div class="chart wide">
          <div class="ctitle">Top 5 departments by compliant sites created</div>
          <div id="ov-sl-top"></div>
        </div>
      </div>
    </div>

    <div class="panel">
      <div class="phead">
        <div>
          <div class="ptitle">Format and Storage</div>
          <div class="psub">Which file formats the declared records are held in, and which of them are actually consuming the storage.</div>
        </div>
        <button class="golink" data-go="fs">Open Format and Storage &rsaquo;</button>
      </div>
      <div class="crow">
        <div class="chart">
          <div class="ctitle">Share of storage consumed</div>
          <div id="ov-fs-gb"></div>
        </div>
        <div class="chart">
          <div class="ctitle">Share of files held</div>
          <div id="ov-fs-files"></div>
        </div>
      </div>
      <div id="ov-fs-callout"></div>
    </div>
  </section>`;

  function init(){
    /* headline cards, each one a route into the dashboard it came from */
    const cards=[
      {lab:"Total Declared Records", val:F(RM.declared),                 go:"rm", to:"Records Management"},
      {lab:"Documents in Compliant Sites", val:(RM.documents/1e6).toFixed(2)+"M", go:"rm", to:"Records Management"},
      {lab:"Compliant Sites Created", val:F(SL.sitesCreated),            go:"sl", to:"Sites and Libraries"},
      {lab:"Storage Consumed", val:GB(FS.totalGB),                       go:"fs", to:"Format and Storage"},
      {lab:"Active Sites, Last 7 Days", val:F(RM.activeSites7),          go:"rm", to:"Records Management"},
    ];
    document.getElementById("ov-kpis").innerHTML=cards.map(c=>
      `<div class="kpi" data-go="${c.go}"><div class="lab">${c.lab}</div><div class="val">${c.val}</div>
       <div class="tap">View in ${c.to} &rsaquo;</div></div>`).join("");

    /* Records Management */
    const physSlices=[
      {label:"Without physical counterpart",value:RM.withoutPhysical,color:C.grey},
      {label:"With physical counterpart",value:RM.withPhysical,color:C.teal},
    ];
    document.getElementById("ov-rm-donut").innerHTML=
      donutCard(physSlices,{centreValue:F(RM.declared),centreLabel:"declared records"},F);

    const rate=PCT(RM.declared,RM.documents);
    document.getElementById("ov-rm-gap").innerHTML=
      gapBars([
        {label:"Documents in compliant sites",value:RM.documents,color:C.orange},
        {label:"Declared as records",value:RM.declared,color:C.blue},
      ],F)+
      `<div class="callout"><b>${rate.toFixed(2)}%</b> of the documents held in EDRMS compliant sites have been declared as records. The remaining <b>${F(RM.documents-RM.declared)}</b> documents sit in compliant sites without record status.</div>`;

    document.getElementById("ov-rm-top").innerHTML=topBars(RM.topDepartments,F)+
      `<div class="mini"><div>Departments reporting<b>${F(RM.departmentCount)}</b></div>
        <div>EDRMS users, monthly active<b>${F(RM.monthlyActiveUsers)}</b></div></div>`;

    /* Sites and Libraries */
    const libSlices=[
      {label:"Declared as records",value:SL.libraryRecords,color:C.teal},
      {label:"Not yet declared",value:SL.libraryUndeclared,color:C.grey},
    ];
    document.getElementById("ov-sl-donut").innerHTML=
      donutCard(libSlices,{centreValue:PCT(SL.libraryRecords,SL.libraryDocuments).toFixed(1)+"%",centreLabel:"declared"},F);

    document.getElementById("ov-sl-top").innerHTML=topBars(SL.topDepartments,F)+
      `<div class="mini"><div>Compliant sites created<b>${F(SL.sitesCreated)}</b></div>
        <div>Libraries tracked<b>${F(SL.libraryCount)}</b></div>
        <div>Library storage<b>${GB(SL.storageGB)}</b></div></div>`;

    /* Format and Storage, two donuts sharing one colour scheme so they can be
       read against each other */
    document.getElementById("ov-fs-gb").innerHTML=
      donutCard(storageSlices,{centreValue:GB(FS.totalGB),centreLabel:"total storage"},GB);
    document.getElementById("ov-fs-files").innerHTML=
      donutCard(fileSlices,{centreValue:F(FS.totalFiles),centreLabel:"total files"},F);

    const gbShare=PCT(bigStorage.value,FS.totalGB), fileShare=PCT(bigStorageFiles.value,FS.totalFiles);
    document.getElementById("ov-fs-callout").innerHTML=
      `<div class="callout">The two charts do not agree, and that is the point. <b>${bigStorage.label}</b> account for <b>${gbShare.toFixed(1)}%</b> of storage but only <b>${fileShare.toFixed(1)}%</b> of files, while <b>${bigFiles.label}</b> are the most numerous at <b>${PCT(bigFiles.value,FS.totalFiles).toFixed(1)}%</b> of files. Storage pressure comes from a small number of large files, not from the formats people create most often.</div>`;

    /* every card and button routes to the dashboard the figure came from */
    document.querySelectorAll(".dash-ov [data-go]").forEach(el=>
      el.onclick=()=>switchTo(el.dataset.go));
  }

  return {
    ver:"Overview Dashboard",
    crumb:"Overview",
    /* A summary is only as current as its stalest input, so this quotes the
       oldest refresh across the dashboards it draws from rather than the newest. */
    asof:"Data as of Sun 05 Jul 2026 23:59, the oldest refresh across the dashboards summarised here",
    html,init
  };
})();


/* =================================================================
   fileplan.js
   The institutional file plan, which is the SharePoint term store read as
   a report. Answers the client's section 3: total terms and the count in
   each top level category.

   Sourced from the Graph term store API and testable in Graph Explorer
   today:
     GET /termStore/groups                       the categories
     GET /termStore/groups/{groupId}/sets        the sets inside one
     GET /termStore/sets/{setId}/children        the terms at one level

   One wrinkle worth knowing before anyone estimates it: a file plan is a
   tree and the API returns one level at a time, so a full count means
   walking down through each level rather than reading a single number.
   That is a loop, not a blocker, and it is why this is a small job rather
   than a free one.
   ================================================================= */
DASHBOARDS.fp=(function(){
  /* [category, sets, terms, depth]. The five top level groups the client
     names. Counts are illustrative until the walk above is run against the
     tenant; the source is confirmed, the numbers are not. */
  const CATS=[
   {label:"Programme and operation", sets:14, terms:412, depth:4},
   {label:"Administration",          sets:11, terms:286, depth:3},
   {label:"Compliance and oversight",sets:8,  terms:174, depth:3},
   {label:"People Management",       sets:7,  terms:139, depth:3},
   {label:"Risk management",         sets:5,  terms:88,  depth:2},
  ];
  const TOTAL_TERMS=CATS.reduce((a,c)=>a+c.terms,0);
  const TOTAL_SETS=CATS.reduce((a,c)=>a+c.sets,0);
  const MAX_DEPTH=Math.max(...CATS.map(c=>c.depth));
  console.assert(CATS.every(c=>c.terms>=c.sets),
    "A category cannot hold fewer terms than it has term sets");

  function draw(){
    const mx=Math.max(...CATS.map(c=>c.terms));
    document.getElementById("fp-bars").innerHTML=CATS.map(c=>
      `<div class="fbar"><div class="fl"><b>${c.label}</b><small>${c.sets} term sets, ${c.depth} levels deep</small></div>
        <div class="ft"><div class="ff" style="width:${Math.max(8,100*c.terms/mx)}%">${F(c.terms)}</div></div>
        <div class="fp">${(c.terms/TOTAL_TERMS*100).toFixed(1)}%</div></div>`).join("");
  }

  const html=`<section class="dash-fp">
    <div class="band">
      <h2>Institutional file plan</h2>
      <div class="bd">The file plan is the SharePoint term store, so its size and shape can be reported directly. How many terms exist, and how they divide across the five categories.</div>
    </div>
    <div class="kpis" id="fp-kpis">
      <div class="kpi stat"><div class="lab">Total Terms</div><div class="val" id="kpi-terms">…</div><div class="sub">Across ${CATS.length} categories, at every level of the plan</div></div>
      <div class="kpi stat"><div class="lab">Term Sets</div><div class="val" id="kpi-sets">…</div><div class="sub">Deepest branch runs ${MAX_DEPTH} levels</div></div>
    </div>
    <div class="panel">
      <div class="ptitle">Terms by category</div>
      <div class="psub">The five top level groups in the term store, sized by how many terms sit beneath them at every level, not only the top. The deepest branch runs ${MAX_DEPTH} levels.</div>
      <div id="fp-bars"></div>
    </div>
  </section>`;

  function init(){
    document.getElementById("kpi-terms").textContent=F(TOTAL_TERMS);
    document.getElementById("kpi-sets").textContent=F(TOTAL_SETS);
    draw();
  }

  return {
    ver:"File Plan Dashboard",
    crumb:"File Plan Dashboard",
    asof:"Data as of Mon 20 Jul 2026 23:59, refreshed Tue 21 Jul 06:00",
    summary:{
      totalTerms:TOTAL_TERMS,
      totalSets:TOTAL_SETS,
      maxDepth:MAX_DEPTH,
      categoryCount:CATS.length,
      categories:CATS.map(c=>({label:c.label,terms:c.terms,sets:c.sets}))
    },
    html,init
  };
})();


/* =================================================================
   retention.js
   Answers the client's 2.1.2.8, the disposal summary. Built rather than
   left a placeholder because the data is already there: Records carries
   EDRMSDueDateForDisposal, computed as EDRMSRetentionLabelApplied plus
   EDRMSDuration, so records due for disposal and the next due date are a
   count and a MIN over a column that exists today. The only figure here
   that is not available now is the inactive document count, which needs
   the document scan, and it is marked as such on the panel.
   ================================================================= */
DASHBOARDS.rt=(function(){
  /* Retention labels across all declared records. Sums to the same 21,646 the
     other dashboards use, and asserts it below rather than trusting it. */
  const LABELS=[
    {label:"10 years after declaration",count:8420},
    {label:"7 years after declaration", count:5310},
    {label:"5 years after declaration", count:3980},
    {label:"Permanent",                 count:2460},
    {label:"3 years after declaration", count:1476},
  ];
  const LABEL_TOTAL=LABELS.reduce((a,l)=>a+l.count,0);
  /* Permanent records are never due for disposal. Stating it as a constant
     keeps the "never due" population visible instead of buried in a filter. */
  const PERMANENT=LABELS.find(l=>l.label==="Permanent").count;

  /* Disposal summary per library. Record counts are the same figures the
     Sites and Libraries dashboard shows, so the two reconcile.
     [library, site, records, dueWithin12m, nextDue, inactive1y] */
  const DLIBS=[
   ["Final Documents","ITD Records Site",640,84,"2026-11-14",210],
   ["Board Papers","OGC Legal Site",540,96,"2026-09-02",164],
   ["Country Reports","SARD Ops Site",450,61,"2026-10-27",138],
   ["Loan Agreements","FIN Treasury Site",384,0,"2031-04-18",92],
   ["Policies","HRD People Site",315,44,"2027-01-09",71],
   ["Project Completion","OSFG Country Site",300,38,"2026-12-03",96],
   ["Field Reports","SERD Ops Site",286,52,"2026-08-21",118],
   ["Case Files","OGC Compliance Site",280,31,"2027-02-16",64],
   ["Minutes","BRM Budget Site",245,58,"2026-09-30",83],
   ["Correspondence","PARD Procurement Site",210,74,"2026-08-14",147],
   ["Investment Memos","PSOD Investments Site",180,22,"2027-03-05",40],
   ["Legal Opinions","OGC Advisory Site",150,0,"2033-06-11",55],
   ["Audit Reports","CWRD Ops Site",120,19,"2026-12-19",37],
   ["Climate Briefs","SDCC Climate Site",95,12,"2027-05-22",26],
   ["Admin Records","OAS Facilities Site",88,17,"2026-10-08",31],
  ];
  const DUE_TOTAL=DLIBS.reduce((a,l)=>a+l[3],0);
  /* Disposal windows. All three are the same count over EDRMSDueDateForDisposal
     at different horizons, so they are held as one shape rather than three
     unrelated numbers, and each is necessarily a subset of the next. */
  const DUE_30=71, DUE_90=196;
  console.assert(DUE_30<=DUE_90 && DUE_90<=DUE_TOTAL,
    "Disposal windows must nest: 30 days inside 90 inside 12 months");

  /* Retention compliance. A record with no retention label has no due date and
     can never be disposed of, which is why it is worth counting separately
     rather than letting it sit silently outside every disposal figure. */
  const WITH_SCHEDULE=20114;
  const BEYOND_RETENTION=342;
  const LIB_RECORDS=DLIBS.reduce((a,l)=>a+l[2],0);
  const INACTIVE_TOTAL=DLIBS.reduce((a,l)=>a+l[5],0);
  const NEXT_DUE=DLIBS.map(l=>l[4]).sort()[0];

  const DFMT=d=>{const x=new Date(d+"T00:00:00");
    return x.toLocaleDateString("en-GB",{day:"2-digit",month:"short",year:"numeric"});};

  /* Reconciliation. The label breakdown must equal the declared record total
     the Records Management dashboard publishes, and no library can have more
     records due than it holds. */
  console.assert(LABEL_TOTAL===DASHBOARDS.rm.summary.declared,
    `Retention labels total ${LABEL_TOTAL} but Records Management declares ${DASHBOARDS.rm.summary.declared}`);
  console.assert(DLIBS.every(l=>l[3]<=l[2]),"A library cannot have more records due for disposal than it holds");
  console.assert(DUE_TOTAL<LABEL_TOTAL-PERMANENT,"Records due must exclude the permanent population");
  const NO_SCHEDULE=LABEL_TOTAL-WITH_SCHEDULE;
  console.assert(WITH_SCHEDULE<=LABEL_TOTAL,"Records with a schedule cannot exceed the declared total");
  console.assert(BEYOND_RETENTION<=WITH_SCHEDULE,"Only a record with a schedule can be beyond its retention period");

  let sortD="due",dirD="desc";
  const DCOLS=[
    {k:"lib",  i:0,lab:"Library",              num:false},
    {k:"site", i:1,lab:"Site",                 num:false},
    {k:"held", i:2,lab:"Records held",         num:true},
    {k:"due",  i:3,lab:"Due within 12 months", num:true},
    {k:"next", i:4,lab:"Next due date",        num:false},
    {k:"inact",i:5,lab:"Inactive over 1 year", num:true},
  ];

  function drawTable(){
    const col=DCOLS.find(c=>c.k===sortD);
    const rows=[...DLIBS].sort((a,b)=>{
      const x=a[col.i],y=b[col.i];
      const cmp=col.num?x-y:String(x).localeCompare(String(y));
      return dirD==="asc"?cmp:-cmp;
    });
    const mx={};[2,3,5].forEach(i=>mx[i]=Math.max(...DLIBS.map(l=>l[i]),1));
    let h="";
    DCOLS.forEach(c=>{
      const arrow=sortD===c.k?(dirD==="asc"?" ↑":" ↓"):"";
      h+=`<div class="hd${c.num?" num":""}${sortD===c.k?" on":""}" data-s="${c.k}">${c.lab}${arrow}</div>`;
    });
    rows.forEach(l=>{
      const cell=i=>`<div class="nc"><div class="nb" style="width:${(l[i]/mx[i]*100).toFixed(1)}%"></div><b>${F(l[i])}</b></div>`;
      h+=`<div class="nm" title="${l[0]}">${l[0]}</div><div class="dp">${l[1]}</div>`;
      h+=cell(2)+cell(3);
      /* A library whose next due date is years out is not "nothing due", it is
         a long or permanent retention. Saying so beats an empty cell. */
      h+=`<div class="dt${l[3]===0?" far":""}">${DFMT(l[4])}</div>`;
      h+=cell(5);
    });
    const t=document.getElementById("rt-table");
    t.innerHTML=h;
    t.querySelectorAll(".hd[data-s]").forEach(hd=>hd.onclick=()=>{
      const k=hd.dataset.s;
      if(sortD===k)dirD=dirD==="asc"?"desc":"asc";
      else{sortD=k;dirD=(k==="lib"||k==="site"||k==="next")?"asc":"desc";}
      drawTable();
    });
  }

  function drawCompliance(){
    const rows=[
      ["With a retention schedule",WITH_SCHEDULE,"var(--teal)"],
      ["No retention schedule",NO_SCHEDULE,"var(--greyblue)"],
      ["Beyond retention period",BEYOND_RETENTION,"var(--orange)"],
    ];
    const mx=Math.max(...rows.map(r=>r[1]));
    document.getElementById("rt-compliance").innerHTML=rows.map(([lab,v,col])=>
      `<div class="lbar"><div class="ll"><b>${lab}</b></div>
        <div class="lt"><div class="lf" style="width:${Math.max(6,100*v/mx)}%;background:${col}">${F(v)}</div></div>
        <div class="lp">${(v/LABEL_TOTAL*100).toFixed(1)}%</div></div>`).join("");
  }
  function drawLabels(){
    const mx=Math.max(...LABELS.map(l=>l.count));
    document.getElementById("rt-labels").innerHTML=LABELS.map(l=>{
      const perm=l.label==="Permanent";
      return `<div class="lbar"><div class="ll"><b>${l.label}</b>${perm?`<small>Never due for disposal</small>`:""}</div>
        <div class="lt"><div class="lf" style="width:${Math.max(6,100*l.count/mx)}%;background:${perm?"var(--greyblue)":"var(--deepblue)"}">${F(l.count)}</div></div>
        <div class="lp">${(l.count/LABEL_TOTAL*100).toFixed(1)}%</div></div>`;
    }).join("");
  }

  const html=`<section class="dash-rt">
    <div class="band">
      <h2>Disposal pipeline</h2>
      <div class="bd">Which declared records are approaching the end of their retention period, and when the next disposal falls due. Due dates come from the retention label applied to each record plus its duration.</div>
    </div>
    <div class="kpis" id="rt-kpis">
      <div class="kpi stat"><div class="lab">Records Due for Disposal, next 12 months</div><div class="val" id="kpi-due">…</div><div class="sub">${F(DUE_30)} of them within 30 days</div></div>
      <div class="kpi stat"><div class="lab">Next Due Date for Disposal</div><div class="val" id="kpi-next">…</div><div class="sub">${F(PERMANENT)} permanent records are never due</div></div>
    </div>
    <div class="panel">
      <div class="ptitle">Disposal summary by library</div>
      <div class="psub">Click any column heading to sort. Records held and records due come from the declared record rows. Inactive over 1 year counts documents untouched for a year, which is the one column here that waits on the document scan.</div>
      <div class="tiles">
        <div class="tile"><div class="tl">Due within 30 days</div><div class="tv">${F(DUE_30)}</div></div>
        <div class="tile"><div class="tl">Due within 90 days</div><div class="tv">${F(DUE_90)}</div></div>
        <div class="tile hi"><div class="tl">Due within 12 months</div><div class="tv">${F(DUE_TOTAL)}</div></div>
        <div class="tile"><div class="tl">Records in these libraries</div><div class="tv">${F(LIB_RECORDS)}</div></div>
      </div>
      <div class="scrollx"><div class="dtab" id="rt-table"></div></div>
    </div>

    <div class="band">
      <h2>Retention compliance</h2>
      <div class="bd">Whether each declared record actually carries a retention schedule, and how many have already passed the end of theirs. A record with no schedule has no due date, so it sits outside every disposal figure above.</div>
    </div>
    <div class="panel">
      <div class="ptitle">Schedules and overdue records</div>
      <div class="psub">All ${F(LABEL_TOTAL)} declared records. Beyond retention counts records whose disposal date has already passed. It does not mean the record is still awaiting action, since nothing records whether a disposal was carried out.</div>
      <div class="tiles">
        <div class="tile"><div class="tl">With a retention schedule</div><div class="tv">${F(WITH_SCHEDULE)}</div></div>
        <div class="tile hi"><div class="tl">Without a retention schedule</div><div class="tv">${F(NO_SCHEDULE)}</div></div>
        <div class="tile"><div class="tl">Beyond retention period</div><div class="tv">${F(BEYOND_RETENTION)}</div></div>
      </div>
      <div id="rt-compliance"></div>
    </div>

    <div class="band">
      <h2>Retention profile</h2>
      <div class="bd">How the declared records divide across retention labels, and how much of the holding is permanent and therefore never due for disposal.</div>
    </div>
    <div class="panel">
      <div class="ptitle">Declared records by retention label</div>
      <div class="psub">All ${F(LABEL_TOTAL)} declared records. ${F(PERMANENT)} of them carry a permanent label, so they are excluded from every disposal figure above.</div>
      <div id="rt-labels"></div>
    </div>
  </section>`;

  function init(){
    document.getElementById("kpi-due").textContent=F(DUE_TOTAL);
    document.getElementById("kpi-next").textContent=DFMT(NEXT_DUE);
    drawTable();
    drawLabels();
    drawCompliance();
  }

  return {
    ver:"Retention Dashboard",
    crumb:"Retention Dashboard",
    asof:"Data as of Mon 20 Jul 2026 23:59, refreshed Tue 21 Jul 06:00",
    summary:{
      dueNext12:DUE_TOTAL,
      due30:DUE_30,
      due90:DUE_90,
      withSchedule:WITH_SCHEDULE,
      get noSchedule(){return this.labelTotal-this.withSchedule;},
      beyondRetention:BEYOND_RETENTION,
      nextDue:NEXT_DUE,
      permanent:PERMANENT,
      labelTotal:LABEL_TOTAL,
      inactiveOverYear:INACTIVE_TOTAL,
      labels:LABELS.map(l=>({label:l.label,count:l.count}))
    },
    html,init
  };
})();

/* ===================================================================
   Shell: left nav switches which dashboard is mounted. Only one
   dashboard is in the DOM at a time, which is why both can keep their
   original element ids untouched.
   =================================================================== */
function switchTo(key){
  const d=DASHBOARDS[key];
  if(!d)return;
  document.getElementById("view").innerHTML=d.html;
  document.getElementById("side-ver").textContent=d.ver;
  document.getElementById("crumb-b").textContent=d.crumb;
  document.getElementById("asof").textContent=d.asof;
  document.querySelectorAll("#nav a[data-d]").forEach(a=>a.classList.toggle("on",a.dataset.d===key));
  d.init();
}
document.querySelectorAll("#nav a[data-d]").forEach(a=>a.onclick=()=>switchTo(a.dataset.d));
switchTo("ov");
</script>
</body></html>
