<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EDRMS Reporting Suite</title>
<!-- Inline favicon, so a served copy does not 404 on /favicon.ico. A data URI
     keeps it a zero request asset and avoids a binary file in the repo. -->
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%230E1F35'/><rect x='7' y='17' width='4' height='8' fill='%239DB8D2'/><rect x='14' y='12' width='4' height='13' fill='%2300A5A8'/><rect x='21' y='7' width='4' height='18' fill='%230072BC'/></svg>">
<style>

/* ================= styles.css ================= */
/* Shared shell styles for the EDRMS Reporting Suite.
   Tokens, sidebar, header, band, KPI card, panel, pager.
   Anything that differs between dashboards lives in that dashboard's
   own folder instead, because the source prototypes reuse class names
   with different values and inverted series colours. */
  /* ===== shared shell tokens (union of both dashboards) ===== */
  :root{--ink:#10243E;--ink2:#33475F;--blue:#0072BC;--blue-d:#005A96;--teal:#00A5A8;--green:#5CA943;--orange:#E8763C;--greyblue:#9DB8D2;--deepblue:#1B5E82;--bg:#EEF2F6;--card:#fff;--line:#D9E1EA;--mut:#6B7A8C;--nav:#0E1F35;--nav-hi:#16304F;--sans:"Segoe UI",system-ui,-apple-system,Arial,sans-serif;--serif:Georgia,serif;--shadow:0 1px 2px rgba(16,36,62,.06),0 4px 14px rgba(16,36,62,.06)}
  *{box-sizing:border-box;margin:0;padding:0}html,body{height:100%}
  body{font-family:var(--sans);background:var(--bg);color:var(--ink);font-size:14px;display:flex}
  #side{width:236px;min-width:236px;background:var(--nav);color:#C7D3E0;display:flex;flex-direction:column;height:100vh;position:sticky;top:0}
  #side .brand{padding:18px;border-bottom:1px solid rgba(255,255,255,.08)}
  #side .t1{font-family:var(--serif);font-size:18px;color:#fff;line-height:1.25}
  #side .t2{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#7FA8CC;margin-top:4px}
  #side .ver{font-size:10px;color:#5E748C;margin-top:6px}
  nav{flex:1;padding:8px 0}
  .grp{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#5E748C;padding:12px 18px 6px}
  nav a{display:flex;align-items:center;gap:10px;padding:8px 18px;color:#C7D3E0;font-size:13.5px;border-left:3px solid transparent;text-decoration:none}
  nav a[data-d]{cursor:pointer}
  nav a[data-d]:hover{background:var(--nav-hi);color:#fff}
  nav a .ic{width:18px;text-align:center;opacity:.85}
  nav a.on{background:var(--nav-hi);color:#fff;border-left-color:var(--green);font-weight:600}
  nav a.dis{color:#4C6079;cursor:default}nav a.dis .ic{opacity:.5}
  #main{flex:1;min-width:0;display:flex;flex-direction:column}
  header{background:var(--card);border-bottom:1px solid var(--line);padding:12px 22px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;position:sticky;top:0;z-index:20}
  .crumb{font-size:12px;color:var(--mut)}.crumb b{color:var(--ink);font-size:15px;font-family:var(--serif);display:block}
  .spacer{flex:1}
  #asof{font-size:11.5px;color:var(--mut)}
  section{padding:20px 22px 46px}
  .band{background:#E9F0F7;border:1px solid #DAE5F0;border-radius:12px;padding:16px 18px;margin-bottom:16px}
  .band h2{font-family:var(--serif);font-size:17px;color:var(--ink);line-height:1.3}
  .band .bd{font-size:12.5px;color:var(--ink2);margin-top:6px;max-width:900px}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;box-shadow:var(--shadow);cursor:pointer;transition:transform .1s,box-shadow .1s;border-left:4px solid transparent}
  .kpi:hover{transform:translateY(-2px)}
  .kpi.on{border-left-color:var(--blue);box-shadow:0 0 0 2px rgba(0,114,188,.22),var(--shadow)}
  .kpi .lab{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--mut);line-height:1.3}
  .kpi .val{font-size:30px;font-weight:700;margin-top:8px;font-variant-numeric:tabular-nums;line-height:1.1}
  .kpi .tap{font-size:11px;color:var(--blue);margin-top:8px;font-weight:600}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:18px 20px;margin-bottom:26px}
  .ptitle{font-size:16px;font-weight:700;font-family:var(--serif);margin-bottom:3px}
  .psub{font-size:12px;color:var(--mut);margin-bottom:14px;max-width:900px}
  .muted{color:var(--mut);font-style:italic;font-size:12px}
  .pager{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:12px}
  .pager .pinfo{font-size:12px;color:var(--mut)}
  .pager .pbtns{display:flex;align-items:center;gap:6px}
  .pager button{font:inherit;font-size:12px;font-weight:600;border:1px solid #cfd8e3;background:#fff;color:var(--ink2);border-radius:6px;padding:5px 10px;cursor:pointer}
  .pager button:hover:not(:disabled){border-color:var(--blue);color:var(--blue)}
  .pager button.on{background:var(--blue);border-color:var(--blue);color:#fff}
  .pager button:disabled{opacity:.45;cursor:default}


/* ================= overview.css ================= */
/* Overview: scoped styles. Only loaded shapes under .dash-ov. */
  .dash-ov .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin-bottom:20px}
  .dash-ov .kpi .tap{display:flex;align-items:center;gap:4px}

  /* panel header carries the link through to the detailed dashboard */
  .dash-ov .phead{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:16px}
  .dash-ov .phead .ptitle{margin-bottom:3px}
  .dash-ov .phead .psub{margin-bottom:0}
  .dash-ov .golink{font:inherit;font-size:12px;font-weight:600;border:1px solid var(--blue);color:var(--blue);background:#fff;border-radius:8px;padding:7px 13px;cursor:pointer;white-space:nowrap}
  .dash-ov .golink:hover{background:var(--blue);color:#fff}

  /* a row of chart cards, wrapping on narrow screens */
  .dash-ov .crow{display:flex;gap:18px;flex-wrap:wrap;align-items:stretch}
  .dash-ov .chart{flex:1 1 285px;min-width:285px;background:#F8FAFC;border:1px solid #E4EBF3;border-radius:10px;padding:14px 16px}
  .dash-ov .chart.wide{flex:2 1 380px}
  .dash-ov .ctitle{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--mut);margin-bottom:12px}
  .dash-ov .cwrap{display:flex;gap:14px;align-items:center;flex-wrap:wrap}

  /* donut legend */
  .dash-ov .dleg{flex:1 1 175px;min-width:175px}
  .dash-ov .dlrow{display:grid;grid-template-columns:12px 1fr auto auto;align-items:start;gap:8px;font-size:11.5px;margin-bottom:8px}
  .dash-ov .dlrow .sw{width:12px;height:12px;border-radius:3px;margin-top:2px}
  .dash-ov .dlrow .dlab{color:var(--ink2);line-height:1.35}
  .dash-ov .dlrow .dval{font-weight:700;font-variant-numeric:tabular-nums;color:var(--ink)}
  .dash-ov .dlrow .dpct{color:var(--mut);font-variant-numeric:tabular-nums;min-width:42px;text-align:right}

  /* top N horizontal bars */
  .dash-ov .tbar{display:grid;grid-template-columns:150px 1fr 74px;align-items:center;gap:12px;margin-bottom:9px}
  .dash-ov .tbar .tl b{font-size:12.5px;font-weight:700}
  .dash-ov .tbar .tl small{display:block;color:var(--mut);font-size:10.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .dash-ov .tbar .tt{background:#E9EFF6;border-radius:6px;height:24px;overflow:hidden}
  .dash-ov .tbar .tf{height:24px;background:var(--blue);border-radius:6px;transition:width .6s ease}
  .dash-ov .tbar .tv{text-align:right;font-size:12.5px;font-weight:700;font-variant-numeric:tabular-nums}

  /* two magnitudes compared on a shared scale */
  .dash-ov .gap{margin-bottom:11px}
  .dash-ov .gap .gl{display:flex;justify-content:space-between;font-size:11.5px;color:var(--ink2);margin-bottom:5px}
  .dash-ov .gap .gl b{font-variant-numeric:tabular-nums;color:var(--ink)}
  .dash-ov .gap .gt{background:#E9EFF6;border-radius:6px;height:22px;overflow:hidden}
  .dash-ov .gap .gf{height:22px;border-radius:6px;transition:width .6s ease}
  .dash-ov .callout{background:#EEF5FC;border:1px solid #CFE0F2;border-left:3px solid var(--blue);border-radius:8px;padding:10px 13px;font-size:12px;color:var(--ink2);line-height:1.55;margin-top:12px}
  .dash-ov .callout b{color:var(--ink)}

  /* small stat strip inside a chart card */
  .dash-ov .mini{display:flex;gap:18px;flex-wrap:wrap;margin-top:12px}
  .dash-ov .mini div{font-size:11.5px;color:var(--mut)}
  .dash-ov .mini b{display:block;font-size:17px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums;margin-top:2px}

/* ================= sitesandlibraries.css ================= */
/* Sites and Libraries: scoped styles. Only loaded shapes under .dash-sl. */
  /* ===== Sites and Libraries, scoped ===== */
  .dash-sl .kpis{display:grid;grid-template-columns:repeat(2,minmax(0,320px));gap:16px;margin-bottom:16px}
  @media(max-width:740px){.dash-sl .kpis{grid-template-columns:1fr}}
  .dash-sl .toolbar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:14px;font-size:12.5px;color:var(--mut)}
  .dash-sl .drange{display:inline-flex;align-items:center;gap:6px;border:1px solid #EAD9C8;background:#FDF7F0;border-radius:8px;padding:5px 9px;color:var(--mut)}
  .dash-sl .drange input[type=date]{font:inherit;font-size:12px;border:1px solid #cfd8e3;border-radius:6px;padding:3px 7px;color:var(--ink);background:#fff;height:28px;width:120px}
  .dash-sl .resetbtn{font:inherit;font-size:12px;font-weight:600;border:1px solid var(--blue);color:var(--blue);background:#fff;border-radius:8px;padding:6px 11px;cursor:pointer;display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
  .dash-sl .resetbtn:hover{background:var(--blue);color:#fff}
  .dash-sl select{font:inherit;font-size:12.5px;border:1px solid var(--line);border-radius:7px;padding:5px 9px;background:#fff;color:var(--ink)}
  .dash-sl .tiles{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:14px}
  .dash-sl .tile{background:#F6F9FC;border:1px solid #E4EBF3;border-radius:10px;padding:12px 16px;min-width:180px}
  .dash-sl .tile.hi{border-color:#CFE0F2;background:#EEF5FC}
  .dash-sl .tile .tl{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut)}
  .dash-sl .tile .tv{font-size:24px;font-weight:700;margin-top:5px;font-variant-numeric:tabular-nums}
  /* date range moved to the right of the tiles row */
  .dash-sl .tilesrow{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:14px}
  .dash-sl .tilesrow .tiles{margin-bottom:0}
  .dash-sl .stfilter{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .dash-sl .tmlegend{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:11px;color:var(--mut)}
  .dash-sl .tmlegend .sw{width:22px;height:11px;border-radius:3px}
  .dash-sl .legend{display:flex;gap:16px;font-size:11.5px;color:var(--ink2)}
  .dash-sl .legend .lg{display:inline-flex;align-items:center;gap:6px}
  .dash-sl .legend .sw{width:12px;height:12px;border-radius:3px;display:inline-block}
  .dash-sl .sortwrap{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:14px}
  .dash-sl .sortctl{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .dash-sl .sortctl .lbl{font-size:12px;color:var(--mut)}
  .dash-sl .segctl{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
  .dash-sl .segctl button{font:inherit;font-size:12px;border:none;padding:6px 12px;cursor:pointer;color:var(--ink2);background:#fff;border-left:1px solid var(--line)}
  .dash-sl .segctl button:first-child{border-left:none}
  .dash-sl .segctl button.on{background:var(--blue);color:#fff;font-weight:600}
  .dash-sl .dirbtn{font:inherit;font-size:12px;font-weight:600;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:8px;padding:6px 12px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
  .dash-sl .dirbtn:hover{border-color:var(--blue)}
  .dash-sl .sbar{display:grid;grid-template-columns:200px 1fr 210px;align-items:center;gap:12px;margin-bottom:9px}
  .dash-sl .sbar .sl b{font-size:13px;font-weight:600}.dash-sl .sbar .sl small{display:block;color:var(--mut);font-size:11px}
  .dash-sl .sbar .st{background:#EEF3F8;border-radius:6px;overflow:hidden;display:flex;height:26px}
  .dash-sl .sbar .seg{height:26px;transition:width .5s ease}
  .dash-sl .sbar .seg.e{background:var(--teal)}.dash-sl .sbar .seg.p{background:var(--greyblue)}
  .dash-sl .sbar .single{height:26px;background:var(--blue);border-radius:6px;transition:width .5s ease}
  .dash-sl .sbar .vv{text-align:right;font-size:12.5px;font-variant-numeric:tabular-nums}
  .dash-sl .sbar .vv b{color:var(--ink);font-weight:600}.dash-sl .sbar .vv span{color:var(--mut)}
  /* Site inventory table. A plain grid so Power BI can reproduce it with a
     table visual, with the numeric cells carrying a data bar the way the
     Format and Storage table does. */
  .dash-sl .stab{--sc:206px 70px 210px 88px 78px 98px 112px 92px;display:grid;grid-template-columns:var(--sc);gap:8px 12px;align-items:center;min-width:900px}
  .dash-sl .stab .hd{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);padding-bottom:7px;border-bottom:1px solid var(--line);cursor:pointer;user-select:none;white-space:nowrap}
  .dash-sl .stab .hd.on{color:var(--blue);font-weight:700}
  .dash-sl .stab .hd.num{text-align:right}
  .dash-sl .stab .nm{font-size:13px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .dash-sl .stab .ow{font-size:12px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .dash-sl .stab .dp{font-size:12px;color:var(--mut)}
  .dash-sl .stab .nc{position:relative;height:24px;background:#F3F7FB;border-radius:5px;display:flex;align-items:center;justify-content:flex-end;padding:0 8px;overflow:hidden}
  .dash-sl .stab .nc .nb{position:absolute;left:0;top:0;height:24px;background:#CFE0F2;border-radius:5px;transition:width .5s ease}
  .dash-sl .stab .nc b{position:relative;font-size:12.5px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--ink)}
  .dash-sl .pill{font-size:11px;font-weight:700;border-radius:999px;padding:4px 10px;text-align:center;white-space:nowrap}
  .dash-sl .pill.ok{background:#E7F4EC;color:#1C6B3C}
  .dash-sl .pill.no{background:#FBEEE7;color:#9A4A17}
  .dash-sl .scrollx{overflow-x:auto}
  .dash-sl .ltab{--sc:200px 200px 118px 130px 118px 118px;display:grid;grid-template-columns:var(--sc);gap:8px 12px;align-items:center;min-width:880px}
  .dash-sl .ltab .hd{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);padding-bottom:7px;border-bottom:1px solid var(--line);cursor:pointer;user-select:none;white-space:nowrap}
  .dash-sl .ltab .hd.on{color:var(--blue);font-weight:700}
  .dash-sl .ltab .hd.num{text-align:right}
  .dash-sl .ltab .nm{font-size:13px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .dash-sl .ltab .dp{font-size:12px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .dash-sl .ltab .nc{position:relative;height:24px;background:#F3F7FB;border-radius:5px;display:flex;align-items:center;justify-content:flex-end;padding:0 8px;overflow:hidden}
  .dash-sl .ltab .nc .nb{position:absolute;left:0;top:0;height:24px;background:#CFE0F2;border-radius:5px;transition:width .5s ease}
  .dash-sl .ltab .nc b{position:relative;font-size:12.5px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--ink)}
  .dash-sl .pill.mid{background:#FDF4E3;color:#8A5A12}
  .dash-sl .subtotal{margin-top:12px;font-size:12.5px;color:var(--ink2)}


/* ================= fileplan.css ================= */
/* File Plan: scoped styles. Only loaded shapes under .dash-fp. */
  .dash-fp .kpis{display:grid;grid-template-columns:repeat(2,minmax(0,300px));gap:16px;margin-bottom:16px}
  @media(max-width:740px){.dash-fp .kpis{grid-template-columns:1fr}}
  .dash-fp .fbar{display:grid;grid-template-columns:250px 1fr 58px;align-items:center;gap:12px;margin-bottom:10px}
  .dash-fp .fbar .fl b{font-size:13px;font-weight:600}
  .dash-fp .fbar .fl small{display:block;color:var(--mut);font-size:11px}
  .dash-fp .fbar .ft{background:#EEF3F8;border-radius:6px;overflow:hidden;height:26px}
  .dash-fp .fbar .ff{height:26px;border-radius:6px;background:var(--teal);color:#fff;font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:flex-end;padding-right:9px;font-variant-numeric:tabular-nums;transition:width .5s ease}
  .dash-fp .fbar .fp{text-align:right;font-size:12.5px;color:var(--mut);font-variant-numeric:tabular-nums}
  .dash-fp .note{background:#FDF9EF;border:1px solid #EFE0BD;border-left:3px solid #E8A317;border-radius:8px;padding:11px 14px;font-size:12px;color:var(--ink2);margin-top:14px;line-height:1.5}

/* ================= retention.css ================= */
/* Retention: scoped styles. Only loaded shapes under .dash-rt. */
  .dash-rt .kpis{display:grid;grid-template-columns:repeat(2,minmax(0,340px));gap:16px;margin-bottom:16px}
  @media(max-width:740px){.dash-rt .kpis{grid-template-columns:1fr}}
  .dash-rt .tiles{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:14px}
  .dash-rt .tile{background:#F6F9FC;border:1px solid #E4EBF3;border-radius:10px;padding:12px 16px;min-width:180px}
  .dash-rt .tile.hi{border-color:#CFE0F2;background:#EEF5FC}
  .dash-rt .tile .tl{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut)}
  .dash-rt .tile .tv{font-size:24px;font-weight:700;margin-top:5px;font-variant-numeric:tabular-nums}
  .dash-rt .scrollx{overflow-x:auto}
  .dash-rt .dtab{--dc:186px 190px 116px 152px 128px 132px;display:grid;grid-template-columns:var(--dc);gap:8px 12px;align-items:center;min-width:900px}
  .dash-rt .dtab .hd{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);padding-bottom:7px;border-bottom:1px solid var(--line);cursor:pointer;user-select:none;white-space:nowrap}
  .dash-rt .dtab .hd.on{color:var(--blue);font-weight:700}
  .dash-rt .dtab .hd.num{text-align:right}
  .dash-rt .dtab .nm{font-size:13px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .dash-rt .dtab .dp{font-size:12px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .dash-rt .dtab .dt{font-size:12.5px;font-variant-numeric:tabular-nums;color:var(--ink)}
  .dash-rt .dtab .dt.far{color:var(--mut)}
  .dash-rt .dtab .nc{position:relative;height:24px;background:#F3F7FB;border-radius:5px;display:flex;align-items:center;justify-content:flex-end;padding:0 8px;overflow:hidden}
  .dash-rt .dtab .nc .nb{position:absolute;left:0;top:0;height:24px;background:#CFE0F2;border-radius:5px;transition:width .5s ease}
  .dash-rt .dtab .nc b{position:relative;font-size:12.5px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--ink)}
  .dash-rt .lbar{display:grid;grid-template-columns:236px 1fr 58px;align-items:center;gap:12px;margin-bottom:9px}
  .dash-rt .lbar .ll b{font-size:13px;font-weight:600}
  .dash-rt .lbar .ll small{display:block;color:var(--mut);font-size:11px}
  .dash-rt .lbar .lt{background:#EEF3F8;border-radius:6px;overflow:hidden;height:26px}
  .dash-rt .lbar .lf{height:26px;border-radius:6px;color:#fff;font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:flex-end;padding-right:9px;font-variant-numeric:tabular-nums;transition:width .5s ease}
  .dash-rt .lbar .lp{text-align:right;font-size:12.5px;color:var(--mut);font-variant-numeric:tabular-nums}
  .dash-rt .note{background:#FDF9EF;border:1px solid #EFE0BD;border-left:3px solid #E8A317;border-radius:8px;padding:11px 14px;font-size:12px;color:var(--ink2);margin-top:12px;line-height:1.5}


/* ================= recordsmanagement.css ================= */
/* Records Management: scoped styles. Only loaded shapes under .dash-rm. */
  /* ===== Records Management, scoped ===== */

<script>
/* Load order below matters in two places. The DASHBOARDS registry is created
   first, format and storage asserts its file total against records management
   so it follows it, and the nav wiring runs last.
   Each dashboard occupies one clearly banner marked block. Editing a dashboard
   means editing inside its block and nothing else, which is what keeps a change
   to one dashboard from disturbing another. */

/* =================================================================
   core.js
   ================================================================= */
/* ===================================================================
   Shared helpers. Only the helpers that were byte identical in both
   source prototypes live here. Anything that differed (pager, the
   deptOptions builders, the date range readers) stays inside its own
   dashboard closure so each keeps its original behaviour.
   =================================================================== */
const F=n=>Number(Math.round(n)).toLocaleString();
function wirePager(scope,onGo){document.querySelectorAll(scope+" .pager button[data-pg]").forEach(b=>b.onclick=()=>onGo(b.dataset.pg));}

const DASHBOARDS={};


/* =================================================================
   sitesandlibraries.js
   ================================================================= */
/* ===================================================================
   Sites and Libraries
   Source: EDRMS_Sites_and_Libraries_Dashboard_v1.html
   =================================================================== */
DASHBOARDS.sl=(function(){
  /* --- pager: this variant prints the row count even on a single page --- */
  function pager(total,page,pages,noun){
    if(pages<=1)return `<div class="pager"><div class="pinfo">Showing 1 to ${F(total)} of ${F(total)} ${noun}</div><div></div></div>`;
    const win=[];for(let p=1;p<=pages;p++){if(p===1||p===pages||Math.abs(p-page)<=1)win.push(p);}
    let nums="",last=0;win.forEach(p=>{if(last&&p-last>1)nums+=`<span style="color:var(--mut)">…</span>`;nums+=`<button class="${p===page?'on':''}" data-pg="${p}">${p}</button>`;last=p;});
    const from=(page-1)*10+1,to=Math.min(total,page*10);
    return `<div class="pager"><div class="pinfo">Showing ${from} to ${to} of ${F(total)} ${noun}</div>
      <div class="pbtns"><button data-pg="prev" ${page===1?'disabled':''}>‹ Prev</button>${nums}<button data-pg="next" ${page===pages?'disabled':''}>Next ›</button></div></div>`;
  }
  function rangeFactor(sId,eId){
    const s=(document.getElementById(sId)||{}).value||"",e=(document.getElementById(eId)||{}).value||"";
    if(s===""&&e==="")return 1;
    const sd=s?new Date(s+"T00:00:00"):null, ed=e?new Date(e+"T00:00:00"):null;
    let sM=(sd&&!isNaN(sd))?(sd.getFullYear()<2026?0:sd.getFullYear()>2026?12:sd.getMonth()):0;
    let eM=(ed&&!isNaN(ed))?(ed.getFullYear()>2026?11:ed.getFullYear()<2026?-1:ed.getMonth()):11;
    const months=Math.min(11,eM)-Math.max(0,sM)+1;
    return Math.max(0,Math.min(1,months/12));
  }

  /* ===== data ===== */
  const SITEDEPTS=[
   ["ITD","Information Technology",40],["SARD","South Asia Regional",36],["OSFG","Sovereign Operations",32],
   ["FIN","Finance",28],["PARD","Procurement and Admin",26],["HRD","Human Resources",24],
   ["SERD","Southeast Asia",22],["OGC","General Counsel",21],["EARD","East Asia Regional",20],
   ["BRM","Budget and Mgmt Services",19],["CWRD","Central and West Asia",17],["PSOD","Private Sector Operations",15],
   ["SPD","Strategy and Policy",12],["SDCC","Sustainable Dev and Climate",10],["OAS","Administrative Services",8],
  ];
  const DNAME={};SITEDEPTS.forEach(d=>DNAME[d[0]]=d[1]);
  const ALLTIME_SITES=1057;

  /* [lib, site, dept, docs, records, storageGB, idleDays, newRecords]
     idleDays    days since the library was last touched. Graph returns
                 lastModifiedDateTime on every drive, from the same
                 GET /sites/{id}/drives call that already supplies LibraryCount.
     newRecords  records declared during the reporting period. Already in the
                 data: every record carries CreatedDate, so the growth rate
                 needs no snapshot history. */
  const LIBS=[
   ["Final Documents","ITD Records Site","ITD",3200,640,4.2,3,74],
   ["Loan Agreements","FIN Treasury Site","FIN",2400,384,6.8,11,41],
   ["Correspondence","PARD Procurement Site","PARD",2100,210,1.9,6,28],
   ["Board Papers","OGC Legal Site","OGC",1800,540,5.4,2,63],
   ["Country Reports","SARD Ops Site","SARD",1500,450,3.1,9,52],
   ["Field Reports","SERD Ops Site","SERD",1300,286,7.2,17,31],
   ["Project Completion","OSFG Country Site","OSFG",1200,300,8.9,24,26],
   ["Case Files","OGC Compliance Site","OGC",1000,280,2.4,41,19],
   ["Policies","HRD People Site","HRD",900,315,0.8,8,34],
   ["Minutes","BRM Budget Site","BRM",700,245,0.5,33,22],
   ["Legal Opinions","OGC Advisory Site","OGC",640,150,0.45,118,4],
   ["Audit Reports","CWRD Ops Site","CWRD",580,120,0.42,96,7],
   ["Investment Memos","PSOD Investments Site","PSOD",520,180,0.38,54,12],
   ["Climate Briefs","SDCC Climate Site","SDCC",460,95,0.35,142,2],
   ["Admin Records","OAS Facilities Site","OAS",400,88,0.30,207,0],
  ];
  const TOTAL_RECORDS=LIBS.reduce((a,l)=>a+l[4],0);
  const TOTAL_GB=LIBS.reduce((a,l)=>a+l[5],0);

  /* Library health. Two thresholds because the client asks for both: 90 days
     marks a library as inactive, 180 flags it as long dormant. */
  const LIB_IDLE=90, LIB_DORMANT=180;
  const LIBS_ACTIVE=LIBS.filter(l=>l[6]<=LIB_IDLE).length;
  const LIBS_INACTIVE=LIBS.filter(l=>l[6]>LIB_IDLE).length;
  const LIBS_DORMANT=LIBS.filter(l=>l[6]>LIB_DORMANT).length;

  /* Growth rate = records declared during the period, over records held at the
     start of it. No snapshot history needed: every record carries CreatedDate,
     so records at the start is simply the total minus those declared since. */
  const NEW_RECORDS=LIBS.reduce((a,l)=>a+l[7],0);
  const RECORDS_AT_START=TOTAL_RECORDS-NEW_RECORDS;
  const GROWTH_RATE=NEW_RECORDS/RECORDS_AT_START;
  console.assert(RECORDS_AT_START>0,"Records at the start of the period must be positive for a growth rate to mean anything");

  /* Site inventory. Every column here maps to a call already run against the
     7rkd12 test tenant, which is the whole reason this section exists:
       owner      Get-PnPTenantSite, 1,683 of 1,702 sites carry one
       libraries  GET /sites/{id}/drives, counted
       users      GET /sites/{id}/analytics/allTime, the actorCount field
       visits     the M365 site usage report, Page View Count
       idleDays   the same report, derived from Last Activity Date
     [site, dept, owner, libraries, users, visits, idleDays] */
  const SITES=[
   ["ITD Records Site","ITD","a.mendoza@adb.org",12,86,4210,3],
   ["FIN Treasury Site","FIN","r.tan@adb.org",9,64,3180,5],
   ["PARD Procurement Site","PARD","j.cruz@adb.org",11,52,2740,2],
   ["OGC Legal Site","OGC","m.reyes@adb.org",8,71,2510,6],
   ["SARD Ops Site","SARD","l.fernandez@adb.org",14,58,2360,11],
   ["SERD Ops Site","SERD","p.santos@adb.org",7,43,1920,9],
   ["OSFG Country Site","OSFG","c.delacruz@adb.org",10,39,1640,17],
   ["OGC Compliance Site","OGC","m.reyes@adb.org",6,34,1425,24],
   ["HRD People Site","HRD","s.villanueva@adb.org",9,47,1310,8],
   ["BRM Budget Site","BRM","d.ramos@adb.org",5,28,980,33],
   ["OGC Advisory Site","OGC","m.reyes@adb.org",4,19,760,118],

     from GET /sites/{id}/drives, then subtract the distinct ListId values
     present in Records. ListId is verified to match SharePoint's own list GUID,
     so the join is safe. A library here is not necessarily empty; it may hold
     documents nobody has declared, which is exactly what makes it worth

  const LIBS_WITH_RECORDS=78;

  /* ===== treemap ===== */
  function squarify(items,x,y,w,h){
    const area=w*h,sum=items.reduce((a,b)=>a+b.v,0)||1;
    let rem=items.map(it=>({...it,area:it.v/sum*area})),R=[],rx=x,ry=y,rw=w,rh=h;
    function worst(a,side){const s=a.reduce((p,q)=>p+q,0),mx=Math.max(...a),mn=Math.min(...a);return Math.max(side*side*mx/(s*s),(s*s)/(side*side*mn));}
    while(rem.length){const side=Math.min(rw,rh);let row=[rem[0]],wr=worst(row.map(z=>z.area),side);
      while(row.length<rem.length){const t=row.concat([rem[row.length]]);const w3=worst(t.map(z=>z.area),side);if(w3>wr)break;row=t;wr=w3;}
      const ra=row.reduce((a,b)=>a+b.area,0);
      if(rw>=rh){const cw=ra/rh;let cy=ry;row.forEach(z=>{const ch=z.area/cw;R.push({...z,x:rx,y:cy,w:cw,h:ch});cy+=ch;});rx+=cw;rw-=cw;}
      else{const rhh=ra/rw;let cx=rx;row.forEach(z=>{const cwd=z.area/rhh;R.push({...z,x:cx,y:ry,w:cwd,h:rhh});cx+=cwd;});ry+=rhh;rh-=rhh;}
      rem=rem.slice(row.length);}
    return R;
  }
  function shade(v,mn,mx){const t=mx>mn?(v-mn)/(mx-mn):0.6;const L=[156,195,236],D=[8,52,90];const c=i=>Math.round(L[i]+(D[i]-L[i])*t);return `rgb(${c(0)},${c(1)},${c(2)})`;}
  function darkText(v,mn,mx){const t=mx>mn?(v-mn)/(mx-mn):0.6;return t<0.42;}

  function drawTreemap(){
    const factor=rangeFactor("st-s","st-e");
    const depts=SITEDEPTS.map(d=>({label:d[0],name:d[1],v:Math.max(1,Math.round(d[2]*factor))})).sort((a,b)=>b.v-a.v);

    const mn=Math.min(...page.map(d=>d.v)),mx=Math.max(...page.map(d=>d.v));
    const rects=squarify(page,0,0,900,400);
    let svg="";
    rects.forEach(r=>{const x=r.x+3,y=r.y+3,w=r.w-6,h=r.h-6;const t=darkText(r.v,mn,mx),tc=t?"#082F4E":"#FFFFFF",sc=t?"#2C567A":"#DCEBFA";
      svg+=`<g><rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${w.toFixed(1)}" height="${h.toFixed(1)}" rx="7" fill="${shade(r.v,mn,mx)}"><title>${r.name}: ${r.v} sites</title></rect>`;
      svg+=`<text x="${(x+14).toFixed(1)}" y="${(y+27).toFixed(1)}" font-size="15" font-weight="700" fill="${tc}">${r.label}</text>`;
      svg+=`<text x="${(x+14).toFixed(1)}" y="${(y+44).toFixed(1)}" font-size="11" fill="${sc}">${r.name}</text>`;
      svg+=`<text x="${(x+14).toFixed(1)}" y="${(y+h-15).toFixed(1)}" font-size="26" font-weight="700" fill="${tc}" style="font-variant-numeric:tabular-nums">${r.v}</text></g>`;
    });
    document.getElementById("st-treemap").innerHTML=`<svg viewBox="0 0 900 400" width="100%" style="display:block;max-height:430px">${svg}</svg>`;
    document.getElementById("st-pager").innerHTML=pager(depts.length,sitePage,pages,"departments");
    wirePager("#st-pager",v=>{sitePage=v==="prev"?Math.max(1,sitePage-1):v==="next"?Math.min(pages,sitePage+1):+v;drawTreemap();});
  }

DASHBOARDS.rm=(function(){
  function split(total,k,seed){
    const w=[];let s=0;for(let i=0;i<k;i++){const x=((seed*(i+3)*7919)%100)/100*0.6+0.55;w.push(x);s+=x;}
    const out=w.map(x=>Math.max(1,Math.round(total*x/s)));
    out[0]+=total-out.reduce((a,b)=>a+b,0);if(out[0]<1)out[0]=1;return out;

    const s=w.reduce((a,b)=>a+b,0);const out=w.map(x=>Math.round(total*x/s));

  /* Site name stems per department. This used to be DIVNAMES and carried a

  const SITESTEMS={ITD:["Digital Services","Infrastructure & Operations"],SARD:["South Asia Operations","South Asia Programs"],

   OAS:["Facilities","Administration"],ERCD:["Macroeconomics","Statistics"]};
  const LIBPOOL=["Final Documents","Board Papers","Loan Agreements","Country Reports","Policies","Correspondence","Minutes","Project Completion"];

  const TREE=DEPTS.map(d=>{

       tier removal. */
    const siteNames=[];

  const LEVELS=["Department","Site","Library"];
  function listAt(path){let lvl=TREE;for(const idx of path)lvl=lvl[idx].children;return lvl;}

  /* ===== section 1 ===== */

  function rangeMonthsFor(sId,eId){

  function drawRec(){

        <div class="psub">Departmental sites with activity in the selected window, ranked by site visits, with each site's most recent activity.</div>
        <div class="toolbar">
          <div class="dayf" id="sites-win">${[7,30,90].map(dd=>`<button class="${winSites===dd?'on':''}" data-d="${dd}">Last ${dd} days</button>`).join("")}</div>
          <div class="ctl">Department<select id="sites-dept">${deptOptions(deptSites)}</select></div></div>
        <div class="statrow" id="sites-stats"></div>
        <div class="colhead"><span>Site</span><span class="c2">Site visits</span><span class="c3">Last activity</span></div>
        <div id="sites-bars"></div><div id="sites-pager"></div></div>`;
      document.querySelectorAll("#sites-win button").forEach(b=>b.onclick=()=>{winSites=+b.dataset.d;pageSites=1;renderS2("sites");});
      document.getElementById("sites-dept").onchange=e=>{deptSites=e.target.value;pageSites=1;drawSites();};
      drawSites();
    }else{
      box.innerHTML=`<div class="panel">
        <div class="ptitle">Total EDRMS Users</div>
        <div class="psub">Distinct people who opened something in each site. The 90 day window is deliberately absent: Microsoft returns no unique viewer total at 90 days, so the button could only ever show something else.</div>
        <div class="toolbar">
          <div class="dayf" id="users-win">${[7,30].map(dd=>`<button class="${winUsers===dd?'on':''}" data-d="${dd}">Last ${dd} days</button>`).join("")}</div>
          <div class="ctl">Department<select id="users-dept">${deptOptions(deptUsers)}</select></div></div>
        <div class="statrow" id="users-stats"></div>
        <div class="colhead"><span>Site</span><span class="c2" id="users-metric-h">Unique viewers</span><span class="c3">Last activity</span></div>
        <div id="users-bars"></div><div id="users-note"></div><div id="users-pager"></div></div>`;
      document.querySelectorAll("#users-win button").forEach(b=>b.onclick=()=>{winUsers=+b.dataset.d;pageUsers=1;renderS2("users");});
      document.getElementById("users-dept").onchange=e=>{deptUsers=e.target.value;pageUsers=1;drawUsers();};
      drawUsers();
    }
  }
  function drawSites(){
    const vKey=s=>winSites===7?s.v7:winSites===30?s.v30:s.v90;
    let list=SITES.filter(s=>s.last<=winSites);
    if(deptSites!=="all")list=list.filter(s=>s.dept===deptSites);
    list=list.map(s=>({...s,v:vKey(s)})).sort((a,b)=>b.v-a.v);
    const visits=list.reduce((a,b)=>a+b.v,0);
    document.getElementById("sites-stats").innerHTML=`
      <div class="stat"><div class="sl">Active sites</div><div class="sv">${F(list.length)}</div></div>
      <div class="stat"><div class="sl">Total site visits</div><div class="sv">${F(visits)}</div></div>`;
    const mx=Math.max(...list.map(s=>s.v),1);
    const pages=Math.max(1,Math.ceil(list.length/10));if(pageSites>pages)pageSites=pages;
    const pg=list.slice((pageSites-1)*10,pageSites*10);
    document.getElementById("sites-bars").innerHTML=pg.map(s=>`<div class="cbar act"><div class="cl"><b>${s.site}</b><small>${s.dept}</small></div>
      <div class="ct"><div class="cf" style="width:${Math.max(6,100*s.v/mx)}%;background:var(--green)">${F(s.v)}</div></div>
      <div class="la">${s.last} day${s.last===1?"":"s"} ago</div></div>`).join("");
    document.getElementById("sites-pager").innerHTML=pager(list.length,pageSites,pages,"sites");
    wirePager("#sites-pager",v=>{pageSites=v==="prev"?Math.max(1,pageSites-1):v==="next"?Math.min(pages,pageSites+1):+v;drawSites();});
  }
  function drawUsers(){
    const uvKey=s=>winUsers===7?s.uv7:s.uv30;
    let list=SITES.filter(s=>s.last<=winUsers);
    if(deptUsers!=="all")list=list.filter(s=>s.dept===deptUsers);
    list=list.map(s=>({...s,m:uvKey(s)})).sort((a,b)=>b.m-a.m);
    document.getElementById("users-metric-h").textContent="Unique viewers";
    const totUV=list.reduce((a,b)=>a+uvKey(b),0);
    /* Two figures, not one, because they answer different questions. The
       bankwide total counts people; the sum of the bars counts site
       memberships. Showing only the sum would overstate headcount. */
    const bank=(winUsers===30&&deptUsers==="all")
      ? `<div class="stat"><div class="sl">Distinct people, bankwide</div><div class="sv">${F(MONTHLY_ACTIVE_USERS)}</div></div>`:"";
    document.getElementById("users-stats").innerHTML=
      bank+`<div class="stat"><div class="sl">Sum of per site viewers</div><div class="sv">${F(totUV)}</div></div>`;
    const mx=Math.max(...list.map(s=>s.m),1);
    const pages=Math.max(1,Math.ceil(list.length/10));if(pageUsers>pages)pageUsers=pages;
    const pg=list.slice((pageUsers-1)*10,pageUsers*10);
    document.getElementById("users-bars").innerHTML=pg.map(s=>`<div class="cbar act"><div class="cl"><b>${s.site}</b><small>${s.dept}</small></div>
      <div class="ct"><div class="cf" style="width:${Math.max(6,100*s.m/mx)}%;background:var(--deepblue)">${F(s.m)}</div></div>
      <div class="la">${s.last} day${s.last===1?"":"s"} ago</div></div>`).join("");
    document.getElementById("users-note").innerHTML=(winUsers===30&&deptUsers==="all")
      ? `<div class="note">The bars add up to ${F(totUV)}, more than the ${F(MONTHLY_ACTIVE_USERS)} distinct people bankwide, because anyone working in several sites is counted once per site. Use the bankwide figure for headcount and the bars for reach.</div>`:"";
    document.getElementById("users-pager").innerHTML=pager(list.length,pageUsers,pages,"sites");
    wirePager("#users-pager",v=>{pageUsers=v==="prev"?Math.max(1,pageUsers-1):v==="next"?Math.min(pages,pageUsers+1):+v;drawUsers();});
  }

  /* ===== declaration over time ===== */
  function renderS3(){
    const mmax=Math.max(...MONTHS.map(m=>m.value));
    const ymax=Math.max(...YEARS.map(y=>y.value));
    document.getElementById("s3-detail").innerHTML=`<div class="panel">
      <div class="ptitle">Records declared by month, ${YEARS[YEARS.length-1].label}</div>
      <div class="psub">Declarations in each month of the current year. The twelve months total ${F(ANNUAL_REC)}, the same figure as Total Declared Records above.</div>
      <div class="mrow">${MONTHS.map(m=>`
        <div class="mcol" title="${m.label}: ${F(m.value)} records">
          <div class="mbar" style="height:${Math.max(4,100*m.value/mmax)}%"></div>
          <div class="mval">${F(m.value)}</div>
          <div class="mlab">${m.label}</div>
        </div>`).join("")}</div>
      <div class="subtotal">Latest closed month, ${THIS_MONTH.label}: <b>${F(THIS_MONTH.value)}</b> records declared.</div>
    </div>
    <div class="panel">
      <div class="ptitle">Records declared by year</div>
      <div class="psub">Declarations per year since the programme began. The current year is still in progress, so it is not directly comparable with the closed years beside it.</div>
      ${YEARS.map(y=>`<div class="ybar"><div class="yl"><b>${y.label}</b></div>
        <div class="yt"><div class="yf" style="width:${Math.max(6,100*y.value/ymax)}%">${F(y.value)}</div></div></div>`).join("")}
    </div>`;
  }

  const html=`<section class="dash-rm">
    <div class="band">
      <h2>Total Declared Records vs Total Documents in EDRMS Compliant Sites</h2>
      <div class="bd">See how much of the content stored in EDRMS compliant sites has been formally declared as an official record, and how that breaks down by department, site, and library.</div>
    </div>
    <div class="kpis" id="s1-kpis">
      <div class="kpi on" data-k="rec"><div class="lab">Total Declared Records</div><div class="val" id="kpi-rec">…</div><div class="tap">▾ Click to open</div></div>
      <div class="kpi" data-k="docs"><div class="lab">Total Documents in EDRMS Compliant Sites</div><div class="val" id="kpi-docs">…</div><div class="tap">▾ Click to open</div></div>
    </div>
    <div id="s1-detail"></div>

    <div class="band">
      <h2>SharePoint Sites and Users Governance</h2>
      <div class="bd">See which departmental sites and users are actively engaging with EDRMS, based on SharePoint usage. Site visits are available at 7, 30 and 90 days; unique viewers only at 7 and 30, which is a Microsoft limit rather than a design choice.</div>
    </div>
    <div class="kpis" id="s2-kpis">
      <div class="kpi on" data-k="sites"><div class="lab">Active Departmental Sites</div><div class="val" id="kpi-sites">…</div><div class="tap">▾ Click to open</div></div>
      <div class="kpi" data-k="users"><div class="lab">Total EDRMS Users, monthly active</div><div class="val" id="kpi-users">…</div><div class="tap">▾ Click to open</div></div>
    </div>
    <div id="s2-detail"></div>

    <div class="band">
      <h2>Declaration over time</h2>
      <div class="bd">When records were declared, by month across the current year and by year since the programme began. Both read the declaration date held against every record, so neither waits on anything.</div>
    </div>
    <div class="kpis" id="s3-kpis">
      <div class="kpi on"><div class="lab">Records Declared This Month</div><div class="val" id="kpi-month">…</div><div class="tap">▾ Opened below</div></div>
      <div class="kpi"><div class="lab">Records Declared This Year</div><div class="val" id="kpi-year">…</div><div class="tap">▾ Opened below</div></div>
    </div>
    <div id="s3-detail"></div>
  </section>`;

  function init(){
    document.getElementById("kpi-rec").textContent=F(ANNUAL_REC);
    document.getElementById("kpi-month").textContent=F(THIS_MONTH.value);
    document.getElementById("kpi-year").textContent=F(ANNUAL_REC);
    document.getElementById("kpi-docs").textContent=(ANNUAL_DOCS/1e6).toFixed(2)+"M";
    document.getElementById("kpi-sites").textContent=F(SITES.filter(s=>s.last<=7).length);
    document.getElementById("kpi-users").textContent=F(MONTHLY_ACTIVE_USERS);
    document.querySelectorAll("#s1-kpis .kpi").forEach(k=>k.onclick=()=>renderS1(k.dataset.k));
    document.querySelectorAll("#s2-kpis .kpi").forEach(k=>k.onclick=()=>renderS2(k.dataset.k));
    renderS1(curS1);renderS2(curS2);renderS3();
  }

  return {
    ver:"Records Management Dashboard",
    crumb:"Records Management Dashboard",
    asof:"Data as of Mon 20 Jul 2026 23:59 · refreshed Tue 21 Jul 06:00",
    /* exposed so Format and Storage can assert its format counts still add up
       to the same declared records total */
    annualRec:ANNUAL_REC,
    /* Read by the Overview dashboard. Derived here, from the same arrays this
       dashboard renders, so a summary figure can never drift from the detail
       figure it is summarising. */
    summary:{
      declared:ANNUAL_REC,
      documents:ANNUAL_DOCS,
      withPhysical:DEPTS.reduce((a,d)=>a+d.phys,0),
      get withoutPhysical(){return this.declared-this.withPhysical;},
      activeSites7:SITES.filter(s=>s.last<=7).length,
      totalSitesTracked:SITES.length,
      activeUsers7:SITES.filter(s=>s.last<=7).reduce((a,s)=>a+s.uv7,0),
      monthlyActiveUsers:MONTHLY_ACTIVE_USERS,
      declaredThisMonth:THIS_MONTH.value,
      declaredByYear:YEARS.map(y=>({label:y.label,value:y.value})),
      topDepartments:[...DEPTS].sort((a,b)=>b.rec-a.rec).slice(0,5).map(d=>({label:d.c,name:d.n,value:d.rec})),
      departmentCount:DEPTS.length
    },
    html,init
  };
})();

/* ===================================================================
   Format and Storage
   Built from the approved mockup. Must be defined after DASHBOARDS.rm,
   because it asserts against that dashboard's declared records total.
   =================================================================== */
DASHBOARDS.fs=(function(){
  /* Average file size is DERIVED, never stored: storageGB * 1024 / files. */
  const FORMATS=[
    {label:"PDF",                files:8200, gb:9.6},
    {label:"Word",               files:5100, gb:3.0},
    {label:"Excel",              files:3050, gb:2.7},
    {label:"Email (.msg / .eml)",files:2100, gb:0.6},
    {label:"PowerPoint",         files:1350, gb:5.9},
    {label:"Image files",        files:980,  gb:3.6},
    {label:"Video files",        files:466,  gb:20.5},
    {label:"All other formats",  files:400,  gb:0.8},
  ];
  const avgOf=f=>f.files?f.gb*1024/f.files:0;
  const TOT_FILES=FORMATS.reduce((a,f)=>a+f.files,0);
  const TOT_GB=FORMATS.reduce((a,f)=>a+f.gb,0);
  const TOT_AVG=TOT_FILES?TOT_GB*1024/TOT_FILES:0;

  /* The format file counts are a decomposition of Total Declared Records on the
     Records Management dashboard. If the department data over there ever
     changes, this fires so the two dashboards cannot silently drift apart. */
  console.assert(TOT_FILES===DASHBOARDS.rm.annualRec,
    `Format and Storage total files (${TOT_FILES}) does not match Records Management declared records (${DASHBOARDS.rm.annualRec})`);

  const COLS=[{k:"files",label:"Number of files"},{k:"gb",label:"Storage (GB)"},{k:"avg",label:"Avg file size (MB)"}];
  const valOf={files:f=>f.files, gb:f=>f.gb, avg:f=>avgOf(f)};
  const fmtOf={files:f=>F(f.files), gb:f=>f.gb.toFixed(1)+" GB", avg:f=>avgOf(f).toFixed(1)};

  let field="files",dir="desc";

  function drawTable(){
    document.querySelectorAll("#fs-field button").forEach(b=>b.classList.toggle("on",b.dataset.f===field));
    document.getElementById("fs-dir").innerHTML=(dir==="desc"?'▼ Highest first':'▲ Lowest first');
    const rows=[...FORMATS].sort((a,b)=>dir==="desc"?valOf[field](b)-valOf[field](a):valOf[field](a)-valOf[field](b));
    const mx={};COLS.forEach(c=>{mx[c.k]=Math.max(...FORMATS.map(f=>valOf[c.k](f)),0.0001);});
    let h=`<div class="fhead"><span>Format</span>`+
      COLS.map(c=>`<span class="num ${c.k===field?'on':''}" data-col="${c.k}">${c.label}</span>`).join("")+`</div>`;
    h+=rows.map(f=>`<div class="frow"><span class="fname">${f.label}</span>`+
      COLS.map(c=>{const w=Math.max(2,100*valOf[c.k](f)/mx[c.k]);
        return `<span class="fcell"><i class="fbar" style="width:${w}%"></i><b>${fmtOf[c.k](f)}</b></span>`;}).join("")+
      `</div>`).join("");
    h+=`<div class="ftot"><span class="fname">Total</span><span class="tv">${F(TOT_FILES)}</span><span class="tv">${TOT_GB.toFixed(1)} GB</span><span class="tv">${TOT_AVG.toFixed(1)}</span></div>`;
    document.getElementById("fs-table").innerHTML=h;
  }
  function drawRecords(){
    const rows=[...FORMATS].sort((a,b)=>b.files-a.files);
    const mx=Math.max(...rows.map(r=>r.files),1);
    document.getElementById("fs-records").innerHTML=rows.map(r=>{
      const pct=TOT_FILES?r.files/TOT_FILES*100:0;
      return `<div class="rbar"><div class="rl">${r.label}</div>
        <div class="rt"><div class="rf" style="width:${Math.max(2,100*r.files/mx)}%"></div></div>
        <div class="rv"><b>${F(r.files)}</b><span> · ${pct.toFixed(1)}%</span></div></div>`;}).join("");
  }

  const html=`<section class="dash-fs">
    <div class="band">
      <h2>Storage footprint by file format</h2>
      <div class="bd">Which file formats consume the most storage across EDRMS compliant sites, and how declared records break down by format.</div>
    </div>
    <div class="kpis">
      <div class="kpi on"><div class="lab">Storage Consumed by Format</div><div class="val" id="kpi-fsgb"></div><div class="tap">▾ Opened below</div></div>
    </div>
    <div class="panel">
      <div class="ptitle">Storage consumed by format</div>
      <div class="psub">File formats ranked by number of files, storage consumed, and average file size. Bars are scaled within each column, so the longest bar in a column is that column's largest value.</div>
      <div class="sortrow"><span class="lbl">Sort by</span>
        <div class="segctl" id="fs-field"><button data-f="files">Files</button><button data-f="gb">Storage</button><button data-f="avg">Avg file size</button></div>
        <button class="dirbtn" id="fs-dir"></button></div>
      <div class="ftab" id="fs-table"></div>
    </div>

    <div class="kpis">
      <div class="kpi on"><div class="lab">Most Common Format</div><div class="val" id="kpi-fstop"></div><div class="tap">▾ Opened below</div></div>
    </div>
    <div class="panel">
      <div class="ptitle">Declared records by format</div>
      <div class="psub">Declared records broken down by file format, as a count and as a share of all declared records.</div>
      <div id="fs-records"></div>
    </div>
  </section>`;

  function init(){
    document.getElementById("kpi-fsgb").textContent=TOT_GB.toFixed(1)+" GB";
    document.getElementById("kpi-fstop").textContent=FORMATS.reduce((a,b)=>b.files>a.files?b:a).label;
    document.querySelectorAll("#fs-field button").forEach(b=>b.onclick=()=>{field=b.dataset.f;drawTable();});
    document.getElementById("fs-dir").onclick=()=>{dir=dir==="desc"?"asc":"desc";drawTable();};
    drawTable();drawRecords();
  }

  return {
    ver:"Format and Storage Dashboard",
    crumb:"Format and Storage Dashboard",
    asof:"Data as of Sun 05 Jul 2026 23:59 · refreshed Mon 06 Jul 06:00",
    /* Read by the Overview dashboard. Derived from the same array this
       dashboard renders, so a summary figure can never drift from the detail. */
    summary:{
      totalFiles:TOT_FILES,
      totalGB:TOT_GB,
      avgFileSizeMB:TOT_AVG,
      formatCount:FORMATS.length,
      formats:FORMATS.map(f=>({label:f.label,files:f.files,gb:f.gb}))
    },
    html,init
  };
})();

   overview.js

/* ===================================================================
   Overview
   An executive summary of the other dashboards. Must be defined after
   them, because every figure it shows is read from their exported
   `summary` objects rather than restated here. That is deliberate: a
   summary that keeps its own copy of the numbers drifts away from the
   detail it claims to summarise the first time either side is edited.
   =================================================================== */
DASHBOARDS.ov=(function(){
  const RM=DASHBOARDS.rm.summary;
  const SL=DASHBOARDS.sl.summary;
  const FS=DASHBOARDS.fs.summary;

  /* Cross dashboard checks. These fire in the console rather than on the page,
     so a broken figure is caught during verification instead of by a reader. */
  console.assert(RM.declared===FS.totalFiles,
    `Overview: declared records (${RM.declared}) and format file total (${FS.totalFiles}) disagree`);
  console.assert(RM.withPhysical+RM.withoutPhysical===RM.declared,
    "Overview: physical counterpart split does not sum to declared records");
  console.assert(SL.libraryRecords+SL.libraryUndeclared===SL.libraryDocuments,
    "Overview: library declaration split does not sum to library documents");
  console.assert(Math.abs(FS.formats.reduce((a,f)=>a+f.gb,0)-FS.totalGB)<0.05,
    "Overview: format storage does not sum to the storage total");

  const GB=n=>n.toFixed(1)+" GB";
  const PCT=(v,t)=>t?(v/t*100):0;

  /* ===== chart primitives, all mapped to native Power BI visuals ===== */

  /* Donut chart. Power BI equivalent: Donut chart. */
  function arcSeg(cx,cy,rO,rI,a0,a1,fill,title){
    const large=(a1-a0)>Math.PI?1:0;
    const pt=(r,a)=>[(cx+r*Math.cos(a)).toFixed(2),(cy+r*Math.sin(a)).toFixed(2)];
    const [x0,y0]=pt(rO,a0),[x1,y1]=pt(rO,a1),[x2,y2]=pt(rI,a1),[x3,y3]=pt(rI,a0);
    return `<path d="M${x0} ${y0}A${rO} ${rO} 0 ${large} 1 ${x1} ${y1}L${x2} ${y2}A${rI} ${rI} 0 ${large} 0 ${x3} ${y3}Z" fill="${fill}"><title>${title}</title></path>`;
  }
  function donut(items,o){
    o=o||{};
    const size=o.size||168, th=o.thickness||32, cx=size/2, cy=size/2, rO=size/2, rI=size/2-th;
    const total=items.reduce((a,i)=>a+i.value,0)||1;
    let a=-Math.PI/2, out="";
    items.forEach(i=>{
      const frac=i.value/total;
      if(frac<=0)return;
      const a1=a+frac*Math.PI*2;
      if(frac>0.9995){
        /* a single full slice would collapse the arc endpoints onto each other,
           so draw it as a stroked circle instead */
        out+=`<circle cx="${cx}" cy="${cy}" r="${(rO+rI)/2}" fill="none" stroke="${i.color}" stroke-width="${th}"><title>${i.label}</title></circle>`;
      }else{
        out+=arcSeg(cx,cy,rO,rI,a,a1,i.color,`${i.label}: ${o.fmt?o.fmt(i.value):F(i.value)}`);
      }
      a=a1;
    });
    const centre=o.centreValue
      ? `<text x="${cx}" y="${cy-1}" text-anchor="middle" font-size="20" font-weight="700" fill="#10243E" style="font-variant-numeric:tabular-nums">${o.centreValue}</text>
         <text x="${cx}" y="${cy+16}" text-anchor="middle" font-size="10" fill="#6B7A8C">${o.centreLabel||""}</text>`
      : "";
    return `<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}" style="display:block;flex:0 0 auto">${out}${centre}</svg>`;
  }
  function legend(items,fmt){
    const total=items.reduce((a,i)=>a+i.value,0)||1;
    return `<div class="dleg">`+items.map(i=>
      `<div class="dlrow"><span class="sw" style="background:${i.color}"></span>
        <span class="dlab" title="${i.label}">${i.label}</span>
        <span class="dval">${fmt(i.value)}</span>
        <span class="dpct">${PCT(i.value,total).toFixed(1)}%</span></div>`).join("")+`</div>`;
  }
  function donutCard(items,o,fmt){
    return `<div class="cwrap">${donut(items,o)}${legend(items,fmt)}</div>`;
  }

  /* Ranked horizontal bars. Power BI equivalent: Clustered bar chart. */
  function topBars(items,fmt){
    const mx=Math.max(...items.map(i=>i.value),1);
    return items.map(i=>`<div class="tbar">
      <div class="tl"><b>${i.label}</b>${i.name?`<small>${i.name}</small>`:""}</div>
      <div class="tt"><div class="tf" style="width:${Math.max(3,100*i.value/mx)}%"></div></div>
      <div class="tv">${fmt(i.value)}</div></div>`).join("");
  }

  /* Two magnitudes on one shared scale, so the gap between them is the message.
     Power BI equivalent: Clustered bar chart. */
  function gapBars(rows,fmt){
    const mx=Math.max(...rows.map(r=>r.value),1);
    return rows.map(r=>`<div class="gap">
      <div class="gl"><span>${r.label}</span><b>${fmt(r.value)}</b></div>
      <div class="gt"><div class="gf" style="width:${Math.max(0.4,100*r.value/mx)}%;background:${r.color}"></div></div>
    </div>`).join("");
  }

  /* ===== palette, taken from the ADB tokens only ===== */
  const C={blue:"#0072BC",teal:"#00A5A8",deep:"#1B5E82",green:"#5CA943",grey:"#9DB8D2",faint:"#C7D3E0",orange:"#E8763C"};

  /* The same five formats appear in both format donuts, with the same colours,
     so the two can be read against each other. Grouping the tail into one slice
     also keeps each donut readable, which eight slices would not be. */
  const FMT_TOP=[...FS.formats].sort((a,b)=>b.gb-a.gb).slice(0,5);
  const FMT_REST=FS.formats.filter(f=>!FMT_TOP.includes(f));
  const FMT_COLORS=[C.blue,C.teal,C.deep,C.green,C.grey];
  const storageSlices=FMT_TOP.map((f,i)=>({label:f.label,value:f.gb,color:FMT_COLORS[i]}))
    .concat([{label:"All other formats",value:FMT_REST.reduce((a,f)=>a+f.gb,0),color:C.faint}]);
  const fileSlices=FMT_TOP.map((f,i)=>({label:f.label,value:f.files,color:FMT_COLORS[i]}))
    .concat([{label:"All other formats",value:FMT_REST.reduce((a,f)=>a+f.files,0),color:C.faint}]);

  console.assert(Math.abs(storageSlices.reduce((a,s)=>a+s.value,0)-FS.totalGB)<0.05,
    "Overview: storage donut does not sum to the storage total");
  console.assert(fileSlices.reduce((a,s)=>a+s.value,0)===FS.totalFiles,
    "Overview: file donut does not sum to the file total");

  /* The single most useful comparison in the data: the format that dominates
     storage is not the format that dominates the file count. */
  const bigStorage=storageSlices[0];
  const bigStorageFiles=fileSlices[0];
  const bigFiles=[...fileSlices].sort((a,b)=>b.value-a.value)[0];

  const html=`<section class="dash-ov">
    <div class="band">
      <h2>Executive summary</h2>
      <div class="bd">One view of how the EDRMS is being adopted across the bank. Each section below summarises a dashboard: open that dashboard for the full detail, filters, and drill down.</div>
    </div>

    <div class="kpis" id="ov-kpis"></div>

    <div class="panel">
      <div class="phead">
        <div>
          <div class="ptitle">Records Management</div>
          <div class="psub">How much of the content held in EDRMS compliant sites has been formally declared as a record, and which departments are declaring it.</div>
        </div>
        <button class="golink" data-go="rm">Open Records Management &rsaquo;</button>
      </div>
      <div class="crow">
        <div class="chart">
          <div class="ctitle">Declared records by physical counterpart</div>
          <div id="ov-rm-donut"></div>
        </div>
        <div class="chart">
          <div class="ctitle">Declared against everything held</div>
          <div id="ov-rm-gap"></div>
        </div>
        <div class="chart wide">
          <div class="ctitle">Top 5 departments by declared records</div>
          <div id="ov-rm-top"></div>
        </div>
      </div>
    </div>

    <div class="panel">
      <div class="phead">
        <div>
          <div class="ptitle">Sites and Libraries</div>
          <div class="psub">How far the compliant site rollout has reached, and how thoroughly the libraries inside those sites are declaring their content.</div>
        </div>
        <button class="golink" data-go="sl">Open Sites and Libraries &rsaquo;</button>
      </div>
      <div class="crow">
        <div class="chart">
          <div class="ctitle">Library content declared as records</div>
          <div id="ov-sl-donut"></div>
        </div>
        <div class="chart wide">
          <div class="ctitle">Top 5 departments by compliant sites created</div>
          <div id="ov-sl-top"></div>
        </div>
      </div>
    </div>

    <div class="panel">
      <div class="phead">
        <div>
          <div class="ptitle">Format and Storage</div>
          <div class="psub">Which file formats the declared records are held in, and which of them are actually consuming the storage.</div>
        </div>
        <button class="golink" data-go="fs">Open Format and Storage &rsaquo;</button>
      </div>
      <div class="crow">
        <div class="chart">
          <div class="ctitle">Share of storage consumed</div>
          <div id="ov-fs-gb"></div>
        </div>
        <div class="chart">
          <div class="ctitle">Share of files held</div>
          <div id="ov-fs-files"></div>
        </div>
      </div>
      <div id="ov-fs-callout"></div>
    </div>
  </section>`;

  function init(){
    /* headline cards, each one a route into the dashboard it came from */
    const cards=[
      {lab:"Total Declared Records", val:F(RM.declared),                 go:"rm", to:"Records Management"},
      {lab:"Documents in Compliant Sites", val:(RM.documents/1e6).toFixed(2)+"M", go:"rm", to:"Records Management"},
      {lab:"Compliant Sites Created", val:F(SL.sitesCreated),            go:"sl", to:"Sites and Libraries"},
      {lab:"Storage Consumed", val:GB(FS.totalGB),                       go:"fs", to:"Format and Storage"},
      {lab:"Active Sites, Last 7 Days", val:F(RM.activeSites7),          go:"rm", to:"Records Management"},
    ];
    document.getElementById("ov-kpis").innerHTML=cards.map(c=>
      `<div class="kpi" data-go="${c.go}"><div class="lab">${c.lab}</div><div class="val">${c.val}</div>
       <div class="tap">View in ${c.to} &rsaquo;</div></div>`).join("");

    /* Records Management */
    const physSlices=[
      {label:"Without physical counterpart",value:RM.withoutPhysical,color:C.grey},
      {label:"With physical counterpart",value:RM.withPhysical,color:C.teal},
    ];
    document.getElementById("ov-rm-donut").innerHTML=
      donutCard(physSlices,{centreValue:F(RM.declared),centreLabel:"declared records"},F);

    const rate=PCT(RM.declared,RM.documents);
    document.getElementById("ov-rm-gap").innerHTML=
      gapBars([
        {label:"Documents in compliant sites",value:RM.documents,color:C.orange},
        {label:"Declared as records",value:RM.declared,color:C.blue},
      ],F)+
      `<div class="callout"><b>${rate.toFixed(2)}%</b> of the documents held in EDRMS compliant sites have been declared as records. The remaining <b>${F(RM.documents-RM.declared)}</b> documents sit in compliant sites without record status.</div>`;

    document.getElementById("ov-rm-top").innerHTML=topBars(RM.topDepartments,F)+
      `<div class="mini"><div>Departments reporting<b>${F(RM.departmentCount)}</b></div>
        <div>EDRMS users, monthly active<b>${F(RM.monthlyActiveUsers)}</b></div></div>`;

    /* Sites and Libraries */
    const libSlices=[
      {label:"Declared as records",value:SL.libraryRecords,color:C.teal},
      {label:"Not yet declared",value:SL.libraryUndeclared,color:C.grey},
    ];
    document.getElementById("ov-sl-donut").innerHTML=
      donutCard(libSlices,{centreValue:PCT(SL.libraryRecords,SL.libraryDocuments).toFixed(1)+"%",centreLabel:"declared"},F);

    document.getElementById("ov-sl-top").innerHTML=topBars(SL.topDepartments,F)+
      `<div class="mini"><div>Compliant sites created<b>${F(SL.sitesCreated)}</b></div>
        <div>Libraries tracked<b>${F(SL.libraryCount)}</b></div>
        <div>Library storage<b>${GB(SL.storageGB)}</b></div></div>`;

    /* Format and Storage, two donuts sharing one colour scheme so they can be
       read against each other */
    document.getElementById("ov-fs-gb").innerHTML=
      donutCard(storageSlices,{centreValue:GB(FS.totalGB),centreLabel:"total storage"},GB);
    document.getElementById("ov-fs-files").innerHTML=
      donutCard(fileSlices,{centreValue:F(FS.totalFiles),centreLabel:"total files"},F);

    const gbShare=PCT(bigStorage.value,FS.totalGB), fileShare=PCT(bigStorageFiles.value,FS.totalFiles);
    document.getElementById("ov-fs-callout").innerHTML=
      `<div class="callout">The two charts do not agree, and that is the point. <b>${bigStorage.label}</b> account for <b>${gbShare.toFixed(1)}%</b> of storage but only <b>${fileShare.toFixed(1)}%</b> of files, while <b>${bigFiles.label}</b> are the most numerous at <b>${PCT(bigFiles.value,FS.totalFiles).toFixed(1)}%</b> of files. Storage pressure comes from a small number of large files, not from the formats people create most often.</div>`;

    /* every card and button routes to the dashboard the figure came from */
    document.querySelectorAll(".dash-ov [data-go]").forEach(el=>
      el.onclick=()=>switchTo(el.dataset.go));
  }

  return {
    ver:"Overview Dashboard",
    crumb:"Overview",
    /* A summary is only as current as its stalest input, so this quotes the
       oldest refresh across the dashboards it draws from rather than the newest. */
    asof:"Data as of Sun 05 Jul 2026 23:59, the oldest refresh across the dashboards summarised here",
    html,init
  };
})();


/* =================================================================
   fileplan.js
   The institutional file plan, which is the SharePoint term store read as
   a report. Answers the client's section 3: total terms and the count in
   each top level category.

   Sourced from the Graph term store API and testable in Graph Explorer
   today:
     GET /termStore/groups                       the categories
     GET /termStore/groups/{groupId}/sets        the sets inside one
     GET /termStore/sets/{setId}/children        the terms at one level

   One wrinkle worth knowing before anyone estimates it: a file plan is a
   tree and the API returns one level at a time, so a full count means
   walking down through each level rather than reading a single number.
   That is a loop, not a blocker, and it is why this is a small job rather
   than a free one.
   ================================================================= */
DASHBOARDS.fp=(function(){
  /* [category, sets, terms, depth]. The five top level groups the client
     names. Counts are illustrative until the walk above is run against the
     tenant; the source is confirmed, the numbers are not. */
  const CATS=[
   {label:"Programme and operation", sets:14, terms:412, depth:4},
   {label:"Administration",          sets:11, terms:286, depth:3},
   {label:"Compliance and oversight",sets:8,  terms:174, depth:3},
   {label:"People Management",       sets:7,  terms:139, depth:3},
   {label:"Risk management",         sets:5,  terms:88,  depth:2},
  ];
  const TOTAL_TERMS=CATS.reduce((a,c)=>a+c.terms,0);
  const TOTAL_SETS=CATS.reduce((a,c)=>a+c.sets,0);
  const MAX_DEPTH=Math.max(...CATS.map(c=>c.depth));
  console.assert(CATS.every(c=>c.terms>=c.sets),
    "A category cannot hold fewer terms than it has term sets");

  function draw(){
    const mx=Math.max(...CATS.map(c=>c.terms));
    document.getElementById("fp-bars").innerHTML=CATS.map(c=>
      `<div class="fbar"><div class="fl"><b>${c.label}</b><small>${c.sets} term sets, ${c.depth} levels deep</small></div>
        <div class="ft"><div class="ff" style="width:${Math.max(8,100*c.terms/mx)}%">${F(c.terms)}</div></div>
        <div class="fp">${(c.terms/TOTAL_TERMS*100).toFixed(1)}%</div></div>`).join("");
  }

  const html=`<section class="dash-fp">
    <div class="band">
      <h2>Institutional file plan</h2>
      <div class="bd">The file plan is the SharePoint term store, so its size and shape can be reported directly. How many terms exist, and how they divide across the five categories.</div>
    </div>
    <div class="kpis" id="fp-kpis">
      <div class="kpi on"><div class="lab">Total Terms</div><div class="val" id="kpi-terms">…</div><div class="tap">▾ Opened below</div></div>
      <div class="kpi"><div class="lab">Term Sets</div><div class="val" id="kpi-sets">…</div><div class="tap">▾ Opened below</div></div>
    </div>
    <div class="panel">
      <div class="ptitle">Terms by category</div>
      <div class="psub">The five top level groups in the term store, sized by how many terms sit beneath them at every level. The deepest branch runs ${MAX_DEPTH} levels.</div>
      <div id="fp-bars"></div>
      <div class="note">Counts include terms at every level, not only the top. The term store API returns one level at a time, so producing these means walking the tree rather than reading a single total. The categories and the source are confirmed; the counts here are illustrative until that walk is run.</div>
    </div>
  </section>`;

  function init(){
    document.getElementById("kpi-terms").textContent=F(TOTAL_TERMS);
    document.getElementById("kpi-sets").textContent=F(TOTAL_SETS);
    draw();
  }

  return {
    ver:"File Plan Dashboard",
    crumb:"File Plan Dashboard",
    asof:"Data as of Mon 20 Jul 2026 23:59, refreshed Tue 21 Jul 06:00",
    summary:{
      totalTerms:TOTAL_TERMS,
      totalSets:TOTAL_SETS,
      maxDepth:MAX_DEPTH,
      categoryCount:CATS.length,
      categories:CATS.map(c=>({label:c.label,terms:c.terms,sets:c.sets}))
    },
    html,init
  };
})();


/* =================================================================
   retention.js
   Answers the client's 2.1.2.8, the disposal summary. Built rather than
   left a placeholder because the data is already there: Records carries
   EDRMSDueDateForDisposal, computed as EDRMSRetentionLabelApplied plus
   EDRMSDuration, so records due for disposal and the next due date are a
   count and a MIN over a column that exists today. The only figure here
   that is not available now is the inactive document count, which needs
   the document scan, and it is marked as such on the panel.
   ================================================================= */
DASHBOARDS.rt=(function(){
  /* Retention labels across all declared records. Sums to the same 21,646 the
     other dashboards use, and asserts it below rather than trusting it. */
  const LABELS=[
    {label:"10 years after declaration",count:8420},
    {label:"7 years after declaration", count:5310},
    {label:"5 years after declaration", count:3980},
    {label:"Permanent",                 count:2460},
    {label:"3 years after declaration", count:1476},
  ];
  const LABEL_TOTAL=LABELS.reduce((a,l)=>a+l.count,0);
  /* Permanent records are never due for disposal. Stating it as a constant
     keeps the "never due" population visible instead of buried in a filter. */
  const PERMANENT=LABELS.find(l=>l.label==="Permanent").count;

  /* Disposal summary per library. Record counts are the same figures the
     Sites and Libraries dashboard shows, so the two reconcile.
     [library, site, records, dueWithin12m, nextDue, inactive1y] */
  const DLIBS=[
   ["Final Documents","ITD Records Site",640,84,"2026-11-14",210],
   ["Board Papers","OGC Legal Site",540,96,"2026-09-02",164],
   ["Country Reports","SARD Ops Site",450,61,"2026-10-27",138],
   ["Loan Agreements","FIN Treasury Site",384,0,"2031-04-18",92],
   ["Policies","HRD People Site",315,44,"2027-01-09",71],
   ["Project Completion","OSFG Country Site",300,38,"2026-12-03",96],
   ["Field Reports","SERD Ops Site",286,52,"2026-08-21",118],
   ["Case Files","OGC Compliance Site",280,31,"2027-02-16",64],
   ["Minutes","BRM Budget Site",245,58,"2026-09-30",83],
   ["Correspondence","PARD Procurement Site",210,74,"2026-08-14",147],
   ["Investment Memos","PSOD Investments Site",180,22,"2027-03-05",40],
   ["Legal Opinions","OGC Advisory Site",150,0,"2033-06-11",55],
   ["Audit Reports","CWRD Ops Site",120,19,"2026-12-19",37],
   ["Climate Briefs","SDCC Climate Site",95,12,"2027-05-22",26],
   ["Admin Records","OAS Facilities Site",88,17,"2026-10-08",31],
  ];
  const DUE_TOTAL=DLIBS.reduce((a,l)=>a+l[3],0);
  /* Disposal windows. All three are the same count over EDRMSDueDateForDisposal
     at different horizons, so they are held as one shape rather than three
     unrelated numbers, and each is necessarily a subset of the next. */
  const DUE_30=71, DUE_90=196;
  console.assert(DUE_30<=DUE_90 && DUE_90<=DUE_TOTAL,
    "Disposal windows must nest: 30 days inside 90 inside 12 months");

  /* Retention compliance. A record with no retention label has no due date and
     can never be disposed of, which is why it is worth counting separately
     rather than letting it sit silently outside every disposal figure. */
  const WITH_SCHEDULE=20114;
  const BEYOND_RETENTION=342;
  const LIB_RECORDS=DLIBS.reduce((a,l)=>a+l[2],0);
  const INACTIVE_TOTAL=DLIBS.reduce((a,l)=>a+l[5],0);
  const NEXT_DUE=DLIBS.map(l=>l[4]).sort()[0];

  const DFMT=d=>{const x=new Date(d+"T00:00:00");
    return x.toLocaleDateString("en-GB",{day:"2-digit",month:"short",year:"numeric"});};

  /* Reconciliation. The label breakdown must equal the declared record total
     the Records Management dashboard publishes, and no library can have more
     records due than it holds. */
  console.assert(LABEL_TOTAL===DASHBOARDS.rm.summary.declared,
    `Retention labels total ${LABEL_TOTAL} but Records Management declares ${DASHBOARDS.rm.summary.declared}`);
  console.assert(DLIBS.every(l=>l[3]<=l[2]),"A library cannot have more records due for disposal than it holds");
  console.assert(DUE_TOTAL<LABEL_TOTAL-PERMANENT,"Records due must exclude the permanent population");
  const NO_SCHEDULE=LABEL_TOTAL-WITH_SCHEDULE;
  console.assert(WITH_SCHEDULE<=LABEL_TOTAL,"Records with a schedule cannot exceed the declared total");
  console.assert(BEYOND_RETENTION<=WITH_SCHEDULE,"Only a record with a schedule can be beyond its retention period");

  let sortD="due",dirD="desc";
  const DCOLS=[
    {k:"lib",  i:0,lab:"Library",              num:false},
    {k:"site", i:1,lab:"Site",                 num:false},
    {k:"held", i:2,lab:"Records held",         num:true},
    {k:"due",  i:3,lab:"Due within 12 months", num:true},
    {k:"next", i:4,lab:"Next due date",        num:false},
    {k:"inact",i:5,lab:"Inactive over 1 year", num:true},
  ];

  function drawTable(){
    const col=DCOLS.find(c=>c.k===sortD);
    const rows=[...DLIBS].sort((a,b)=>{
      const x=a[col.i],y=b[col.i];
      const cmp=col.num?x-y:String(x).localeCompare(String(y));
      return dirD==="asc"?cmp:-cmp;
    });
    const mx={};[2,3,5].forEach(i=>mx[i]=Math.max(...DLIBS.map(l=>l[i]),1));
    let h="";
    DCOLS.forEach(c=>{
      const arrow=sortD===c.k?(dirD==="asc"?" ↑":" ↓"):"";
      h+=`<div class="hd${c.num?" num":""}${sortD===c.k?" on":""}" data-s="${c.k}">${c.lab}${arrow}</div>`;
    });
    rows.forEach(l=>{
      const cell=i=>`<div class="nc"><div class="nb" style="width:${(l[i]/mx[i]*100).toFixed(1)}%"></div><b>${F(l[i])}</b></div>`;
      h+=`<div class="nm" title="${l[0]}">${l[0]}</div><div class="dp">${l[1]}</div>`;
      h+=cell(2)+cell(3);
      /* A library whose next due date is years out is not "nothing due", it is
         a long or permanent retention. Saying so beats an empty cell. */
      h+=`<div class="dt${l[3]===0?" far":""}">${DFMT(l[4])}</div>`;
      h+=cell(5);
    });
    const t=document.getElementById("rt-table");
    t.innerHTML=h;
    t.querySelectorAll(".hd[data-s]").forEach(hd=>hd.onclick=()=>{
      const k=hd.dataset.s;
      if(sortD===k)dirD=dirD==="asc"?"desc":"asc";
      else{sortD=k;dirD=(k==="lib"||k==="site"||k==="next")?"asc":"desc";}
      drawTable();
    });
  }

  function drawCompliance(){
    const rows=[
      ["With a retention schedule",WITH_SCHEDULE,"var(--teal)"],
      ["No retention schedule",NO_SCHEDULE,"var(--greyblue)"],
      ["Beyond retention period",BEYOND_RETENTION,"var(--orange)"],
    ];
    const mx=Math.max(...rows.map(r=>r[1]));
    document.getElementById("rt-compliance").innerHTML=rows.map(([lab,v,col])=>
      `<div class="lbar"><div class="ll"><b>${lab}</b></div>
        <div class="lt"><div class="lf" style="width:${Math.max(6,100*v/mx)}%;background:${col}">${F(v)}</div></div>
        <div class="lp">${(v/LABEL_TOTAL*100).toFixed(1)}%</div></div>`).join("");
  }
  function drawLabels(){
    const mx=Math.max(...LABELS.map(l=>l.count));
    document.getElementById("rt-labels").innerHTML=LABELS.map(l=>{
      const perm=l.label==="Permanent";
      return `<div class="lbar"><div class="ll"><b>${l.label}</b>${perm?`<small>Never due for disposal</small>`:""}</div>
        <div class="lt"><div class="lf" style="width:${Math.max(6,100*l.count/mx)}%;background:${perm?"var(--greyblue)":"var(--deepblue)"}">${F(l.count)}</div></div>
        <div class="lp">${(l.count/LABEL_TOTAL*100).toFixed(1)}%</div></div>`;
    }).join("");
  }

  const html=`<section class="dash-rt">
    <div class="band">
      <h2>Disposal pipeline</h2>
      <div class="bd">Which declared records are approaching the end of their retention period, and when the next disposal falls due. Due dates come from the retention label applied to each record plus its duration.</div>
    </div>
    <div class="kpis" id="rt-kpis">
      <div class="kpi on"><div class="lab">Records Due for Disposal, next 12 months</div><div class="val" id="kpi-due">…</div><div class="tap">▾ Opened below</div></div>
      <div class="kpi"><div class="lab">Next Due Date for Disposal</div><div class="val" id="kpi-next">…</div><div class="tap">▾ Opened below</div></div>
    </div>
    <div class="panel">
      <div class="ptitle">Disposal summary by library</div>
      <div class="psub">Click any column heading to sort. Records held and records due come from the declared record rows. Inactive over 1 year counts documents untouched for a year, which is the one column here that waits on the document scan.</div>
      <div class="tiles">
        <div class="tile"><div class="tl">Due within 30 days</div><div class="tv">${F(DUE_30)}</div></div>
        <div class="tile"><div class="tl">Due within 90 days</div><div class="tv">${F(DUE_90)}</div></div>
        <div class="tile hi"><div class="tl">Due within 12 months</div><div class="tv">${F(DUE_TOTAL)}</div></div>
        <div class="tile"><div class="tl">Records in these libraries</div><div class="tv">${F(LIB_RECORDS)}</div></div>
      </div>
      <div class="scrollx"><div class="dtab" id="rt-table"></div></div>
      <div class="note">Inactive over 1 year is the only figure on this page that is not available today. It needs the weekly document scan, because an undeclared or untouched document has no row in the records table to read a date from.</div>
    </div>

    <div class="band">
      <h2>Retention compliance</h2>
      <div class="bd">Whether each declared record actually carries a retention schedule, and how many have already passed the end of theirs. A record with no schedule has no due date, so it sits outside every disposal figure above.</div>
    </div>
    <div class="panel">
      <div class="ptitle">Schedules and overdue records</div>
      <div class="psub">All ${F(LABEL_TOTAL)} declared records. Beyond retention counts records whose disposal date has already passed, which is measurable today from the due date alone.</div>
      <div class="tiles">
        <div class="tile"><div class="tl">With a retention schedule</div><div class="tv">${F(WITH_SCHEDULE)}</div></div>
        <div class="tile hi"><div class="tl">Without a retention schedule</div><div class="tv">${F(NO_SCHEDULE)}</div></div>
        <div class="tile"><div class="tl">Beyond retention period</div><div class="tv">${F(BEYOND_RETENTION)}</div></div>
      </div>
      <div id="rt-compliance"></div>
      <div class="note">Beyond retention means the disposal date has passed. It does <b>not</b> mean the record is still awaiting action, because nothing in the database records whether a disposal was carried out. That needs a disposal status field the EDRMS application does not have.</div>
    </div>

    <div class="band">
      <h2>Retention profile</h2>
      <div class="bd">How the declared records divide across retention labels, and how much of the holding is permanent and therefore never due for disposal.</div>
    </div>
    <div class="panel">
      <div class="ptitle">Declared records by retention label</div>
      <div class="psub">All ${F(LABEL_TOTAL)} declared records. ${F(PERMANENT)} of them carry a permanent label, so they are excluded from every disposal figure above.</div>
      <div id="rt-labels"></div>
    </div>
  </section>`;

  function init(){
    document.getElementById("kpi-due").textContent=F(DUE_TOTAL);
    document.getElementById("kpi-next").textContent=DFMT(NEXT_DUE);
    drawTable();
    drawLabels();
    drawCompliance();
  }

  return {
    ver:"Retention Dashboard",
    crumb:"Retention Dashboard",
    asof:"Data as of Mon 20 Jul 2026 23:59, refreshed Tue 21 Jul 06:00",
    summary:{
      dueNext12:DUE_TOTAL,
      due30:DUE_30,
      due90:DUE_90,
      withSchedule:WITH_SCHEDULE,
      get noSchedule(){return this.labelTotal-this.withSchedule;},
      beyondRetention:BEYOND_RETENTION,
      nextDue:NEXT_DUE,
      permanent:PERMANENT,
      labelTotal:LABEL_TOTAL,
