<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EDRMS Reporting Suite</title>
<!-- Inline favicon, so a served copy does not 404 on /favicon.ico. A data URI
     keeps it a zero request asset and avoids a binary file in the repo. -->
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%230E1F35'/><rect x='7' y='17' width='4' height='8' fill='%239DB8D2'/><rect x='14' y='12' width='4' height='13' fill='%2300A5A8'/><rect x='21' y='7' width='4' height='18' fill='%230072BC'/></svg>">
<style>

/* ================= styles.css ================= */
/* Shared shell styles for the EDRMS Reporting Suite.
   Tokens, sidebar, header, band, KPI card, panel, pager.
   Anything that differs between dashboards lives in that dashboard's
   own folder instead, because the source prototypes reuse class names
   with different values and inverted series colours. */
  /* ===== shared shell tokens (union of both dashboards) ===== */
  :root{--ink:#10243E;--ink2:#33475F;--blue:#0072BC;--blue-d:#005A96;--teal:#00A5A8;--green:#5CA943;--orange:#E8763C;--greyblue:#9DB8D2;--deepblue:#1B5E82;--bg:#EEF2F6;--card:#fff;--line:#D9E1EA;--mut:#6B7A8C;--nav:#0E1F35;--nav-hi:#16304F;--sans:"Segoe UI",system-ui,-apple-system,Arial,sans-serif;--serif:Georgia,serif;--shadow:0 1px 2px rgba(16,36,62,.06),0 4px 14px rgba(16,36,62,.06)}
  *{box-sizing:border-box;margin:0;padding:0}html,body{height:100%}
  html,body{max-width:100%;overflow-x:hidden}
  #main{overflow-x:hidden}
  section{max-width:100%}
  body{font-family:var(--sans);background:var(--bg);color:var(--ink);font-size:14px;display:flex}
  #side{width:236px;min-width:236px;background:var(--nav);color:#C7D3E0;display:flex;flex-direction:column;height:100vh;position:sticky;top:0;overflow-y:auto}
  @media(max-width:900px){#side{width:190px;min-width:190px}}
  @media(max-width:640px){body{display:block}#side{width:100%;min-width:0;height:auto;position:static}nav{display:flex;flex-wrap:wrap}}
  #side .brand{padding:18px;border-bottom:1px solid rgba(255,255,255,.08)}
  #side .t1{font-family:var(--serif);font-size:18px;color:#fff;line-height:1.25}
  #side .t2{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#7FA8CC;margin-top:4px}
  #side .ver{font-size:10px;color:#5E748C;margin-top:6px}
  nav{flex:1;padding:8px 0}
  .grp{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#5E748C;padding:12px 18px 6px}
  nav a{display:flex;align-items:center;gap:10px;padding:8px 18px;color:#C7D3E0;font-size:13.5px;border-left:3px solid transparent;text-decoration:none}
  nav a[data-d]{cursor:pointer}
  nav a[data-d]:hover{background:var(--nav-hi);color:#fff}
  nav a .ic{width:18px;text-align:center;opacity:.85}
  nav a.on{background:var(--nav-hi);color:#fff;border-left-color:var(--green);font-weight:600}
  nav a.dis{color:#4C6079;cursor:default}nav a.dis .ic{opacity:.5}
  #main{flex:1;min-width:0;display:flex;flex-direction:column}
  header{background:var(--card);border-bottom:1px solid var(--line);padding:12px 22px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;position:sticky;top:0;z-index:20}
  .crumb{font-size:12px;color:var(--mut)}.crumb b{color:var(--ink);font-size:15px;font-family:var(--serif);display:block}
  .spacer{flex:1}
  #asof{font-size:11.5px;color:var(--mut)}
  section{padding:20px 22px 46px}
  .band{background:#E9F0F7;border:1px solid #DAE5F0;border-radius:12px;padding:16px 18px;margin-bottom:16px;min-width:0;overflow-wrap:anywhere}
  .band h2{font-family:var(--serif);font-size:17px;color:var(--ink);line-height:1.3}
  .band .bd{font-size:12.5px;color:var(--ink2);margin-top:6px;max-width:900px}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;box-shadow:var(--shadow);cursor:pointer;transition:transform .1s,box-shadow .1s;border-left:4px solid transparent}
  .kpi:hover{transform:translateY(-2px)}
  .kpi.on{border-left-color:var(--blue);box-shadow:0 0 0 2px rgba(0,114,188,.22),var(--shadow)}
  /* A card that is not wired to anything must not look like one that is. No
     pointer, no hover lift, no selected-state rail: it reads as a figure, not a
     control. Every KPI whose panel is always open below it carries .stat. */
  .kpi.stat{cursor:default;border-left-color:#E4EBF3}
  .kpi.stat:hover{transform:none}
  .kpi.stat .val{color:var(--ink)}
  .kpi.stat .sub{font-size:11.5px;color:var(--mut);margin-top:8px;line-height:1.35}
  .kpi{min-width:0}
  .kpi .lab{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--mut);line-height:1.3;
    overflow-wrap:anywhere}
  /* clamp() so a long number shrinks instead of overflowing its card when the
     grid narrows or the browser is zoomed in */
  .kpi .val{font-size:clamp(19px,2.1vw,30px);font-weight:700;margin-top:8px;
    font-variant-numeric:tabular-nums;line-height:1.15;overflow-wrap:anywhere}
  .kpi .sub{overflow-wrap:anywhere}
  .kpi .tap{font-size:11px;color:var(--blue);margin-top:8px;font-weight:600}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:18px 20px;margin-bottom:26px;min-width:0;overflow-wrap:anywhere}
  .ptitle{font-size:16px;font-weight:700;font-family:var(--serif);margin-bottom:3px}
  .psub{font-size:12px;color:var(--mut);margin-bottom:14px;max-width:900px}
  .muted{color:var(--mut);font-style:italic;font-size:12px}
  .pager{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:12px}
  .pager .pinfo{font-size:12px;color:var(--mut)}
  .pager .pbtns{display:flex;align-items:center;gap:6px}
  .pager button{font:inherit;font-size:12px;font-weight:600;border:1px solid #cfd8e3;background:#fff;color:var(--ink2);border-radius:6px;padding:5px 10px;cursor:pointer}
  .pager button:hover:not(:disabled){border-color:var(--blue);color:var(--blue)}
  .pager button.on{background:var(--blue);border-color:var(--blue);color:#fff}
  .pager button:disabled{opacity:.45;cursor:default}

  /* ===== shared chart components, added 13 Aug 2026 =====
     Global rather than scoped, because unlike the class names in the collision
     list these are new and mean exactly one thing on every dashboard. Keeping
     them global is what stops six near identical copies drifting apart. */
  .crow{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:18px}
  .crow .chart{min-width:0}
  .crow .chart.wide{grid-column:span 2}
  @media(max-width:900px){.crow .chart.wide{grid-column:span 1}}
  .ctitle{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--mut);
    margin-bottom:10px;font-weight:600}
  .donutwrap{display:flex;align-items:center;gap:18px;flex-wrap:wrap;min-width:0}
  .donutwrap>svg{flex:0 0 auto;max-width:100%;height:auto}
  .dlegend{display:flex;flex-direction:column;gap:6px;min-width:150px;flex:1}
  .dlegend.row{flex-direction:row;flex-wrap:wrap;gap:14px;margin-top:10px}
  .dlegend .lg{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--ink2)}
  .dlegend .lg i{width:11px;height:11px;border-radius:3px;flex:0 0 auto}
  .dlegend .lg span{flex:1;min-width:0;overflow-wrap:anywhere}
  .dlegend .lg b{font-variant-numeric:tabular-nums;color:var(--ink)}
  .hbar{display:grid;grid-template-columns:minmax(96px,190px) 1fr;gap:12px;align-items:center;margin-bottom:7px}
  .hbar.pct{grid-template-columns:minmax(96px,190px) 1fr 66px}
  .hbar .hl{font-size:12.5px;font-weight:600;line-height:1.25;min-width:0;overflow-wrap:anywhere}
  .hbar .hl small{display:block;font-weight:400;color:var(--mut);font-size:11px}
  .hbar .ht{background:#F3F7FB;border-radius:5px;height:26px;overflow:hidden}
  .hbar .hf{height:100%;border-radius:5px;display:flex;align-items:center;justify-content:flex-end;
    padding:0 9px;color:#fff;font-size:11px;font-weight:700;min-width:42px;white-space:nowrap}
  .hbar .hp{text-align:right;font-size:12px;color:var(--mut);font-variant-numeric:tabular-nums}
  @media(max-width:700px){.hbar,.hbar.pct{grid-template-columns:96px 1fr}}
  .cols{display:flex;align-items:flex-end;gap:8px;padding-top:14px;overflow-x:auto}
  .cols .ccol{min-width:34px}
  .cols .ccol{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;
    gap:5px;height:100%;min-width:0}
  .cols .cb{width:100%;border-radius:4px 4px 0 0;min-height:3px}
  .cols .cv{font-size:10.5px;font-weight:700;color:var(--ink2);font-variant-numeric:tabular-nums;
    white-space:nowrap}
  .cols .cl{font-size:11px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    max-width:100%;line-height:1.35;min-height:16px;flex:0 0 auto}
  .cols .cv{flex:0 0 auto}
  .stackwrap{min-width:0}
  .stackwrap .scap{font-size:12px;color:var(--mut);margin-bottom:7px;overflow-wrap:anywhere}
  .stack{display:flex;height:30px;border-radius:7px;overflow:hidden;background:#F3F7FB}
  .stack .sg{display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;
    font-weight:700;font-variant-numeric:tabular-nums;min-width:2px}

  /* ===== KPI grouping =====
     Asked for on 13 Aug: a reader should be able to see at a glance which
     cards do something. The affordance rule already said a card with a
     chevron opens a panel and a card without one never does, but the two
     kinds sat in one grid and the difference had to be looked for. They are
     now separate rows with their own heading. */
  /* A treemap has a floor below which its labels stop fitting. Let it scroll
     sideways at that point rather than crushing the blocks. */
  .tmwrap{overflow-x:auto}
  @media(max-width:760px){
    section{padding:14px 14px 36px}
    .panel{padding:14px 14px}
    .kpi{padding:13px 14px}
    .kpi .val{font-size:22px}
  }
  .kpigrp{margin-bottom:16px}
  /* The group is a block in its own right. It used to be injected into a
     container that was itself a four column grid, which turned each group into
     one narrow column and crushed every card inside it. */
  .kpigrp>.kpis{width:100%}
  .kpigrp .gh{display:flex;align-items:baseline;gap:9px;margin-bottom:9px}
  .kpigrp .gh b{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink2);font-weight:700}
  .kpigrp .gh span{font-size:11.5px;color:var(--mut)}
  .kpigrp.act .gh b{color:var(--blue)}

  /* ===== the why disclosure =====
     Every panel that cannot be fully sourced still has to say so, but the
     explanation was being printed in full and the page had become 2,940 words
     of prose. The one line stays visible; the reasoning moves behind this. */
  .why{margin:8px 0 12px}
  .why summary{cursor:pointer;font-size:11.5px;color:var(--blue);font-weight:600;
    list-style:none;display:inline-flex;align-items:center;gap:5px;user-select:none}
  .why summary::-webkit-details-marker{display:none}
  .why summary::before{content:"▸";font-size:10px}
  .why[open] summary::before{content:"▾"}
  .why summary:hover{text-decoration:underline}
  .why .wb{font-size:12px;color:var(--ink2);line-height:1.5;margin-top:8px;padding:11px 13px;
    background:#F7FAFD;border:1px solid var(--line);border-radius:8px;max-width:900px}
  .why .wb p+p{margin-top:7px}


/* ================= bankwide.css ================= */
/* Bank-wide Oversight: scoped styles. Everything sits under .dash-bw.
   Built to the client's own design, PPT s15 to s18 and s34 to s44. */
  .dash-bw .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin-bottom:16px}
  @media(max-width:1180px){.dash-bw .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
  @media(max-width:640px){.dash-bw .kpis{grid-template-columns:1fr}}
  .dash-bw .kpi .val{font-size:26px}
  /* Source status marker. Three states, and a panel that carries no marker at
     all is one every figure on it can be sourced from the design as it stands.
     Agreed 13 Aug 2026: the client is reading six dashboards at once and cannot
     otherwise tell a real figure from an aspiration. This supersedes the 11 Aug
     "no caveat boxes" decision, which was taken when the prototype was five
     dashboards all of which had a source path. */
  .dash-bw .src{display:inline-block;font-size:10.5px;letter-spacing:.04em;text-transform:uppercase;
    font-weight:700;border-radius:5px;padding:3px 8px;margin-bottom:8px;border:1px solid}
  .dash-bw .src.dept{background:#FFF6EC;border-color:#F3D8BC;color:#9C5620}
  .dash-bw .src.none{background:#FDEDED;border-color:#F0C9C9;color:#9C2B2B}
  .dash-bw .src.part{background:#F1F7FF;border-color:#CFE0F3;color:#1B5E82}
  /* department table */
  .dash-bw .scrollx{overflow-x:auto}
  .dash-bw .dtab{--dc:210px 108px 118px 130px 128px 120px;min-width:820px}
  .dash-bw .dhead,.dash-bw .drow,.dash-bw .dtot{display:grid;grid-template-columns:var(--dc);gap:12px;align-items:center}
  .dash-bw .dhead{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);
    padding-bottom:9px;border-bottom:1px solid var(--line);margin-bottom:8px}
  .dash-bw .dhead .hd{cursor:pointer;user-select:none}
  .dash-bw .dhead .hd:hover{color:var(--blue)}
  .dash-bw .dhead .hd.on{color:var(--blue);font-weight:700}
  .dash-bw .dhead .num,.dash-bw .drow .num,.dash-bw .dtot .num{text-align:right;font-variant-numeric:tabular-nums}
  .dash-bw .drow{padding:7px 0;border-bottom:1px solid #F0F4F8;font-size:13px}
  .dash-bw .drow .dn{font-weight:600}
  .dash-bw .drow .dn small{display:block;font-weight:400;color:var(--mut);font-size:11px;margin-top:1px}
  .dash-bw .drow.grp{background:#F6FAFE}
  /* the division tier, reinstated 13 Aug 2026 */
  .dash-bw .drow.exp{cursor:pointer}
  .dash-bw .drow.exp:hover{background:#F7FBFF}
  .dash-bw .drow.exp .tw{display:inline-block;width:14px;color:var(--blue);font-weight:700}
  .dash-bw .drow.kid{background:#FAFCFE;font-size:12.5px}
  .dash-bw .drow.kid .dn{font-weight:400;color:var(--ink2);padding-left:14px}
  .dash-bw .dtot{padding-top:10px;margin-top:4px;border-top:2px solid var(--line);font-weight:700;font-size:13px}
  .dash-bw .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:14px}
  .dash-bw .tile,.dash-dp .tile{min-width:0;overflow-wrap:anywhere}
  .dash-bw .tile{background:#F5F8FC;border:1px solid var(--line);border-radius:9px;padding:11px 13px}
  .dash-bw .tile.hi{background:#EAF3FB;border-color:#CFE0F3}
  .dash-bw .tile .tl{font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--mut);line-height:1.3}
  .dash-bw .tile .tv{font-size:19px;font-weight:700;margin-top:5px;font-variant-numeric:tabular-nums}
  /* comparison bars: one row per department, two measures side by side */
  .dash-bw .cmp{display:grid;grid-template-columns:180px 1fr;gap:12px;align-items:center;margin-bottom:9px}
  .dash-bw .cmp .cl{font-size:12.5px;font-weight:600}
  .dash-bw .cmp .cl small{display:block;font-weight:400;color:var(--mut);font-size:11px}
  .dash-bw .cbars{display:flex;flex-direction:column;gap:4px}
  .dash-bw .cbar{height:17px;border-radius:4px;display:flex;align-items:center;justify-content:flex-end;
    padding:0 7px;color:#fff;font-size:10.5px;font-weight:700;min-width:34px}
  .dash-bw .legend{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:12px;font-size:12px;color:var(--ink2)}
  .dash-bw .legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:6px;vertical-align:-1px}
  /* trend columns */
  .dash-bw .trend{display:flex;align-items:flex-end;gap:8px;height:190px;padding-top:12px;overflow-x:auto}
  .dash-bw .tcol{min-width:34px}
  .dash-bw .tcol{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:5px;height:100%}
  .dash-bw .tbar{width:100%;background:var(--blue);border-radius:4px 4px 0 0;min-height:3px}
  .dash-bw .tlab{font-size:11px;color:var(--mut)}
  .dash-bw .tval{font-size:10.5px;font-weight:700;color:var(--ink2);font-variant-numeric:tabular-nums}
  .dash-bw .toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:14px}
  .dash-bw .toolbar .lbl{font-size:12px;color:var(--mut)}
  .dash-bw select{font:inherit;font-size:12.5px;padding:6px 10px;border:1px solid var(--line);
    border-radius:8px;background:#fff;color:var(--ink)}
  .dash-bw .resetbtn{font:inherit;font-size:12px;font-weight:600;border:1px solid var(--line);background:#fff;
    color:var(--ink2);border-radius:8px;padding:6px 12px;cursor:pointer}
  .dash-bw .resetbtn:hover{border-color:var(--blue);color:var(--blue)}
  /* horizontal ranked bars, reused by several drill panels */
  .dash-bw .lbar{display:grid;grid-template-columns:200px 1fr 74px;gap:12px;align-items:center;margin-bottom:7px}
  .dash-bw .lbar .ll{font-size:12.5px;font-weight:600}
  .dash-bw .lbar .ll small{display:block;font-weight:400;color:var(--mut);font-size:11px}
  .dash-bw .lbar .lt{background:#F3F7FB;border-radius:5px;height:23px;overflow:hidden}
  .dash-bw .lbar .lf{height:100%;border-radius:5px;display:flex;align-items:center;justify-content:flex-end;
    padding:0 8px;color:#fff;font-size:11px;font-weight:700;min-width:40px}
  .dash-bw .lbar .lp{text-align:right;font-size:12px;color:var(--mut);font-variant-numeric:tabular-nums}
  @media(max-width:700px){.dash-bw .lbar{grid-template-columns:130px 1fr 62px}.dash-bw .cmp{grid-template-columns:120px 1fr}}

/* ================= department.css ================= */
/* Department Insights: scoped styles. Everything under .dash-dp.
   Built to PPT s19 to s28 and s53 to s66. Shares the source marker
   convention introduced with Bank-wide, restated here because the two
   dashboards must stay independently editable. */
  .dash-dp .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin-bottom:16px}
  @media(max-width:1180px){.dash-dp .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
  @media(max-width:640px){.dash-dp .kpis{grid-template-columns:1fr}}
  .dash-dp .kpi .val{font-size:26px}
  .dash-dp .src{display:inline-block;font-size:10.5px;letter-spacing:.04em;text-transform:uppercase;
    font-weight:700;border-radius:5px;padding:3px 8px;margin-bottom:8px;border:1px solid}
  .dash-dp .src.dept{background:#FFF6EC;border-color:#F3D8BC;color:#9C5620}
  .dash-dp .src.none{background:#FDEDED;border-color:#F0C9C9;color:#9C2B2B}
  .dash-dp .src.part{background:#F1F7FF;border-color:#CFE0F3;color:#1B5E82}
  .dash-dp .src.ref{background:#F4F1FB;border-color:#DCD3EE;color:#553F86}
  /* the department picker sits above everything and drives every panel */
  .dash-dp .picker{background:var(--card);border:1px solid var(--line);border-radius:12px;
    box-shadow:var(--shadow);padding:14px 18px;margin-bottom:16px;display:flex;align-items:center;
    gap:12px;flex-wrap:wrap}
  .dash-dp .picker .lbl{font-size:12px;color:var(--mut)}
  .dash-dp select{font:inherit;font-size:13px;padding:7px 11px;border:1px solid var(--line);
    border-radius:8px;background:#fff;color:var(--ink);max-width:100%}
  .dash-dp .golive{font-size:12px;color:var(--ink2);margin-left:auto}
  .dash-dp .golive b{font-family:var(--serif)}
  .dash-dp .scrollx{overflow-x:auto}
  .dash-dp .dtab{--dc:220px repeat(5,1fr);min-width:760px}
  .dash-dp .dhead,.dash-dp .drow,.dash-dp .dtot{display:grid;grid-template-columns:var(--dc);gap:12px;align-items:center}
  .dash-dp .dhead{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);
    padding-bottom:9px;border-bottom:1px solid var(--line);margin-bottom:8px}
  .dash-dp .dhead .hd{cursor:pointer;user-select:none}
  .dash-dp .dhead .hd:hover{color:var(--blue)}
  .dash-dp .dhead .hd.on{color:var(--blue);font-weight:700}
  .dash-dp .dhead .num,.dash-dp .drow .num,.dash-dp .dtot .num{text-align:right;font-variant-numeric:tabular-nums}
  .dash-dp .drow{padding:7px 0;border-bottom:1px solid #F0F4F8;font-size:13px}
  .dash-dp .drow .dn{font-weight:600}
  .dash-dp .drow .dn small{display:block;font-weight:400;color:var(--mut);font-size:11px;margin-top:1px}
  .dash-dp .drow.cat{background:#F6FAFE;font-weight:700}
  /* the division tier, reinstated 13 Aug 2026 */
  .dash-dp .drow.exp{cursor:pointer}
  .dash-dp .drow.exp:hover{background:#F7FBFF}
  .dash-dp .drow.exp .tw{display:inline-block;width:14px;color:var(--blue);font-weight:700}

<script>
/* Load order below matters in two places. The DASHBOARDS registry is created
   first, format and storage asserts its file total against records management
   so it follows it, and the nav wiring runs last.
   Each dashboard occupies one clearly banner marked block. Editing a dashboard
   means editing inside its block and nothing else, which is what keeps a change
   to one dashboard from disturbing another. */

/* =================================================================
   core.js
   ================================================================= */
/* ===================================================================
   Shared helpers. Only the helpers that were byte identical in both
   source prototypes live here. Anything that differed (pager, the
   deptOptions builders, the date range readers) stays inside its own
   dashboard closure so each keeps its original behaviour.
   =================================================================== */
const F=n=>Number(Math.round(n)).toLocaleString();
function wirePager(scope,onGo){document.querySelectorAll(scope+" .pager button[data-pg]").forEach(b=>b.onclick=()=>onGo(b.dataset.pg));}

const DASHBOARDS={};


/* =================================================================
   charts.js
   ================================================================= */
/* ===================================================================
   Shared visual helpers, added 13 Aug 2026.

   The redesign had drifted into tables and paragraphs: 2,940 words of
   prose and fifteen tables against six charts. The client asked for the
   balance the earlier prototype had, so these five helpers exist to be
   reached for before another table is written.

   Every one has a native Power BI equivalent, which is the rule that
   governs what may appear here at all:

     donut()    Donut chart
     hbars()    Clustered bar chart
     columns()  Clustered column chart
     stacked()  Stacked bar chart
     treemap()  Treemap visual

   They return markup and read nothing from the DOM, so any dashboard can
   call them from its own draw function.
   =================================================================== */
const CHART=(function(){
  const C={blue:"var(--blue)",teal:"var(--teal)",green:"var(--green)",orange:"var(--orange)",
           grey:"var(--greyblue)",deep:"var(--deepblue)",mut:"var(--mut)"};
  const PALETTE=[C.blue,C.teal,C.green,C.orange,C.deep,C.grey,C.mut];

  /* Donut. An SVG ring per slice, drawn with stroke-dasharray so there is no
     path arithmetic to get wrong. Centre carries the total. */
  function donut(items,opts){
    const o=opts||{}, size=o.size||168, sw=o.stroke||26;
    const r=(size-sw)/2, cx=size/2, cy=size/2, circ=2*Math.PI*r;
    const total=items.reduce((a,i)=>a+i.value,0)||1;
    let off=0,arcs="";
    items.forEach((i,n)=>{
      const frac=i.value/total, len=frac*circ;
      arcs+=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="none"
        stroke="${i.color||PALETTE[n%PALETTE.length]}" stroke-width="${sw}"
        stroke-dasharray="${len.toFixed(2)} ${(circ-len).toFixed(2)}"
        stroke-dashoffset="${(-off).toFixed(2)}"
        transform="rotate(-90 ${cx} ${cy})"><title>${i.label}: ${F(i.value)}</title></circle>`;
      off+=len;
    });
    const centre=o.centreValue
      ? `<text x="${cx}" y="${cy-2}" text-anchor="middle" font-size="21" font-weight="700"
           fill="var(--ink)" style="font-variant-numeric:tabular-nums">${o.centreValue}</text>
         <text x="${cx}" y="${cy+16}" text-anchor="middle" font-size="10.5" fill="var(--mut)">${o.centreLabel||""}</text>`
      : "";
    const legend=items.map((i,n)=>
      `<div class="lg"><i style="background:${i.color||PALETTE[n%PALETTE.length]}"></i>
        <span>${i.label}</span><b>${(i.value/total*100).toFixed(1)}%</b></div>`).join("");
    return `<div class="donutwrap">
      <svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}">${arcs}${centre}</svg>
      <div class="dlegend">${legend}</div></div>`;
  }

  /* Horizontal ranked bars. The workhorse: any "top N by measure" question. */
  function hbars(items,opts){
    const o=opts||{}, mx=Math.max(...items.map(i=>i.value),1);
    return items.map((i,n)=>
      `<div class="hbar"><div class="hl">${i.label}${i.sub?`<small>${i.sub}</small>`:""}</div>
        <div class="ht"><div class="hf" style="width:${Math.max(3,100*i.value/mx)}%;
          background:${i.color||o.color||C.blue}">${o.hideValue?"":(i.display||F(i.value))}</div></div>
        ${o.pct?`<div class="hp">${i.pct}</div>`:""}</div>`).join("");
  }

  /* Vertical columns, for anything over time. */
  function columns(items,opts){
    const o=opts||{}, mx=Math.max(...items.map(i=>i.value),1);
    return `<div class="cols" style="height:${o.height||180}px">`+items.map(i=>
      `<div class="ccol"><div class="cv">${i.display||F(i.value)}</div>
        <div class="cb" style="height:${Math.max(2,100*i.value/mx)}%;background:${i.color||o.color||C.blue}"
          title="${i.label}: ${F(i.value)}"></div>
        <div class="cl">${i.label}</div></div>`).join("")+`</div>`;
  }

  /* One stacked bar, for a part against a whole. */
  function stacked(segments,opts){
    const o=opts||{}, total=segments.reduce((a,s)=>a+s.value,0)||1;
    const bar=segments.map((s,n)=>
      `<div class="sg" style="width:${100*s.value/total}%;background:${s.color||PALETTE[n%PALETTE.length]}"
        title="${s.label}: ${F(s.value)}">${(s.value/total)>0.09?F(s.value):""}</div>`).join("");
    const legend=segments.map((s,n)=>
      `<div class="lg"><i style="background:${s.color||PALETTE[n%PALETTE.length]}"></i>
        <span>${s.label}</span><b>${(s.value/total*100).toFixed(1)}%</b></div>`).join("");
    return `<div class="stackwrap">${o.caption?`<div class="scap">${o.caption}</div>`:""}
      <div class="stack">${bar}</div><div class="dlegend row">${legend}</div></div>`;
  }

  /* Treemap. Squarified enough to read: rows filled left to right, each row
     sized so its blocks stay close to square. Same approach as the site
     rollout treemap the earlier prototype used. */
  function treemap(items,opts){
    const o=opts||{}, W=o.width||900, H=o.height||360;
    const rows=[...items].sort((a,b)=>b.value-a.value);
    const total=rows.reduce((a,r)=>a+r.value,0)||1;
    const mn=Math.min(...rows.map(r=>r.value)), mx=Math.max(...rows.map(r=>r.value));
    const shade=v=>{
      const t=mx===mn?0.5:(v-mn)/(mx-mn);
      const a=[156,195,236], b=[8,52,90];
      return `rgb(${a.map((x,i)=>Math.round(x+(b[i]-x)*t)).join(",")})`;
    };
    let svg="",y=0,i=0;
    const perRow=Math.ceil(Math.sqrt(rows.length));
    /* A block only gets a line of text if it is tall enough to hold it without
       colliding with the line below. Before this, a short row printed its name
       at y+24, its sub at y+40 and its value at y+h-16, and once h fell under
       about 78 the value landed on top of the sub. */
    const MINH=64;
    while(i<rows.length){
      const slice=rows.slice(i,i+perRow);
      const sliceVal=slice.reduce((a,r)=>a+r.value,0);
      const h=Math.max(MINH,H*sliceVal/total);
      let x=0;
      slice.forEach(r=>{
        const w=W*r.value/sliceVal;
        const t=mx===mn?0.5:(r.value-mn)/(mx-mn);
        const fg=t<0.42?"#10243E":"#fff", sc=t<0.42?"#33475F":"rgba(255,255,255,.82)";
        svg+=`<g><rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${Math.max(2,w-3).toFixed(1)}"
          height="${(h-3).toFixed(1)}" rx="7" fill="${shade(r.value)}"><title>${r.label}: ${F(r.value)}</title></rect>`;
        const roomForVal=h>=54;
        if(w>72){
          svg+=`<text x="${(x+12).toFixed(1)}" y="${(y+22).toFixed(1)}" font-size="14"
            font-weight="700" fill="${fg}">${r.label}</text>`;
          if(roomForVal)svg+=`<text x="${(x+12).toFixed(1)}" y="${(y+h-14).toFixed(1)}"
            font-size="${h<80?15:20}" font-weight="700" fill="${fg}"
            style="font-variant-numeric:tabular-nums">${F(r.value)}</text>`;
        }
        svg+=`</g>`;
        x+=w;
      });
      y+=h;i+=perRow;
    }
    return `<div class="tmwrap"><svg viewBox="0 0 ${W} ${y}" width="100%" preserveAspectRatio="xMidYMin meet" style="display:block;min-width:520px">${svg}</svg></div>`;
  }

  return {donut,hbars,columns,stacked,treemap,C,PALETTE};
})();


/* =================================================================
   data.js
   ================================================================= */
/* ===================================================================
   The base figures the whole suite is built on.

   Until 13 Aug 2026 these lived inside the five dashboards the client's
   redesign removes: Records Management owned the departments and the
   declaration trend, Sites and Libraries owned the site and library
   health, Format and Storage owned the eight format groups, and
   Retention and File Plan owned the retention labels and the disposal
   windows. Each new dashboard read them out of the old one's summary.

   Deleting those five would have taken the data with them, so it moves
   here instead. That is also the better shape: a figure that appears on
   three dashboards should be defined once and read three times, rather
   than owned by whichever dashboard happened to be built first.

   Everything that has to reconcile is asserted at the bottom of this
   block, so a mismatch fails on load rather than on the one dashboard
   that happens to display both numbers.
   =================================================================== */
const DATA=(function(){
  function monthly(total,seed){
    const w=[];for(let m=0;m<12;m++)w.push(0.6+m*0.08+((seed*(m+1))%5)*0.05);
    const s=w.reduce((a,b)=>a+b,0);const out=w.map(x=>Math.round(total*x/s));
    out[11]+=total-out.reduce((a,b)=>a+b,0);return out;
  }

  /* ===== departments ===== */
  const DEPTS=[
   {code:"ITD", name:"Information Technology",       rec:2611,phys:470,docs:640000},
   {code:"SARD",name:"South Asia Regional",          rec:2240,phys:360,docs:520000},
   {code:"OSFG",name:"Sovereign Operations",         rec:2168,phys:300,docs:410000},
   {code:"FIN", name:"Finance",                      rec:2150,phys:520,docs:300000},
   {code:"PARD",name:"Procurement and Admin",        rec:1892,phys:410,docs:290000},
   {code:"HRD", name:"Human Resources",              rec:1462,phys:240,docs:205000},
   {code:"SERD",name:"Southeast Asia",               rec:1320,phys:180,docs:150000},
   {code:"EARD",name:"East Asia Regional",           rec:1180,phys:150,docs:120000},
   {code:"CWRD",name:"Central and West Asia",        rec:1150,phys:210,docs:180000},
   {code:"OGC", name:"General Counsel",              rec:1074,phys:210,docs:100000},
   {code:"PSOD",name:"Private Sector Operations",    rec:980, phys:260,docs:140000},
   {code:"BRM", name:"Budget and Mgmt Services",     rec:809, phys:90, docs:70000},
   {code:"SPD", name:"Strategy and Policy",          rec:760, phys:120,docs:95000},
   {code:"SDCC",name:"Sustainable Dev and Climate",  rec:690, phys:110,docs:88000},
   {code:"OAS", name:"Administrative Services",      rec:620, phys:130,docs:105000},
   {code:"ERCD",name:"Economic Research",            rec:540, phys:70, docs:60000},
  ];
  const DECLARED=DEPTS.reduce((a,d)=>a+d.rec,0);
  const DOCUMENTS=DEPTS.reduce((a,d)=>a+d.docs,0);
  const WITH_PHYSICAL=DEPTS.reduce((a,d)=>a+d.phys,0);

  /* ===== declaration over time =====
     A rolling twelve months ending at the latest closed month, not a calendar
     year. The suite is dated 20 Jul 2026, so a January to December chart would
     show figures for months that have not happened yet. */
  const MONTH_LABELS=["Aug","Sep","Oct","Nov","Dec","Jan","Feb","Mar","Apr","May","Jun","Jul"];
  DEPTS.forEach((d,i)=>{d.mrec=monthly(d.rec,d.code.length+i+1);});
  const MONTH_VALUES=MONTH_LABELS.map((m,i)=>DEPTS.reduce((a,d)=>a+d.mrec[i],0));

  /* Records declared by year, and the current month against its average. Both
     read Records.CreatedDate, which is populated today, so neither waits on
     the scan. The last entry is the same population as the monthly series, so
     the two agree by construction rather than by coincidence. */
  const YEARS=[
    {label:"2023",value:6480},
    {label:"2024",value:11240},
    {label:"2025",value:17905},
    {label:"Last 12 months",value:DECLARED},
  ];
  const DECLARED_THIS_MONTH=MONTH_VALUES[MONTH_VALUES.length-1];
  const MONTH_AVERAGE=Math.round(DECLARED/12);

  /* ===== people and sites ===== */
  const MONTHLY_ACTIVE_USERS=9420;
  const SITES_CREATED=1057;
  const IDLE_DAYS=90;             /* a site is inactive after this long */
  const LIB_IDLE=90, LIB_DORMANT=180;
  const SITES_INACTIVE=189;       /* of the 1,057, no activity for IDLE_DAYS */
  const SITES_CREATED_90=64;
  const SITE_LIBRARIES=1840;
  const LIBS_NO_RECORDS=604;
  const LIBS_WITH_RECORDS=SITE_LIBRARIES-LIBS_NO_RECORDS;
  const LIBS_ACTIVE=1102;         /* activity within LIB_IDLE days */
  const LIBS_DORMANT_180=411;     /* no activity for LIB_DORMANT days */
  const LIB_GROWTH=0.107;

  /* Library ranking, for the three "largest" and "highest" questions the
     metrics document asks under Library usage. A library is always shown with
     its parent site, because display names repeat across sites and a bare
     library name is ambiguous. */
  const TOP_LIBRARIES=[
    {lib:"Board Papers",        site:"ITD Records Site",      dept:"ITD",  docs:41200, rec:2010, gb:14.8},
    {lib:"Loan Agreements",     site:"SARD Operations Site",  dept:"SARD", docs:38400, rec:1884, gb:11.2},
    {lib:"Country Planning",    site:"OSFG Country Site",     dept:"OSFG", docs:33900, rec:1602, gb:9.4},
    {lib:"Final Documents",     site:"FIN Treasury Site",     dept:"FIN",  docs:31100, rec:1490, gb:18.6},
    {lib:"Project Completion",  site:"PARD Programs Site",    dept:"PARD", docs:28700, rec:1288, gb:7.9},
    {lib:"Policies",            site:"OGC Legal Site",        dept:"OGC",  docs:19400, rec:1044, gb:4.1},
    {lib:"Correspondence",      site:"HRD People Site",       dept:"HRD",  docs:24600, rec:902,  gb:6.3},
    {lib:"Minutes",             site:"SPD Strategy Site",     dept:"SPD",  docs:12800, rec:744,  gb:2.2},
    {lib:"Annual Meetings",     site:"OAS Facilities Site",   dept:"OAS",  docs:16300, rec:598,  gb:21.4},
    {lib:"Country Reports",     site:"ERCD Statistics Site",  dept:"ERCD", docs:14100, rec:532,  gb:3.7},
  ];

  /* ===== records quality =====
     Both are computable today from columns already on the document row: a
     duplicate is a repeated Title, an orphaned record is one whose parent site
     or library no longer resolves. Neither is on any dashboard until now. */
  const DUPLICATE_RECORDS=1284;
  const ORPHANED_RECORDS=96;

  /* ===== information classification =====
     SensitivityLabelName is designed on the document row and appears on no
     dashboard. The states below account for every declared record. */
  const SENSITIVITY=[
    {label:"Internal",     count:12840},
    {label:"Confidential", count:4620},
    {label:"Restricted",   count:1180},
    {label:"Public",       count:812},
    {label:"No sensitivity label", count:2194},
  ];
  const SENSITIVITY_TOTAL=SENSITIVITY.reduce((a,s)=>a+s.count,0);
  const UNLABELLED=SENSITIVITY.find(s=>s.label==="No sensitivity label").count;

  /* Site visits by month, for the site activity trend the metrics document
     asks for under Site Trends. A range sums the 7 day figure and never the
     30, 90 or 180 day ones: consecutive 7 day windows tile exactly, longer
     ones overlap and would count most days several times over. */
  const SITE_VISITS_MONTHLY=[41200,43800,39600,46100,44700,48300,
                             51200,49800,53400,55100,52600,57300];

  /* ===== format groups =====
     The eight groups the client lists under Format and Storage Analysis. The
     file counts are a decomposition of the declared records, so they total it. */
  const FORMATS=[
    {label:"PDF",                 files:8200, gb:9.6},
    {label:"Word",                files:5100, gb:3.0},
    {label:"Excel",               files:3050, gb:2.7},
    {label:"Email (.msg / .eml)", files:2100, gb:0.6},
    {label:"PowerPoint",          files:1350, gb:5.9},
    {label:"Image files",         files:980,  gb:3.6},
    {label:"Video files",         files:466,  gb:20.5},
    {label:"All other formats",   files:400,  gb:0.8},
  ];
  const TOTAL_FILES=FORMATS.reduce((a,f)=>a+f.files,0);
  const TOTAL_GB=FORMATS.reduce((a,f)=>a+f.gb,0);

  /* ===== retention ===== */
  const LABELS=[
    {label:"10 years after declaration",count:8100},
    {label:"7 years after declaration", count:5100},
    {label:"5 years after declaration", count:3820},
    {label:"Permanent",                 count:2400, note:"Never due for disposal"},
    {label:"3 years after declaration", count:1420},
    {label:"Others",                    count:574,  note:"Labels outside the standard 3, 5, 7 and 10 year set"},
    {label:"No retention label",        count:232,  note:"No label, so no disposal date and nothing to schedule"},
  ];
  const LABEL_TOTAL=LABELS.reduce((a,l)=>a+l.count,0);
  const PERMANENT=LABELS.find(l=>l.label==="Permanent").count;
  const NO_LABEL=LABELS.find(l=>l.label==="No retention label").count;
  const WITH_SCHEDULE=LABEL_TOTAL-NO_LABEL;
  const BEYOND_RETENTION=342;
  const DUE_30=71, DUE_90=196, DUE_NEXT_12=608;
  const NEXT_DUE="12 Sep 2026";

  /* ===== reconciliation =====
     These are the three that would otherwise be discovered by a reader adding
     up a column, months after the fact. */
  console.assert(MONTH_VALUES.reduce((a,v)=>a+v,0)===DECLARED,
    "The monthly declaration trend must total the declared record count");
  console.assert(LABEL_TOTAL===DECLARED,
    "Every declared record must carry exactly one retention label state");
  console.assert(TOTAL_FILES===DECLARED,
    "The eight format groups must decompose the declared record count exactly");
  console.assert(DUE_30<=DUE_90 && DUE_90<=DUE_NEXT_12,
    "Disposal windows must nest: 30 days inside 90 inside 12 months");
  console.assert(WITH_SCHEDULE+NO_LABEL===LABEL_TOTAL,
    "Records with and without a schedule must account for every labelled record");
  console.assert(SENSITIVITY_TOTAL===DECLARED,
    "Sensitivity label states must account for every declared record");
  console.assert(YEARS[YEARS.length-1].value===DECLARED,
    "The current year in the by-year trend must match the declared record count");
  console.assert(LIBS_DORMANT_180<=SITE_LIBRARIES-LIBS_ACTIVE,
    "Dormant libraries must be a subset of the libraries that are not active");

  return {DEPTS,DECLARED,DOCUMENTS,WITH_PHYSICAL,
    MONTH_LABELS,MONTH_VALUES,
    MONTHLY_ACTIVE_USERS,SITES_CREATED,SITES_INACTIVE,SITES_CREATED_90,IDLE_DAYS,
    LIB_IDLE,LIB_DORMANT,SITE_LIBRARIES,LIBS_WITH_RECORDS,LIBS_NO_RECORDS,LIBS_ACTIVE,LIB_GROWTH,
    FORMATS,TOTAL_FILES,TOTAL_GB,
    YEARS,DECLARED_THIS_MONTH,MONTH_AVERAGE,
    TOP_LIBRARIES,LIBS_DORMANT_180,SITE_VISITS_MONTHLY,
    DUPLICATE_RECORDS,ORPHANED_RECORDS,SENSITIVITY,SENSITIVITY_TOTAL,UNLABELLED,
    LABELS,LABEL_TOTAL,PERMANENT,NO_LABEL,WITH_SCHEDULE,BEYOND_RETENTION,
    DUE_30,DUE_90,DUE_NEXT_12,NEXT_DUE};
})();

   bankwide.js
   ================================================================= */
/* ===================================================================
   Bank-wide Oversight. Built to the client's own design of 13 Aug 2026:
   PPT s15 to s18 for the layout, s34 to s44 for the drill tables behind
   each top panel tile.

   This dashboard is intended to absorb the Overview and Records
   Management dashboards, per the client's comments on PPT s9 and s10.
   Both are left mounted until the client approves this one, so nothing
   is lost if they want to retreat.

   Every figure that also appears on another dashboard is read from that
   dashboard's summary rather than retyped, and asserted below.

   SOURCE MARKERS. A panel with no marker can be sourced from the 73
   column design as it stands. Otherwise:
     .src.part  partly sourceable, the marker says which half is not
     .src.dept  waiting only on the site to department list from RAC
     .src.none  no source identified anywhere, see the requirements
                workbook of 13 Aug 2026
   =================================================================== */
DASHBOARDS.bw=(function(){

  /* Deterministic split of a total across n weighted slots. Same shape as the
     Records Management helper: the remainder lands on the first slot so the
     parts always total the whole exactly, never one out from rounding. */
  function split(total,weights){
    const s=weights.reduce((a,b)=>a+b,0);
    const out=weights.map(w=>Math.max(1,Math.round(total*w/s)));
    out[0]+=total-out.reduce((a,b)=>a+b,0);
    return out;
  }
  const GB=v=>v>=1024?(v/1024).toFixed(2)+" TB":v.toFixed(1)+" GB";
  const PCT=(a,b)=>b?(a/b*100):0;

  /* ===== departments =====
     Codes, names and the three declared-record measures come straight from
     Records Management. Sites, users and disposal are split across the same
     departments here, weighted by declared records, so every column totals the
     bank-wide figure it belongs to. */
  const BASE=DATA.DEPTS;
  const W=BASE.map(d=>d.rec);
  const siteSplit=split(DATA.SITES_CREATED-180,W);          /* 180 project sites, below */
  const userSplit=split(DATA.MONTHLY_ACTIVE_USERS,W);
  const dueSplit=split(DATA.DUE_NEXT_12,BASE.map(d=>d.phys));

  const DEPTS=BASE.map((d,i)=>({
    code:d.code, name:d.name,
    sites:siteSplit[i], users:userSplit[i],
    docs:d.docs, rec:d.rec, phys:d.phys, due:dueSplit[i],
    /* Users declaring records is a subset of active users. Documents are
       created by more people than declare records, which is the point of the
       comparison panel on PPT s17. */
    declaring:Math.max(1,Math.round(userSplit[i]*0.34)),
    creating:Math.max(1,Math.round(userSplit[i]*0.71)),
    gb:+(d.docs/3400).toFixed(1)
  }));

  /* ===== project sites =====
     PPT s36 and s37. Nothing in the tenant classifies a site as a project site,
     let alone as sovereign or nonsovereign, so these two rows are layout only.
     They are kept visible because the client asked for the split three times
     (PPT s4, s15, s34) and hiding it would misrepresent the design. */
  const PROJECTS=[
    {code:"Sovereign projects",     sites:112, docs:186000, rec:2140, phys:305, due:44, users:640},
    {code:"Nonsovereign projects",  sites:68,  docs:74000,  rec:915,  phys:120, due:19, users:280},
  ];
  const PROJ_SITES=PROJECTS.reduce((a,p)=>a+p.sites,0);

  const DEPT_SITES=DEPTS.reduce((a,d)=>a+d.sites,0);
  const TOTAL_USERS=DATA.MONTHLY_ACTIVE_USERS;
  const TOTAL_DOCS=DATA.DOCUMENTS;
  const TOTAL_REC=DATA.DECLARED;
  const TOTAL_PHYS=DATA.WITH_PHYSICAL;
  const TOTAL_DUE=DATA.DUE_NEXT_12;
  const DECL_RATE=PCT(TOTAL_REC,TOTAL_DOCS);

  /* Site movement indicators, PPT s35. Created and inactive are sourceable:
     SiteCreatedDate is confirmed from Graph, LastActivityDate from the usage
     export. Deleted has a column that nothing populates yet. Archived has no
     definition at all, which is why it prints as a dash rather than a zero: a
     zero would be a claim, and we are not in a position to make it. */
  const IDLE_DAYS=90;
  const SITES_CREATED_90=64, SITES_DELETED_90=null, SITES_ARCHIVED_90=null;
  const SITES_INACTIVE=DATA.SITES_INACTIVE;

  console.assert(DEPTS.reduce((a,d)=>a+d.rec,0)===TOTAL_REC,
    "Bank-wide department records must total Records Management declared records");
  console.assert(DEPTS.reduce((a,d)=>a+d.users,0)===TOTAL_USERS,
    "Bank-wide department users must total monthly active users");
  console.assert(DEPTS.reduce((a,d)=>a+d.due,0)===TOTAL_DUE,
    "Bank-wide department disposals must total the Retention due figure");
  console.assert(DEPT_SITES+PROJ_SITES===DATA.SITES_CREATED,
    "Departmental sites plus project sites must total compliant sites created");

  /* ===== divisions =====
     Reinstated 13 Aug 2026 at the client's instruction, reopening the decision
     of 10 August. That decision was taken because ADBMeta carries no division
     for any row and nothing in the tenant supplies one, and none of that has
     changed: the tier is built here so the client can see the shape they asked
     for on PPT s41, s42, s54 and s58, and every panel carrying it is marked as
     having no source. Whoever supplies the site to department list has to
     supply a division alongside it, or these rows stay empty in production.

     Two to four divisions a department, named from a fixed pool so they are
     stable between draws, with every measure split from the department total so
     the divisions always add back up to it. */
  const DIVPOOL=["Operations","Policy and Planning","Services","Support"];
  const DIVCACHE={};
  function divisionsFor(code){
    if(DIVCACHE[code])return DIVCACHE[code];
    const d=DEPTS.find(x=>x.code===code);
    const n=2+(code.length%3);                       /* 2, 3 or 4 */
    const w=[];for(let i=0;i<n;i++)w.push(1+((i*5+code.length)%6)*0.32);
    const rec=split(d.rec,w), phys=split(d.phys,w),
          users=split(d.users,w), declaring=split(d.declaring,w);
    const rows=[];
    for(let i=0;i<n;i++)rows.push({
      name:`${code} ${DIVPOOL[i]} Division`,
      rec:rec[i], phys:phys[i], users:users[i], declaring:declaring[i]
    });
    DIVCACHE[code]=rows;
    return rows;
  }
  console.assert(DEPTS.every(d=>divisionsFor(d.code).reduce((a,v)=>a+v.rec,0)===d.rec),
    "Division records must total the department they belong to");
  console.assert(DEPTS.every(d=>divisionsFor(d.code).reduce((a,v)=>a+v.users,0)===d.users),
    "Division users must total the department they belong to");

  /* ===== state ===== */
  let openKpi="users";          /* which drill table is showing */
  let sortDept="rec", dirDept="desc";
  let cmpMode="docsrec";
  let trendDept="all";
  let expanded={};              /* which department rows have their divisions open */

  /* ===== top panel, PPT s15 and s34 ===== */
  const TILES=[
    {k:null,   lab:"Active EDRMS Sites, Department / RM / Office", val:()=>F(DEPT_SITES),
     sub:"Departments, offices and resident missions"},
    {k:null,   lab:"Active EDRMS Sites, Sovereign Projects", val:()=>F(PROJECTS[0].sites),
     sub:"Sovereign project sites"},
    {k:null,   lab:"Active EDRMS Sites, Nonsovereign Projects", val:()=>F(PROJECTS[1].sites),
     sub:"Nonsovereign project sites"},
    {k:"users",lab:"Total EDRMS Users", val:()=>F(TOTAL_USERS), to:"users by department"},
    {k:"docs", lab:"Total Documents in EDRMS", val:()=>(TOTAL_DOCS/1e6).toFixed(2)+"M", to:"documents by department"},
    {k:"rec",  lab:"Total Records Declared", val:()=>F(TOTAL_REC), to:"records by department"},
    {k:"phys", lab:"Total Physical Counterparts", val:()=>F(TOTAL_PHYS), to:"counterparts by department"},
    {k:"disp", lab:"Total Records Due for Disposal", val:()=>F(TOTAL_DUE), to:"disposal by department"},
  ];

  /* The two kinds of card are drawn into two separate groups with their own
     headings, so which cards do something is visible rather than deducible. */
  function drawTiles(){
    const act=TILES.filter(t=>t.k), stat=TILES.filter(t=>!t.k);
    document.getElementById("bw-kpis").innerHTML=
      `<div class="kpigrp act">
         <div class="gh"><b>Open a breakdown</b><span>${act.length} cards, each opens the table beneath</span></div>
         <div class="kpis">${act.map(t=>
           `<div class="kpi ${t.k===openKpi?"on":""}" data-k="${t.k}"><div class="lab">${t.lab}</div>
              <div class="val">${t.val()}</div><div class="tap">&#9662; Click to open</div></div>`).join("")}</div>
       </div>
       <div class="kpigrp">
         <div class="gh"><b>At a glance</b><span>${stat.length} figures, nothing to click</span></div>
         <div class="kpis">${stat.map(t=>
           `<div class="kpi stat"><div class="lab">${t.lab}</div><div class="val">${t.val()}</div>
              <div class="sub">${t.sub}</div></div>`).join("")}</div>
       </div>`;
  }

  /* Each card carries its own handler, which is what the affordance check
     reads: a card that looks clickable must have something wired to it.
     The handler updates the selected rail in place and redraws only the panel
     below. It deliberately does not call drawTiles(), because that replaces
     the whole grid including the node being clicked, and a click arriving
     during that swap was being lost. */
  function wireTiles(){
    document.querySelectorAll("#bw-kpis .kpi[data-k]").forEach(card=>{
      card.onclick=()=>{
        openKpi=card.dataset.k;
        document.querySelectorAll("#bw-kpis .kpi[data-k]").forEach(el=>
          el.classList.toggle("on",el.dataset.k===openKpi));
        drawDrill();
      };
    });
  }

  /* ===== the five drill tables, PPT s39 to s43 ===== */
  const DRILL={
    users:{
      title:"Total number of EDRMS users, by department",
      sub:"Active users by department, split by staff, contractor and consultant.",
      cols:["Department","Active users","Staff","Contractors","Consultants","Never accessed"],
      rows:()=>DEPTS.map(d=>{
        const staff=Math.round(d.users*0.62), con=Math.round(d.users*0.24);
        return [d.code+" - "+d.name, F(d.users), F(staff), F(con), F(d.users-staff-con),
                F(Math.round(d.users*0.11))];
      }),
      tiles:()=>[["Monthly active users",F(TOTAL_USERS)],
                 ["Never accessed EDRMS",F(Math.round(TOTAL_USERS*0.11))],
                 ["No access in 90 days",F(Math.round(TOTAL_USERS*0.19))],
                 ["Training completion","74%"]]
    },
    docs:{
      title:"Total number of documents in EDRMS, by department",
      sub:"Documents and storage by department.",
      cols:["Department","Documents","Users creating","Storage","Share of documents"],
      rows:()=>DEPTS.map(d=>[d.code+" - "+d.name, F(d.docs), F(d.creating), GB(d.gb),
                             PCT(d.docs,TOTAL_DOCS).toFixed(1)+"%"]),
      tiles:()=>[["Documents held",(TOTAL_DOCS/1e6).toFixed(2)+"M"],
                 ["Storage consumed",GB(DEPTS.reduce((a,d)=>a+d.gb,0))],
                 ["Average monthly growth","2.4%"],
                 ["Departments reporting",F(DEPTS.length)]]
    },
    rec:{
      title:"Total number of records declared in EDRMS, by department and division",
      sub:"Click a department to open its divisions.",
      divisions:true,
      cols:["Department","Records declared","Users declaring","Declaration rate","Share of records"],
      rows:()=>DEPTS.map(d=>[d.code+" - "+d.name, F(d.rec), F(d.declaring),
                             PCT(d.rec,d.docs).toFixed(2)+"%", PCT(d.rec,TOTAL_REC).toFixed(1)+"%"]),
      kids:d=>divisionsFor(d.code).map(v=>[v.name, F(v.rec), F(v.declaring),
                             PCT(v.rec,Math.max(1,Math.round(d.docs*v.rec/d.rec))).toFixed(2)+"%",
                             PCT(v.rec,TOTAL_REC).toFixed(1)+"%"]),
      tiles:()=>[["Records declared",F(TOTAL_REC)],
                 ["Bank-wide declaration rate",DECL_RATE.toFixed(2)+"%"],
                 ["Departments with zero declarations",F(DEPTS.filter(d=>d.rec===0).length)],
                 ["Users declaring",F(DEPTS.reduce((a,d)=>a+d.declaring,0))]]
    },
    phys:{
      title:"Total number of physical counterparts identified, by department and division",
      sub:"Click a department to open its divisions.",
      divisions:true,
      cols:["Department","Physical counterparts","Records declared","Share with counterpart","Turned over to RAC"],
      rows:()=>DEPTS.map(d=>[d.code+" - "+d.name, F(d.phys), F(d.rec),
                             PCT(d.phys,d.rec).toFixed(1)+"%", F(Math.round(d.phys*0.58))]),
      kids:d=>divisionsFor(d.code).map(v=>[v.name, F(v.phys), F(v.rec),
                             PCT(v.phys,v.rec).toFixed(1)+"%", F(Math.round(v.phys*0.58))]),
      tiles:()=>[["Physical counterparts",F(TOTAL_PHYS)],
                 ["Share of declared records",PCT(TOTAL_PHYS,TOTAL_REC).toFixed(1)+"%"],
                 ["Turned over to RAC",F(Math.round(TOTAL_PHYS*0.58))],
                 ["Completion rate","58.0%"]]
    },
    disp:{
      title:"Total number of records due for disposal, by department",
      sub:"Records due for disposal by department, with the next due date.",
      cols:["Department","Records due","Next due date","With counterpart","Approver","Status"],
      rows:()=>DEPTS.map((d,i)=>[d.code+" - "+d.name, F(d.due),
                                 DUE_DATES[i%DUE_DATES.length],
                                 F(Math.round(d.due*0.31)),
                                 APPROVERS[i%APPROVERS.length], DSTATUS[i%DSTATUS.length]]),
      tiles:()=>[["Due within 30 days",F(DATA.DUE_30)],
                 ["Due within 90 days",F(DATA.DUE_90)],
                 ["Due within 12 months",F(TOTAL_DUE)],
                 ["Records disposed",F(Math.round(TOTAL_DUE*0.42))]]
    }
  };
  const DUE_DATES=["12 Sep 2026","28 Sep 2026","04 Oct 2026","19 Oct 2026","02 Nov 2026","23 Nov 2026",
                   "07 Dec 2026","21 Dec 2026","11 Jan 2027","25 Jan 2027","08 Feb 2027","22 Feb 2027",
                   "08 Mar 2027","22 Mar 2027","05 Apr 2027","19 Apr 2027"];
  const APPROVERS=["R. Tan","M. Reyes","A. Mendoza","L. Fernandez","J. Cruz","P. Santos"];
  const DSTATUS=["Approved","Approved","Pending","Extended","Approved","Declined"];


  function drawDrill(){
    const d=DRILL[openKpi];
    const rows=d.rows(), tiles=d.tiles();
    /* A table with a division tier renders one row per department with a
       disclosure control, and the division rows beneath it when open. Without
       the tier it is a flat list, which is every other drill table here. */
    const bodyRows=rows.map((r,i)=>{
      if(!d.divisions)
        return `<div class="drow">${r.map((c,j)=>
          j?`<div class="num">${c}</div>`:`<div class="dn">${c}</div>`).join("")}</div>`;
      const dep=DEPTS[i], open=!!expanded[dep.code];
      let h=`<div class="drow exp" data-dep="${dep.code}">
        <div class="dn"><span class="tw">${open?"▾":"▸"}</span>${r[0]}
          <small>${divisionsFor(dep.code).length} divisions</small></div>
        ${r.slice(1).map(c=>`<div class="num">${c}</div>`).join("")}</div>`;
      if(open)h+=d.kids(dep).map(k=>`<div class="drow kid">${k.map((c,j)=>
        j?`<div class="num">${c}</div>`:`<div class="dn">${c}</div>`).join("")}</div>`).join("");
      return h;
    }).join("");

    document.getElementById("bw-drill").innerHTML=
      `<div class="ptitle">${d.title}</div>
       <div class="psub">${d.sub}</div>
       <div class="tiles">${tiles.map(([l,v])=>
         `<div class="tile"><div class="tl">${l}</div><div class="tv">${v}</div></div>`).join("")}</div>
       <div class="scrollx"><div class="dtab" style="--dc:230px repeat(${d.cols.length-1},1fr)">
         <div class="dhead">${d.cols.map((c,i)=>
           `<div class="${i?"num":""}">${c}</div>`).join("")}</div>
         ${bodyRows}
       </div></div>`;

      DEPTS.map(d=>`<option value="${d.code}">${d.code} - ${d.name}</option>`).join("");
    sel.onchange=e=>{trendDept=e.target.value;drawTrend();};
    document.getElementById("bw-trend-reset").onclick=()=>{
      trendDept="all";sel.value="all";drawTrend();
    };
    drawTrend();
  }

  return {
    ver:"Bank-wide Oversight Dashboard",
    crumb:"Bank-wide Oversight",
    asof:"Data as of Mon 20 Jul 2026 23:59, refreshed Tue 21 Jul 06:00",
    summary:{
      departmentalSites:DEPT_SITES,
      projectSites:PROJ_SITES,
      users:TOTAL_USERS,
      documents:TOTAL_DOCS,
      declared:TOTAL_REC,
      physical:TOTAL_PHYS,
      dueForDisposal:TOTAL_DUE,
      declarationRate:DECL_RATE,
      departmentCount:DEPTS.length,
      /* Read by Department Insights, which drills into one of these rows.
         Exposed rather than rebuilt so a department's totals are identical
         whichever dashboard the reader arrives from. */
      departments:DEPTS.map(d=>({...d})),
      idleDays:IDLE_DAYS,
      /* The division tier, so Department Insights uses the same divisions with
         the same figures rather than inventing a second set. */
      divisionsFor
    },
    html,init
  };
})();

   department.js
   ================================================================= */
/* ===================================================================
   Department Insights. Stage 2 of the client redesign of 13 Aug 2026.
   PPT s19 to s28 for the layout, s53 to s66 for the detail.

   Fourteen of the client's fifty-seven design slides describe this one
   screen, which makes it the largest single piece of the redesign. It
   was also the dashboard removed from the prototype on 10 August, so it
   is built here from nothing rather than restored.

   Every department total is read from Bank-wide Oversight, which reads
   Records Management, so a department shows the same figures whichever
   dashboard the reader arrives from. Within a department, sites and
   libraries are split from that total, so they always add back up to it.

   Source markers as introduced on Bank-wide, plus one more:
     .src.ref   not a measurement at all. A list somebody has to maintain
   =================================================================== */
DASHBOARDS.dp=(function(){
  const BW=DASHBOARDS.bw.summary;
  const DEPTS=BW.departments;
  const IDLE=BW.idleDays;

  function split(total,weights){
    const s=weights.reduce((a,b)=>a+b,0);
    const out=weights.map(w=>Math.max(1,Math.round(total*w/s)));
    out[0]+=total-out.reduce((a,b)=>a+b,0);
    if(out[0]<0)out[0]=0;
    return out;
  }
  const GB=v=>v>=1024?(v/1024).toFixed(2)+" TB":v.toFixed(1)+" GB";
  const PCT=(a,b)=>b?(a/b*100):0;

  /* ===== sites within a department =====
     A department's site count comes from Bank-wide. The names come from a
     fixed pool so they are stable between draws, and every measure is split
     from the department total, so the site rows always sum to the department
     header figures. */
  const STEMS=["Records","Operations","Programs","Country Planning","Governance","Knowledge",
               "Administration","Projects","Advisory","Portfolio","Reporting","Archive"];
  const OWNERS=["a.mendoza","r.tan","j.cruz","m.reyes","l.fernandez","p.santos","c.delacruz",
                "s.villanueva","d.ramos","k.aquino","n.bautista","g.ocampo"];

  const SITECACHE={};
  function sitesFor(code){
    if(SITECACHE[code])return SITECACHE[code];
    const d=DEPTS.find(x=>x.code===code);
    const n=Math.max(1,d.sites);
    const w=[];for(let i=0;i<n;i++)w.push(1+((i*7+code.length)%9)*0.28);
    const rec=split(d.rec,w), docs=split(d.docs,w), phys=split(d.phys,w),
          due=split(d.due,w), users=split(d.users,w);
    const rows=[];
    for(let i=0;i<n;i++){
      const stem=STEMS[i%STEMS.length];
      const suffix=i<STEMS.length?"":" "+(Math.floor(i/STEMS.length)+1);
      rows.push({
        name:`${code} ${stem}${suffix} Site`,
        owner:OWNERS[(i+code.length)%OWNERS.length]+"@adb.org",
        rec:rec[i], docs:docs[i], phys:phys[i], due:due[i], users:users[i],
        /* Days since last activity. The 90 day rule the client asks for on
           s55 is derived from this, never stored, so changing 90 to 120 is
           one edit rather than a reload. */
        idle:((i*13+code.length*5)%210)+1,
        gb:+(docs[i]/3400).toFixed(1)
      });
    }
    SITECACHE[code]=rows;
    return rows;
  }

  /* ===== libraries, grouped by file plan category =====
     PPT s61 to s66 gives one screen per category. The categories themselves
     are the client's, from PPT s47 to s52. They exist in neither the term
     store nor Purview, which is why the panel carries a marker: the grouping
     is the client's design, not something we can read from the tenant. */
  const CATS=["Institutional Management","Administration","People Management",
              "Programs and Operations","Other"];
  const LIBPOOL={
    "Institutional Management":["Annual Meetings","Board Papers","Executive Correspondence","Policies"],
    "Administration":["Budgeting","Facilities","Procurement","Travel"],
    "People Management":["Learning and Development","Recruitment","Staff Records"],
    "Programs and Operations":["Portfolio Management","Country Planning","Loan Agreements","Project Completion"],
    "Other":["Photos and Audiovisual","Legacy Content"]
  };
  const LIBCACHE={};
  function librariesFor(code){
    if(LIBCACHE[code])return LIBCACHE[code];
    const d=DEPTS.find(x=>x.code===code);
    const flat=[];
    CATS.forEach(c=>LIBPOOL[c].forEach(l=>flat.push({cat:c,lib:l})));
    const w=flat.map((f,i)=>1+((i*5+code.length)%7)*0.3);
    const rec=split(d.rec,w), docs=split(d.docs,w), phys=split(d.phys,w);
    flat.forEach((f,i)=>{f.rec=rec[i];f.docs=docs[i];f.phys=phys[i];
      f.idle=((i*17+code.length*3)%200)+1;});
    LIBCACHE[code]=flat;
    return flat;
  }

  /* ===== reference lists =====
     PPT s26, s28 and s53. None of these are measurements: they are lists
     somebody in the department maintains, and nothing in SharePoint or the
     database design can generate them. They are laid out here exactly as the
     client drew them so the question "who maintains this" has something
     concrete attached to it. */
  const CONVENTION={link:"Approved SharePoint site, library and folder convention",
                    approved:"14 Feb 2026", updated:"02 Jun 2026", version:"v2.1"};
  const PROGRAMME=[
    {lab:"CSIS-IR audit of EDRMS", date:"08 Aug 2026", status:"Done"},
    {lab:"Convention review",      date:"30 Sep 2026", status:"Due"},
    {lab:"Physical records review",date:"15 Oct 2026", status:"Due"},
    {lab:"Refresher training",     date:"20 Nov 2026", status:"Due"},
    {lab:"Focals CoP schedule",    date:"04 Dec 2026", status:"Due"},
  ];
  const GOLIVE={ITD:"12 Jan 2026",SARD:"02 Feb 2026",OSFG:"16 Feb 2026",FIN:"12 Jan 2026",
    PARD:"02 Mar 2026",HRD:"16 Mar 2026",SERD:"30 Mar 2026",EARD:"13 Apr 2026",
    OGC:"26 Jan 2026",CWRD:"27 Apr 2026",PSOD:"11 May 2026",BRM:"25 May 2026",
    SPD:"08 Jun 2026",SDCC:"22 Jun 2026",OAS:"06 Jul 2026",ERCD:"20 Jul 2026"};

  /* ===== state ===== */
  let dept=DEPTS[0].code;      /* the largest, so the panels open populated */
  let openKpi="users";
  let sitePage=1, sortSite="rec", dirSite="desc";
  let libPage=1;
  let drillOpen={};   /* which site rows have their divisions open, PPT s58 */

  const D=()=>DEPTS.find(x=>x.code===dept);

  function pager(total,page,pages,noun){
    if(pages<=1)return `<div class="pager"><div class="pinfo">Showing ${F(total)} ${noun}</div></div>`;
    const win=[];for(let p=1;p<=pages;p++){if(p===1||p===pages||Math.abs(p-page)<=1)win.push(p);}
    let nums="",last=0;
    win.forEach(p=>{if(last&&p-last>1)nums+=`<span style="color:var(--mut)">…</span>`;
      nums+=`<button class="${p===page?'on':''}" data-pg="${p}">${p}</button>`;last=p;});
    const from=(page-1)*10+1,to=Math.min(total,page*10);
    return `<div class="pager"><div class="pinfo">Showing ${from} to ${to} of ${F(total)} ${noun}</div>
      <div class="pbtns"><button data-pg="prev" ${page===1?'disabled':''}>&lsaquo; Prev</button>${nums}
      <button data-pg="next" ${page===pages?'disabled':''}>Next &rsaquo;</button></div></div>`;
  }

  /* ===== top panel, PPT s19 and s53 ===== */
  function drawTiles(){
    const d=D(), sites=sitesFor(dept);
    const visitors=Math.round(d.users*1.9);
    const TILES=[
      {lab:"Sites Created", val:F(d.sites), stat:"Owned by this department"},
      {lab:"Total EDRMS Users", val:F(d.users), k:"users"},
      {lab:"Total Site Visitors", val:F(visitors), k:"visitors"},
      {lab:"Documents in EDRMS", val:F(d.docs), k:"docs"},
      {lab:"Records Declared", val:F(d.rec), k:"rec"},
      {lab:"Physical Counterparts", val:F(d.phys), stat:"Records with a physical copy"},
      {lab:"Records Due for Disposal", val:F(d.due), k:"disp"},
      {lab:"Sites Inactive over "+IDLE+" Days", val:F(sites.filter(s=>s.idle>IDLE).length),
       stat:"No activity since"},
    ];
    const act=TILES.filter(t=>t.k), st=TILES.filter(t=>!t.k);
    document.getElementById("dp-kpis").innerHTML=
      `<div class="kpigrp act">
         <div class="gh"><b>Open a breakdown</b><span>${act.length} cards, each opens the table beneath</span></div>
         <div class="kpis">${act.map(t=>
           `<div class="kpi ${t.k===openKpi?"on":""}" data-k="${t.k}"><div class="lab">${t.lab}</div>
              <div class="val">${t.val}</div><div class="tap">&#9662; Click to open</div></div>`).join("")}</div>
       </div>
       <div class="kpigrp">
         <div class="gh"><b>At a glance</b><span>${st.length} figures, nothing to click</span></div>
         <div class="kpis">${st.map(t=>
           `<div class="kpi stat"><div class="lab">${t.lab}</div><div class="val">${t.val}</div>
              <div class="sub">${t.stat}</div></div>`).join("")}</div>
       </div>`;
  }

  /* Per card, updating in place, for the same reasons as Bank-wide. */
  function wireTiles(){
    document.querySelectorAll("#dp-kpis .kpi[data-k]").forEach(card=>{
      card.onclick=()=>{
        openKpi=card.dataset.k;
        document.querySelectorAll("#dp-kpis .kpi[data-k]").forEach(el=>
          el.classList.toggle("on",el.dataset.k===openKpi));
        drawDrill();
      };
    });
  }

  /* ===== the drill tables behind the tiles, PPT s21 to s23, s54 to s60 ===== */
  function drawDrill(){
    const d=D(), sites=sitesFor(dept), DIVS=BW.divisionsFor(dept);
    let title,src,sub,cols,rows,tiles,kids=null;

    if(openKpi==="users"){
      title="Users, by division";
      sub="Active users in each division, split by staff, contractor and consultant.";
      cols=["Division","Active users","Staff","Contractors","Consultants","Training complete"];
      rows=DIVS.map(v=>{const st=Math.round(v.users*0.62),c=Math.round(v.users*0.24);
        return [v.name,F(v.users),F(st),F(c),F(Math.max(0,v.users-st-c)),
                Math.round(62+((v.name.length*7)%31))+"%"];});
      tiles=[["Active users",F(d.users)],["Divisions",F(DIVS.length)],
             ["Never accessed",F(Math.round(d.users*0.11))],["Training completion","74%"]];
    }
    else if(openKpi==="visitors"){
      title="Site visitors";
      sub="Visitors to each site, and access requests granted or declined.";
      cols=["Site","Visitors, all time","Visitors, 7 days","External","Requests granted","Requests declined"];
      rows=sites.map(s=>[s.name,F(Math.round(s.users*1.9)),F(Math.round(s.users*0.42)),
                         F(Math.round(s.users*0.18)),F(Math.round(s.users*0.22)),
                         F(Math.round(s.users*0.04))]);
      tiles=[["Visitors, all time",F(Math.round(d.users*1.9))],["Visitors, last 7 days",F(Math.round(d.users*0.42))],
             ["External visitors",F(Math.round(d.users*0.18))],
             ["Access requests granted",F(Math.round(d.users*0.22))]];
    }
    else if(openKpi==="docs"){
      title="Documents in EDRMS, by site";
      sub="Documents held, who is creating them, and the storage they consume.";
      cols=["Site","Documents","Users creating","Storage","Share of department"];
      rows=sites.map(s=>[s.name,F(s.docs),F(Math.max(1,Math.round(s.users*0.71))),GB(s.gb),
                         PCT(s.docs,d.docs).toFixed(1)+"%"]);
      tiles=[["Documents held",F(d.docs)],["Storage consumed",GB(d.gb)],
             ["Sites holding documents",F(sites.length)]];
    }
    else if(openKpi==="rec"){
      title="Record declaration, by site and division";
      sub="Records declared and the declaration rate for each site. Click a site to open its divisions.";
      cols=["Site","Records declared","Users declaring","Declaration rate","No declaration in "+IDLE+" days"];
      rows=sites.map(s=>[s.name,F(s.rec),F(Math.max(1,Math.round(s.users*0.34))),
                         PCT(s.rec,s.docs).toFixed(2)+"%", s.idle>IDLE?"yes":"no"]);
      /* One row per division of this site, split from the site's own total so a
         site's divisions always add back up to the site, exactly as the sites
         add back up to the department. */
      kids=s=>{
        const w=DIVS.map((v,i)=>1+((i*3+s.name.length)%5)*0.3);
        const rec=split(s.rec,w), dec=split(Math.max(1,Math.round(s.users*0.34)),w);
        return DIVS.map((v,i)=>[v.name.replace(dept+" ",""),F(rec[i]),F(dec[i]),
          PCT(rec[i],Math.max(1,Math.round(s.docs*rec[i]/Math.max(1,s.rec)))).toFixed(2)+"%",""]);
      };
      tiles=[["Records declared",F(d.rec)],["Declaration rate",PCT(d.rec,d.docs).toFixed(2)+"%"],
             ["Users declaring",F(d.declaring)],
             ["Sites with no declaration in "+IDLE+" days",F(sites.filter(s=>s.idle>IDLE).length)]];
    }
    else{
      title="Disposal, by library";
      sub="Records falling due in each library, with the next due date and its approver.";
      cols=["Library","Records due","Next due date","With counterpart","Approver","Status"];
      const libs=librariesFor(dept), dues=split(d.due,libs.map(l=>Math.max(1,l.phys)));
      rows=libs.map((l,i)=>[l.lib,F(dues[i]),DUE_DATES[i%DUE_DATES.length],
                            F(Math.round(dues[i]*0.31)),
                            APPROVERS[i%APPROVERS.length], DSTATUS[i%DSTATUS.length]]);
      tiles=[["Records due, next 12 months",F(d.due)],["Next due date",DUE_DATES[0]],
             ["Records disposed",F(Math.round(d.due*0.42))],
             ["Disposal backlog",F(Math.round(d.due*0.15))]];
    }
    const shown=rows.slice(0,10);
    const bodyRows=shown.map((r,i)=>{
      if(!kids)
        return `<div class="drow">${r.map((c,j)=>
          j?`<div class="num">${c}</div>`:`<div class="dn">${c}</div>`).join("")}</div>`;
      const site=sites[i], open=!!drillOpen[site.name];
      let h=`<div class="drow exp" data-row="${site.name}">
        <div class="dn"><span class="tw">${open?"▾":"▸"}</span>${r[0]}
          <small>${DIVS.length} divisions</small></div>
        ${r.slice(1).map(c=>`<div class="num">${c}</div>`).join("")}</div>`;
      if(open)h+=kids(site).map(k=>`<div class="drow kid">${k.map((c,j)=>
        j?`<div class="num">${c}</div>`:`<div class="dn">${c}</div>`).join("")}</div>`).join("");
      return h;
    }).join("");

    document.getElementById("dp-drill").innerHTML=
      `<div class="ptitle">${title}</div>
       <div class="psub">${sub}</div>
       <div class="tiles">${tiles.map(([l,v])=>
         `<div class="tile"><div class="tl">${l}</div><div class="tv">${v}</div></div>`).join("")}</div>
       <div class="scrollx"><div class="dtab" style="--dc:230px repeat(${cols.length-1},1fr)">
         <div class="dhead">${cols.map((c,i)=>`<div class="${i?"num":""}">${c}</div>`).join("")}</div>
         ${bodyRows}
       </div></div>
       ${rows.length>10?`<div class="psub" style="margin-top:10px">The full list is on the panel below.</div>`:""}`;

    document.querySelectorAll("#dp-drill .drow.exp").forEach(el=>el.onclick=()=>{
      const k=el.dataset.row;
      drillOpen[k]=!drillOpen[k];
      drawDrill();
    });
  }
  const DUE_DATES=["12 Sep 2026","28 Sep 2026","04 Oct 2026","19 Oct 2026","02 Nov 2026","23 Nov 2026",
                   "07 Dec 2026","21 Dec 2026","11 Jan 2027","25 Jan 2027","08 Feb 2027","22 Feb 2027",
                   "08 Mar 2027","22 Mar 2027","05 Apr 2027","19 Apr 2027"];
  const APPROVERS=["R. Tan","M. Reyes","A. Mendoza","L. Fernandez","J. Cruz","P. Santos"];
  const DSTATUS=["Approved","Approved","Pending","Extended","Approved","Declined"];

  /* ===== sites list, PPT s20 and s55 ===== */
  const SCOLS=[{k:"name",lab:"Site"},{k:"owner",lab:"Site owner"},{k:"docs",lab:"Documents",num:1},
               {k:"rec",lab:"Records",num:1},{k:"phys",lab:"Counterparts",num:1},{k:"due",lab:"Due",num:1}];
  function drawSites(){
    const d=D();
    const all=[...sitesFor(dept)].sort((a,b)=>{
      const k=sortSite, cmp=(k==="name"||k==="owner")?String(a[k]).localeCompare(String(b[k])):a[k]-b[k];
      return dirSite==="asc"?cmp:-cmp;
    });
    const pages=Math.max(1,Math.ceil(all.length/10));
    if(sitePage>pages)sitePage=pages;
    const view=all.slice((sitePage-1)*10,sitePage*10);
    let h=`<div class="dhead">`+SCOLS.map(c=>
      `<div class="hd${c.num?" num":""}${sortSite===c.k?" on":""}" data-s="${c.k}">${c.lab}${
        sortSite===c.k?(dirSite==="asc"?" ↑":" ↓"):""}</div>`).join("")+`</div>`;
    h+=view.map(s=>`<div class="drow">
      <div class="dn">${s.name}<small>${s.idle>IDLE?"No activity for "+s.idle+" days":"Active, last activity "+s.idle+" days ago"}</small></div>
      <div class="num">${s.owner}</div><div class="num">${F(s.docs)}</div>
      <div class="num">${F(s.rec)}</div><div class="num">${F(s.phys)}</div>
      <div class="num">${F(s.due)}</div></div>`).join("");
    h+=`<div class="dtot"><div>Department total</div><div class="num">${F(all.length)} sites</div>
      <div class="num">${F(d.docs)}</div><div class="num">${F(d.rec)}</div>
      <div class="num">${F(d.phys)}</div><div class="num">${F(d.due)}</div></div>`;
    document.getElementById("dp-sites").innerHTML=h;
    document.getElementById("dp-sites-pager").innerHTML=pager(all.length,sitePage,pages,"sites");
    document.querySelectorAll("#dp-sites .hd").forEach(el=>el.onclick=()=>{
      const k=el.dataset.s;
      if(sortSite===k)dirSite=dirSite==="asc"?"desc":"asc";
      else{sortSite=k;dirSite=(k==="name"||k==="owner")?"asc":"desc";}
      sitePage=1;drawSites();
    });
    wirePager("#dp-sites-pager",v=>{
      sitePage=v==="prev"?Math.max(1,sitePage-1):v==="next"?Math.min(pages,sitePage+1):+v;
      drawSites();
    });
  }

  function drawDeptCharts(){
    const d=D(), sites=sitesFor(dept);
    document.getElementById("dp-donut").innerHTML=CHART.donut([
      {label:"Declared as records",value:d.rec,color:"var(--teal)"},
      {label:"Not declared",value:d.docs-d.rec,color:"var(--greyblue)"},
    ],{centreValue:PCT(d.rec,d.docs).toFixed(1)+"%",centreLabel:"declaration rate"});
    document.getElementById("dp-sitebars").innerHTML=CHART.hbars(
      [...sites].sort((a,b)=>b.rec-a.rec).slice(0,6)
        .map(x=>({label:x.name.replace(dept+" ",""),sub:x.owner,value:x.rec})));
  }

  /* ===== library usage, PPT s25 and s61 to s66 ===== */
  function drawLibs(){
    const d=D(), libs=librariesFor(dept);
    const pages=Math.max(1,Math.ceil(libs.length/10));
    if(libPage>pages)libPage=pages;
    const view=libs.slice((libPage-1)*10,libPage*10);
    let h=`<div class="dhead"><div>Library</div><div class="num">Users</div>
      <div class="num">Documents</div><div class="num">Records declared</div>
      <div class="num">Counterparts</div><div class="num">Idle days</div></div>`;
    let cat="";
    view.forEach(l=>{
      if(l.cat!==cat){cat=l.cat;h+=`<div class="drow cat"><div class="dn">${cat}</div>
        <div></div><div></div><div></div><div></div><div></div></div>`;}
      h+=`<div class="drow"><div class="dn">${l.lib}<small>${dept}</small></div>
        <div class="num">${F(Math.max(2,Math.round(l.rec/26)))}</div><div class="num">${F(l.docs)}</div>
        <div class="num">${F(l.rec)}</div><div class="num">${F(l.phys)}</div>
        <div class="num">${l.idle}</div></div>`;
    });
    h+=`<div class="dtot"><div>Department total</div><div class="num">${F(d.users)}</div>
      <div class="num">${F(d.docs)}</div><div class="num">${F(d.rec)}</div>
      <div class="num">${F(d.phys)}</div><div class="num"></div></div>`;
    document.getElementById("dp-libs").innerHTML=h;
    document.getElementById("dp-libs-pager").innerHTML=pager(libs.length,libPage,pages,"libraries");
    wirePager("#dp-libs-pager",v=>{
      libPage=v==="prev"?Math.max(1,libPage-1):v==="next"?Math.min(pages,libPage+1):+v;
      drawLibs();
    });
  }

  /* ===== declaration trend for one department, PPT s24 ===== */
  function drawTrend(){
    const d=D(), share=d.rec/DATA.DECLARED;
    const vals=DATA.MONTH_VALUES.map(v=>Math.round(v*share));
    const mx=Math.max(...vals,1);
    document.getElementById("dp-trend").innerHTML=DATA.MONTH_LABELS.map((m,i)=>`
      <div class="tcol"><div class="tval">${F(vals[i])}</div>
        <div class="tbar" style="height:${Math.max(2,100*vals[i]/mx)}%"></div>
        <div class="tlab">${m}</div></div>`).join("");
    document.getElementById("dp-trend-sum").textContent=d.code;
  }

  function drawAll(){
    const d=D();
    document.getElementById("dp-golive").innerHTML=
      `Go-live date <b>${GOLIVE[d.code]||"not recorded"}</b>`;
    document.getElementById("dp-name").textContent=d.code+" - "+d.name;
    sitePage=1;libPage=1;drillOpen={};
    drawTiles();wireTiles();drawDrill();drawSites();drawLibs();drawTrend();drawDeptCharts();
  }

  const html=`<section class="dash-dp">
    <div class="band">
      <h2>Department insights</h2>
      <div class="bd">How one department is managing its records: sites, people, declaration, libraries and disposal.</div>
    </div>

    <div class="picker">
