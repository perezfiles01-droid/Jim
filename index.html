/* ===================================================================
   Overview
   An executive summary of the other dashboards. Must be defined after
   them, because every figure it shows is read from their exported
   `summary` objects rather than restated here. That is deliberate: a
   summary that keeps its own copy of the numbers drifts away from the
   detail it claims to summarise the first time either side is edited.
   =================================================================== */
DASHBOARDS.ov=(function(){
  const RM=DASHBOARDS.rm.summary;
  const SL=DASHBOARDS.sl.summary;
  const FS=DASHBOARDS.fs.summary;

  /* Cross dashboard checks. These fire in the console rather than on the page,
     so a broken figure is caught during verification instead of by a reader. */
  console.assert(RM.declared===FS.totalFiles,
    `Overview: declared records (${RM.declared}) and format file total (${FS.totalFiles}) disagree`);
  console.assert(RM.withPhysical+RM.withoutPhysical===RM.declared,
    "Overview: physical counterpart split does not sum to declared records");
  console.assert(SL.libraryRecords+SL.libraryUndeclared===SL.libraryDocuments,
    "Overview: library declaration split does not sum to library documents");
  console.assert(Math.abs(FS.formats.reduce((a,f)=>a+f.gb,0)-FS.totalGB)<0.05,
    "Overview: format storage does not sum to the storage total");

  const GB=n=>n.toFixed(1)+" GB";
  const PCT=(v,t)=>t?(v/t*100):0;

  /* ===== chart primitives, all mapped to native Power BI visuals ===== */

  /* Donut chart. Power BI equivalent: Donut chart. */
  function arcSeg(cx,cy,rO,rI,a0,a1,fill,title){
    const large=(a1-a0)>Math.PI?1:0;
    const pt=(r,a)=>[(cx+r*Math.cos(a)).toFixed(2),(cy+r*Math.sin(a)).toFixed(2)];
    const [x0,y0]=pt(rO,a0),[x1,y1]=pt(rO,a1),[x2,y2]=pt(rI,a1),[x3,y3]=pt(rI,a0);
    return `<path d="M${x0} ${y0}A${rO} ${rO} 0 ${large} 1 ${x1} ${y1}L${x2} ${y2}A${rI} ${rI} 0 ${large} 0 ${x3} ${y3}Z" fill="${fill}"><title>${title}</title></path>`;
  }
  function donut(items,o){
    o=o||{};
    const size=o.size||168, th=o.thickness||32, cx=size/2, cy=size/2, rO=size/2, rI=size/2-th;
    const total=items.reduce((a,i)=>a+i.value,0)||1;
    let a=-Math.PI/2, out="";
    items.forEach(i=>{
      const frac=i.value/total;
      if(frac<=0)return;
      const a1=a+frac*Math.PI*2;
      if(frac>0.9995){
        /* a single full slice would collapse the arc endpoints onto each other,
           so draw it as a stroked circle instead */
        out+=`<circle cx="${cx}" cy="${cy}" r="${(rO+rI)/2}" fill="none" stroke="${i.color}" stroke-width="${th}"><title>${i.label}</title></circle>`;
      }else{
        out+=arcSeg(cx,cy,rO,rI,a,a1,i.color,`${i.label}: ${o.fmt?o.fmt(i.value):F(i.value)}`);
      }
      a=a1;
    });
    const centre=o.centreValue
      ? `<text x="${cx}" y="${cy-1}" text-anchor="middle" font-size="20" font-weight="700" fill="#10243E" style="font-variant-numeric:tabular-nums">${o.centreValue}</text>
         <text x="${cx}" y="${cy+16}" text-anchor="middle" font-size="10" fill="#6B7A8C">${o.centreLabel||""}</text>`
      : "";
    return `<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}" style="display:block;flex:0 0 auto">${out}${centre}</svg>`;
  }
  function legend(items,fmt){
    const total=items.reduce((a,i)=>a+i.value,0)||1;
    return `<div class="dleg">`+items.map(i=>
      `<div class="dlrow"><span class="sw" style="background:${i.color}"></span>
        <span class="dlab" title="${i.label}">${i.label}</span>
        <span class="dval">${fmt(i.value)}</span>
        <span class="dpct">${PCT(i.value,total).toFixed(1)}%</span></div>`).join("")+`</div>`;
  }
  function donutCard(items,o,fmt){
    return `<div class="cwrap">${donut(items,o)}${legend(items,fmt)}</div>`;
  }

  /* Ranked horizontal bars. Power BI equivalent: Clustered bar chart. */
  function topBars(items,fmt){
    const mx=Math.max(...items.map(i=>i.value),1);
    return items.map(i=>`<div class="tbar">
      <div class="tl"><b>${i.label}</b>${i.name?`<small>${i.name}</small>`:""}</div>
      <div class="tt"><div class="tf" style="width:${Math.max(3,100*i.value/mx)}%"></div></div>
      <div class="tv">${fmt(i.value)}</div></div>`).join("");
  }

  /* Two magnitudes on one shared scale, so the gap between them is the message.
     Power BI equivalent: Clustered bar chart. */
  function gapBars(rows,fmt){
    const mx=Math.max(...rows.map(r=>r.value),1);
    return rows.map(r=>`<div class="gap">
      <div class="gl"><span>${r.label}</span><b>${fmt(r.value)}</b></div>
      <div class="gt"><div class="gf" style="width:${Math.max(0.4,100*r.value/mx)}%;background:${r.color}"></div></div>
    </div>`).join("");
  }

  /* ===== palette, taken from the ADB tokens only ===== */
  const C={blue:"#0072BC",teal:"#00A5A8",deep:"#1B5E82",green:"#5CA943",grey:"#9DB8D2",faint:"#C7D3E0",orange:"#E8763C"};

  /* The same five formats appear in both format donuts, with the same colours,
     so the two can be read against each other. Grouping the tail into one slice
     also keeps each donut readable, which eight slices would not be. */
  const FMT_TOP=[...FS.formats].sort((a,b)=>b.gb-a.gb).slice(0,5);
  const FMT_REST=FS.formats.filter(f=>!FMT_TOP.includes(f));
  const FMT_COLORS=[C.blue,C.teal,C.deep,C.green,C.grey];
  const storageSlices=FMT_TOP.map((f,i)=>({label:f.label,value:f.gb,color:FMT_COLORS[i]}))
    .concat([{label:"All other formats",value:FMT_REST.reduce((a,f)=>a+f.gb,0),color:C.faint}]);
  const fileSlices=FMT_TOP.map((f,i)=>({label:f.label,value:f.files,color:FMT_COLORS[i]}))
    .concat([{label:"All other formats",value:FMT_REST.reduce((a,f)=>a+f.files,0),color:C.faint}]);

  console.assert(Math.abs(storageSlices.reduce((a,s)=>a+s.value,0)-FS.totalGB)<0.05,
    "Overview: storage donut does not sum to the storage total");
  console.assert(fileSlices.reduce((a,s)=>a+s.value,0)===FS.totalFiles,
    "Overview: file donut does not sum to the file total");

  /* The single most useful comparison in the data: the format that dominates
     storage is not the format that dominates the file count. */
  const bigStorage=storageSlices[0];
  const bigStorageFiles=fileSlices[0];
  const bigFiles=[...fileSlices].sort((a,b)=>b.value-a.value)[0];

  const html=`<section class="dash-ov">
    <div class="band">
      <h2>Executive summary</h2>
      <div class="bd">One view of how the EDRMS is being adopted across the bank. Each section below summarises a dashboard: open that dashboard for the full detail, filters, and drill down.</div>
    </div>

    <div class="kpis" id="ov-kpis"></div>

    <div class="panel">
      <div class="phead">
        <div>
          <div class="ptitle">Records Management</div>
          <div class="psub">How much of the content held in EDRMS compliant sites has been formally declared as a record, and which departments are declaring it.</div>
        </div>
        <button class="golink" data-go="rm">Open Records Management &rsaquo;</button>
      </div>
      <div class="crow">
        <div class="chart">
          <div class="ctitle">Declared records by physical counterpart</div>
          <div id="ov-rm-donut"></div>
        </div>
        <div class="chart">
          <div class="ctitle">Declared against everything held</div>
          <div id="ov-rm-gap"></div>
        </div>
        <div class="chart wide">
          <div class="ctitle">Top 5 departments by declared records</div>
          <div id="ov-rm-top"></div>
        </div>
      </div>
    </div>

    <div class="panel">
      <div class="phead">
        <div>
          <div class="ptitle">Sites and Libraries</div>
          <div class="psub">How far the compliant site rollout has reached, and how thoroughly the libraries inside those sites are declaring their content.</div>
        </div>
        <button class="golink" data-go="sl">Open Sites and Libraries &rsaquo;</button>
      </div>
      <div class="crow">
        <div class="chart">
          <div class="ctitle">Library content declared as records</div>
          <div id="ov-sl-donut"></div>
        </div>
        <div class="chart wide">
          <div class="ctitle">Top 5 departments by compliant sites created</div>
          <div id="ov-sl-top"></div>
        </div>
      </div>
    </div>

    <div class="panel">
      <div class="phead">
        <div>
          <div class="ptitle">Format and Storage</div>
          <div class="psub">Which file formats the declared records are held in, and which of them are actually consuming the storage.</div>
        </div>
        <button class="golink" data-go="fs">Open Format and Storage &rsaquo;</button>
      </div>
      <div class="crow">
        <div class="chart">
          <div class="ctitle">Share of storage consumed</div>
          <div id="ov-fs-gb"></div>
        </div>
        <div class="chart">
          <div class="ctitle">Share of files held</div>
          <div id="ov-fs-files"></div>
        </div>
      </div>
      <div id="ov-fs-callout"></div>
    </div>
  </section>`;

  function init(){
    /* headline cards, each one a route into the dashboard it came from */
    const cards=[
      {lab:"Total Declared Records", val:F(RM.declared),                 go:"rm", to:"Records Management"},
      {lab:"Documents in Compliant Sites", val:(RM.documents/1e6).toFixed(2)+"M", go:"rm", to:"Records Management"},
      {lab:"Compliant Sites Created", val:F(SL.sitesCreated),            go:"sl", to:"Sites and Libraries"},
      {lab:"Storage Consumed", val:GB(FS.totalGB),                       go:"fs", to:"Format and Storage"},
      {lab:"Active Sites, Last 7 Days", val:F(RM.activeSites7),          go:"rm", to:"Records Management"},
    ];
    document.getElementById("ov-kpis").innerHTML=cards.map(c=>
      `<div class="kpi" data-go="${c.go}"><div class="lab">${c.lab}</div><div class="val">${c.val}</div>
       <div class="tap">View in ${c.to} &rsaquo;</div></div>`).join("");

    /* Records Management */
    const physSlices=[
      {label:"Without physical counterpart",value:RM.withoutPhysical,color:C.grey},
      {label:"With physical counterpart",value:RM.withPhysical,color:C.teal},
    ];
    document.getElementById("ov-rm-donut").innerHTML=
      donutCard(physSlices,{centreValue:F(RM.declared),centreLabel:"declared records"},F);

    const rate=PCT(RM.declared,RM.documents);
    document.getElementById("ov-rm-gap").innerHTML=
      gapBars([
        {label:"Documents in compliant sites",value:RM.documents,color:C.orange},
        {label:"Declared as records",value:RM.declared,color:C.blue},
      ],F)+
      `<div class="callout"><b>${rate.toFixed(2)}%</b> of the documents held in EDRMS compliant sites have been declared as records. The remaining <b>${F(RM.documents-RM.declared)}</b> documents sit in compliant sites without record status.</div>`;

    document.getElementById("ov-rm-top").innerHTML=topBars(RM.topDepartments,F)+
      `<div class="mini"><div>Departments reporting<b>${F(RM.departmentCount)}</b></div>
        <div>EDRMS users, monthly active<b>${F(RM.monthlyActiveUsers)}</b></div></div>`;

    /* Sites and Libraries */
    const libSlices=[
      {label:"Declared as records",value:SL.libraryRecords,color:C.teal},
      {label:"Not yet declared",value:SL.libraryUndeclared,color:C.grey},
    ];
    document.getElementById("ov-sl-donut").innerHTML=
      donutCard(libSlices,{centreValue:PCT(SL.libraryRecords,SL.libraryDocuments).toFixed(1)+"%",centreLabel:"declared"},F);

    document.getElementById("ov-sl-top").innerHTML=topBars(SL.topDepartments,F)+
      `<div class="mini"><div>Compliant sites created<b>${F(SL.sitesCreated)}</b></div>
        <div>Libraries tracked<b>${F(SL.libraryCount)}</b></div>
        <div>Library storage<b>${GB(SL.storageGB)}</b></div></div>`;

    /* Format and Storage, two donuts sharing one colour scheme so they can be
       read against each other */
    document.getElementById("ov-fs-gb").innerHTML=
      donutCard(storageSlices,{centreValue:GB(FS.totalGB),centreLabel:"total storage"},GB);
    document.getElementById("ov-fs-files").innerHTML=
      donutCard(fileSlices,{centreValue:F(FS.totalFiles),centreLabel:"total files"},F);

    const gbShare=PCT(bigStorage.value,FS.totalGB), fileShare=PCT(bigStorageFiles.value,FS.totalFiles);
    document.getElementById("ov-fs-callout").innerHTML=
      `<div class="callout">The two charts do not agree, and that is the point. <b>${bigStorage.label}</b> account for <b>${gbShare.toFixed(1)}%</b> of storage but only <b>${fileShare.toFixed(1)}%</b> of files, while <b>${bigFiles.label}</b> are the most numerous at <b>${PCT(bigFiles.value,FS.totalFiles).toFixed(1)}%</b> of files. Storage pressure comes from a small number of large files, not from the formats people create most often.</div>`;

    /* every card and button routes to the dashboard the figure came from */
    document.querySelectorAll(".dash-ov [data-go]").forEach(el=>
      el.onclick=()=>switchTo(el.dataset.go));
  }

  return {
    ver:"Overview Dashboard",
    crumb:"Overview",
    /* A summary is only as current as its stalest input, so this quotes the
       oldest refresh across the dashboards it draws from rather than the newest. */
    asof:"Data as of Sun 05 Jul 2026 23:59, the oldest refresh across the dashboards summarised here",
    html,init
  };
})();


/* =================================================================
   retention.js
   Answers the client's 2.1.2.8, the disposal summary. Built rather than
   left a placeholder because the data is already there: Records carries
   EDRMSDueDateForDisposal, computed as EDRMSRetentionLabelApplied plus
   EDRMSDuration, so records due for disposal and the next due date are a
   count and a MIN over a column that exists today. The only figure here
   that is not available now is the inactive document count, which needs
   the document scan, and it is marked as such on the panel.
   ================================================================= */
DASHBOARDS.rt=(function(){
  /* Retention labels across all declared records. Sums to the same 21,646 the
     other dashboards use, and asserts it below rather than trusting it. */
  /* `note` prints under the label, the way Permanent already explains itself.
     The last two rows exist because neither is a retention period: one is
     everything outside the standard set, the other is the absence of a label. */
  const LABELS=[
    {label:"10 years after declaration",count:8100},
    {label:"7 years after declaration", count:5100},
    {label:"5 years after declaration", count:3820},
    {label:"Permanent",                 count:2400, note:"Never due for disposal"},
    {label:"3 years after declaration", count:1420},
    {label:"Others",                    count:574,  note:"Labels outside the standard 3, 5, 7 and 10 year set"},
    {label:"No retention label",        count:232,  note:"No label, so no disposal date and nothing to schedule"},
  ];
  const LABEL_TOTAL=LABELS.reduce((a,l)=>a+l.count,0);
  /* Permanent records are never due for disposal. Stating it as a constant
     keeps the "never due" population visible instead of buried in a filter. */
  const PERMANENT=LABELS.find(l=>l.label==="Permanent").count;
  /* One source of truth for the unlabelled population. The compliance panel
     above reads the same number, so the two cannot disagree. */
  const NO_LABEL=LABELS.find(l=>l.label==="No retention label").count;

  /* Disposal summary per library. Record counts are the same figures the
     Sites and Libraries dashboard shows, so the two reconcile.
     [library, site, records, dueWithin12m, nextDue, inactive1y] */
  const DLIBS=[
   ["Final Documents","ITD Records Site",640,84,"2026-11-14",210],
   ["Board Papers","OGC Legal Site",540,96,"2026-09-02",164],
   ["Country Reports","SARD Ops Site",450,61,"2026-10-27",138],
   ["Loan Agreements","FIN Treasury Site",384,0,"2031-04-18",92],
   ["Policies","HRD People Site",315,44,"2027-01-09",71],
   ["Project Completion","OSFG Country Site",300,38,"2026-12-03",96],
   ["Field Reports","SERD Ops Site",286,52,"2026-08-21",118],
   ["Case Files","OGC Compliance Site",280,31,"2027-02-16",64],
   ["Minutes","BRM Budget Site",245,58,"2026-09-30",83],
   ["Correspondence","PARD Procurement Site",210,74,"2026-08-14",147],
   ["Investment Memos","PSOD Investments Site",180,22,"2027-03-05",40],
   ["Legal Opinions","OGC Advisory Site",150,0,"2033-06-11",55],
   ["Audit Reports","CWRD Ops Site",120,19,"2026-12-19",37],
   ["Climate Briefs","SDCC Climate Site",95,12,"2027-05-22",26],
   ["Admin Records","OAS Facilities Site",88,17,"2026-10-08",31],
  ];
  const DUE_TOTAL=DLIBS.reduce((a,l)=>a+l[3],0);
  /* Disposal windows. All three are the same count over EDRMSDueDateForDisposal
     at different horizons, so they are held as one shape rather than three
     unrelated numbers, and each is necessarily a subset of the next. */
  const DUE_30=71, DUE_90=196;
  console.assert(DUE_30<=DUE_90 && DUE_90<=DUE_TOTAL,
    "Disposal windows must nest: 30 days inside 90 inside 12 months");

  /* Retention compliance. A record with no retention label has no due date and
     can never be disposed of, which is why it is worth counting separately
     rather than letting it sit silently outside every disposal figure. */
  const WITH_SCHEDULE=LABEL_TOTAL-NO_LABEL;
  const BEYOND_RETENTION=342;
  const LIB_RECORDS=DLIBS.reduce((a,l)=>a+l[2],0);
  const INACTIVE_TOTAL=DLIBS.reduce((a,l)=>a+l[5],0);
  const NEXT_DUE=DLIBS.map(l=>l[4]).sort()[0];

  const DFMT=d=>{const x=new Date(d+"T00:00:00");
    return x.toLocaleDateString("en-GB",{day:"2-digit",month:"short",year:"numeric"});};

  /* Reconciliation. The label breakdown must equal the declared record total
     the Records Management dashboard publishes, and no library can have more
     records due than it holds. */
  console.assert(LABEL_TOTAL===DASHBOARDS.rm.summary.declared,
    `Retention labels total ${LABEL_TOTAL} but Records Management declares ${DASHBOARDS.rm.summary.declared}`);
  console.assert(DLIBS.every(l=>l[3]<=l[2]),"A library cannot have more records due for disposal than it holds");
  console.assert(DUE_TOTAL<LABEL_TOTAL-PERMANENT,"Records due must exclude the permanent population");
  const NO_SCHEDULE=NO_LABEL;
  console.assert(WITH_SCHEDULE+NO_SCHEDULE===LABEL_TOTAL,
    "The compliance split must account for every declared record");
  console.assert(WITH_SCHEDULE<=LABEL_TOTAL,"Records with a schedule cannot exceed the declared total");
  console.assert(BEYOND_RETENTION<=WITH_SCHEDULE,"Only a record with a schedule can be beyond its retention period");

  /* [category, sets, terms, depth]. The five top level groups the client
     names. Counts are illustrative until the walk above is run against the
     tenant; the source is confirmed, the numbers are not. */
  const CATS=[
   {label:"Programme and operation", sets:14, terms:412, depth:4},
   {label:"Administration",          sets:11, terms:286, depth:3},
   {label:"Compliance and oversight",sets:8,  terms:174, depth:3},
   {label:"People Management",       sets:7,  terms:139, depth:3},
   {label:"Risk management",         sets:5,  terms:88,  depth:2},
  ];
  const TOTAL_TERMS=CATS.reduce((a,c)=>a+c.terms,0);
  const TOTAL_SETS=CATS.reduce((a,c)=>a+c.sets,0);
  const MAX_DEPTH=Math.max(...CATS.map(c=>c.depth));
  console.assert(CATS.every(c=>c.terms>=c.sets),
    "A category cannot hold fewer terms than it has term sets");


  let sortD="due",dirD="desc";
  const DCOLS=[
    {k:"lib",  i:0,lab:"Library",              num:false},
    {k:"site", i:1,lab:"Site",                 num:false},
    {k:"held", i:2,lab:"Records held",         num:true},
    {k:"due",  i:3,lab:"Due within 12 months", num:true},
    {k:"next", i:4,lab:"Next due date",        num:false},
    {k:"inact",i:5,lab:"Inactive over 1 year", num:true},
  ];

  function drawPlan(){
    const mx=Math.max(...CATS.map(c=>c.terms));
    document.getElementById("rt-plan").innerHTML=CATS.map(c=>
      `<div class="fbar"><div class="fl"><b>${c.label}</b><small>${c.sets} term sets, ${c.depth} levels deep</small></div>
        <div class="ft"><div class="ff" style="width:${Math.max(8,100*c.terms/mx)}%">${F(c.terms)}</div></div>
        <div class="fp">${(c.terms/TOTAL_TERMS*100).toFixed(1)}%</div></div>`).join("");
  }

  function drawTable(){
    const col=DCOLS.find(c=>c.k===sortD);
    const rows=[...DLIBS].sort((a,b)=>{
      const x=a[col.i],y=b[col.i];
      const cmp=col.num?x-y:String(x).localeCompare(String(y));
      return dirD==="asc"?cmp:-cmp;
    });
    const mx={};[2,3,5].forEach(i=>mx[i]=Math.max(...DLIBS.map(l=>l[i]),1));
    let h="";
    DCOLS.forEach(c=>{
      const arrow=sortD===c.k?(dirD==="asc"?" ↑":" ↓"):"";
      h+=`<div class="hd${c.num?" num":""}${sortD===c.k?" on":""}" data-s="${c.k}">${c.lab}${arrow}</div>`;
    });
    rows.forEach(l=>{
      const cell=i=>`<div class="nc"><div class="nb" style="width:${(l[i]/mx[i]*100).toFixed(1)}%"></div><b>${F(l[i])}</b></div>`;
      h+=`<div class="nm" title="${l[0]}">${l[0]}</div><div class="dp">${l[1]}</div>`;
      h+=cell(2)+cell(3);
      /* A library whose next due date is years out is not "nothing due", it is
         a long or permanent retention. Saying so beats an empty cell. */
      h+=`<div class="dt${l[3]===0?" far":""}">${DFMT(l[4])}</div>`;
      h+=cell(5);
    });
    const t=document.getElementById("rt-table");
    t.innerHTML=h;
    t.querySelectorAll(".hd[data-s]").forEach(hd=>hd.onclick=()=>{
      const k=hd.dataset.s;
      if(sortD===k)dirD=dirD==="asc"?"desc":"asc";
      else{sortD=k;dirD=(k==="lib"||k==="site"||k==="next")?"asc":"desc";}
      drawTable();
    });
  }

  function drawCompliance(){
    const rows=[
      ["With a retention schedule",WITH_SCHEDULE,"var(--teal)"],
      ["No retention schedule",NO_SCHEDULE,"var(--greyblue)"],
      ["Beyond retention period",BEYOND_RETENTION,"var(--orange)"],
    ];
    const mx=Math.max(...rows.map(r=>r[1]));
    document.getElementById("rt-compliance").innerHTML=rows.map(([lab,v,col])=>
      `<div class="lbar"><div class="ll"><b>${lab}</b></div>
        <div class="lt"><div class="lf" style="width:${Math.max(6,100*v/mx)}%;background:${col}">${F(v)}</div></div>
        <div class="lp">${(v/LABEL_TOTAL*100).toFixed(1)}%</div></div>`).join("");
  }
  function drawLabels(){
    const mx=Math.max(...LABELS.map(l=>l.count));
    const colour=l=>l.label==="Permanent"?"var(--greyblue)"
                  :l.label==="No retention label"?"var(--orange)"
                  :l.label==="Others"?"var(--mut)":"var(--deepblue)";
    document.getElementById("rt-labels").innerHTML=LABELS.map(l=>
      `<div class="lbar"><div class="ll"><b>${l.label}</b>${l.note?`<small>${l.note}</small>`:""}</div>
        <div class="lt"><div class="lf" style="width:${Math.max(6,100*l.count/mx)}%;background:${colour(l)}">${F(l.count)}</div></div>
        <div class="lp">${(l.count/LABEL_TOTAL*100).toFixed(1)}%</div></div>`).join("");
  }

  const html=`<section class="dash-rt">
    <div class="band">
      <h2>Disposal pipeline</h2>
      <div class="bd">Which declared records are approaching the end of their retention period, and when the next disposal falls due. Due dates come from the retention label applied to each record plus its duration.</div>
    </div>
    <div class="kpis" id="rt-kpis">
      <div class="kpi stat"><div class="lab">Records Due for Disposal, next 12 months</div><div class="val" id="kpi-due">…</div></div>
      <div class="kpi stat"><div class="lab">Next Due Date for Disposal</div><div class="val" id="kpi-next">…</div></div>
    </div>
    <div class="panel">
      <div class="ptitle">Disposal summary by library</div>
      <div class="psub">Click any column heading to sort. Records held and records due come from the declared record rows. Inactive over 1 year counts documents untouched for a year, which is the one column here that waits on the document scan.</div>
      <div class="tiles">
        <div class="tile"><div class="tl">Due within 30 days</div><div class="tv">${F(DUE_30)}</div></div>
        <div class="tile"><div class="tl">Due within 90 days</div><div class="tv">${F(DUE_90)}</div></div>
        <div class="tile hi"><div class="tl">Due within 12 months</div><div class="tv">${F(DUE_TOTAL)}</div></div>
        <div class="tile"><div class="tl">Records in these libraries</div><div class="tv">${F(LIB_RECORDS)}</div></div>
      </div>
      <div class="scrollx"><div class="dtab" id="rt-table"></div></div>
    </div>

    <div class="band">
      <h2>Retention compliance</h2>
      <div class="bd">Whether each declared record actually carries a retention schedule, and how many have already passed the end of theirs. A record with no schedule has no due date, so it sits outside every disposal figure above.</div>
    </div>
    <div class="panel">
      <div class="ptitle">Schedules and overdue records</div>
      <div class="psub">Every declared record is counted once, as carrying a schedule or not. Beyond retention is a subset of those that carry one: it means the disposal date has passed, not that the record is still awaiting action, since nothing records whether a disposal was carried out.</div>
      <div class="tiles">
        <div class="tile"><div class="tl">With a retention schedule</div><div class="tv">${F(WITH_SCHEDULE)}</div></div>
        <div class="tile hi"><div class="tl">Without a retention schedule</div><div class="tv">${F(NO_SCHEDULE)}</div></div>
        <div class="tile"><div class="tl">Beyond retention period</div><div class="tv">${F(BEYOND_RETENTION)}</div></div>
      </div>
      <div id="rt-compliance"></div>
    </div>

    <div class="band">
      <h2>Institutional file plan</h2>
      <div class="bd">The classification scheme these retention rules apply to. The file plan says how content is filed; the retention labels above say how long each class is kept. Two views of the same governance.</div>
    </div>
    <div class="panel">
      <div class="ptitle">Terms by category</div>
      <div class="psub">The ${CATS.length} top level groups in the file plan, sized by how many terms sit beneath them at every level, not only the top.</div>
      <div id="rt-plan"></div>
    </div>

    <div class="band">
      <h2>Retention profile</h2>
      <div class="bd">How the declared records divide across retention labels, and how much of the holding is permanent and therefore never due for disposal.</div>
    </div>
    <div class="panel">
      <div class="ptitle">Declared records by retention label</div>
      <div class="psub">Others covers retention labels outside the standard 3, 5, 7 and 10 year set. No retention label means the label was removed from the record, so it has no disposal date and cannot be scheduled at all.</div>
      <div id="rt-labels"></div>
    </div>
  </section>`;

  function init(){
    document.getElementById("kpi-due").textContent=F(DUE_TOTAL);
    document.getElementById("kpi-next").textContent=DFMT(NEXT_DUE);
    drawTable();
    drawLabels();
    drawCompliance();
    drawPlan();
  }

  return {
    ver:"Retention and File Plan Dashboard",
    crumb:"Retention and File Plan",
    asof:"Data as of Mon 20 Jul 2026 23:59, refreshed Tue 21 Jul 06:00",
    summary:{
      dueNext12:DUE_TOTAL,
      due30:DUE_30,
      due90:DUE_90,
      withSchedule:WITH_SCHEDULE,
      get noSchedule(){return this.labelTotal-this.withSchedule;},
      beyondRetention:BEYOND_RETENTION,
      nextDue:NEXT_DUE,
      permanent:PERMANENT,
      labelTotal:LABEL_TOTAL,
      inactiveOverYear:INACTIVE_TOTAL,
      labels:LABELS.map(l=>({label:l.label,count:l.count})),
      totalTerms:TOTAL_TERMS,
      totalSets:TOTAL_SETS,
      maxDepth:MAX_DEPTH,
      categoryCount:CATS.length,
      categories:CATS.map(c=>({label:c.label,terms:c.terms,sets:c.sets}))
    },
    html,init
  };
})();

/* ===================================================================
   Bank-wide Oversight. Built to the client's own design of 13 Aug 2026:
   PPT s15 to s18 for the layout, s34 to s44 for the drill tables behind
   each top panel tile.

   This dashboard is intended to absorb the Overview and Records
   Management dashboards, per the client's comments on PPT s9 and s10.
   Both are left mounted until the client approves this one, so nothing
   is lost if they want to retreat.

   Every figure that also appears on another dashboard is read from that
   dashboard's summary rather than retyped, and asserted below.

   SOURCE MARKERS. A panel with no marker can be sourced from the 73
   column design as it stands. Otherwise:
     .src.part  partly sourceable, the marker says which half is not
     .src.dept  waiting only on the site to department list from RAC
     .src.none  no source identified anywhere, see the requirements
                workbook of 13 Aug 2026
   =================================================================== */
DASHBOARDS.bw=(function(){
  const RM=DASHBOARDS.rm.summary, RT=DASHBOARDS.rt.summary, SL=DASHBOARDS.sl.summary;

  /* Deterministic split of a total across n weighted slots. Same shape as the
     Records Management helper: the remainder lands on the first slot so the
     parts always total the whole exactly, never one out from rounding. */
  function split(total,weights){
    const s=weights.reduce((a,b)=>a+b,0);
    const out=weights.map(w=>Math.max(1,Math.round(total*w/s)));
    out[0]+=total-out.reduce((a,b)=>a+b,0);
    return out;
  }
  const GB=v=>v>=1024?(v/1024).toFixed(2)+" TB":v.toFixed(1)+" GB";
  const PCT=(a,b)=>b?(a/b*100):0;

  /* ===== departments =====
     Codes, names and the three declared-record measures come straight from
     Records Management. Sites, users and disposal are split across the same
     departments here, weighted by declared records, so every column totals the
     bank-wide figure it belongs to. */
  const BASE=RM.departments;
  const W=BASE.map(d=>d.rec);
  const siteSplit=split(SL.sitesCreated-180,W);          /* 180 project sites, below */
  const userSplit=split(RM.monthlyActiveUsers,W);
  const dueSplit=split(RT.dueNext12,BASE.map(d=>d.phys));

  const DEPTS=BASE.map((d,i)=>({
    code:d.code, name:d.name,
    sites:siteSplit[i], users:userSplit[i],
    docs:d.docs, rec:d.rec, phys:d.phys, due:dueSplit[i],
    /* Users declaring records is a subset of active users. Documents are
       created by more people than declare records, which is the point of the
       comparison panel on PPT s17. */
    declaring:Math.max(1,Math.round(userSplit[i]*0.34)),
    creating:Math.max(1,Math.round(userSplit[i]*0.71)),
    gb:+(d.docs/3400).toFixed(1)
  }));

  /* ===== project sites =====
     PPT s36 and s37. Nothing in the tenant classifies a site as a project site,
     let alone as sovereign or nonsovereign, so these two rows are layout only.
     They are kept visible because the client asked for the split three times
     (PPT s4, s15, s34) and hiding it would misrepresent the design. */
  const PROJECTS=[
    {code:"Sovereign projects",     sites:112, docs:186000, rec:2140, phys:305, due:44, users:640},
    {code:"Nonsovereign projects",  sites:68,  docs:74000,  rec:915,  phys:120, due:19, users:280},
  ];
  const PROJ_SITES=PROJECTS.reduce((a,p)=>a+p.sites,0);

  const DEPT_SITES=DEPTS.reduce((a,d)=>a+d.sites,0);
  const TOTAL_USERS=RM.monthlyActiveUsers;
  const TOTAL_DOCS=RM.documents;
  const TOTAL_REC=RM.declared;
  const TOTAL_PHYS=RM.withPhysical;
  const TOTAL_DUE=RT.dueNext12;
  const DECL_RATE=PCT(TOTAL_REC,TOTAL_DOCS);

  /* Site movement indicators, PPT s35. Created and inactive are sourceable:
     SiteCreatedDate is confirmed from Graph, LastActivityDate from the usage
     export. Deleted has a column that nothing populates yet. Archived has no
     definition at all, which is why it prints as a dash rather than a zero: a
     zero would be a claim, and we are not in a position to make it. */
  const IDLE_DAYS=90;
  const SITES_CREATED_90=64, SITES_DELETED_90=null, SITES_ARCHIVED_90=null;
  const SITES_INACTIVE=SL.inactiveSites;

  console.assert(DEPTS.reduce((a,d)=>a+d.rec,0)===TOTAL_REC,
    "Bank-wide department records must total Records Management declared records");
  console.assert(DEPTS.reduce((a,d)=>a+d.users,0)===TOTAL_USERS,
    "Bank-wide department users must total monthly active users");
  console.assert(DEPTS.reduce((a,d)=>a+d.due,0)===TOTAL_DUE,
    "Bank-wide department disposals must total the Retention due figure");
  console.assert(DEPT_SITES+PROJ_SITES===SL.sitesCreated,
    "Departmental sites plus project sites must total compliant sites created");

  /* ===== state ===== */
  let openKpi="users";          /* which drill table is showing */
  let sortDept="rec", dirDept="desc";
  let cmpMode="docsrec";
  let trendDept="all";

  /* ===== top panel, PPT s15 and s34 ===== */
  const TILES=[
    {k:null,   lab:"Active EDRMS Sites, Department / RM / Office", val:()=>F(DEPT_SITES),
     sub:"Compliance rule still to be confirmed. Office and RM are not separable yet"},
    {k:null,   lab:"Active EDRMS Sites, Sovereign Projects", val:()=>F(PROJECTS[0].sites),
     sub:"Layout only. Nothing classifies a site as a project site"},
    {k:null,   lab:"Active EDRMS Sites, Nonsovereign Projects", val:()=>F(PROJECTS[1].sites),
     sub:"Layout only. Nothing classifies a site as a project site"},
    {k:"users",lab:"Total EDRMS Users", val:()=>F(TOTAL_USERS), to:"users by department"},
    {k:"docs", lab:"Total Documents in EDRMS", val:()=>(TOTAL_DOCS/1e6).toFixed(2)+"M", to:"documents by department"},
    {k:"rec",  lab:"Total Records Declared", val:()=>F(TOTAL_REC), to:"records by department"},
    {k:"phys", lab:"Total Physical Counterparts", val:()=>F(TOTAL_PHYS), to:"counterparts by department"},
    {k:"disp", lab:"Total Records Due for Disposal", val:()=>F(TOTAL_DUE), to:"disposal by department"},
  ];

  function drawTiles(){
    document.getElementById("bw-kpis").innerHTML=TILES.map(t=>
      t.k
        ? `<div class="kpi ${t.k===openKpi?"on":""}" data-k="${t.k}"><div class="lab">${t.lab}</div>
             <div class="val">${t.val()}</div><div class="tap">&#9662; Click to open</div></div>`
        : `<div class="kpi stat"><div class="lab">${t.lab}</div><div class="val">${t.val()}</div>
             <div class="sub">${t.sub}</div></div>`).join("");
    document.querySelectorAll("#bw-kpis .kpi[data-k]").forEach(el=>{
      el.onclick=()=>{openKpi=el.dataset.k;drawTiles();drawDrill();};
    });
  }

  /* ===== the five drill tables, PPT s39 to s43 ===== */
  const DRILL={
    users:{
      title:"Total number of EDRMS users, by department",
      sub:"PPT s39. Active, never accessed and 90 day idle counts read one column, the user activity table's LastActivityDate, so they need no new source. The staff, contractor and consultant split and the training columns have no source in SharePoint at all: PPT s54 asks the same question of the client.",
      src:["none","Staff split and training: no source identified. Activity figures: waiting on the department list"],
      cols:["Department","Active users","Staff","Contractors","Consultants","Never accessed"],
      rows:()=>DEPTS.map(d=>{
        const staff=Math.round(d.users*0.62), con=Math.round(d.users*0.24);
        return [d.code+" - "+d.name, F(d.users), F(staff), F(con), F(d.users-staff-con),
                F(Math.round(d.users*0.11))];
      }),
      tiles:()=>[["Monthly active users",F(TOTAL_USERS)],
                 ["Never accessed EDRMS",F(Math.round(TOTAL_USERS*0.11))],
                 ["No access in 90 days",F(Math.round(TOTAL_USERS*0.19))],
                 ["Training completion",'no source']]
    },
    docs:{
      title:"Total number of documents in EDRMS, by department",
      sub:"PPT s40. Document counts and storage read FileCreatedDate and FileSize on the document table. Number of users creating documents is the one column here with no source: we hold who declared a record, not who authored an undeclared document.",
      src:["part","Users creating documents: needs the document scan to capture Author"],
      cols:["Department","Documents","Users creating","Storage","Share of documents"],
      rows:()=>DEPTS.map(d=>[d.code+" - "+d.name, F(d.docs), F(d.creating), GB(d.gb),
                             PCT(d.docs,TOTAL_DOCS).toFixed(1)+"%"]),
      tiles:()=>[["Documents held",(TOTAL_DOCS/1e6).toFixed(2)+"M"],
                 ["Storage consumed",GB(DEPTS.reduce((a,d)=>a+d.gb,0))],
                 ["Average monthly growth","2.4%"],
                 ["Departments reporting",F(DEPTS.length)]]
    },
    rec:{
      title:"Total number of records declared in EDRMS, by department",
      sub:"PPT s41. Every column here is sourceable once departments are known. The division columns the slide also asks for are not built: division was removed from the design on 10 August because nothing populates it, and that decision needs reopening with the client before it can return.",
      src:["dept","Waiting on the site to department list. Division tier not built, see question 3"],
      cols:["Department","Records declared","Users declaring","Declaration rate","Share of records"],
      rows:()=>DEPTS.map(d=>[d.code+" - "+d.name, F(d.rec), F(d.declaring),
                             PCT(d.rec,d.docs).toFixed(2)+"%", PCT(d.rec,TOTAL_REC).toFixed(1)+"%"]),
      tiles:()=>[["Records declared",F(TOTAL_REC)],
                 ["Bank-wide declaration rate",DECL_RATE.toFixed(2)+"%"],
                 ["Departments with zero declarations",F(DEPTS.filter(d=>d.rec===0).length)],
                 ["Users declaring",F(DEPTS.reduce((a,d)=>a+d.declaring,0))]]
    },
    phys:{
      title:"Total number of physical counterparts identified, by department",
      sub:"PPT s42. The count of records flagged as having a physical counterpart is sourceable today from HasPhysical, and appears on no current dashboard. The completion rate the slide also asks for compares this against records turned over to RAC, and nothing records a transfer.",
      src:["part","Counts: sourceable today. Completion rate against RAC turnover: no source"],
      cols:["Department","Physical counterparts","Records declared","Share with counterpart","Turned over to RAC"],
      rows:()=>DEPTS.map(d=>[d.code+" - "+d.name, F(d.phys), F(d.rec),
                             PCT(d.phys,d.rec).toFixed(1)+"%", "no source"]),
      tiles:()=>[["Physical counterparts",F(TOTAL_PHYS)],
                 ["Share of declared records",PCT(TOTAL_PHYS,TOTAL_REC).toFixed(1)+"%"],
                 ["Turned over to RAC","no source"],
                 ["Completion rate","no source"]]
    },
    disp:{
      title:"Total number of records due for disposal, by department",
      sub:"PPT s43. Records due, the next due date and the forward look are all computed from the due date already on the record. Approver and the three approval statuses need a new field in the EDRMS application, which is a development change request rather than a reporting one.",
      src:["part","Due dates: sourceable today. Approver and Approved / Declined / Extended: application change needed, see question 4"],
      cols:["Department","Records due","Next due date","With counterpart","Approver","Status"],
      rows:()=>DEPTS.map((d,i)=>[d.code+" - "+d.name, F(d.due),
                                 DUE_DATES[i%DUE_DATES.length],

    }
  };
  const DUE_DATES=["12 Sep 2026","28 Sep 2026","04 Oct 2026","19 Oct 2026","02 Nov 2026","23 Nov 2026",
                   "07 Dec 2026","21 Dec 2026","11 Jan 2027","25 Jan 2027","08 Feb 2027","22 Feb 2027",
                   "08 Mar 2027","22 Mar 2027","05 Apr 2027","19 Apr 2027"];

  function srcTag(kind,text){
    const word={dept:"Waiting on the department list",part:"Partly sourceable",none:"No source identified"}[kind];

  function drawDrill(){

           i?`<div class="num">${c}</div>`:`<div class="dn">${c}</div>`).join("")}</div>`).join("")}

  /* ===== overview of EDRMS sites, PPT s16 and s35 ===== */
  const DCOLS=[{k:"code",lab:"Department / Office / RM"},{k:"sites",lab:"Sites",num:1},

  function drawDeptTable(){
    const rows=[...DEPTS].sort((a,b)=>{

  /* ===== comparison, PPT s6 and s17 ===== */
  const CMP={
    userdoc:{a:"users",b:"docs",la:"Active users",lb:"Documents",ca:"var(--teal)",cb:"var(--blue)",

    userrec:{a:"users",b:"rec",la:"Active users",lb:"Records declared",ca:"var(--teal)",cb:"var(--green)",
             note:"Users against declarations. A wide gap here means people are in the system but are not declaring what they produce, which is a training and advocacy question rather than a rollout one."},
    docsrec:{a:"docs",b:"rec",la:"Documents",lb:"Records declared",ca:"var(--orange)",cb:"var(--green)",
             note:"Documents against declarations, which is the declaration rate seen department by department. This is the comparison the client called the useful one on PPT s6."}
  };
  function drawCmp(){

    document.getElementById("bw-cmp").innerHTML=rows.map(d=>`

        <div class="cbars">

  /* ===== declaration trend, PPT s10 and s18 ===== */
  function drawTrend(){

    document.getElementById("bw-trend-sum").textContent=
      (trendDept==="all"?"All departments":trendDept)+", "+F(vals.reduce((a,b)=>a+b,0))+

  /* ===== retention rollup, PPT s44 ===== */
  const RETROWS=[
    {lab:"Permanent retention", depts:11, libs:64, rec:RT.permanent, phys:Math.round(RT.permanent*0.21), due:0},
    {lab:"Temporary retention", depts:16, libs:203, rec:RT.labelTotal-RT.permanent,
     phys:TOTAL_PHYS-Math.round(RT.permanent*0.21), due:TOTAL_DUE},
  ];
  console.assert(RETROWS.reduce((a,r)=>a+r.rec,0)===RT.labelTotal,
    "Permanent plus temporary must total every labelled record");

  const html=`<section class="dash-bw">
    <div class="band">
      <h2>Bank-wide oversight</h2>
      <div class="bd">How EDRMS is performing across ADB: adoption, usage, compliance and trend, with every figure broken down by department, office or resident mission. Built to the client design of 13 August 2026, PPT s15 to s18 and s34 to s44. Each of the five interactive tiles opens the drill table the client specified for it.</div>
    </div>

    <div class="kpis" id="bw-kpis"></div>
    <div class="panel" id="bw-drill"></div>

    <div class="band">
      <h2>Overview of EDRMS sites</h2>
      <div class="bd">Every department, office and resident mission listed alphabetically by default, with the four measures the client asked for on PPT s16, and the two project groupings beneath. Click any column heading to sort, which answers the question asked on PPT s5.</div>
    </div>
    <div class="panel">
      <div class="ptitle">Sites, documents, records and counterparts by department</div>
      <div class="src dept">Waiting on the department list</div>
      <div class="psub">The measures are all sourceable. What is missing is the site to department mapping that assigns them, which RAC supply once. On PPT s16 the client asks that each department name be clickable through to that department's own dashboard: that arrives with Department Insights, so the names are plain text here rather than promising a click that does nothing.</div>
      <div class="tiles">
        <div class="tile"><div class="tl">Sites created, last ${IDLE_DAYS} days</div><div class="tv">${F(SITES_CREATED_90)}</div></div>
        <div class="tile hi"><div class="tl">Inactive over ${IDLE_DAYS} days</div><div class="tv">${F(SITES_INACTIVE)}</div></div>
        <div class="tile"><div class="tl">Sites deleted</div><div class="tv">no source</div></div>
        <div class="tile"><div class="tl">Sites archived</div><div class="tv">no definition</div></div>
      </div>
      <div class="scrollx"><div class="dtab" id="bw-depts"></div></div>
    </div>

    <div class="band">
      <h2>Comparison</h2>
      <div class="bd">The three comparisons the client named on PPT s17, replacing the earlier compare panel they described on PPT s6 as showing the obvious. Each one puts two measures side by side for every department, so the outlier is the point rather than the ranking.</div>
    </div>
    <div class="panel">
      <div class="ptitle">Compare departments</div>
      <div class="src dept">Waiting on the department list</div>
      <div class="psub" id="bw-cmp-note"></div>
      <div class="toolbar">
        <span class="lbl">Compare</span>
        <select id="bw-cmp-sel">
          <option value="docsrec">Documents against records declared</option>
          <option value="userdoc">Active users against documents</option>
          <option value="userrec">Active users against records declared</option>
        </select>
      </div>
      <div class="legend" id="bw-cmp-legend"></div>
      <div id="bw-cmp"></div>
    </div>

    <div class="band">
      <h2>Bank-wide record declaration trend</h2>
      <div class="bd">The trend the client asked to move here from Records Management on PPT s10, with the department cut they asked for at the same time. The default range is the last 12 closed months, which is the answer to the question they raised on that slide.</div>
    </div>
    <div class="panel">
      <div class="ptitle">Records declared over the last 12 months</div>

      <div class="psub">The bank-wide trend reads CreatedDate on the record and is sourceable today. The department cut below waits on the department list. The project cut the slide also asks for is not offered at all, because nothing classifies a project site.</div>
      <div class="toolbar">

    <div class="band">
      <h2>Retention and disposal rollup</h2>
      <div class="bd">The permanent against temporary summary the client placed on the bank-wide view, PPT s44. The full breakdown lives on the Retention dashboard, which this agrees with by construction.</div>
    </div>
    <div class="panel">
      <div class="ptitle">Permanent and temporary retention</div>
      <div class="src part">Partly sourceable</div>
      <div class="psub">The split, the record counts and the disposal due figures are sourceable today. Libraries provisioned per retention term needs a link from a term to a library that the design does not have. Records disposed needs a field the EDRMS application does not have.</div>
      <div class="scrollx"><div class="dtab" style="--dc:210px repeat(6,1fr)">
        <div class="dhead"><div>Retention</div><div class="num">Departments</div><div class="num">Libraries</div>
          <div class="num">Records declared</div><div class="num">Counterparts</div>
          <div class="num">Due for disposal</div><div class="num">Disposed</div></div>
        ${RETROWS.map(r=>`<div class="drow"><div class="dn">${r.lab}</div>
          <div class="num">${F(r.depts)}</div><div class="num">${F(r.libs)}</div>
          <div class="num">${F(r.rec)}</div><div class="num">${F(r.phys)}</div>
          <div class="num">${F(r.due)}</div><div class="num">no source</div></div>`).join("")}
        <div class="dtot"><div>Total</div>
          <div class="num">${F(DEPTS.length)}</div>
          <div class="num">${F(RETROWS.reduce((a,r)=>a+r.libs,0))}</div>
          <div class="num">${F(RT.labelTotal)}</div>
          <div class="num">${F(TOTAL_PHYS)}</div>
          <div class="num">${F(TOTAL_DUE)}</div>
          <div class="num">no source</div></div>
      </div></div>
    </div>
  </section>`;

  function init(){
    drawTiles();
    drawDrill();
    drawDeptTable();
    drawCmp();
    document.getElementById("bw-cmp-sel").onchange=e=>{cmpMode=e.target.value;drawCmp();};
    const sel=document.getElementById("bw-trend-sel");
    sel.innerHTML=`<option value="all">All departments</option>`+
      DEPTS.map(d=>`<option value="${d.code}">${d.code} - ${d.name}</option>`).join("");
    sel.onchange=e=>{trendDept=e.target.value;drawTrend();};
    document.getElementById("bw-trend-reset").onclick=()=>{
      trendDept="all";sel.value="all";drawTrend();
    };

  }

  return {
    ver:"Bank-wide Oversight Dashboard",
    crumb:"Bank-wide Oversight",
    asof:"Data as of Mon 20 Jul 2026 23:59, refreshed Tue 21 Jul 06:00",
    summary:{
      departmentalSites:DEPT_SITES,
      projectSites:PROJ_SITES,
      users:TOTAL_USERS,
      documents:TOTAL_DOCS,
      declared:TOTAL_REC,
      physical:TOTAL_PHYS,
      dueForDisposal:TOTAL_DUE,
      declarationRate:DECL_RATE,
      departmentCount:DEPTS.length,
      /* Read by Department Insights, which drills into one of these rows.
         Exposed rather than rebuilt so a department's totals are identical

/* ===================================================================
   Department Insights. Stage 2 of the client redesign of 13 Aug 2026.
   PPT s19 to s28 for the layout, s53 to s66 for the detail.

   Fourteen of the client's fifty-seven design slides describe this one
   screen, which makes it the largest single piece of the redesign. It
   was also the dashboard removed from the prototype on 10 August, so it
   is built here from nothing rather than restored.

   Every department total is read from Bank-wide Oversight, which reads
   Records Management, so a department shows the same figures whichever
   dashboard the reader arrives from. Within a department, sites and
   libraries are split from that total, so they always add back up to it.

   Source markers as introduced on Bank-wide, plus one more:
     .src.ref   not a measurement at all. A list somebody has to maintain
   =================================================================== */
DASHBOARDS.dp=(function(){
  const BW=DASHBOARDS.bw.summary, RM=DASHBOARDS.rm.summary;
  const DEPTS=BW.departments;
  const IDLE=BW.idleDays;

  function split(total,weights){
    const s=weights.reduce((a,b)=>a+b,0);
    const out=weights.map(w=>Math.max(1,Math.round(total*w/s)));
    out[0]+=total-out.reduce((a,b)=>a+b,0);
    if(out[0]<0)out[0]=0;
    return out;
  }
  const GB=v=>v>=1024?(v/1024).toFixed(2)+" TB":v.toFixed(1)+" GB";
  const PCT=(a,b)=>b?(a/b*100):0;

  /* ===== sites within a department =====
     A department's site count comes from Bank-wide. The names come from a
     fixed pool so they are stable between draws, and every measure is split
     from the department total, so the site rows always sum to the department
     header figures. */
  const STEMS=["Records","Operations","Programs","Country Planning","Governance","Knowledge",
               "Administration","Projects","Advisory","Portfolio","Reporting","Archive"];
  const OWNERS=["a.mendoza","r.tan","j.cruz","m.reyes","l.fernandez","p.santos","c.delacruz",
                "s.villanueva","d.ramos","k.aquino","n.bautista","g.ocampo"];

  const SITECACHE={};
  function sitesFor(code){
    if(SITECACHE[code])return SITECACHE[code];
    const d=DEPTS.find(x=>x.code===code);
    const n=Math.max(1,d.sites);
    const w=[];for(let i=0;i<n;i++)w.push(1+((i*7+code.length)%9)*0.28);
    const rec=split(d.rec,w), docs=split(d.docs,w), phys=split(d.phys,w),
          due=split(d.due,w), users=split(d.users,w);
    const rows=[];
    for(let i=0;i<n;i++){
      const stem=STEMS[i%STEMS.length];
      const suffix=i<STEMS.length?"":" "+(Math.floor(i/STEMS.length)+1);
      rows.push({
        name:`${code} ${stem}${suffix} Site`,
        owner:OWNERS[(i+code.length)%OWNERS.length]+"@adb.org",
        rec:rec[i], docs:docs[i], phys:phys[i], due:due[i], users:users[i],
        /* Days since last activity. The 90 day rule the client asks for on
           s55 is derived from this, never stored, so changing 90 to 120 is
           one edit rather than a reload. */
        idle:((i*13+code.length*5)%210)+1,
        gb:+(docs[i]/3400).toFixed(1)
      });
    }
    SITECACHE[code]=rows;
    return rows;
  }

  /* ===== libraries, grouped by file plan category =====
     PPT s61 to s66 gives one screen per category. The categories themselves
     are the client's, from PPT s47 to s52. They exist in neither the term
     store nor Purview, which is why the panel carries a marker: the grouping
     is the client's design, not something we can read from the tenant. */
  const CATS=["Institutional Management","Administration","People Management",
              "Programs and Operations","Other"];
  const LIBPOOL={
    "Institutional Management":["Annual Meetings","Board Papers","Executive Correspondence","Policies"],
    "Administration":["Budgeting","Facilities","Procurement","Travel"],
    "People Management":["Learning and Development","Recruitment","Staff Records"],
    "Programs and Operations":["Portfolio Management","Country Planning","Loan Agreements","Project Completion"],
    "Other":["Photos and Audiovisual","Legacy Content"]
  };
  const LIBCACHE={};
  function librariesFor(code){
    if(LIBCACHE[code])return LIBCACHE[code];
    const d=DEPTS.find(x=>x.code===code);
    const flat=[];
    CATS.forEach(c=>LIBPOOL[c].forEach(l=>flat.push({cat:c,lib:l})));
    const w=flat.map((f,i)=>1+((i*5+code.length)%7)*0.3);
    const rec=split(d.rec,w), docs=split(d.docs,w), phys=split(d.phys,w);
    flat.forEach((f,i)=>{f.rec=rec[i];f.docs=docs[i];f.phys=phys[i];
      f.idle=((i*17+code.length*3)%200)+1;});
    LIBCACHE[code]=flat;
    return flat;
  }

  /* ===== reference lists =====
     PPT s26, s28 and s53. None of these are measurements: they are lists
     somebody in the department maintains, and nothing in SharePoint or the
     database design can generate them. They are laid out here exactly as the
     client drew them so the question "who maintains this" has something
     concrete attached to it. */
  const CONVENTION={link:"Approved SharePoint site, library and folder convention",
                    approved:"14 Feb 2026", updated:"02 Jun 2026", version:"v2.1"};
  const PROGRAMME=[
    {lab:"CSIS-IR audit of EDRMS", date:"08 Aug 2026", status:"Done"},
    {lab:"Convention review",      date:"30 Sep 2026", status:"Due"},
    {lab:"Physical records review",date:"15 Oct 2026", status:"Due"},
    {lab:"Refresher training",     date:"20 Nov 2026", status:"Due"},
    {lab:"Focals CoP schedule",    date:"04 Dec 2026", status:"Due"},
  ];
  const GOLIVE={ITD:"12 Jan 2026",SARD:"02 Feb 2026",OSFG:"16 Feb 2026",FIN:"12 Jan 2026",
    PARD:"02 Mar 2026",HRD:"16 Mar 2026",SERD:"30 Mar 2026",EARD:"13 Apr 2026",
    OGC:"26 Jan 2026",CWRD:"27 Apr 2026",PSOD:"11 May 2026",BRM:"25 May 2026",
    SPD:"08 Jun 2026",SDCC:"22 Jun 2026",OAS:"06 Jul 2026",ERCD:"20 Jul 2026"};

  /* ===== state ===== */
  let dept=DEPTS[0].code;      /* the largest, so the panels open populated */
  let openKpi="users";
  let sitePage=1, sortSite="rec", dirSite="desc";
  let libPage=1;

  const D=()=>DEPTS.find(x=>x.code===dept);

  function pager(total,page,pages,noun){
    if(pages<=1)return `<div class="pager"><div class="pinfo">Showing ${F(total)} ${noun}</div></div>`;
    const win=[];for(let p=1;p<=pages;p++){if(p===1||p===pages||Math.abs(p-page)<=1)win.push(p);}
    let nums="",last=0;
    win.forEach(p=>{if(last&&p-last>1)nums+=`<span style="color:var(--mut)">…</span>`;
      nums+=`<button class="${p===page?'on':''}" data-pg="${p}">${p}</button>`;last=p;});
    const from=(page-1)*10+1,to=Math.min(total,page*10);
    return `<div class="pager"><div class="pinfo">Showing ${from} to ${to} of ${F(total)} ${noun}</div>
      <div class="pbtns"><button data-pg="prev" ${page===1?'disabled':''}>&lsaquo; Prev</button>${nums}
      <button data-pg="next" ${page===pages?'disabled':''}>Next &rsaquo;</button></div></div>`;
  }

  /* ===== top panel, PPT s19 and s53 ===== */
  function drawTiles(){
    const d=D(), sites=sitesFor(dept);
    const visitors=Math.round(d.users*1.9);
    const TILES=[
      {lab:"Sites Created", val:F(d.sites), stat:"Sourceable once departments are known"},
      {lab:"Total EDRMS Users", val:F(d.users), k:"users"},
      {lab:"Total Site Visitors", val:F(visitors), k:"visitors"},
      {lab:"Documents in EDRMS", val:F(d.docs), k:"docs"},
      {lab:"Records Declared", val:F(d.rec), k:"rec"},
      {lab:"Physical Counterparts", val:F(d.phys), stat:"HasPhysical, sourceable today"},
      {lab:"Records Due for Disposal", val:F(d.due), k:"disp"},
      {lab:"Sites Inactive over "+IDLE+" Days", val:F(sites.filter(s=>s.idle>IDLE).length),
       stat:"Derived from LastActivityDate, never stored"},
    ];
    document.getElementById("dp-kpis").innerHTML=TILES.map(t=>
      t.k
        ? `<div class="kpi ${t.k===openKpi?"on":""}" data-k="${t.k}"><div class="lab">${t.lab}</div>
             <div class="val">${t.val}</div><div class="tap">&#9662; Click to open</div></div>`
        : `<div class="kpi stat"><div class="lab">${t.lab}</div><div class="val">${t.val}</div>
             <div class="sub">${t.stat}</div></div>`).join("");
    document.querySelectorAll("#dp-kpis .kpi[data-k]").forEach(el=>{
      el.onclick=()=>{openKpi=el.dataset.k;drawTiles();drawDrill();};
    });
  }

  /* ===== the drill tables behind the tiles, PPT s21 to s23, s54 to s60 ===== */
  function drawDrill(){
    const d=D(), sites=sitesFor(dept);
    let title,src,sub,cols,rows,tiles;

    if(openKpi==="users"){
      title="Users, by site";
      src=["none","Staff, contractor and consultant split, training and onboarding: no source in SharePoint. PPT s54 asks the client the same question"];
      sub="Active user counts read the user activity table and are sourceable. Everything to the right of them is a people record, not a SharePoint one. The division tier the slide also asks for is not built, because division was removed from the design on 10 August and nothing populates it.";
      cols=["Site","Active users","Staff","Contractors","Consultants","Training complete"];
      rows=sites.map(s=>{const st=Math.round(s.users*0.62),c=Math.round(s.users*0.24);
        return [s.name,F(s.users),F(st),F(c),F(Math.max(0,s.users-st-c)),"no source"];});
      tiles=[["Active users",F(d.users)],["Share of staff","no source"],
             ["Never accessed",F(Math.round(d.users*0.11))],["Training completion","no source"]];
    }
    else if(openKpi==="visitors"){
      title="Site visitors";
      src=["none","Internal against external, and access requests granted or declined: no source. PPT s56 asks whether SharePoint or Cloud Governance holds this. Through the reporting APIs, neither does"];
      sub="A visitor count per site is available from Graph site analytics, in two windows only, seven days and all time. There is no thirty or ninety day window, and no split between internal and external visitors. Access requests are a permission workflow rather than a reporting feed.";
      cols=["Site","Visitors, all time","Visitors, 7 days","External","Requests granted","Requests declined"];
      rows=sites.map(s=>[s.name,F(Math.round(s.users*1.9)),F(Math.round(s.users*0.42)),
                         "no source","no source","no source"]);
      tiles=[["Visitors, all time",F(Math.round(d.users*1.9))],["Visitors, last 7 days",F(Math.round(d.users*0.42))],
             ["External visitors","no source"],["Access requests","no source"]];
    }
    else if(openKpi==="docs"){
      title="Documents in EDRMS, by site";
      src=["part","Documents and storage: sourceable. Users creating documents: needs the scan to capture Author"];
      sub="Document counts and storage read FileCreatedDate and FileSize. The migration columns on PPT s57 are not built: the client said on PPT s4 and again on PPT s11 that migration is not wanted on this report, so the two slides contradict each other and it is question 8 on the list back to them.";
      cols=["Site","Documents","Users creating","Storage","Share of department"];
      rows=sites.map(s=>[s.name,F(s.docs),F(Math.max(1,Math.round(s.users*0.71))),GB(s.gb),
                         PCT(s.docs,d.docs).toFixed(1)+"%"]);
      tiles=[["Documents held",F(d.docs)],["Storage consumed",GB(d.gb)],
             ["Sites holding documents",F(sites.length)],["Migrated documents","not built, see question 8"]];
    }
    else if(openKpi==="rec"){
      title="Record declaration, by site";
      src=["dept","Waiting on the department list. Division tier not built, see question 3"];
      sub="Records declared, users declaring and the declaration rate per site are all sourceable once departments are known. PPT s58 asks for collapsible division rows beneath each site, which is the division decision again.";
      cols=["Site","Records declared","Users declaring","Declaration rate","No declaration in "+IDLE+" days"];
      rows=sites.map(s=>[s.name,F(s.rec),F(Math.max(1,Math.round(s.users*0.34))),
                         PCT(s.rec,s.docs).toFixed(2)+"%", s.idle>IDLE?"yes":"no"]);
      tiles=[["Records declared",F(d.rec)],["Declaration rate",PCT(d.rec,d.docs).toFixed(2)+"%"],
             ["Users declaring",F(d.declaring)],
             ["Sites with no declaration in "+IDLE+" days",F(sites.filter(s=>s.idle>IDLE).length)]];
    }
    else{
      title="Disposal, by library";
      src=["part","Due dates: sourceable today. Approver, the three statuses and records disposed: application change needed, see question 4"];
      sub="Records due and the next due date are computed from the due date already on the record. The approver and the Approved, Declined and Extended statuses need a field the EDRMS application does not have, which is a development change request rather than a reporting one.";
      cols=["Library","Records due","Next due date","With counterpart","Approver","Status"];
      const libs=librariesFor(dept), dues=split(d.due,libs.map(l=>Math.max(1,l.phys)));
      rows=libs.map((l,i)=>[l.lib,F(dues[i]),DUE_DATES[i%DUE_DATES.length],
                            F(Math.round(dues[i]*0.31)),"no source","no source"]);
      tiles=[["Records due, next 12 months",F(d.due)],["Next due date",DUE_DATES[0]],
             ["Records disposed","no source"],["Disposal backlog","no source"]];
    }

    const word={dept:"Waiting on the department list",part:"Partly sourceable",
                none:"No source identified",ref:"Maintained list, not a measurement"}[src[0]];
    document.getElementById("dp-drill").innerHTML=
      `<div class="ptitle">${title}</div>
       <div class="src ${src[0]}">${word}</div><div class="psub">${src[1]}</div>
       <div class="psub">${sub}</div>
       <div class="tiles">${tiles.map(([l,v])=>
         `<div class="tile"><div class="tl">${l}</div><div class="tv">${v}</div></div>`).join("")}</div>
       <div class="scrollx"><div class="dtab" style="--dc:230px repeat(${cols.length-1},1fr)">
         <div class="dhead">${cols.map((c,i)=>`<div class="${i?"num":""}">${c}</div>`).join("")}</div>
         ${rows.slice(0,10).map(r=>`<div class="drow">${r.map((c,i)=>
           i?`<div class="num">${c}</div>`:`<div class="dn">${c}</div>`).join("")}</div>`).join("")}
       </div></div>
       ${rows.length>10?`<div class="psub" style="margin-top:10px">Showing the first 10 of ${F(rows.length)} rows. The full list is on the panel below.</div>`:""}`;
  }
  const DUE_DATES=["12 Sep 2026","28 Sep 2026","04 Oct 2026","19 Oct 2026","02 Nov 2026","23 Nov 2026",
                   "07 Dec 2026","21 Dec 2026","11 Jan 2027","25 Jan 2027","08 Feb 2027","22 Feb 2027",
                   "08 Mar 2027","22 Mar 2027","05 Apr 2027","19 Apr 2027"];

  /* ===== sites list, PPT s20 and s55 ===== */
  const SCOLS=[{k:"name",lab:"Site"},{k:"owner",lab:"Site owner"},{k:"docs",lab:"Documents",num:1},
               {k:"rec",lab:"Records",num:1},{k:"phys",lab:"Counterparts",num:1},{k:"due",lab:"Due",num:1}];
  function drawSites(){
    const d=D();
    const all=[...sitesFor(dept)].sort((a,b)=>{
      const k=sortSite, cmp=(k==="name"||k==="owner")?String(a[k]).localeCompare(String(b[k])):a[k]-b[k];
      return dirSite==="asc"?cmp:-cmp;
    });
    const pages=Math.max(1,Math.ceil(all.length/10));
    if(sitePage>pages)sitePage=pages;
    const view=all.slice((sitePage-1)*10,sitePage*10);
    let h=`<div class="dhead">`+SCOLS.map(c=>
      `<div class="hd${c.num?" num":""}${sortSite===c.k?" on":""}" data-s="${c.k}">${c.lab}${
        sortSite===c.k?(dirSite==="asc"?" ↑":" ↓"):""}</div>`).join("")+`</div>`;
    h+=view.map(s=>`<div class="drow">
      <div class="dn">${s.name}<small>${s.idle>IDLE?"No activity for "+s.idle+" days":"Active, last activity "+s.idle+" days ago"}</small></div>
      <div class="num">${s.owner}</div><div class="num">${F(s.docs)}</div>
      <div class="num">${F(s.rec)}</div><div class="num">${F(s.phys)}</div>
      <div class="num">${F(s.due)}</div></div>`).join("");
    h+=`<div class="dtot"><div>Department total</div><div class="num">${F(all.length)} sites</div>
      <div class="num">${F(d.docs)}</div><div class="num">${F(d.rec)}</div>
      <div class="num">${F(d.phys)}</div><div class="num">${F(d.due)}</div></div>`;
    document.getElementById("dp-sites").innerHTML=h;
    document.getElementById("dp-sites-pager").innerHTML=pager(all.length,sitePage,pages,"sites");
    document.querySelectorAll("#dp-sites .hd").forEach(el=>el.onclick=()=>{
      const k=el.dataset.s;
      if(sortSite===k)dirSite=dirSite==="asc"?"desc":"asc";
      else{sortSite=k;dirSite=(k==="name"||k==="owner")?"asc":"desc";}
      sitePage=1;drawSites();
    });
    wirePager("#dp-sites-pager",v=>{
      sitePage=v==="prev"?Math.max(1,sitePage-1):v==="next"?Math.min(pages,sitePage+1):+v;
      drawSites();
    });
  }

  /* ===== library usage, PPT s25 and s61 to s66 ===== */
  function drawLibs(){
    const d=D(), libs=librariesFor(dept);
    const pages=Math.max(1,Math.ceil(libs.length/10));
    if(libPage>pages)libPage=pages;
    const view=libs.slice((libPage-1)*10,libPage*10);
    let h=`<div class="dhead"><div>Library</div><div class="num">Users</div>
      <div class="num">Documents</div><div class="num">Records declared</div>
      <div class="num">Counterparts</div><div class="num">Idle days</div></div>`;
    let cat="";
    view.forEach(l=>{
      if(l.cat!==cat){cat=l.cat;h+=`<div class="drow cat"><div class="dn">${cat}</div>
        <div></div><div></div><div></div><div></div><div></div></div>`;}
      h+=`<div class="drow"><div class="dn">${l.lib}<small>${dept}</small></div>
        <div class="num">no source</div><div class="num">${F(l.docs)}</div>
        <div class="num">${F(l.rec)}</div><div class="num">${F(l.phys)}</div>
        <div class="num">${l.idle}</div></div>`;
    });
    h+=`<div class="dtot"><div>Department total</div><div class="num">no source</div>
      <div class="num">${F(d.docs)}</div><div class="num">${F(d.rec)}</div>
      <div class="num">${F(d.phys)}</div><div class="num"></div></div>`;
    document.getElementById("dp-libs").innerHTML=h;
    document.getElementById("dp-libs-pager").innerHTML=pager(libs.length,libPage,pages,"libraries");
    wirePager("#dp-libs-pager",v=>{
      libPage=v==="prev"?Math.max(1,libPage-1):v==="next"?Math.min(pages,libPage+1):+v;
      drawLibs();
    });
  }

  /* ===== declaration trend for one department, PPT s24 ===== */
  function drawTrend(){
    const d=D(), share=d.rec/RM.declared;
    const vals=RM.monthValues.map(v=>Math.round(v*share));
    const mx=Math.max(...vals,1);
    document.getElementById("dp-trend").innerHTML=RM.monthLabels.map((m,i)=>`
      <div class="tcol"><div class="tval">${F(vals[i])}</div>
        <div class="tbar" style="height:${Math.max(2,100*vals[i]/mx)}%"></div>
        <div class="tlab">${m}</div></div>`).join("");
    document.getElementById("dp-trend-sum").textContent=
      d.code+", "+F(vals.reduce((a,b)=>a+b,0))+" records declared over the last 12 months";
  }

  function drawAll(){
    const d=D();
    document.getElementById("dp-golive").innerHTML=
      `Go-live date <b>${GOLIVE[d.code]||"not recorded"}</b>`;
    document.getElementById("dp-name").textContent=d.code+" - "+d.name;
    sitePage=1;libPage=1;
    drawTiles();drawDrill();drawSites();drawLibs();drawTrend();
  }

  const html=`<section class="dash-dp">
    <div class="band">
      <h2>Department insights</h2>
      <div class="bd">How one department, office or resident mission is managing its records: its sites, its people, its declaration performance, its libraries and its disposal readiness. Built to the client design of 13 August 2026, PPT s19 to s28 and s53 to s66. Choose a department below; every panel on the page follows it.</div>
    </div>

    <div class="picker">
      <span class="lbl">Department, office or resident mission</span>
      <select id="dp-sel"></select>
      <span class="golive" id="dp-golive"></span>
    </div>

    <div class="kpis" id="dp-kpis"></div>
    <div class="panel" id="dp-drill"></div>

    <div class="band">
      <h2>EDRMS sites</h2>
      <div class="bd">Every site the department owns, with the owner to contact about it, and the four measures the client asked for on PPT s20. Sites with no activity for ${IDLE} days are called out on the row itself, which is the indicator asked for on PPT s55.</div>
    </div>
    <div class="panel">
      <div class="ptitle">Sites owned by <span id="dp-name"></span></div>
      <div class="src dept">Waiting on the department list</div>
      <div class="psub">Site names, owners and every measure here are sourceable. The site owner is confirmed present on 1,899 of the 1,918 live sites in the test tenant, so a small number of rows will show no owner at all, and those are the ones worth chasing. Click any column heading to sort.</div>
      <div class="scrollx"><div class="dtab" id="dp-sites"></div></div>
      <div id="dp-sites-pager"></div>
    </div>

    <div class="band">
      <h2>Library usage</h2>
      <div class="bd">The department's libraries grouped by institutional file plan category, which is the shape the client gave on PPT s61 to s66, one screen per category.</div>
    </div>
    <div class="panel">
      <div class="ptitle">Libraries by file plan category</div>
      <div class="src none">No source identified</div>
      <div class="psub">Two separate blockers sit on this panel. The file plan categories are the client's own and exist in neither the term store nor Purview, so the grouping cannot be read from the tenant, and there is no link anywhere from a term to a library. Number of users per library, asked for on PPT s25, is not available at all: SharePoint reports viewers per site and never per library. Document and record counts per library are sourceable today.</div>
      <div class="scrollx"><div class="dtab" id="dp-libs"></div></div>
      <div id="dp-libs-pager"></div>
    </div>

    <div class="band">
      <h2>Record declaration trend</h2>
      <div class="bd">The same trend as the bank-wide view, scoped to this department, which is what PPT s24 asks for.</div>
    </div>
    <div class="panel">
      <div class="ptitle">Records declared over the last 12 months</div>
      <div class="src dept">Waiting on the department list</div>
      <div class="psub">The measure reads CreatedDate on the record and is sourceable today. Attributing it to a department is what waits on the list from RAC.</div>
      <div class="trend" id="dp-trend"></div>
      <div class="psub" style="margin-top:12px" id="dp-trend-sum"></div>
    </div>

    <div class="band">
      <h2>Conventions and programme dates</h2>
      <div class="bd">PPT s26 and s28. Neither of these is a measurement. They are lists somebody in the department maintains, laid out here as the client drew them so that the question of who maintains them has something concrete attached to it.</div>
    </div>
    <div class="panel">
      <div class="ptitle">Approved convention</div>
      <div class="src ref">Maintained list, not a measurement</div>
      <div class="psub">Nothing in SharePoint or in the database design can generate a convention document, its approval date or its version number. This is question 5 on the list back to the client.</div>
      <div class="reflist">
        <div class="refrow"><b>${CONVENTION.link}</b><div class="rv">Approved ${CONVENTION.approved}</div><div class="rs">${CONVENTION.version}</div></div>
        <div class="refrow"><b>Last updated</b><div class="rv">${CONVENTION.updated}</div><div class="rs"></div></div>
      </div>
    </div>
    <div class="panel">
      <div class="ptitle">Records management programme dates</div>
      <div class="src ref">Maintained list, not a measurement</div>
      <div class="psub">The five dates the client listed on PPT s28, each with the status shown on PPT s53. Same conclusion as the convention above: somebody has to keep this, and nobody has been named.</div>
      <div class="reflist">
        ${PROGRAMME.map(p=>`<div class="refrow"><b>${p.lab}</b><div class="rv">${p.date}</div>
          <div class="rs ${p.status==="Done"?"done":"due"}">${p.status}</div></div>`).join("")}
      </div>
    </div>
  </section>`;

  function init(){
    const sel=document.getElementById("dp-sel");
    sel.innerHTML=DEPTS.map(d=>
      `<option value="${d.code}" ${d.code===dept?"selected":""}>${d.code} - ${d.name}</option>`).join("");
    sel.onchange=e=>{dept=e.target.value;drawAll();};
    drawAll();
  }

  return {
    ver:"Department Insights Dashboard",
    crumb:"Department Insights",
    asof:"Data as of Mon 20 Jul 2026 23:59, refreshed Tue 21 Jul 06:00",
    summary:{
      departmentCount:DEPTS.length,
      categories:CATS.length,
      programmeDates:PROGRAMME.length
    },
    html,init
  };
})();


/* =================================================================
   app.js
   ================================================================= */
/* ===================================================================
   Shell: left nav switches which dashboard is mounted. Only one
   dashboard is in the DOM at a time, which is why both can keep their
   original element ids untouched.
   =================================================================== */
function switchTo(key){
  const d=DASHBOARDS[key];
  if(!d)return;
  document.getElementById("view").innerHTML=d.html;
  document.getElementById("side-ver").textContent=d.ver;
  document.getElementById("crumb-b").textContent=d.crumb;
  document.getElementById("asof").textContent=d.asof;
  document.querySelectorAll("#nav a[data-d]").forEach(a=>a.classList.toggle("on",a.dataset.d===key));
  d.init();
}
document.querySelectorAll("#nav a[data-d]").forEach(a=>a.onclick=()=>switchTo(a.dataset.d));
switchTo("ov");
</script>
</body></html>
