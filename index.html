<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EDRMS Reporting Suite</title>
<!-- Inline favicon, so a served copy does not 404 on /favicon.ico. A data URI
     keeps it a zero request asset and avoids a binary file in the repo. -->
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%230E1F35'/><rect x='7' y='17' width='4' height='8' fill='%239DB8D2'/><rect x='14' y='12' width='4' height='13' fill='%2300A5A8'/><rect x='21' y='7' width='4' height='18' fill='%230072BC'/></svg>">
<!-- Shared shell first, then one stylesheet per dashboard. -->
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="sites-and-libraries.css">
<link rel="stylesheet" href="records-management.css">
<link rel="stylesheet" href="format-and-storage.css">
</head>
<body>
<aside id="side">
  <div class="brand"><div class="t1">EDRMS Utilization Report</div><div class="t2">Asian Development Bank</div><div class="ver" id="side-ver"></div></div>
  <nav id="nav">
    <div class="grp">Executive</div><a class="dis"><span class="ic">◈</span>Overview</a>
    <div class="grp">Operations</div>
    <a data-d="rm"><span class="ic">▤</span>Records Management</a>
    <a class="dis"><span class="ic">▦</span>Department Performance</a>
    <a data-d="sl"><span class="ic">⚑</span>Sites &amp; Libraries</a>
    <a data-d="fs"><span class="ic">◫</span>Format &amp; Storage</a>
    <a class="dis"><span class="ic">⏳</span>Retention</a>
  </nav>
</aside>
<div id="main">
  <header>
    <div class="crumb">EDRMS Reporting Suite<b id="crumb-b"></b></div>
    <div class="spacer"></div>
    <span id="asof"></span>
  </header>
  <div id="view"></div>
</div>

<!-- Load order matters in two places. core.js creates the DASHBOARDS registry,
     so it runs first. format-and-storage asserts its file total against
     records-management, so it runs after it. app.js wires the nav and mounts
     the first dashboard, so it runs last.
     These are classic scripts, not modules, which is deliberate: it keeps
     index.html working when opened directly from disk as well as over http. -->
<script src="core.js"></script>
<script src="sites-and-libraries.js"></script>
<script src="records-management.js"></script>
<script src="format-and-storage.js"></script>
<script src="app.js"></script>
</body></html>
