/* ===================================================================
   Department Insights. Stage 2 of the client redesign of 13 Aug 2026.
   PPT s19 to s28 for the layout, s53 to s66 for the detail.

   Fourteen of the client's fifty-seven design slides describe this one
   screen, which makes it the largest single piece of the redesign. It
   was also the dashboard removed from the prototype on 10 August, so it
   is built here from nothing rather than restored.

   Every department total is read from Bank-wide Oversight, which reads
   Records Management, so a department shows the same figures whichever
   dashboard the reader arrives from. Within a department, sites and
   libraries are split from that total, so they always add back up to it.

   Source markers as introduced on Bank-wide, plus one more:
     .src.ref   not a measurement at all. A list somebody has to maintain
   =================================================================== */
DASHBOARDS.dp=(function(){
  const BW=DASHBOARDS.bw.summary;
  const DEPTS=BW.departments;
  const IDLE=BW.idleDays;

  const split=splitTotal;
  const GB=v=>v>=1024?(v/1024).toFixed(2)+" TB":v.toFixed(1)+" GB";
  const PCT=(a,b)=>b?(a/b*100):0;

  /* ===== sites within a department =====
     A department's site count comes from Bank-wide. The names come from a
     fixed pool so they are stable between draws, and every measure is split
     from the department total, so the site rows always sum to the department
     header figures. */
  const STEMS=["Records","Operations","Programs","Country Planning","Governance","Knowledge",
               "Administration","Projects","Advisory","Portfolio","Reporting","Archive"];
  const OWNERS=["a.mendoza","r.tan","j.cruz","m.reyes","l.fernandez","p.santos","c.delacruz",
                "s.villanueva","d.ramos","k.aquino","n.bautista","g.ocampo"];

  const SITECACHE={};
  function sitesFor(code){
    if(SITECACHE[code])return SITECACHE[code];
    /* The aggregate is the real units' sites concatenated, never a fresh
       draw. Drawing 1,057 sites from the bank-wide totals would produce a
       list that does not match any department's own, so the same site would
       hold different figures depending on which filter you came through. */
    if(code===ALLCODE){
      const all=DEPTS.reduce((a,d)=>a.concat(sitesFor(d.code)),[]);
      console.assert(all.length===ALL.sites,
        "The All units site list must hold every site the units report");
      console.assert(all.reduce((a,r)=>a+r.rec,0)===ALL.rec,
        "The All units site list must total every declared record");
      SITECACHE[code]=all;
      return all;
    }
    const d=DEPTS.find(x=>x.code===code);
    const n=Math.max(1,d.sites);
    /* One weight vector per measure, and a seed that varies by department so
       two departments do not draw the same shape.

       This carried the same defect the library table did until 17 August: a
       single vector split records, documents, counterparts, disposals and
       users alike, so every ratio between them was constant down the whole
       site list. ITD's declaration rate read 0.41% on all 104 of its sites.
       The old weights were also periodic, ((i*7+n)%9), giving only nine
       distinct values across 104 sites, so a sorted page of ten showed ten
       identical rows. Both faults are guarded by check_constants.js. */
    const s=code.length*7;
    const rec=split(d.rec,      weights(n,s+11)),
          docs=split(d.docs,    weights(n,s+12)),
          phys=split(d.phys,    weights(n,s+13)),
          due=split(d.due,      weights(n,s+14)),
          users=split(d.users,  weights(n,s+15)),
          vis=split(d.visitors, weights(n,s+16)),    /* from T2.UniqueViewersAllTime sum per dept */
          views=split(d.views,  weights(n,s+17)),    /* from T2.SiteVisits7 sum per dept */
          gb=split(Math.round(d.gb*10),weights(n,s+18));
    /* People declaring and people creating are DISTINCT COUNTS, and distinct
       counts DO NOT SUM. This was got wrong until 17 August and it put an
       impossible row on screen.

       The mistake was splitting the department's declarer count across its
       sites, as if each person belonged to exactly one. ITD has 128 sites and
       109 people who declared a record, so the split ran out and left sites
       showing 23 declared records and ZERO people who declared them. A record
       cannot exist without somebody having declared it.

       One person declaring in three sites is ONE at department level and
       THREE at site level, so the site column legitimately sums to MORE than
       the department figure, and forcing it to reconcile is what created the
       impossible rows. The department tile stays the distinct count, the site
       rows are counted per site, and the two are NOT asserted to be equal.
       What is asserted is the relationship that does hold: no site may report
       more declarers than it has users, or more than it has records, and the
       department figure can be no larger than the sum of its sites. */
    const perSite=(cap,things,seed)=>{
      const w=weights(n,seed);
      return w.map((x,i)=>{
        const ceiling=Math.max(0,Math.min(cap[i],things[i]));
        if(ceiling===0)return 0;              /* nothing here, nobody did it */
        return Math.max(1,Math.min(ceiling,Math.round(ceiling*(0.25+x*0.45))));
      });
    };
    const creating=perSite(users,docs,s+19),
          declaring=perSite(creating,rec,s+20);
    const rows=[];
    for(let i=0;i<n;i++){
      const stem=STEMS[i%STEMS.length];
      const suffix=i<STEMS.length?"":" "+(Math.floor(i/STEMS.length)+1);
      rows.push({
        name:`${code} ${stem}${suffix} Site`,
        owner:OWNERS[(i+code.length)%OWNERS.length]+"@adb.org",
        rec:rec[i], docs:docs[i], phys:phys[i], due:due[i], users:users[i],
        visitors:vis[i], views:views[i],
        creating:creating[i], declaring:declaring[i],
        /* Days since last activity. The 90 day rule the client asks for on
           s55 is derived from this, never stored, so changing 90 to 120 is
           one edit rather than a reload. */
        idle:((i*13+code.length*5)%210)+1,
        gb:+(gb[i]/10).toFixed(1),
        /* M365 usage metrics from SharePoint Site Usage Report */
        pageViewCount:Math.max(0,Math.round(views[i]*1.3+Math.random()*50)),
        visitedPageCount:Math.max(1,Math.round(views[i]*0.6+Math.random()*20)),
        /* EDRMS Site Type from Cloud Governance */
        ermsType:["EDRMS Project Site","EDRMS Traditional Site"][i%2],
        /* Disposal urgency buckets - derived from due records count */
        dueIn3Months:Math.max(0,Math.round(due[i]*0.33)),
        dueIn6Months:Math.max(0,Math.round(due[i]*0.50)),
        dueIn12Months:due[i]
      });
    }
    /* Every site measure adds back up to its department. Asserted here rather
       than trusted, because these are now eight separate splits instead of
       one, and eight chances to lose a unit. */
    console.assert(rows.reduce((a,r)=>a+r.rec,0)===d.rec&&
                   rows.reduce((a,r)=>a+r.docs,0)===d.docs&&
                   rows.reduce((a,r)=>a+r.phys,0)===d.phys&&
                   rows.reduce((a,r)=>a+r.due,0)===d.due&&
                   rows.reduce((a,r)=>a+r.users,0)===d.users&&
                   rows.reduce((a,r)=>a+r.visitors,0)===d.visitors&&
                   rows.reduce((a,r)=>a+r.views,0)===d.views,
      `Every site measure must total the ${code} department figure it came from`);
    /* The people columns are distinct counts and are deliberately NOT in the
       assertion above. What must hold instead: */
    console.assert(rows.every(r=>r.rec===0||r.declaring>=1),
      `Every ${code} site holding records must show at least one person who declared them`);
    console.assert(rows.every(r=>r.docs===0||r.creating>=1),
      `Every ${code} site holding documents must show at least one person who created them`);
    console.assert(rows.every(r=>r.declaring<=r.creating&&r.creating<=r.users),
      `No ${code} site may report more declarers than creators, or more people than users`);
    console.assert(rows.every(r=>r.declaring<=r.rec),
      `No ${code} site may report more people declaring than records declared`);
    console.assert(rows.reduce((a,r)=>a+r.declaring,0)>=d.declaring,
      `${code} site declarers must sum to at least the department's distinct count, `+
      `since one person declaring in three sites counts once here and three times there`);
    SITECACHE[code]=rows;
    return rows;
  }

  /* ===== libraries, grouped by file plan category =====
     PPT s61 to s66 gives one screen per category. The categories themselves
     are the client's, from PPT s47 to s52. They exist in neither the term
     store nor Purview, which is why the panel carries a marker: the grouping
     is the client's design, not something we can read from the tenant. */
  const CATS=["Institutional Management","Administration","People Management",
              "Programs and Operations","Other"];
  const LIBPOOL={
    "Institutional Management":["Annual Meetings","Board Papers","Executive Correspondence","Policies"],
    "Administration":["Budgeting","Facilities","Procurement","Travel"],
    "People Management":["Learning and Development","Recruitment","Staff Records"],
    "Programs and Operations":["Portfolio Management","Country Planning","Loan Agreements","Project Completion"],
    "Other":["Photos and Audiovisual","Legacy Content"]
  };
  const LIBCACHE={};
  function librariesFor(code){
    if(LIBCACHE[code])return LIBCACHE[code];
    /* For the aggregate, one row per file plan library with every unit's
       figures folded into it, so the category totals still reconcile. */
    if(code===ALLCODE){
      const merged=[];
      DEPTS.forEach(d=>librariesFor(d.code).forEach((f,i)=>{
        if(!merged[i])merged[i]={cat:f.cat,lib:f.lib,rec:0,docs:0,phys:0,idle:f.idle};
        merged[i].rec+=f.rec; merged[i].docs+=f.docs; merged[i].phys+=f.phys;
      }));
      console.assert(merged.reduce((a,f)=>a+f.rec,0)===ALL.rec,
        "The All units library list must total every declared record");
      LIBCACHE[code]=merged;
      return merged;
    }
    const d=DEPTS.find(x=>x.code===code);
    const flat=[];
    CATS.forEach(c=>LIBPOOL[c].forEach(l=>flat.push({cat:c,lib:l})));
    /* Records, documents and counterparts get INDEPENDENT weights. Splitting
       all three by one weight makes every derived ratio constant down the
       table: rec[i]/docs[i] collapses to d.rec/d.docs on every row, so a
       declaration rate column would read the same figure for every library
       whatever the data. That is the same tautology the division tier had, and
       check_division.js now fails on it. In real data these three vary
       independently, so the demo data has to as well or the screen teaches the
       reader something false. */
    const w    =flat.map((f,i)=>1+((i*5+code.length)%7)*0.3);
    const wRec =flat.map((f,i)=>1+((i*3+code.length*2)%5)*0.5);
    const wPhys=flat.map((f,i)=>1+((i*7+code.length)%4)*0.6);
    const rec=split(d.rec,wRec), docs=split(d.docs,w), phys=split(d.phys,wPhys);
    flat.forEach((f,i)=>{f.rec=rec[i];f.docs=docs[i];f.phys=phys[i];
      f.idle=((i*17+code.length*3)%200)+1;});
    LIBCACHE[code]=flat;
    return flat;
  }

  /* ===== reference lists =====
     PPT s26, s28 and s53. None of these are measurements: they are lists
     somebody in the department maintains, and nothing in SharePoint or the
     database design can generate them. They are laid out here exactly as the
     client drew them so the question "who maintains this" has something
     concrete attached to it. */
  const GOLIVE={ITD:"12 Jan 2026",SARD:"02 Feb 2026",OSFG:"16 Feb 2026",FIN:"12 Jan 2026",
    PARD:"02 Mar 2026",HRD:"16 Mar 2026",SERD:"30 Mar 2026",EARD:"13 Apr 2026",
    OGC:"26 Jan 2026",CWRD:"27 Apr 2026",PSOD:"11 May 2026",BRM:"25 May 2026",
    SPD:"08 Jun 2026",SDCC:"22 Jun 2026",OAS:"06 Jul 2026",ERCD:"20 Jul 2026"};

  /* ===== visitor date range filter =====
     Demo data for different date windows and monthly/yearly snapshots.
     Based on M365 SharePoint usage report windows and Microsoft Graph Analytics.

     DATABASE MAPPING:
     - 7 days:   SUM(T2.SiteVisits7) - current week unique visitors
     - 30 days:  SUM(T2.SiteVisits30) - last month active visitors
     - 90 days:  SUM(T2.SiteVisits90) - quarterly active visitors
     - 180 days: SUM(T2.SiteVisits180) - half-year active visitors (M365 max window)
     - monthly:  SUM(T2.SiteVisits30) for snapshot date matching that month
     - yearly:   SUM(T2.UniqueViewersAllTime) for all activity through end of year
  */
  const VISITORS_WINDOWS={
    "7days":2100,       /* ~12% of current: very active users this week */
    "30days":7540,      /* ~44% of current: active last month */
    "90days":13100,     /* ~76% of current: active last quarter */
    "180days":15800     /* ~92% of current: active in past 6 months */
  };

  /* Monthly visitor snapshots (one snapshot per month, rolling 12 months) */
  const VISITORS_BY_MONTH={
    "2025-08":1850,  "2025-09":2100,  "2025-10":1920,  "2025-11":2340,  "2025-12":2560,
    "2026-01":2780,  "2026-02":3120,  "2026-03":3450,  "2026-04":3890,  "2026-05":4560,
    "2026-06":5120,  "2026-07":7540   /* Jul 2026 is current month */
  };

  /* Yearly visitor snapshots (YTD through end of each year) */
  const VISITORS_BY_YEAR={
    "2023":3200,   /* Full year 2023 */
    "2024":7840,   /* Full year 2024 */
    "2025":14200,  /* Full year 2025 */
    "2026":7540    /* 2026 YTD (Jan-Jul) */
  };

  /* ===== state ===== */
  let dept=DEPTS[0].code;      /* the largest, so the panels open populated */
  let openKpi="sites";         /* tile 1 on s53 */
  let sitePage=1, sortSite="rec", dirSite="desc";
  let visitorPage=1, sortVisitor="name", dirVisitor="asc";
  let docsPage=1, sortDocs="name", dirDocs="asc";
  let recPage=1, sortRec="name", dirRec="asc";
  let physPage=1, sortPhys="name", dirPhys="asc";
  let disposalPage=1, sortDisp="name", dirDisp="asc";
  let libsPage=1, sortLibs="name", dirLibs="asc";
  let libCat=CATS[0];
  let visitorFilter="7days";   /* Default to last 7 days */
  let visitorFilterType="window"; /* window, month, or year */
  let visitorFilterMode="quick"; /* quick or custom - which UI mode is active */
  let visitorMonth="2026-07";  /* Default to Jul 2026 */
  let visitorYear="2026";      /* Default to 2026 */

  /* Get the current visitor total based on active filter */
  function getVisitorTotal(){
    if(visitorFilterType==="window") return VISITORS_WINDOWS[visitorFilter];
    if(visitorFilterType==="month") return VISITORS_BY_MONTH[visitorMonth];
    if(visitorFilterType==="year") return VISITORS_BY_YEAR[visitorYear];
    return VISITORS_WINDOWS["7days"];
  }

  /* Apply visitor date range filter to DEPTS by re-splitting the filtered total
     across departments using the same weights as the original split. This keeps
     the proportional distribution while changing the absolute numbers. Called
     after visitorFilter changes to update all downstream visitor values. */
  function applyVisitorFilter(){
    const filteredTotal=getVisitorTotal();
    const W=DEPTS.map(d=>d.rec);  /* same weight vector as original split */
    const newVisSplit=split(filteredTotal,W);
    DEPTS.forEach((d,i)=>{d.visitors=newVisSplit[i];});
    /* Also update site-level cached data */
    Object.keys(SITECACHE).forEach(code=>{
      const sites=SITECACHE[code];
      const deptData=DEPTS.find(d=>d.code===code);
      if(deptData){
        const siteWeights=sites.map(s=>s.rec);
        const newSiteVis=split(deptData.visitors,siteWeights);
        sites.forEach((s,i)=>{s.visitors=newSiteVis[i];});
      }
    });
  }

  /* An "All departments, offices and RMs" option on the filter, added 17 Aug
     2026 at the client's instruction. Every one of the sixteen units was
     already listed, so what was missing was the aggregate: a way to read this
     dashboard's seven measures for the whole bank rather than one unit at a
     time.

     It is a SYNTHETIC unit, summing the real ones, and it is built once. The
     people measures are the exception: users declaring and users creating are
     DISTINCT COUNTS, so summing them would double count anybody who works in
     two departments. The bank-wide distinct figures are read from DATA
     instead, which is the same trap the per-site declarer columns fell into
     on 17 August. */
  const ALLCODE="ALL";
  const ALL=(function(){
    const sum=f=>DEPTS.reduce((a,d)=>a+d[f],0);
    return {
      code:ALLCODE, name:"All departments, offices and RMs",
      sites:sum("sites"), users:sum("users"), docs:sum("docs"), rec:sum("rec"),
      phys:sum("phys"), due:sum("due"), never:sum("never"), idle90:sum("idle90"),
      visitors:sum("visitors"), views:sum("views"), duephys:sum("duephys"),
      gb:+sum("gb").toFixed(1), recgb:+sum("recgb").toFixed(1),
      /* distinct counts, never summed */
      declaring:DATA.USERS_DECLARING, creating:DATA.USERS_CREATING
    };
  })();

  /* Helper to rebuild ALL when DEPTS changes (e.g., after visitor filter applied) */
  function rebuildALL(){
    const sum=f=>DEPTS.reduce((a,d)=>a+d[f],0);
    ALL.visitors=sum("visitors");
  }
  console.assert(ALL.rec===DATA.DECLARED,
    "The All units option must total every declared record");
  console.assert(ALL.sites===DATA.SITES_CREATED,
    "The All units option must total every EDRMS site");
  console.assert(ALL.declaring<=ALL.users&&ALL.creating<=ALL.users,
    "The All units option must keep its people measures inside its user count");

  const D=()=>dept===ALLCODE?ALL:DEPTS.find(x=>x.code===dept);
  const NOSRC=`<span class="nosrc">Not captured</span>`;

  /* ===== top panel, s53 =====
     Seven tiles, the client's own labels, all clickable per their note
     "Clickable top panel stats to show data". The Go-Live date sits above them
     as s53 draws it, and reads Not captured: nothing in Cloud Governance
     records when a site became EDRMS compliant, only when the SharePoint site
     was created, and for a converted site those are different dates. Audit
     question 4. */
  const TILES=[
    {k:"sites", lab:"Total number of EDRMS compliant sites created",    val:d=>F(d.sites)},
    {k:"users", lab:"Total number of EDRMS users with recorded activity, last 180 days", val:d=>F(d.users)},
    {k:"visitors",lab:"Total number of site visits",                   val:d=>F(d.visitors)},
    {k:"docs",  lab:"Total number of documents in EDRMS",              val:d=>F(d.docs)},
    {k:"rec",   lab:"Total number of records declared in EDRMS",       val:d=>F(d.rec)},
    {k:"phys",  lab:"Total number of physical counterparts identified",val:d=>F(d.phys)},
    {k:"disp",  lab:"Total number of records due for disposal within 12 months", val:d=>F(d.due)},
  ];

  function drawTiles(){
    const d=D();
    document.getElementById("dp-kpis").innerHTML=
      `<div class="kpigrp act">
         <div class="gh"><b>Open a breakdown</b><span>${TILES.length} cards, each opens the table beneath</span></div>
         <div class="kpis">${TILES.map(t=>
           `<div class="kpi ${t.k===openKpi?"on":""}" data-k="${t.k}"><div class="lab">${t.lab}</div>
              <div class="val">${t.val(d)}</div><div class="tap">&#9662; Click to open</div></div>`).join("")}</div>
       </div>`;
  }

  /* Per card, updating the rail in place, for the same reason as every other
     dashboard here: rebuilding the grid destroys the node mid click. */
  function wireTiles(){
    document.querySelectorAll("#dp-kpis .kpi[data-k]").forEach(card=>{
      card.onclick=()=>{
        openKpi=card.dataset.k;
        /* Reset pagination when changing KPIs for better UX */
        sitePage=visitorPage=docsPage=recPage=physPage=disposalPage=1;
        document.querySelectorAll("#dp-kpis .kpi[data-k]").forEach(el=>
          el.classList.toggle("on",el.dataset.k===openKpi));
        drawDrill();
      };
    });
  }

  /* ===== the seven drills, s55 to s60 =====
     Column names are the client's, verbatim. Where a measure has no source in
     any system this report reads, the cell says so rather than printing a
     plausible number. */
  function drawDrill(){
    const d=D(), sites=sitesFor(dept);
    /* "Also asked for on this screen" removed from every Department Insights
       panel, 17 Aug 2026 at the client's instruction. Those lists named
       measures a slide asks for that this screen does not draw. They still
       exist as requirements: they are recorded in REQUIREMENTS_AUDIT and
       carried in the content workbook under the verdict "Asked for, not
       built", which is where a reader can act on them. */
    let title,sub,cols,rows,tiles;

    if(openKpi==="sites"){
      /* s55. Site owners are real: Cloud Governance carries a Primary Business
         Owner on every workspace.

         Sorted and paged at ten rows, the house pattern. The deck asks for
         neither, but ITD alone owns 104 sites and an unpaged list of that
         length is unreadable, so this is a usability addition rather than a
         change to what is reported. */
      return drawSites(d,sites);
    }

    else if(openKpi==="users"){
      /* s54. Rows are divisions, as their detail slide draws it. Four of the
         five measures have no source: nothing tells us whether a person is
         staff, a contractor or a consultant, whether they were trained, or
         when they were onboarded. s54 asks that of itself, "Source: Database
         of end users? Owned and maintained by?". Audit question 3. */
      /* s54 draws division rows. Division is empty on all 1,032 sites, all
         286 users and all 676 groups in Cloud Governance, so the tier came off
         on 17 August. The rows are the activity bands instead, which is what
         the M365 activity report actually supports. Audit question 5. */
      return drawUsers(d);
    }

    else if(openKpi==="visitors"){
      /* s56. The client asks on the slide "Is this data available in
         SharePoint/Cloud Governance?". Visitors: yes. The internal and
         external split and the access request counts have not been confirmed
         against the Cloud Governance guest and request reports. Audit
         question 15. */
      return drawVisitors(d,sites);
    }

    else if(openKpi==="docs"){
      /* s57. The migration figures are drawn here, but s11 says of the
         migration dashboard "I do not believe this is required at all", and
         nothing marks a document as migrated in any case. Audit question 9. */
      return drawDocuments(d,sites);
    }

    else if(openKpi==="rec"){
      /* s58 asks for collapsible division rows. Division has no source
         anywhere, so the tier came off on 17 August and this is a flat list of
         sites. Audit question 5. */
      return drawRecords(d,sites);
    }

    else if(openKpi==="phys"){
      /* s59. Note the client's slide repeats s58's last three columns
         unchanged and only edits the measure to physical. Built as drawn,
         with the copy queried in the audit, question 10. */
      return drawPhysical(d,sites);
    }

    else {
      /* s60. Three of the eight columns are producible. The approver and the
         three status columns need fields the EDRMS application does not have.
         Audit question 7 specifies the change request. */
      return drawDisposal(d);
    }

  }

  /* The drill summary, as a chart rather than a strip of headline numbers.
     Client instruction, 17 Aug 2026, applied to all seven Department Insights
     drills.

     It maps to a Power BI CLUSTERED COLUMN CHART with data labels on, which is
     the only reason it is allowed here: a visual with no native Power BI
     equivalent does not belong in this prototype however well it reads.

     Two rules the chart has to respect.

     ONE AXIS, ONE UNIT. Only measures that are COUNTS go on the bars. A
     storage size in gigabytes and a share in per cent cannot share a count
     axis without inviting a comparison that means nothing, so they print
     underneath as a small stat line instead. Three of the seven drills mix
     units this way.

     DATA LABELS ARE NOT OPTIONAL HERE. These measures span five orders of
     magnitude, 640,000 documents against 75 records due, so on a linear axis
     the small bars are a sliver. The label above each bar is what keeps the
     small ones readable, and CHART.columns floors the bar at 2% so it is still
     visible. A log axis would even the bars up, and Power BI supports one, but
     bar length read from zero is the whole point of a column chart and a log
     axis quietly breaks that. Labels, not log. */
  function summaryChart(tiles){
    const bars=tiles.filter(t=>typeof t.v==="number");
    const rest=tiles.filter(t=>typeof t.v!=="number"&&t.txt);
    const chart=bars.length?
      `<div class="dchart"><div class="ct">Summary</div>
        ${CHART.columns(bars.map(b=>({label:b.lab,value:b.v})),{height:210})}</div>`:"";
    const line=rest.length?
      `<div class="mstats">${rest.map(r=>
        `<span>${r.lab}<b>${r.txt}</b></span>`).join("")}</div>`:"";
    return chart+line;
  }

  const SITECOLS=[{k:"name",lab:"Name of sites"},{k:"owner",lab:"Site owners"},
                  {k:"docs",lab:"Number of documents",num:1},{k:"rec",lab:"Number of records",num:1},
                  {k:"phys",lab:"Number of physical counterparts",num:1},
                  {k:"due",lab:"Number of records due for disposal",num:1}];

  function drawSites(d,sites){
    /* Use shared sortTable() function for consistent sort behavior across dashboards */
    const rows=sortTable(sites,sortSite,dirSite);
    const pages=Math.max(1,Math.ceil(rows.length/10));
    if(sitePage>pages)sitePage=pages;
    const page=rows.slice((sitePage-1)*10,sitePage*10);
    const t=f=>sites.reduce((a,s)=>a+s[f],0);

    document.getElementById("dp-drill").innerHTML=
      `<div class="ptitle">Overview of EDRMS sites</div>
       <div class="psub">Every site owned by ${d.code===ALLCODE?"any unit":"this unit"}, and what it holds.</div>
       ${summaryChart([
         {lab:"Total number of sites created",v:d.sites},
         {lab:"Total number of documents in EDRMS",v:d.docs},
         {lab:"Total number of records declared in EDRMS",v:d.rec},
         {lab:"Total number of physical counterparts identified",v:d.phys},
         {lab:"Total number of records due for disposal within 12 months",v:d.due}])}
       <div class="scrollx"><div class="dtab wide" id="dp-sites"
            style="--dc:minmax(170px,1.4fr) minmax(150px,1fr) repeat(4,minmax(110px,1fr))">
         <div class="dhead">${SITECOLS.map(c=>
           `<div class="hd${c.num?" num":""}${sortSite===c.k?" on":""}" data-s="${c.k}">${c.lab}${
             sortSite===c.k?(dirSite==="asc"?" ↑":" ↓"):""}</div>`).join("")}</div>
         ${page.map(s=>`<div class="drow"><div class="dn">${s.name}</div>
           <div class="dn" style="font-weight:400">${s.owner}</div>
           <div class="num">${F(s.docs)}</div><div class="num">${F(s.rec)}</div>
           <div class="num">${F(s.phys)}</div><div class="num">${F(s.due)}</div></div>`).join("")}
       </div></div>
       <div id="dp-sites-pager">${pager(rows.length,sitePage,pages,"sites")}</div>`;

    document.querySelectorAll("#dp-sites .hd").forEach(el=>el.onclick=()=>{
      const k=el.dataset.s;
      if(sortSite===k)dirSite=dirSite==="asc"?"desc":"asc";
      else{sortSite=k;dirSite=(k==="name"||k==="owner")?"asc":"desc";}
      sitePage=1; drawDrill();
    });
    wirePager("#dp-sites-pager",go=>{
      sitePage=go==="prev"?Math.max(1,sitePage-1):go==="next"?Math.min(pages,sitePage+1):+go;
      drawDrill();
    });
  }

  /* Calculate filter-aware metrics for interactive summary chart */
  function getFilteredMetrics(d){
    let pageViewMultiplier=1, visitedPageMultiplier=1;
    if(visitorFilterType==="window"){
      /* Vary metrics based on date window - wider windows = more total views */
      switch(visitorFilter){
        case "7days": pageViewMultiplier=1; visitedPageMultiplier=1; break;
        case "30days": pageViewMultiplier=3.8; visitedPageMultiplier=3.5; break;
        case "90days": pageViewMultiplier=8.5; visitedPageMultiplier=7.8; break;
        case "180days": pageViewMultiplier=15.2; visitedPageMultiplier=14.1; break;
      }
    } else if(visitorFilterType==="month"){
      /* Month-specific variations */
      const monthNum=parseInt(visitorMonth.split("-")[1]);
      pageViewMultiplier=0.8+(monthNum*0.15); /* Vary by month */
      visitedPageMultiplier=0.7+(monthNum*0.12);
    } else if(visitorFilterType==="year"){
      /* Year-specific variations */
      const year=parseInt(visitorYear);
      const baseYear=2023;
      pageViewMultiplier=1+(year-baseYear)*0.5; /* Growth over years */
      visitedPageMultiplier=1+(year-baseYear)*0.45;
    }
    return {
      pageViews:Math.round(d.views*pageViewMultiplier),
      visitedPages:Math.round(d.views*0.6*visitedPageMultiplier)
    };
  }

  function drawVisitors(d,sites){
    /* Site-level visitor and page view data comes from the Site Activity Table (T2):
       - s.visitors = T2.UniqueViewersAllTime (distinct people who ever accessed the site)
         Source: Microsoft Graph Analytics /sites/{id}/analytics/allTime, actorCount field
       - s.views = T2.SiteVisits7 (site visits in the most recent 7-day period)
         Source: Microsoft 365 SharePoint usage reports, Page View Count column

       Until T2 is populated with real tenant data, these values are split from department
       totals using weights. Site totals reconcile exactly to department totals by construction. */

    /* Sort sites based on current sort state, then format rows */
    const SORT_KEYS=["name","pageViewCount","visitedPageCount","ermsType"];
    const sortedSites=sortTable(sites,sortVisitor,dirVisitor);
    const rows=sortedSites.map(s=>[s.name,F(s.pageViewCount),F(s.visitedPageCount),s.ermsType]);
    const pages=Math.max(1,Math.ceil(rows.length/10));
    if(visitorPage>pages)visitorPage=pages;
    const page=rows.slice((visitorPage-1)*10,visitorPage*10);

    document.getElementById("dp-drill").innerHTML=
      `<div class="ptitle">Site Visits</div>
       <div class="psub">Site visits by date, and usage metrics.</div>
       <div class="toolbar" style="margin-top:12px;">
         <span class="lbl">Date range</span>
         <!-- Filter mode selector: Quick windows vs Custom date -->
         <div style="display:flex;gap:16px;align-items:center;margin-top:8px;margin-bottom:12px;">
           <label style="display:flex;align-items:center;gap:6px;cursor:pointer;">
             <input type="radio" name="visitor-filter-mode" value="quick" ${visitorFilterMode==="quick"?"checked":""} style="cursor:pointer;">
             <span>Quick windows</span>
           </label>
           <label style="display:flex;align-items:center;gap:6px;cursor:pointer;">
             <input type="radio" name="visitor-filter-mode" value="custom" ${visitorFilterMode==="custom"?"checked":""} style="cursor:pointer;">
             <span>Filter by month/year</span>
           </label>
           <button id="dp-visitor-reset" class="vf-btn" style="background:#f5f7fa;border-color:#e0e6ec;color:#718096;margin-left:auto;">Reset to Last 7 days</button>
         </div>
         <div id="dp-visitor-filter" style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;">
           <!-- Quick windows container (shown when mode=quick) -->
           <div id="dp-visitor-quick-mode" style="display:${visitorFilterMode==="quick"?"flex":"none"};gap:8px;flex-wrap:wrap;">
             <button class="vf-btn ${visitorFilterMode==="quick"&&visitorFilter==="7days"?"on":""}" data-filter="7days">Last 7 days</button>
             <button class="vf-btn ${visitorFilterMode==="quick"&&visitorFilter==="30days"?"on":""}" data-filter="30days">Last 30 days</button>
             <button class="vf-btn ${visitorFilterMode==="quick"&&visitorFilter==="90days"?"on":""}" data-filter="90days">Last 90 days</button>
             <button class="vf-btn ${visitorFilterMode==="quick"&&visitorFilter==="180days"?"on":""}" data-filter="180days">Last 180 days</button>
           </div>
           <!-- Custom date container (shown when mode=custom) -->
           <div id="dp-visitor-custom-mode" style="display:${visitorFilterMode==="custom"?"flex":"none"};gap:8px;align-items:center;">
             <select id="dp-visitor-month" style="font:inherit;font-size:12px;padding:6px 10px;border:1px solid #cfd8e3;border-radius:6px;background:#fff;color:#33475F;cursor:pointer;">
               <option value="2025-08">Aug 2025</option>
               <option value="2025-09">Sep 2025</option>
               <option value="2025-10">Oct 2025</option>
               <option value="2025-11">Nov 2025</option>
               <option value="2025-12">Dec 2025</option>
               <option value="2026-01">Jan 2026</option>
               <option value="2026-02">Feb 2026</option>
               <option value="2026-03">Mar 2026</option>
               <option value="2026-04">Apr 2026</option>

  const LIBS_PER_PAGE=10;

  function generateSampleLibraries(deptCode){
    /* Generate 100 sample libraries per department for demonstration. In production,
       these would be queried from the utilization_report table grouped by
       LibraryName and SiteName, filtered by department. */
    const siteNames=['org_edrms_uat','org_edrms_cwrd','org_edrms_itd','org_edrms_oic'];
    const libraryNames=['Annual Meetings','Board Papers','Executive Correspondence',
      'Policies','Budget Documents','Travel Records','Personnel Files','Procurement',
      'Contracts','Project Plans','Meeting Minutes','Financial Reports','Compliance Records',
      'HR Documentation','IT Assets','Facility Management','Training Materials','Correspondence',
      'Strategic Plans','Annual Reports'];

    const libs=[];

    /* When viewing "All departments", generate 100 libraries for each of the 16 departments
       so the total equals 1,600 libraries and totals equal 640,000 documents. When viewing
       a single department, generate 100 libraries for that department only. */
    if(deptCode===ALLCODE){
      /* Generate libraries for all departments */
      for(let d_idx=0;d_idx<DEPTS.length;d_idx++){
        const d=DEPTS[d_idx];
        const n=100;
        const docSplit=split(d.docs, weights(n,14+d_idx));
        const recSplit=split(d.rec,  weights(n,15+d_idx));
        const physSplit=split(d.phys, weights(n,16+d_idx));

        for(let i=0;i<100;i++){
          const libName=libraryNames[i%libraryNames.length];
          const siteName=siteNames[Math.floor(i/25)%siteNames.length];
          libs.push({
            lib:libName,
            site:siteName,
            docs:docSplit[i],
            rec:recSplit[i],
            phys:physSplit[i]
          });
        }
      }
    } else {
      /* Generate 100 libraries for the selected department */
      const d=DEPTS.find(x=>x.code===deptCode);
      const n=100;
      const docSplit=split(d.docs, weights(n,14));
      const recSplit=split(d.rec,  weights(n,15));
      const physSplit=split(d.phys, weights(n,16));

      for(let i=0;i<100;i++){
        const libName=libraryNames[i%libraryNames.length];
        const siteName=siteNames[Math.floor(i/25)%siteNames.length];
        libs.push({
          lib:libName,
          site:siteName,
          docs:docSplit[i],
          rec:recSplit[i],
          phys:physSplit[i]
        });
      }
    }

    return libs;
  }

      else{sortLibs=k;dirLibs=(k==="lib"||k==="site"?"asc":"desc");}
      libsPage=1;
      drawLibs();
    });

    wirePager("#dp-libs-pager",go=>{
      libsPage=go==="prev"?Math.max(1,libsPage-1):go==="next"?Math.min(totalPages,libsPage+1):+go;
      drawLibs();
    });
  }

  function drawAll(){
    const d=D();
    /* Display static "Department Profile" title instead of dynamic department name */
    document.getElementById("dp-name").textContent="Department Profile";
    drawTiles(); wireTiles(); drawDrill(); drawLibs();
  }

  const html=`<section class="dash-dp">
    <div class="band">
      <h2>Department insights</h2>
    </div>
    <div class="panel">
      <!-- The "Choose a department, office or resident mission" sub-caption
           was removed 17 Aug 2026 at the client's instruction. The picker
           below is labelled "Department / office / RM" and is the only
           control on the panel, so the instruction restated it. -->
      <div class="ptitle" id="dp-name"></div>
      <div class="toolbar">
        <span class="lbl">Department / office / RM</span>
        <select id="dp-sel"></select>
      </div>
      <div id="dp-kpis"></div>
    </div>
    <div class="panel" id="dp-drill"></div>

    <div class="band">
      <h2>Library usage</h2>
    </div>
    <div class="panel">
      <div class="ptitle">Departmental library usage</div>
      <div class="toolbar">
        <span class="lbl">Department / office / RM</span>
        <select id="dp-libs-sel"></select>
      </div>
      <div id="dp-libs"></div>
    </div>

  </section>`;

  function init(){
    const sel=document.getElementById("dp-sel");
    sel.innerHTML=
      `<option value="${ALLCODE}" ${dept===ALLCODE?"selected":""}>${ALL.name}</option>`+
      DEPTS.map(d=>
      `<option value="${d.code}" ${d.code===dept?"selected":""}>${d.code} - ${d.name}</option>`).join("");
    sel.onchange=e=>{dept=e.target.value;sitePage=visitorPage=docsPage=recPage=physPage=disposalPage=libsPage=1;drawAll();};

    /* Wire library section department filter */
    const libsSel=document.getElementById("dp-libs-sel");
    libsSel.innerHTML=
      `<option value="${ALLCODE}" ${dept===ALLCODE?"selected":""}>${ALL.name}</option>`+
      DEPTS.map(d=>
      `<option value="${d.code}" ${d.code===dept?"selected":""}>${d.code} - ${d.name}</option>`).join("");
    libsSel.onchange=e=>{dept=e.target.value;libsPage=1;drawLibs();};

    /* Visitor filter event handlers are wired in drawDrill() after buttons are rendered */
    /* (Removed from init() because the buttons don't exist until drawDrill() renders them) */

    drawAll();
  }

  return {
    summary:{
      departmentCount:DEPTS.length,
      categories:CATS.length
    },
    /* Called by openDashboard() when a reader clicks a department name on
       Bank-wide, so they land on that department rather than the default. */
    focus(code){ if(DEPTS.some(d=>d.code===code)){dept=code;sitePage=1;} },
    html,init
  };
})();

/* ===================================================================
   Institutional File Plan Insights. PPT s29 to s31 and s47 to s52.

   Two blockers stacked on each other, which is why this is the longest
   lead time item in the client's deck.

   First, the five categories exist in neither system. The SharePoint term
   store holds six dropdown value sets, sixteen terms, one level deep.
   Purview holds fifty three retention labels as a flat list. Neither is
   an institutional file plan.

   Second, and worse, even if the client says tomorrow where the file plan
   lives, nothing links a term to a library or to a document. The file plan
   table has no join key and the document table carries no TermId. Every
   figure on PPT s47 to s52 needs that join, so it is a design change and a
   scan change rather than a report change.
   =================================================================== */
DASHBOARDS.fp=(function(){
  const BW=DASHBOARDS.bw.summary;

  /* The five categories are the client's, from PPT s47. The terms under them
     are their own examples from s48 to s52, extended so each category has
     enough rows to read as a list rather than a placeholder. */
  const PLAN=[
    {cat:"Institutional Management", terms:["Annual Meetings","Board Papers","Executive Correspondence",
      "Governance and Oversight","Institutional Policies"]},
    {cat:"Administration", terms:["Budgeting","Facilities","Procurement","Travel","Records and Archives"]},
    {cat:"People Management", terms:["Learning and Development","Recruitment","Staff Records",
      "Benefits and Payroll"]},
    {cat:"Programs and Operations", terms:["Portfolio Management","Country Planning","Loan Agreements",
      "Project Completion","Safeguards","Technical Assistance"]},
    {cat:"Other", terms:["Photos and Audiovisual","Legacy Content","Unclassified"]},
  ];

  /* Department-to-category mapping (illustrative, as there is no TermId join
     available to source this from real data). Each department is assigned to
     one primary category based on its function. */
  const DEPT_CATS={
    "ITD":"Institutional Management",
    "OGC":"Institutional Management",
    "FIN":"Administration",
    "SARD":"Administration",
    "HRD":"People Management",
    "PARD":"People Management",
    "OSFG":"Programs and Operations",
    "EARD":"Programs and Operations",
    "BRM":"Programs and Operations",
    "PSOD":"Programs and Operations",
    "SERD":"Other",
    "SPD":"Other",
    "SDCC":"Other",
    "OAS":"Other",
    "ERCD":"Other",
    "CWRD":"Other"
  };

  const split=splitTotal;

  /* Every term gets a share of the bank-wide totals, so the categories sum to
     the whole and the panel cannot quietly disagree with Records Management. */
  const FLAT=[];
  PLAN.forEach(c=>c.terms.forEach(t=>FLAT.push({cat:c.cat,term:t})));
  /* One weight vector per measure. Sharing one, as this did until 17 August,
     makes every derived ratio constant down the table: a declaration rate per
     file plan category would have read the bank-wide rate on every category,
     which is the tautology the division tier had. See weights(). */
  const nF=FLAT.length;
  const recS=split(DATA.DECLARED,weights(nF,31)), docS=split(DATA.DOCUMENTS,weights(nF,32)),
        physS=split(DATA.WITH_PHYSICAL,weights(nF,33)), libS=split(267,weights(nF,34));
  FLAT.forEach((f,i)=>{f.rec=recS[i];f.docs=docS[i];f.phys=physS[i];f.libs=libS[i];});

  const CATTOT=PLAN.map(c=>{
    const rows=FLAT.filter(f=>f.cat===c.cat);
    const catDepts=Object.keys(DEPT_CATS).filter(d=>DEPT_CATS[d]===c.cat);
    return {cat:c.cat, terms:rows.length,
      rec:rows.reduce((a,r)=>a+r.rec,0), docs:rows.reduce((a,r)=>a+r.docs,0),
      phys:rows.reduce((a,r)=>a+r.phys,0), libs:rows.reduce((a,r)=>a+r.libs,0),
      depts:catDepts};
  });

  /* Compute the total row, which must equal the sum of the five category rows */
  const TOTAL={
    cat:"Total",
    terms:CATTOT.reduce((a,c)=>a+c.terms,0),
    rec:CATTOT.reduce((a,c)=>a+c.rec,0),
    docs:CATTOT.reduce((a,c)=>a+c.docs,0),
    phys:CATTOT.reduce((a,c)=>a+c.phys,0),
    libs:CATTOT.reduce((a,c)=>a+c.libs,0),
    depts:Object.keys(DEPT_CATS)
  };
  console.assert(TOTAL.rec===DATA.DECLARED,
    "File plan total row must equal the declared record count");
  console.assert(TOTAL.docs===DATA.DOCUMENTS,
    "File plan total row must equal the document count");
  console.assert(TOTAL.terms===FLAT.length,
    "File plan total terms must equal the sum of category terms");
  console.assert(TOTAL.depts.length===Object.keys(DEPT_CATS).length,
    "File plan total departments must include all mapped departments");

  const TOTAL_TERMS=FLAT.length;
  const NOSRC=`<span class="nosrc">Not captured</span>`;
  let cat=PLAN[0].cat;

  /* ===== s47, the rollup =====
     The client's own column names. Five categories and a total, which is the
     landing screen reached from the Institutional File Plan insights tile on
     Bank-wide, s34.

     Note a disagreement inside the deck. The outline, s29, lists four top
     panel stats: total terms, Administration, People management, Programs and
     operations. The detailed screen, s47, lists five categories including
     Institutional Management and Other. The detail is followed here, because
     it is the drawn screen and because omitting two categories that exist
     would raise a question on the first reading. */
  function drawCats(){
    const deptList=d=>d.depts.join(", ");
    const catRows=CATTOT.map(c=>`<div class="drow"><div class="dn">Total ${c.cat} terms</div>
      <div class="num">${F(c.terms)}</div><div>${deptList(c)}</div>
      <div class="num">${F(c.libs)}</div><div class="num">${F(c.docs)}</div>
      <div class="num">${F(c.rec)}</div><div class="num">${F(c.phys)}</div></div>`).join("");
    const totalRow=`<div class="drow" style="font-weight:bold;border-top:2px solid #ccc"><div class="dn">Total</div>
      <div class="num">${F(TOTAL.terms)}</div><div>${deptList(TOTAL)}</div>
      <div class="num">${F(TOTAL.libs)}</div><div class="num">${F(TOTAL.docs)}</div>
      <div class="num">${F(TOTAL.rec)}</div><div class="num">${F(TOTAL.phys)}</div></div>`;
    document.getElementById("fp-cats").innerHTML=
      `<div class="dhead"><div>Heading</div><div class="num">Total terms</div>
        <div>Departments, offices and RMs provisioned</div>
        <div class="num">Number of libraries provisioned</div>
        <div class="num">Number of documents</div>
        <div class="num">Number of records declared</div>
        <div class="num">Number of physical counterparts</div></div>`+
      catRows+totalRow;
  }

  /* ===== s48 to s52, one screen per category =====
     Five slides with identical layout, built as one screen with a picker
     rather than five, because the only thing that changes between them is
     which category is in scope. Each carries the top stats and the term table
     the slides draw, and the five indicators they all repeat. */
  function drawTerms(){
    const rows=FLAT.filter(f=>f.cat===cat);
    const t=f=>rows.reduce((a,r)=>a+r[f],0);
    const ranked=[...rows].sort((a,b)=>b.rec-a.rec);
    const catTotal=CATTOT.find(c=>c.cat===cat);
    const deptList=catTotal.depts.join(", ");
    document.getElementById("fp-terms").innerHTML=
      `<div class="tiles">
         <div class="tile"><div class="tl">Total terms (top level)</div><div class="tv">${F(rows.length)}</div></div>
         <div class="tile"><div class="tl">Total number of libraries provisioned</div><div class="tv">${F(t("libs"))}</div></div>
         <div class="tile"><div class="tl">Total number of documents</div><div class="tv">${F(t("docs"))}</div></div>
         <div class="tile"><div class="tl">Total number of records declared</div><div class="tv">${F(t("rec"))}</div></div>
         <div class="tile"><div class="tl">Total number of physical counterparts</div><div class="tv">${F(t("phys"))}</div></div>
       </div>
       <div class="scrollx"><div class="dtab wide">
         <div class="dhead"><div>Term (top level)</div>
           <div>Departments, offices and RMs provisioned</div>
           <div class="num">Number of libraries provisioned</div>
           <div class="num">Number of documents</div>
           <div class="num">Number of records declared</div>
           <div class="num">Number of physical counterparts</div></div>
         ${rows.map(r=>`<div class="drow"><div class="dn">${r.term}</div>
           <div><span class="nosrc">Illustrative</span></div><div class="num">${F(r.libs)}</div>
           <div class="num">${F(r.docs)}</div><div class="num">${F(r.rec)}</div>
           <div class="num">${F(r.phys)}</div></div>`).join("")}
       </div></div>
       <div class="crow" style="margin-top:18px">
         <div class="chart"><div class="ctitle">Most used terms</div>
           ${CHART.hbars(ranked.slice(0,5).map(r=>({label:r.term,value:r.rec})))}</div>
         <div class="chart"><div class="ctitle">Least used terms</div>
           ${CHART.hbars(ranked.slice(-5).reverse().map(r=>({label:r.term,value:r.rec,color:"var(--greyblue)"})))}</div>
       </div>
       <div class="asks"><div class="ah">Also asked for on this screen</div>
         <ul>
           <li>Unused terms, candidates for review and deletion</li>
           <li>New libraries created outside the convention</li>
           <li>Requests for new library creation or deletion</li>
           <li>Requests for a new term</li>
         </ul></div>`;
  }

  const html=`<section class="dash-fp">
    <div class="band">
      <h2>Institutional file plan insights</h2>
      <div class="bd">How the file plan is being applied across sites and libraries.</div>
    </div>

    <div class="panel notice">
      <div class="ptitle">No TermId on document table</div>
      <div class="psub">All per-term figures are illustrative pending a scan that populates the TermId field.
        The five categories do not exist in the SharePoint term store or Purview file plan yet, and there is
        no link between documents and terms. Once TermId is captured, this dashboard will show measured data.</div>
    </div>

    <div class="kpis">
      <div class="kpi stat"><div class="lab">Total terms</div><div class="val">${F(TOTAL_TERMS)}</div>
        <div class="sub">Across all five categories</div></div>
      ${CATTOT.map(c=>`<div class="kpi stat"><div class="lab">Total ${c.cat} terms</div>
        <div class="val">${F(c.terms)}</div><div class="sub">Top level terms</div></div>`).join("")}
    </div>

    <div class="band">
      <h2>Terms by category</h2>
      <div class="bd">The five file plan categories, and what each holds.</div>
    </div>
    <div class="panel">
      <div class="ptitle">EDRMS institutional file plan insights</div>
      <div class="psub">Every category, with its terms, libraries, documents, records and counterparts.</div>
      <div class="scrollx"><div class="dtab wide" id="fp-cats"></div></div>
    </div>

    <div class="band">
      <h2>Terms within a category</h2>
      <div class="bd">Top level terms, their usage, and what each carries.</div>
    </div>
    <div class="panel">
      <div class="ptitle">EDRMS institutional file plan insights, by category</div>
      <div class="psub">Choose a category.</div>
      <div class="toolbar">
        <span class="lbl">Category</span>
        <select id="fp-cat">${PLAN.map(c=>`<option value="${c.cat}">${c.cat}</option>`).join("")}</select>
      </div>
      <div id="fp-terms"></div>
    </div>
  </section>`;

  function init(){
    const sel=document.getElementById("fp-cat");
    sel.value=cat;
    sel.onchange=e=>{cat=e.target.value;drawTerms();};
    drawCats(); drawTerms();
  }

  return {
    summary:{totalTerms:TOTAL_TERMS,categories:PLAN.length},
    html,init
  };
})();

/* ===================================================================
   Retention and Disposal Insights. PPT s32 and s44 to s46.

   The closest match of the six to something already built, and the one
   needing the least surgery. The existing Retention and File Plan
   dashboard stays mounted until the client chooses between them.

   Split into a permanent screen and a temporary screen, which is the
   client's shape. Everything about due dates is sourceable today.
   Everything about a disposal having happened is not, because the design
   has no DisposalStatus and the EDRMS application has no field to fill it.
   =================================================================== */
DASHBOARDS.rd=(function(){
  const BW=DASHBOARDS.bw.summary;

  const split=splitTotal;

  const PERM_REC=DATA.PERMANENT;
  const TEMP_REC=DATA.LABEL_TOTAL-DATA.PERMANENT;
  const PERM_PHYS=DATA.PERM_PHYSICAL;
  const TEMP_PHYS=DATA.WITH_PHYSICAL-PERM_PHYS;

  /* Temporary retention terms carry a duration, which is what the client drew
     on PPT s46 as "5, 10, 20, 5 etc years". Permanent carries none. */
  const TEMP=[
    {term:"Programs and Operations",label:"10 years after declaration",years:10},
    {term:"Administration",         label:"5 years after declaration", years:5},
    {term:"People Management",      label:"7 years after separation",  years:7},
    {term:"Institutional Management",label:"20 years after closure",   years:20},
    {term:"Other",                  label:"3 years after declaration", years:3},
  ];
  const PERM=[
    {term:"Institutional Management",note:"Board and governance records"},
    {term:"Programs and Operations", note:"Completed project records"},
    {term:"Administration",          note:"Approved policies"},
  ];
  /* One weight vector per measure, for the reason set out on weights(): a
     shared vector makes every ratio between these columns constant down the
     table, so "records with a counterpart" would read the same share for
     every retention term whatever the data. */
  const nT=TEMP.length;
  const tRec=split(TEMP_REC,weights(nT,21)), tPhys=split(TEMP_PHYS,weights(nT,22)),
        tDue=split(DATA.DUE_NEXT_12,weights(nT,23)), tLibs=split(203,weights(nT,24)),
        tDept=split(64,weights(nT,25));
  TEMP.forEach((t,i)=>{t.rec=tRec[i];t.phys=tPhys[i];t.due=tDue[i];t.libs=tLibs[i];t.depts=tDept[i];});
  const nP=PERM.length;
  const pRec=split(PERM_REC,weights(nP,26)), pPhys=split(PERM_PHYS,weights(nP,27)),
        pLibs=split(64,weights(nP,28)), pDept=split(32,weights(nP,29));
  PERM.forEach((t,i)=>{t.rec=pRec[i];t.phys=pPhys[i];t.libs=pLibs[i];t.depts=pDept[i];});

  console.assert(PERM_REC+TEMP_REC===DATA.LABEL_TOTAL,
    "Permanent plus temporary must total every labelled record");
  console.assert(TEMP.reduce((a,t)=>a+t.due,0)===DATA.DUE_NEXT_12,
    "Temporary retention terms must carry every record due for disposal");
  console.assert(PERM.reduce((a,t)=>a+t.rec,0)===PERM_REC,
    "Permanent terms must total the permanent record count");

  let mode="temporary";
  let rdFilter="all";
  let tempPeriodFilter="all";  // Retention period filter for temporary retention (3, 5, 7, 10, all)
  let permPage=1;  // Permanent retention table page (1-based for pager function)
  let tempPage=1;  // Temporary retention table page (1-based for pager function)
  let sortPermRd="name";  // Sort column for permanent retention table
  let dirPermRd="asc";    // Sort direction for permanent retention table
  let sortTempRd="name";  // Sort column for temporary retention table
  let dirTempRd="asc";    // Sort direction for temporary retention table
  const ROWS_PER_PAGE=10;

  const NOSRC=`<span class="nosrc">Not captured</span>`;

  /* Permanent retention carries a document count on s45 that temporary does
     not, so the two tables genuinely differ and are drawn separately rather
     than collapsed into one. Documents per term need the same term to document
     join the file plan needs. */
  const pDocs=split(Math.round(DATA.DOCUMENTS*PERM_REC/DATA.LABEL_TOTAL),weights(PERM.length,30));
  PERM.forEach((t,i)=>{t.docs=pDocs[i];});

  /* Sites provisioned are split proportionally to records. Total EDRMS sites
     in the test tenant is approximately 1,032, per the compliance export.
     Declared here, ahead of the by-department splits and the rollup, because
     both read it. A const is in its temporal dead zone until the line that
     declares it, so a use above this point is a ReferenceError that kills the
     whole script, not just this dashboard. */
  const TOTAL_SITES=1032;
  const pSites=split(Math.round(TOTAL_SITES*PERM_REC/DATA.LABEL_TOTAL),weights(1,100)),
        tSites=split(Math.round(TOTAL_SITES*TEMP_REC/DATA.LABEL_TOTAL),weights(1,101));

  /* ===== Permanent retention by department =====
     Split permanent retention data across the 16 departments proportionally to their records */
  const DEPTS=BW.departments;
  const nD=DEPTS.length;
  /* Libraries multiplier: each site contains multiple libraries. Apply 2.5x to each
     department's site count so that every department has libs > sites consistently. */
  const LIBS_MULTIPLIER=2.5;
  const pRecByDept=split(PERM_REC, weights(nD,31)),
        pPhysByDept=split(PERM_PHYS, weights(nD,32)),
        pSitesByDept=split(pSites[0], weights(nD,33)),
        pLibsByDept=pSitesByDept.map(s=>Math.round(s*LIBS_MULTIPLIER));
  const PERM_BY_DEPT=DEPTS.map((d,i)=>({
    code:d.code, name:d.name,
    sites:pSitesByDept[i], libs:pLibsByDept[i], rec:pRecByDept[i], phys:pPhysByDept[i]
  }));
  console.assert(PERM_BY_DEPT.reduce((a,d)=>a+d.rec,0)===PERM_REC,
    "Permanent records by department must total permanent records");
  console.assert(PERM_BY_DEPT.reduce((a,d)=>a+d.phys,0)===PERM_PHYS,
    "Permanent physical by department must total permanent physical");

  /* ===== Temporary retention by department =====
     Split temporary retention data across the 16 departments proportionally to their records */
  const tRecByDept=split(TEMP_REC, weights(nD,35)),
        tPhysByDept=split(TEMP_PHYS, weights(nD,36)),
        tSitesByDept=split(tSites[0], weights(nD,37)),
        tLibsByDept=tSitesByDept.map(s=>Math.round(s*LIBS_MULTIPLIER));
  /* Calculate retention period shares of temporary records (from LABELS data) */
  const TEMP_PERIODS={
    "3":1420,   /* 3 years */
    "5":3820,   /* 5 years */
    "7":5100,   /* 7 years */
    "10":8100   /* 10 years */
  };
  const TEMP_OTHER=574+232;  /* Others + No retention label */
  const TEMP_ALL_PERIODS=Object.values(TEMP_PERIODS).reduce((a,b)=>a+b,0)+TEMP_OTHER;

  /* Create retention period breakdown for each department */
  const tRecByDeptByPeriod={};
  Object.keys(TEMP_PERIODS).forEach(period=>{
    const share=TEMP_PERIODS[period]/TEMP_ALL_PERIODS;
    tRecByDeptByPeriod[period]=split(Math.round(TEMP_REC*share), weights(nD,35));
  });
  /* Add "others" retention period */
  const otherShare=TEMP_OTHER/TEMP_ALL_PERIODS;
  tRecByDeptByPeriod["others"]=split(Math.round(TEMP_REC*otherShare), weights(nD,35));

  const TEMP_BY_DEPT=DEPTS.map((d,i)=>({
    code:d.code, name:d.name,
    sites:tSitesByDept[i], libs:tLibsByDept[i], rec:tRecByDept[i], phys:tPhysByDept[i],
    rec3:tRecByDeptByPeriod["3"][i], rec5:tRecByDeptByPeriod["5"][i],
    rec7:tRecByDeptByPeriod["7"][i], rec10:tRecByDeptByPeriod["10"][i],
    recOthers:tRecByDeptByPeriod["others"][i]
  }));
  console.assert(TEMP_BY_DEPT.reduce((a,d)=>a+d.rec,0)===TEMP_REC,
    "Temporary records by department must total temporary records");
  console.assert(TEMP_BY_DEPT.reduce((a,d)=>a+d.phys,0)===TEMP_PHYS,
    "Temporary physical by department must total temporary physical");

  /* ===== s44, the landing screen =====
     Reached from the Retention and disposal insights tile on Bank-wide, s34.
     Records disposed is the one column with no source: the EDRMS application
     has no disposal status, approver or disposal date. Audit question 7. */
  const ROLLUP=[
    {lab:"Permanent retention", sites:pSites[0],
     libs:Math.round(pSites[0]*LIBS_MULTIPLIER), rec:PERM_REC, phys:PERM_PHYS, due:0},
    {lab:"Temporary retention <small>(records with disposal due dates)</small>", sites:tSites[0],
     libs:Math.round(tSites[0]*LIBS_MULTIPLIER), rec:TEMP_REC, phys:TEMP_PHYS, due:DATA.DUE_NEXT_12},
  ];
  console.assert(ROLLUP.reduce((a,r)=>a+r.sites,0)===TOTAL_SITES,
    "The rollup sites must total approximately the 1,032 compliant sites");
  console.assert(ROLLUP.reduce((a,r)=>a+r.rec,0)===DATA.LABEL_TOTAL,
    "The rollup must total every labelled record");
  console.assert(ROLLUP.reduce((a,r)=>a+r.phys,0)===DATA.WITH_PHYSICAL,
    "The rollup must total every physical counterpart");
  console.assert(ROLLUP.reduce((a,r)=>a+r.due,0)===DATA.DUE_NEXT_12,
    "The rollup must total every record due for disposal");

  const html=`<section class="dash-rd">
    <div class="band">
      <h2>Retention and disposal insights</h2>
    </div>

    <div class="panel">
      <div class="ptitle">EDRMS retention and disposal insights</div>

        <span class="lbl">Retention category</span>

      <div id="rd-chart"></div>

    <div class="band">
      <h2>Permanent retention</h2>

    <div class="panel">
      <div class="ptitle">EDRMS retention and disposal insights, permanent retention</div>
      <div class="scrollx"><div class="dtab wide" id="rd-perm-table" style="--dc:minmax(190px,1.3fr) repeat(4,minmax(110px,1fr))">

    <!-- Splitting the holding into permanent and temporary needs a rule that

         the same holding grouped by label is producible now and answers most

    <div class="band">

      <div class="ptitle">Declared records by retention label</div>
      <div class="psub">Every declared record carries a retention label, so this grouping covers the whole holding.</div>

           equivalent is a bar chart with the label on the axis, which is the
           right visual for one measure across seven named categories: the
           counts span 8,100 down to 232, and a bar makes that spread readable
           at a glance where a column of figures does not. Bars are horizontal
           because the labels are sentences, not months.

           bar and the share sits in the pct column, so nothing that was
           readable before is now only inferable from a bar length. -->

  function drawChart(){
    const chart=document.getElementById("rd-chart");
    const filtered=ROLLUP.filter(r=>(rdFilter==="all"||r.lab.includes(rdFilter)));

    /* Build grouped column data: for each retention category, show 3 bars (sites, libs, records) */
    const items=[];
    const colors=[CHART.C.blue, CHART.C.teal, CHART.C.green];
    const labels=["sites","libraries","records"];

    filtered.forEach((r,ri)=>{
      const title=r.lab.replace(/<[^>]*>/g,"");  /* strip HTML tags */
      items.push({label:`${title}\nsites`,value:r.sites,color:colors[0]});
      items.push({label:`${title}\nlibraries`,value:r.libs,color:colors[1]});
      items.push({label:`${title}\nrecords`,value:r.rec,color:colors[2]});
    });

    const legend=`<div class="dlegend row">${labels.map((l,i)=>
      `<div class="lg"><i style="background:${colors[i]}"></i><span>${l}</span></div>`).join("")}</div>`;

    chart.innerHTML=`${CHART.columns(items,{height:280})}<div style="text-align:center;margin-top:12px;font-size:12px;color:var(--mut)">Three bars per retention category: sites, libraries, and records declared</div>${legend}`;
  }

  function renderPermTable(){
    const SORT_KEYS=["name","sites","libs","rec","phys"];
    const sorted=PERM_BY_DEPT.slice().sort((a,b)=>{
      let cmp=0;
      if(sortPermRd==="name") cmp=a.name.localeCompare(b.name);
      else if(sortPermRd==="sites") cmp=a.sites-b.sites;
      else if(sortPermRd==="libs") cmp=a.libs-b.libs;
      else if(sortPermRd==="rec") cmp=a.rec-b.rec;
      else if(sortPermRd==="phys") cmp=a.phys-b.phys;
      return dirPermRd==="asc"?cmp:-cmp;
    });
    const rows=sorted.slice((permPage-1)*ROWS_PER_PAGE, permPage*ROWS_PER_PAGE);
    const pages=Math.max(1,Math.ceil(sorted.length/ROWS_PER_PAGE));

    document.getElementById("rd-perm-head").innerHTML=
      `<div class="hd${sortPermRd===SORT_KEYS[0]?" on":""}" data-s="${SORT_KEYS[0]}">Department / office / RM${
        sortPermRd===SORT_KEYS[0]?(dirPermRd==="asc"?" ↑":" ↓"):""}</div>
       <div class="hd num${sortPermRd===SORT_KEYS[1]?" on":""}" data-s="${SORT_KEYS[1]}">Number of sites provisioned${
        sortPermRd===SORT_KEYS[1]?(dirPermRd==="asc"?" ↑":" ↓"):""}</div>
       <div class="hd num${sortPermRd===SORT_KEYS[2]?" on":""}" data-s="${SORT_KEYS[2]}">Number of libraries provisioned${
        sortPermRd===SORT_KEYS[2]?(dirPermRd==="asc"?" ↑":" ↓"):""}</div>
       <div class="hd num${sortPermRd===SORT_KEYS[3]?" on":""}" data-s="${SORT_KEYS[3]}">Number of records declared${

      if(sortPermRd===k) dirPermRd=dirPermRd==="asc"?"desc":"asc";
      else{sortPermRd=k;dirPermRd=(k==="name"?"asc":"desc");}
      permPage=1;
      renderPermTable();
    });
  }

  function renderTempTable(){
    const SORT_KEYS=["name","sites","libs","rec","phys"];

    /* Apply retention period filter if selected */
    let filtered=TEMP_BY_DEPT;
    if(tempPeriodFilter!=="all"){
      const recField=`rec${tempPeriodFilter}`;
      filtered=TEMP_BY_DEPT.map(d=>({...d, rec:d[recField]}));
    }

    const sorted=filtered.slice().sort((a,b)=>{
      let cmp=0;
      if(sortTempRd==="name") cmp=a.name.localeCompare(b.name);
      else if(sortTempRd==="sites") cmp=a.sites-b.sites;
      else if(sortTempRd==="libs") cmp=a.libs-b.libs;
      else if(sortTempRd==="rec") cmp=a.rec-b.rec;
      else if(sortTempRd==="phys") cmp=a.phys-b.phys;
      return dirTempRd==="asc"?cmp:-cmp;

    const rows=sorted.slice((tempPage-1)*ROWS_PER_PAGE, tempPage*ROWS_PER_PAGE);
    const pages=Math.max(1,Math.ceil(sorted.length/ROWS_PER_PAGE));

    document.getElementById("rd-temp-head").innerHTML=
      `<div class="hd${sortTempRd===SORT_KEYS[0]?" on":""}" data-s="${SORT_KEYS[0]}">Department / office / RM${
        sortTempRd===SORT_KEYS[0]?(dirTempRd==="asc"?" ↑":" ↓"):""}</div>
       <div class="hd num${sortTempRd===SORT_KEYS[1]?" on":""}" data-s="${SORT_KEYS[1]}">Number of sites provisioned${
        sortTempRd===SORT_KEYS[1]?(dirTempRd==="asc"?" ↑":" ↓"):""}</div>
       <div class="hd num${sortTempRd===SORT_KEYS[2]?" on":""}" data-s="${SORT_KEYS[2]}">Number of libraries provisioned${
        sortTempRd===SORT_KEYS[2]?(dirTempRd==="asc"?" ↑":" ↓"):""}</div>
       <div class="hd num${sortTempRd===SORT_KEYS[3]?" on":""}" data-s="${SORT_KEYS[3]}">Number of records declared${
        sortTempRd===SORT_KEYS[3]?(dirTempRd==="asc"?" ↑":" ↓"):""}</div>
       <div class="hd num${sortTempRd===SORT_KEYS[4]?" on":""}" data-s="${SORT_KEYS[4]}">Number of physical counterparts${
        sortTempRd===SORT_KEYS[4]?(dirTempRd==="asc"?" ↑":" ↓"):""}</div>`;

    const dtab=document.getElementById("rd-temp-table");
    dtab.innerHTML=document.getElementById("rd-temp-head").outerHTML+
      `${rows.map(d=>`<div class="drow"><div class="dn">${d.name}</div>
        <div class="num">${F(d.sites)}</div><div class="num">${F(d.libs)}</div>
        <div class="num">${F(d.rec)}</div><div class="num">${F(d.phys)}</div></div>`).join("")}`;

    document.getElementById("rd-temp-pager").innerHTML=pager(sorted.length, tempPage, pages, "departments");

    document.querySelectorAll("#rd-temp-table .hd").forEach(el=>el.onclick=()=>{
      const k=el.dataset.s;
      if(sortTempRd===k) dirTempRd=dirTempRd==="asc"?"desc":"asc";
      else{sortTempRd=k;dirTempRd=(k==="name"?"asc":"desc");}
      tempPage=1;
      renderTempTable();
    });
  }

  function init(){
    const filter=document.getElementById("rd-filter");
    filter.innerHTML=`<option value="all">All</option>
      <option value="Permanent">Permanent retention</option>
      <option value="Temporary">Temporary retention</option>`;
    filter.onchange=e=>{rdFilter=e.target.value;drawChart();};

    const periodFilter=document.getElementById("rd-temp-period-filter");
    periodFilter.innerHTML=`<option value="all">All retention periods</option>
      <option value="3">3 years</option>
      <option value="5">5 years</option>
      <option value="7">7 years</option>
      <option value="10">10 years</option>
      <option value="others">Others</option>`;
    periodFilter.onchange=e=>{tempPeriodFilter=e.target.value;tempPage=1;renderTempTable();};

    // Render the retention tables
    renderPermTable();
    renderTempTable();

    // Wire up permanent retention pagination
    wirePager("#rd-perm-pager",pg=>{
      if(pg==="prev"){if(permPage>1)permPage--;}
      else if(pg==="next"){const pages=Math.ceil(PERM_BY_DEPT.length/ROWS_PER_PAGE);if(permPage<pages)permPage++;}
      else permPage=parseInt(pg);
      renderPermTable();
    });

    // Wire up temporary retention pagination
    wirePager("#rd-temp-pager",pg=>{
      if(pg==="prev"){if(tempPage>1)tempPage--;}
      else if(pg==="next"){const pages=Math.ceil(TEMP_BY_DEPT.length/ROWS_PER_PAGE);if(tempPage<pages)tempPage++;}
      else tempPage=parseInt(pg);
      renderTempTable();
    });

    drawChart();
  }

  return {
    summary:{permanent:PERM_REC,temporary:TEMP_REC,due:DATA.DUE_NEXT_12},
    html,init
  };
})();

   Rewritten 17 Aug 2026. This screen printed invented figures: 1,840
   boxes, 9,260 folders, 78 percent of capacity used, retrieval counts
   per location. Not one of them had a source, and the capacity chart
   answered a question the client had asked US, on s68: "Can room
   capacity and % available storage capacity be included?"

   Three facts govern what this dashboard may show:

     s33 is, in full, "RAC suggestions?". The client has not specified
     this screen.
     s67 is a screenshot of the IR Dashboard with "We would also like to
     learn what is available in Opus and how we can apply the features
     for our dashboard", and it puts retrieval in eServe.
     s68 and s69 ARE drawn, with real column headings, so the SHAPE is a
     requirement even though the content is not available.

   So the tables are laid out with the client's own column names, and
   every measure reads "Not captured", because no system this report can
   reach holds a box, a folder, a storage room, a transfer or a
   retrieval. Nothing here is taken from Opus or the IR Dashboard.

   This is deliberately a specification of the ask rather than a mock of

DASHBOARDS.ra=(function(){
  const LOCATIONS=["Archives Room","Records Center","Offsite Storage"];

  /* Data structures for storage and retrieval. All holdings data is illustrative,
     as no system this report reaches holds boxes, folders, storage, or retrieval
     information. The only sourced figure is physical counterparts identified.

  const split=splitTotal;
  const TOTAL_BOXES=1840, TOTAL_FOLDERS=9260, TOTAL_REQUESTS=342;
  const BOX_WEIGHTS=weights(3,41), FOLDER_WEIGHTS=weights(3,42), REQ_WEIGHTS=weights(3,43);
  const boxSplit=split(TOTAL_BOXES,BOX_WEIGHTS), folderSplit=split(TOTAL_FOLDERS,FOLDER_WEIGHTS),
        reqSplit=split(TOTAL_REQUESTS,REQ_WEIGHTS);

  /* Storage data by location (Slide 68: columns are Location, Requests, Requestors-depts,
     Requestors-RMs, Boxes stored, Folders stored, Remarks) */
  const STORE_DATA=LOCATIONS.map((loc,i)=>({
    location:loc,
    requests:reqSplit[i],
    requestors_depts:split(Math.round(78*Math.random()),weights(1,44))[0],
    requestors_rms:split(Math.round(45*Math.random()),weights(1,45))[0],
    boxes:boxSplit[i],
    folders:folderSplit[i],
    remarks:["Active, regular access","High volume transfers","Specialized holdings"][i]
  }));
  const STORE_TOTAL={
    location:"Total",
    requests:STORE_DATA.reduce((a,d)=>a+d.requests,0),
    requestors_depts:STORE_DATA.reduce((a,d)=>a+d.requestors_depts,0),
    requestors_rms:STORE_DATA.reduce((a,d)=>a+d.requestors_rms,0),
    boxes:TOTAL_BOXES,
    folders:TOTAL_FOLDERS,
    remarks:""
  };

  /* Retrieval data by location (Slide 69: columns are Location, Requests, Requestors,
     Boxes retrieved, Folders retrieved, Status, Remarks). Status mix per location. */
  const RETR_DATA=LOCATIONS.map((loc,i)=>{
    const retrReqs=split(Math.round(reqSplit[i]*0.35),weights(1,46))[0];
    const retrBoxes=split(Math.round(boxSplit[i]*0.25),weights(1,47))[0];
    const retrFolders=split(Math.round(folderSplit[i]*0.28),weights(1,48))[0];
    return {
      location:loc,
      requests:retrReqs,
      requestors:split(Math.round(45*Math.random()),weights(1,49))[0],
      boxes_retrieved:retrBoxes,
      folders_retrieved:retrFolders,
      status:["Loan","Return to owner","For Disposal"][i],
      remarks:["Short-term use","Completed project","Approved for disposal"][i]
    };
  });
  const RETR_TOTAL={
    location:"Total",
    requests:RETR_DATA.reduce((a,d)=>a+d.requests,0),
    requestors:RETR_DATA.reduce((a,d)=>a+d.requestors,0),

  /* Capacity metrics: illustrative % used and available space per location */
  const CAPACITY_DATA=LOCATIONS.map((loc,i)=>({
    location:loc,

    get boxes_available(){return this.boxes_max-STORE_DATA[i].boxes;}

  console.assert(STORE_TOTAL.boxes===TOTAL_BOXES,

/* ===================================================================
   Shell: left nav switches which dashboard is mounted. Only one
   dashboard is in the DOM at a time, which is why both can keep their
   original element ids untouched.
   =================================================================== */
function switchTo(key){
  const d=DASHBOARDS[key];
  if(!d)return;
  document.getElementById("view").innerHTML=d.html;
  /* The highlighted nav row is now the only thing that says which view is
     open, so it is the signal the checkers read to prove a tile navigated. */
  document.querySelectorAll("#nav a[data-d]").forEach(a=>a.classList.toggle("on",a.dataset.d===key));
  d.init();
}
document.querySelectorAll("#nav a[data-d]").forEach(a=>a.onclick=()=>switchTo(a.dataset.d));
switchTo("bw");
</script>
