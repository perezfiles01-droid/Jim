<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EDRMS Reporting Suite</title>
<!-- Inline favicon, so a served copy does not 404 on /favicon.ico. A data URI
     keeps it a zero request asset and avoids a binary file in the repo. -->
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%230E1F35'/><rect x='7' y='17' width='4' height='8' fill='%239DB8D2'/><rect x='14' y='12' width='4' height='13' fill='%2300A5A8'/><rect x='21' y='7' width='4' height='18' fill='%230072BC'/></svg>">
<style>

/* ================= styles.css ================= */
/* Shared shell styles for the EDRMS Reporting Suite.
   Tokens, sidebar, header, band, KPI card, panel, pager.
   Anything that differs between dashboards lives in that dashboard's
   own folder instead, because the source prototypes reuse class names
   with different values and inverted series colours. */
  /* ===== shared shell tokens (union of both dashboards) ===== */
  :root{--ink:#10243E;--ink2:#33475F;--blue:#0072BC;--blue-d:#005A96;--teal:#00A5A8;--green:#5CA943;--orange:#E8763C;--greyblue:#9DB8D2;--deepblue:#1B5E82;--bg:#EEF2F6;--card:#fff;--line:#D9E1EA;--mut:#6B7A8C;--nav:#0E1F35;--nav-hi:#16304F;--sans:"Segoe UI",system-ui,-apple-system,Arial,sans-serif;--serif:Georgia,serif;--shadow:0 1px 2px rgba(16,36,62,.06),0 4px 14px rgba(16,36,62,.06)}
  *{box-sizing:border-box;margin:0;padding:0}html,body{height:100%}
  body{font-family:var(--sans);background:var(--bg);color:var(--ink);font-size:14px;display:flex}
  #side{width:236px;min-width:236px;background:var(--nav);color:#C7D3E0;display:flex;flex-direction:column;height:100vh;position:sticky;top:0}
  #side .brand{padding:18px;border-bottom:1px solid rgba(255,255,255,.08)}
  #side .t1{font-family:var(--serif);font-size:18px;color:#fff;line-height:1.25}
  #side .t2{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#7FA8CC;margin-top:4px}
  #side .ver{font-size:10px;color:#5E748C;margin-top:6px}
  nav{flex:1;padding:8px 0}
  .grp{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#5E748C;padding:12px 18px 6px}
  nav a{display:flex;align-items:center;gap:10px;padding:8px 18px;color:#C7D3E0;font-size:13.5px;border-left:3px solid transparent;text-decoration:none}
  nav a[data-d]{cursor:pointer}
  nav a[data-d]:hover{background:var(--nav-hi);color:#fff}
  nav a .ic{width:18px;text-align:center;opacity:.85}
  nav a.on{background:var(--nav-hi);color:#fff;border-left-color:var(--green);font-weight:600}
  nav a.dis{color:#4C6079;cursor:default}nav a.dis .ic{opacity:.5}
  #main{flex:1;min-width:0;display:flex;flex-direction:column}
  header{background:var(--card);border-bottom:1px solid var(--line);padding:12px 22px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;position:sticky;top:0;z-index:20}
  .crumb{font-size:12px;color:var(--mut)}.crumb b{color:var(--ink);font-size:15px;font-family:var(--serif);display:block}
  .spacer{flex:1}
  #asof{font-size:11.5px;color:var(--mut)}
  section{padding:20px 22px 46px}
  .band{background:#E9F0F7;border:1px solid #DAE5F0;border-radius:12px;padding:16px 18px;margin-bottom:16px}
  .band h2{font-family:var(--serif);font-size:17px;color:var(--ink);line-height:1.3}
  .band .bd{font-size:12.5px;color:var(--ink2);margin-top:6px;max-width:900px}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;box-shadow:var(--shadow);cursor:pointer;transition:transform .1s,box-shadow .1s;border-left:4px solid transparent}
  .kpi:hover{transform:translateY(-2px)}
  .kpi.on{border-left-color:var(--blue);box-shadow:0 0 0 2px rgba(0,114,188,.22),var(--shadow)}
  /* A card that is not wired to anything must not look like one that is. No
     pointer, no hover lift, no selected-state rail: it reads as a figure, not a
     control. Every KPI whose panel is always open below it carries .stat. */
  .kpi.stat{cursor:default;border-left-color:#E4EBF3}
  .kpi.stat:hover{transform:none}
  .kpi.stat .val{color:var(--ink)}
  .kpi.stat .sub{font-size:11.5px;color:var(--mut);margin-top:8px;line-height:1.35}
  .kpi .lab{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--mut);line-height:1.3}
  .kpi .val{font-size:30px;font-weight:700;margin-top:8px;font-variant-numeric:tabular-nums;line-height:1.1}
  .kpi .tap{font-size:11px;color:var(--blue);margin-top:8px;font-weight:600}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:18px 20px;margin-bottom:26px}
  .ptitle{font-size:16px;font-weight:700;font-family:var(--serif);margin-bottom:3px}
  .psub{font-size:12px;color:var(--mut);margin-bottom:14px;max-width:900px}
  .muted{color:var(--mut);font-style:italic;font-size:12px}
  .pager{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:12px}
  .pager .pinfo{font-size:12px;color:var(--mut)}
  .pager .pbtns{display:flex;align-items:center;gap:6px}
  .pager button{font:inherit;font-size:12px;font-weight:600;border:1px solid #cfd8e3;background:#fff;color:var(--ink2);border-radius:6px;padding:5px 10px;cursor:pointer}
  .pager button:hover:not(:disabled){border-color:var(--blue);color:var(--blue)}
  .pager button.on{background:var(--blue);border-color:var(--blue);color:#fff}
  .pager button:disabled{opacity:.45;cursor:default}


/* ================= overview.css ================= */
/* Overview: scoped styles. Only loaded shapes under .dash-ov. */
  .dash-ov .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin-bottom:20px}
  .dash-ov .kpi .tap{display:flex;align-items:center;gap:4px}

  /* panel header carries the link through to the detailed dashboard */
  .dash-ov .phead{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:16px}
  .dash-ov .phead .ptitle{margin-bottom:3px}
  .dash-ov .phead .psub{margin-bottom:0}
  .dash-ov .golink{font:inherit;font-size:12px;font-weight:600;border:1px solid var(--blue);color:var(--blue);background:#fff;border-radius:8px;padding:7px 13px;cursor:pointer;white-space:nowrap}
  .dash-ov .golink:hover{background:var(--blue);color:#fff}

  /* a row of chart cards, wrapping on narrow screens */
  .dash-ov .crow{display:flex;gap:18px;flex-wrap:wrap;align-items:stretch}
  .dash-ov .chart{flex:1 1 285px;min-width:285px;background:#F8FAFC;border:1px solid #E4EBF3;border-radius:10px;padding:14px 16px}
  .dash-ov .chart.wide{flex:2 1 380px}
  .dash-ov .ctitle{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--mut);margin-bottom:12px}
  .dash-ov .cwrap{display:flex;gap:14px;align-items:center;flex-wrap:wrap}

  /* donut legend */
  .dash-ov .dleg{flex:1 1 175px;min-width:175px}
  .dash-ov .dlrow{display:grid;grid-template-columns:12px 1fr auto auto;align-items:start;gap:8px;font-size:11.5px;margin-bottom:8px}
  .dash-ov .dlrow .sw{width:12px;height:12px;border-radius:3px;margin-top:2px}
  .dash-ov .dlrow .dlab{color:var(--ink2);line-height:1.35}
  .dash-ov .dlrow .dval{font-weight:700;font-variant-numeric:tabular-nums;color:var(--ink)}
  .dash-ov .dlrow .dpct{color:var(--mut);font-variant-numeric:tabular-nums;min-width:42px;text-align:right}

  /* top N horizontal bars */
  .dash-ov .tbar{display:grid;grid-template-columns:150px 1fr 74px;align-items:center;gap:12px;margin-bottom:9px}
  .dash-ov .tbar .tl b{font-size:12.5px;font-weight:700}
  .dash-ov .tbar .tl small{display:block;color:var(--mut);font-size:10.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .dash-ov .tbar .tt{background:#E9EFF6;border-radius:6px;height:24px;overflow:hidden}
  .dash-ov .tbar .tf{height:24px;background:var(--blue);border-radius:6px;transition:width .6s ease}
  .dash-ov .tbar .tv{text-align:right;font-size:12.5px;font-weight:700;font-variant-numeric:tabular-nums}

  /* two magnitudes compared on a shared scale */
  .dash-ov .gap{margin-bottom:11px}
  .dash-ov .gap .gl{display:flex;justify-content:space-between;font-size:11.5px;color:var(--ink2);margin-bottom:5px}
  .dash-ov .gap .gl b{font-variant-numeric:tabular-nums;color:var(--ink)}
  .dash-ov .gap .gt{background:#E9EFF6;border-radius:6px;height:22px;overflow:hidden}
  .dash-ov .gap .gf{height:22px;border-radius:6px;transition:width .6s ease}
  .dash-ov .callout{background:#EEF5FC;border:1px solid #CFE0F2;border-left:3px solid var(--blue);border-radius:8px;padding:10px 13px;font-size:12px;color:var(--ink2);line-height:1.55;margin-top:12px}
  .dash-ov .callout b{color:var(--ink)}

  /* small stat strip inside a chart card */
  .dash-ov .mini{display:flex;gap:18px;flex-wrap:wrap;margin-top:12px}
  .dash-ov .mini div{font-size:11.5px;color:var(--mut)}
  .dash-ov .mini b{display:block;font-size:17px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums;margin-top:2px}

/* ================= sitesandlibraries.css ================= */
/* Sites and Libraries: scoped styles. Only loaded shapes under .dash-sl. */
  /* ===== Sites and Libraries, scoped ===== */
  .dash-sl .kpis{display:grid;grid-template-columns:repeat(2,minmax(0,320px));gap:16px;margin-bottom:16px}
  @media(max-width:740px){.dash-sl .kpis{grid-template-columns:1fr}}
  .dash-sl .toolbar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:14px;font-size:12.5px;color:var(--mut)}
  .dash-sl .drange{display:inline-flex;align-items:center;gap:6px;border:1px solid #EAD9C8;background:#FDF7F0;border-radius:8px;padding:5px 9px;color:var(--mut)}
  .dash-sl .drange input[type=date]{font:inherit;font-size:12px;border:1px solid #cfd8e3;border-radius:6px;padding:3px 7px;color:var(--ink);background:#fff;height:28px;width:120px}
  .dash-sl .resetbtn{font:inherit;font-size:12px;font-weight:600;border:1px solid var(--blue);color:var(--blue);background:#fff;border-radius:8px;padding:6px 11px;cursor:pointer;display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
  .dash-sl .resetbtn:hover{background:var(--blue);color:#fff}
  .dash-sl select{font:inherit;font-size:12.5px;border:1px solid var(--line);border-radius:7px;padding:5px 9px;background:#fff;color:var(--ink)}
  .dash-sl .tiles{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:14px}
  .dash-sl .tile{background:#F6F9FC;border:1px solid #E4EBF3;border-radius:10px;padding:12px 16px;min-width:180px}
  .dash-sl .tile.hi{border-color:#CFE0F2;background:#EEF5FC}
  .dash-sl .tile .tl{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut)}
  .dash-sl .tile .tv{font-size:24px;font-weight:700;margin-top:5px;font-variant-numeric:tabular-nums}
  /* date range moved to the right of the tiles row */
  .dash-sl .tilesrow{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:14px}
  .dash-sl .tilesrow .tiles{margin-bottom:0}
  .dash-sl .stfilter{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .dash-sl .tmlegend{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:11px;color:var(--mut)}
  .dash-sl .tmlegend .sw{width:22px;height:11px;border-radius:3px}
  .dash-sl .legend{display:flex;gap:16px;font-size:11.5px;color:var(--ink2)}
  .dash-sl .legend .lg{display:inline-flex;align-items:center;gap:6px}
  .dash-sl .legend .sw{width:12px;height:12px;border-radius:3px;display:inline-block}
  .dash-sl .sortwrap{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:14px}
  .dash-sl .sortctl{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .dash-sl .sortctl .lbl{font-size:12px;color:var(--mut)}
  .dash-sl .segctl{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
  .dash-sl .segctl button{font:inherit;font-size:12px;border:none;padding:6px 12px;cursor:pointer;color:var(--ink2);background:#fff;border-left:1px solid var(--line)}
  .dash-sl .segctl button:first-child{border-left:none}
  .dash-sl .segctl button.on{background:var(--blue);color:#fff;font-weight:600}
  .dash-sl .dirbtn{font:inherit;font-size:12px;font-weight:600;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:8px;padding:6px 12px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
  .dash-sl .dirbtn:hover{border-color:var(--blue)}
  .dash-sl .sbar{display:grid;grid-template-columns:200px 1fr 210px;align-items:center;gap:12px;margin-bottom:9px}
  .dash-sl .sbar .sl b{font-size:13px;font-weight:600}.dash-sl .sbar .sl small{display:block;color:var(--mut);font-size:11px}
  .dash-sl .sbar .st{background:#EEF3F8;border-radius:6px;overflow:hidden;display:flex;height:26px}
  .dash-sl .sbar .seg{height:26px;transition:width .5s ease}
  .dash-sl .sbar .seg.e{background:var(--teal)}.dash-sl .sbar .seg.p{background:var(--greyblue)}
  .dash-sl .sbar .single{height:26px;background:var(--blue);border-radius:6px;transition:width .5s ease}
  .dash-sl .sbar .vv{text-align:right;font-size:12.5px;font-variant-numeric:tabular-nums}
  .dash-sl .sbar .vv b{color:var(--ink);font-weight:600}.dash-sl .sbar .vv span{color:var(--mut)}
  /* Site inventory table. A plain grid so Power BI can reproduce it with a
     table visual, with the numeric cells carrying a data bar the way the
     Format and Storage table does. */
  .dash-sl .stab{--sc:206px 70px 210px 88px 78px 98px 112px 92px;display:grid;grid-template-columns:var(--sc);gap:8px 12px;align-items:center;min-width:900px}
  .dash-sl .stab .hd{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);padding-bottom:7px;border-bottom:1px solid var(--line);cursor:pointer;user-select:none;white-space:nowrap}
  .dash-sl .stab .hd.on{color:var(--blue);font-weight:700}
  .dash-sl .stab .hd.num{text-align:right}
  .dash-sl .stab .nm{font-size:13px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .dash-sl .stab .ow{font-size:12px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .dash-sl .stab .dp{font-size:12px;color:var(--mut)}
  .dash-sl .stab .nc{position:relative;height:24px;background:#F3F7FB;border-radius:5px;display:flex;align-items:center;justify-content:flex-end;padding:0 8px;overflow:hidden}
  .dash-sl .stab .nc .nb{position:absolute;left:0;top:0;height:24px;background:#CFE0F2;border-radius:5px;transition:width .5s ease}
  .dash-sl .stab .nc b{position:relative;font-size:12.5px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--ink)}
  .dash-sl .pill{font-size:11px;font-weight:700;border-radius:999px;padding:4px 10px;text-align:center;white-space:nowrap}
  .dash-sl .pill.ok{background:#E7F4EC;color:#1C6B3C}
  .dash-sl .pill.no{background:#FBEEE7;color:#9A4A17}
  .dash-sl .scrollx{overflow-x:auto}
  .dash-sl .ltab{--sc:200px 200px 118px 130px 118px 118px;display:grid;grid-template-columns:var(--sc);gap:8px 12px;align-items:center;min-width:880px}
  .dash-sl .ltab .hd{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);padding-bottom:7px;border-bottom:1px solid var(--line);cursor:pointer;user-select:none;white-space:nowrap}
  .dash-sl .ltab .hd.on{color:var(--blue);font-weight:700}
  .dash-sl .ltab .hd.num{text-align:right}
  .dash-sl .ltab .nm{font-size:13px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .dash-sl .ltab .dp{font-size:12px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .dash-sl .ltab .nc{position:relative;height:24px;background:#F3F7FB;border-radius:5px;display:flex;align-items:center;justify-content:flex-end;padding:0 8px;overflow:hidden}
  .dash-sl .ltab .nc .nb{position:absolute;left:0;top:0;height:24px;background:#CFE0F2;border-radius:5px;transition:width .5s ease}
  .dash-sl .ltab .nc b{position:relative;font-size:12.5px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--ink)}
  .dash-sl .pill.mid{background:#FDF4E3;color:#8A5A12}
  .dash-sl .subtotal{margin-top:12px;font-size:12.5px;color:var(--ink2)}


/* ================= fileplan.css ================= */
/* File Plan: scoped styles. Only loaded shapes under .dash-fp. */
  .dash-fp .kpis{display:grid;grid-template-columns:repeat(2,minmax(0,300px));gap:16px;margin-bottom:16px}
  @media(max-width:740px){.dash-fp .kpis{grid-template-columns:1fr}}
  .dash-fp .fbar{display:grid;grid-template-columns:250px 1fr 58px;align-items:center;gap:12px;margin-bottom:10px}
  .dash-fp .fbar .fl b{font-size:13px;font-weight:600}
  .dash-fp .fbar .fl small{display:block;color:var(--mut);font-size:11px}
  .dash-fp .fbar .ft{background:#EEF3F8;border-radius:6px;overflow:hidden;height:26px}
  .dash-fp .fbar .ff{height:26px;border-radius:6px;background:var(--teal);color:#fff;font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:flex-end;padding-right:9px;font-variant-numeric:tabular-nums;transition:width .5s ease}
  .dash-fp .fbar .fp{text-align:right;font-size:12.5px;color:var(--mut);font-variant-numeric:tabular-nums}

/* ================= retention.css ================= */
/* Retention: scoped styles. Only loaded shapes under .dash-rt. */
  .dash-rt .kpis{display:grid;grid-template-columns:repeat(2,minmax(0,340px));gap:16px;margin-bottom:16px}
  @media(max-width:740px){.dash-rt .kpis{grid-template-columns:1fr}}
  .dash-rt .tiles{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:14px}
  .dash-rt .tile{background:#F6F9FC;border:1px solid #E4EBF3;border-radius:10px;padding:12px 16px;min-width:180px}
  .dash-rt .tile.hi{border-color:#CFE0F2;background:#EEF5FC}
  .dash-rt .tile .tl{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut)}
  .dash-rt .tile .tv{font-size:24px;font-weight:700;margin-top:5px;font-variant-numeric:tabular-nums}
  .dash-rt .scrollx{overflow-x:auto}
  .dash-rt .dtab{--dc:186px 190px 116px 152px 128px 132px;display:grid;grid-template-columns:var(--dc);gap:8px 12px;align-items:center;min-width:900px}
  .dash-rt .dtab .hd{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);padding-bottom:7px;border-bottom:1px solid var(--line);cursor:pointer;user-select:none;white-space:nowrap}
  .dash-rt .dtab .hd.on{color:var(--blue);font-weight:700}
  .dash-rt .dtab .hd.num{text-align:right}
  .dash-rt .dtab .nm{font-size:13px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .dash-rt .dtab .dp{font-size:12px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .dash-rt .dtab .dt{font-size:12.5px;font-variant-numeric:tabular-nums;color:var(--ink)}
  .dash-rt .dtab .dt.far{color:var(--mut)}
  .dash-rt .dtab .nc{position:relative;height:24px;background:#F3F7FB;border-radius:5px;display:flex;align-items:center;justify-content:flex-end;padding:0 8px;overflow:hidden}
  .dash-rt .dtab .nc .nb{position:absolute;left:0;top:0;height:24px;background:#CFE0F2;border-radius:5px;transition:width .5s ease}
  .dash-rt .dtab .nc b{position:relative;font-size:12.5px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--ink)}
  .dash-rt .lbar{display:grid;grid-template-columns:236px 1fr 58px;align-items:center;gap:12px;margin-bottom:9px}
  .dash-rt .lbar .ll b{font-size:13px;font-weight:600}
  .dash-rt .lbar .ll small{display:block;color:var(--mut);font-size:11px}
  .dash-rt .lbar .lt{background:#EEF3F8;border-radius:6px;overflow:hidden;height:26px}
  .dash-rt .lbar .lf{height:26px;border-radius:6px;color:#fff;font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:flex-end;padding-right:9px;font-variant-numeric:tabular-nums;transition:width .5s ease}
  .dash-rt .lbar .lp{text-align:right;font-size:12.5px;color:var(--mut);font-variant-numeric:tabular-nums}


/* ================= recordsmanagement.css ================= */
/* Records Management: scoped styles. Only loaded shapes under .dash-rm. */
  /* ===== Records Management, scoped ===== */
  .dash-rm .kpis{display:grid;grid-template-columns:repeat(2,minmax(0,300px));gap:16px;margin-bottom:16px}

<script>
/* Load order below matters in two places. The DASHBOARDS registry is created
   first, format and storage asserts its file total against records management
   so it follows it, and the nav wiring runs last.
   Each dashboard occupies one clearly banner marked block. Editing a dashboard
   means editing inside its block and nothing else, which is what keeps a change
   to one dashboard from disturbing another. */

/* =================================================================
   core.js
   ================================================================= */
/* ===================================================================
   Shared helpers. Only the helpers that were byte identical in both
   source prototypes live here. Anything that differed (pager, the
   deptOptions builders, the date range readers) stays inside its own
   dashboard closure so each keeps its original behaviour.
   =================================================================== */
const F=n=>Number(Math.round(n)).toLocaleString();
function wirePager(scope,onGo){document.querySelectorAll(scope+" .pager button[data-pg]").forEach(b=>b.onclick=()=>onGo(b.dataset.pg));}

const DASHBOARDS={};


/* =================================================================
   sitesandlibraries.js
   ================================================================= */
/* ===================================================================
   Sites and Libraries
   Source: EDRMS_Sites_and_Libraries_Dashboard_v1.html
   =================================================================== */
DASHBOARDS.sl=(function(){
  /* --- pager: this variant prints the row count even on a single page --- */
  function pager(total,page,pages,noun){
    if(pages<=1)return `<div class="pager"><div class="pinfo">Showing 1 to ${F(total)} of ${F(total)} ${noun}</div><div></div></div>`;
    const win=[];for(let p=1;p<=pages;p++){if(p===1||p===pages||Math.abs(p-page)<=1)win.push(p);}
    let nums="",last=0;win.forEach(p=>{if(last&&p-last>1)nums+=`<span style="color:var(--mut)">…</span>`;nums+=`<button class="${p===page?'on':''}" data-pg="${p}">${p}</button>`;last=p;});
    const from=(page-1)*10+1,to=Math.min(total,page*10);
    return `<div class="pager"><div class="pinfo">Showing ${from} to ${to} of ${F(total)} ${noun}</div>
      <div class="pbtns"><button data-pg="prev" ${page===1?'disabled':''}>‹ Prev</button>${nums}<button data-pg="next" ${page===pages?'disabled':''}>Next ›</button></div></div>`;
  }
  function rangeFactor(sId,eId){
    const s=(document.getElementById(sId)||{}).value||"",e=(document.getElementById(eId)||{}).value||"";
    if(s===""&&e==="")return 1;
    const sd=s?new Date(s+"T00:00:00"):null, ed=e?new Date(e+"T00:00:00"):null;
    let sM=(sd&&!isNaN(sd))?(sd.getFullYear()<2026?0:sd.getFullYear()>2026?12:sd.getMonth()):0;
    let eM=(ed&&!isNaN(ed))?(ed.getFullYear()>2026?11:ed.getFullYear()<2026?-1:ed.getMonth()):11;
    const months=Math.min(11,eM)-Math.max(0,sM)+1;
    return Math.max(0,Math.min(1,months/12));
  }

  /* ===== data ===== */
  const SITEDEPTS=[
   ["ITD","Information Technology",40],["SARD","South Asia Regional",36],["OSFG","Sovereign Operations",32],
   ["FIN","Finance",28],["PARD","Procurement and Admin",26],["HRD","Human Resources",24],
   ["SERD","Southeast Asia",22],["OGC","General Counsel",21],["EARD","East Asia Regional",20],
   ["BRM","Budget and Mgmt Services",19],["CWRD","Central and West Asia",17],["PSOD","Private Sector Operations",15],
   ["SPD","Strategy and Policy",12],["SDCC","Sustainable Dev and Climate",10],["OAS","Administrative Services",8],
  ];
  const DNAME={};SITEDEPTS.forEach(d=>DNAME[d[0]]=d[1]);
  const ALLTIME_SITES=1057;

  /* [lib, site, dept, docs, records, storageGB, idleDays, newRecords]
     idleDays    days since the library was last touched. Graph returns
                 lastModifiedDateTime on every drive, from the same
                 GET /sites/{id}/drives call that already supplies LibraryCount.
     newRecords  records declared during the reporting period. Already in the
                 data: every record carries CreatedDate, so the growth rate
                 needs no snapshot history. */
  const LIBS=[
   ["Final Documents","ITD Records Site","ITD",3200,640,4.2,3,74],
   ["Loan Agreements","FIN Treasury Site","FIN",2400,384,6.8,11,41],
   ["Correspondence","PARD Procurement Site","PARD",2100,210,1.9,6,28],
   ["Board Papers","OGC Legal Site","OGC",1800,540,5.4,2,63],
   ["Country Reports","SARD Ops Site","SARD",1500,450,3.1,9,52],
   ["Field Reports","SERD Ops Site","SERD",1300,286,7.2,17,31],
   ["Project Completion","OSFG Country Site","OSFG",1200,300,8.9,24,26],
   ["Case Files","OGC Compliance Site","OGC",1000,280,2.4,41,19],
   ["Policies","HRD People Site","HRD",900,315,0.8,8,34],
   ["Minutes","BRM Budget Site","BRM",700,245,0.5,33,22],
   ["Legal Opinions","OGC Advisory Site","OGC",640,150,0.45,118,4],
   ["Audit Reports","CWRD Ops Site","CWRD",580,120,0.42,96,7],
   ["Investment Memos","PSOD Investments Site","PSOD",520,180,0.38,54,12],
   ["Climate Briefs","SDCC Climate Site","SDCC",460,95,0.35,142,2],
   ["Admin Records","OAS Facilities Site","OAS",400,88,0.30,207,0],
  ];
  const TOTAL_RECORDS=LIBS.reduce((a,l)=>a+l[4],0);
  const TOTAL_GB=LIBS.reduce((a,l)=>a+l[5],0);

  /* Library health. Two thresholds because the client asks for both: 90 days
     marks a library as inactive, 180 flags it as long dormant. */
  const LIB_IDLE=90, LIB_DORMANT=180;
  const LIBS_ACTIVE=LIBS.filter(l=>l[6]<=LIB_IDLE).length;
  const LIBS_INACTIVE=LIBS.filter(l=>l[6]>LIB_IDLE).length;
  const LIBS_DORMANT=LIBS.filter(l=>l[6]>LIB_DORMANT).length;

  /* Growth rate = records declared during the period, over records held at the
     start of it. No snapshot history needed: every record carries CreatedDate,
     so records at the start is simply the total minus those declared since. */
  const NEW_RECORDS=LIBS.reduce((a,l)=>a+l[7],0);
  const RECORDS_AT_START=TOTAL_RECORDS-NEW_RECORDS;
  const GROWTH_RATE=NEW_RECORDS/RECORDS_AT_START;
  console.assert(RECORDS_AT_START>0,"Records at the start of the period must be positive for a growth rate to mean anything");

  /* Site inventory. Every column here maps to a call already run against the
     7rkd12 test tenant, which is the whole reason this section exists:
       owner      Get-PnPTenantSite, 1,683 of 1,702 sites carry one
       libraries  GET /sites/{id}/drives, counted
       users      GET /sites/{id}/analytics/allTime, the actorCount field
       visits     the M365 site usage report, Page View Count
       idleDays   the same report, derived from Last Activity Date
     [site, dept, owner, libraries, users, visits, idleDays] */
  const SITES=[
   ["ITD Records Site","ITD","a.mendoza@adb.org",12,86,4210,3],
   ["FIN Treasury Site","FIN","r.tan@adb.org",9,64,3180,5],
   ["PARD Procurement Site","PARD","j.cruz@adb.org",11,52,2740,2],
   ["OGC Legal Site","OGC","m.reyes@adb.org",8,71,2510,6],
   ["SARD Ops Site","SARD","l.fernandez@adb.org",14,58,2360,11],
   ["SERD Ops Site","SERD","p.santos@adb.org",7,43,1920,9],
   ["OSFG Country Site","OSFG","c.delacruz@adb.org",10,39,1640,17],
   ["OGC Compliance Site","OGC","m.reyes@adb.org",6,34,1425,24],
   ["HRD People Site","HRD","s.villanueva@adb.org",9,47,1310,8],
   ["BRM Budget Site","BRM","d.ramos@adb.org",5,28,980,33],
   ["OGC Advisory Site","OGC","m.reyes@adb.org",4,19,760,118],
   ["CWRD Ops Site","CWRD","k.aquino@adb.org",7,22,640,96],
   ["PSOD Investments Site","PSOD","e.navarro@adb.org",6,31,585,41],
   ["SDCC Climate Site","SDCC","t.bautista@adb.org",5,16,430,142],
   ["OAS Facilities Site","OAS","f.gutierrez@adb.org",3,11,290,207],
  ];
  /* The inactivity rule. 90 days with no activity, read straight off Last
     Activity Date. Ownerless sites are a different question and deliberately
     out of scope, so this is idle time only and is named for what it measures. */
  const IDLE_DAYS=90;
  const ACTIVE_SITES=SITES.filter(s=>s[6]<=IDLE_DAYS).length;
  const INACTIVE_SITES=SITES.length-ACTIVE_SITES;
  const SITE_LIBRARIES=SITES.reduce((a,s)=>a+s[3],0);

  /* Libraries holding no declared records. Not a scan job: enumerate libraries
     from GET /sites/{id}/drives, then subtract the distinct ListId values
     present in Records. ListId is verified to match SharePoint's own list GUID,
     so the join is safe. A library here is not necessarily empty; it may hold
     documents nobody has declared, which is exactly what makes it worth
     showing. */
  const LIBS_WITH_RECORDS=78;
  const LIBS_NO_RECORDS=SITE_LIBRARIES-LIBS_WITH_RECORDS;
  console.assert(LIBS_WITH_RECORDS<=SITE_LIBRARIES,"Libraries holding records cannot exceed the libraries counted");
  console.assert(LIBS_WITH_RECORDS>=LIBS.length,"The sampled libraries all hold records, so the total cannot be lower");


  /* ===== treemap ===== */
  function squarify(items,x,y,w,h){
    const area=w*h,sum=items.reduce((a,b)=>a+b.v,0)||1;
    let rem=items.map(it=>({...it,area:it.v/sum*area})),R=[],rx=x,ry=y,rw=w,rh=h;
    function worst(a,side){const s=a.reduce((p,q)=>p+q,0),mx=Math.max(...a),mn=Math.min(...a);return Math.max(side*side*mx/(s*s),(s*s)/(side*side*mn));}
    while(rem.length){const side=Math.min(rw,rh);let row=[rem[0]],wr=worst(row.map(z=>z.area),side);
      while(row.length<rem.length){const t=row.concat([rem[row.length]]);const w3=worst(t.map(z=>z.area),side);if(w3>wr)break;row=t;wr=w3;}
      const ra=row.reduce((a,b)=>a+b.area,0);
      if(rw>=rh){const cw=ra/rh;let cy=ry;row.forEach(z=>{const ch=z.area/cw;R.push({...z,x:rx,y:cy,w:cw,h:ch});cy+=ch;});rx+=cw;rw-=cw;}
      else{const rhh=ra/rw;let cx=rx;row.forEach(z=>{const cwd=z.area/rhh;R.push({...z,x:cx,y:ry,w:cwd,h:rhh});cx+=cwd;});ry+=rhh;rh-=rhh;}
      rem=rem.slice(row.length);}
    return R;
  }
  function shade(v,mn,mx){const t=mx>mn?(v-mn)/(mx-mn):0.6;const L=[156,195,236],D=[8,52,90];const c=i=>Math.round(L[i]+(D[i]-L[i])*t);return `rgb(${c(0)},${c(1)},${c(2)})`;}
  function darkText(v,mn,mx){const t=mx>mn?(v-mn)/(mx-mn):0.6;return t<0.42;}

  let sitePage=1;
  function renderS1(){
    document.getElementById("s1-detail").innerHTML=`<div class="panel">
      <div class="ptitle">Sites created by department</div>
      <div class="psub">Each block is a department, sized by the number of compliant sites created. Darker means more sites.</div>
      <div class="tilesrow">
        <div class="tiles">
          <div class="tile"><div class="tl">Total sites created</div><div class="tv">${F(ALLTIME_SITES)}</div></div>
          <div class="tile hi"><div class="tl">Total sites created by date range</div><div class="tv" id="st-tile2">…</div></div>
        </div>
        <div class="stfilter">
          <div class="drange">Date range <input type="date" id="st-s"> to <input type="date" id="st-e"></div>
          <button class="resetbtn" id="st-reset"><i>↺</i> Reset filter</button>
        </div>
      </div>
      <div id="st-treemap"></div>
      <div class="tmlegend"><span>Fewer sites</span><span class="sw" style="background:rgb(156,195,236)"></span><span class="sw" style="background:rgb(120,163,201)"></span><span class="sw" style="background:rgb(84,120,152)"></span><span class="sw" style="background:rgb(8,52,90)"></span><span>More sites</span></div>
      <div id="st-pager"></div></div>`;
    document.getElementById("st-s").onchange=()=>{sitePage=1;drawTreemap();};
    document.getElementById("st-e").onchange=()=>{sitePage=1;drawTreemap();};
    document.getElementById("st-reset").onclick=()=>{document.getElementById("st-s").value="";document.getElementById("st-e").value="";sitePage=1;drawTreemap();};
    drawTreemap();
  }
  function drawTreemap(){
    const factor=rangeFactor("st-s","st-e");
    const depts=SITEDEPTS.map(d=>({label:d[0],name:d[1],v:Math.max(1,Math.round(d[2]*factor))})).sort((a,b)=>b.v-a.v);
    document.getElementById("st-tile2").textContent=F(depts.reduce((a,b)=>a+b.v,0));
    const pages=Math.ceil(depts.length/10);if(sitePage>pages)sitePage=pages;
    const page=depts.slice((sitePage-1)*10,sitePage*10);
    const mn=Math.min(...page.map(d=>d.v)),mx=Math.max(...page.map(d=>d.v));
    const rects=squarify(page,0,0,900,400);
    let svg="";
    rects.forEach(r=>{const x=r.x+3,y=r.y+3,w=r.w-6,h=r.h-6;const t=darkText(r.v,mn,mx),tc=t?"#082F4E":"#FFFFFF",sc=t?"#2C567A":"#DCEBFA";
      svg+=`<g><rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${w.toFixed(1)}" height="${h.toFixed(1)}" rx="7" fill="${shade(r.v,mn,mx)}"><title>${r.name}: ${r.v} sites</title></rect>`;
      svg+=`<text x="${(x+14).toFixed(1)}" y="${(y+27).toFixed(1)}" font-size="15" font-weight="700" fill="${tc}">${r.label}</text>`;
      svg+=`<text x="${(x+14).toFixed(1)}" y="${(y+44).toFixed(1)}" font-size="11" fill="${sc}">${r.name}</text>`;
      svg+=`<text x="${(x+14).toFixed(1)}" y="${(y+h-15).toFixed(1)}" font-size="26" font-weight="700" fill="${tc}" style="font-variant-numeric:tabular-nums">${r.v}</text></g>`;
    });
    document.getElementById("st-treemap").innerHTML=`<svg viewBox="0 0 900 400" width="100%" style="display:block;max-height:430px">${svg}</svg>`;
    document.getElementById("st-pager").innerHTML=pager(depts.length,sitePage,pages,"departments");
    wirePager("#st-pager",v=>{sitePage=v==="prev"?Math.max(1,sitePage-1):v==="next"?Math.min(pages,sitePage+1):+v;drawTreemap();});
  }

  /* ===== libraries ===== */
  function deptOptions(sel){const codes=[...new Set(LIBS.map(l=>l[2]))];return `<option value="all">All departments</option>`+codes.map(c=>`<option value="${c}" ${sel===c?"selected":""}>${c} - ${DNAME[c]||c}</option>`).join("");}
  let deptDecl="all",fieldDecl="docs",dirDecl="desc",pageDecl=1;
  let deptStor="all",fieldStor="gb",dirStor="desc",pageStor=1;
  let curS2="decl";

  function renderS2(which){
    curS2=which;
    document.querySelectorAll("#s2-kpis .kpi").forEach(k=>k.classList.toggle("on",k.dataset.k===which));
    const box=document.getElementById("s2-detail");
    if(which==="decl"){
      box.innerHTML=`<div class="panel">
        <div class="ptitle">Libraries declaration rate</div>
        <div class="psub">How much of each library's content has been declared as records. Bars stack the declared portion over the not yet declared portion, sized to total documents.</div>
        <div class="toolbar">
          <span>Department <select id="decl-dept">${deptOptions(deptDecl)}</select></span>
          <div class="drange">Date range <input type="date" id="decl-s"> to <input type="date" id="decl-e"></div>
          <button class="resetbtn" id="decl-reset"><i>↺</i> Reset filter</button>
        </div>
        <div class="sortwrap">
          <div class="legend"><span class="lg"><span class="sw" style="background:var(--teal)"></span>Declared as records</span><span class="lg"><span class="sw" style="background:var(--greyblue)"></span>Not yet declared</span></div>
          <div class="sortctl"><span class="lbl">Sort by</span>
            <div class="segctl" id="decl-field"><button data-f="docs">Documents</button><button data-f="rec">Records</button><button data-f="rate">Rate</button></div>
            <button class="dirbtn" id="decl-dir"></button></div>
        </div>
        <div id="decl-rows"></div><div id="decl-pager"></div></div>`;
      document.getElementById("decl-dept").onchange=e=>{deptDecl=e.target.value;pageDecl=1;drawDecl();};
      document.getElementById("decl-s").onchange=()=>{pageDecl=1;drawDecl();};
      document.getElementById("decl-e").onchange=()=>{pageDecl=1;drawDecl();};
      document.getElementById("decl-reset").onclick=()=>{deptDecl="all";fieldDecl="docs";dirDecl="desc";pageDecl=1;document.getElementById("decl-dept").value="all";document.getElementById("decl-s").value="";document.getElementById("decl-e").value="";drawDecl();};
      document.querySelectorAll("#decl-field button").forEach(b=>b.onclick=()=>{fieldDecl=b.dataset.f;pageDecl=1;drawDecl();});
      document.getElementById("decl-dir").onclick=()=>{dirDecl=dirDecl==="desc"?"asc":"desc";drawDecl();};
      drawDecl();
    }else{
      box.innerHTML=`<div class="panel">
        <div class="ptitle">Largest libraries by storage</div>
        <div class="psub">Libraries ranked by total storage consumed. Storage per library is the sum of its file sizes.</div>
        <div class="toolbar">
          <span>Department <select id="stor-dept">${deptOptions(deptStor)}</select></span>
          <div class="drange">Date range <input type="date" id="stor-s"> to <input type="date" id="stor-e"></div>
          <button class="resetbtn" id="stor-reset"><i>↺</i> Reset filter</button>
        </div>
        <div class="sortwrap"><span></span>
          <div class="sortctl"><span class="lbl">Sort by</span>
            <div class="segctl" id="stor-field"><button data-f="gb">Storage</button><button data-f="docs">Documents</button><button data-f="avg">Avg file size</button></div>
            <button class="dirbtn" id="stor-dir"></button></div>
        </div>
        <div id="stor-rows"></div><div id="stor-pager"></div></div>`;
      document.getElementById("stor-dept").onchange=e=>{deptStor=e.target.value;pageStor=1;drawStor();};
      document.getElementById("stor-s").onchange=()=>{pageStor=1;drawStor();};
      document.getElementById("stor-e").onchange=()=>{pageStor=1;drawStor();};
      document.getElementById("stor-reset").onclick=()=>{deptStor="all";fieldStor="gb";dirStor="desc";pageStor=1;document.getElementById("stor-dept").value="all";document.getElementById("stor-s").value="";document.getElementById("stor-e").value="";drawStor();};
      document.querySelectorAll("#stor-field button").forEach(b=>b.onclick=()=>{fieldStor=b.dataset.f;pageStor=1;drawStor();});
      document.getElementById("stor-dir").onclick=()=>{dirStor=dirStor==="desc"?"asc":"desc";drawStor();};
      drawStor();
    }
  }
  function paintSeg(scope,field){document.querySelectorAll(scope+" button").forEach(b=>b.classList.toggle("on",b.dataset.f===field));}
  function drawDecl(){
    const f=rangeFactor("decl-s","decl-e");
    let rows=LIBS.filter(l=>deptDecl==="all"||l[2]===deptDecl).map(l=>({lib:l[0],site:l[1],docs:Math.round(l[3]*f),rec:Math.round(l[4]*f)}));
    const val={docs:r=>r.docs,rec:r=>r.rec,rate:r=>r.docs?r.rec/r.docs:0};
    rows.sort((a,b)=>dirDecl==="desc"?val[fieldDecl](b)-val[fieldDecl](a):val[fieldDecl](a)-val[fieldDecl](b));
    paintSeg("#decl-field",fieldDecl);
    document.getElementById("decl-dir").innerHTML=(dirDecl==="desc"?'▼ Highest first':'▲ Lowest first');
    const mx=Math.max(...rows.map(r=>r.docs),1);
    const pages=Math.max(1,Math.ceil(rows.length/10));if(pageDecl>pages)pageDecl=pages;
    const pg=rows.slice((pageDecl-1)*10,pageDecl*10);
    document.getElementById("decl-rows").innerHTML=pg.map(r=>{
      const tot=100*r.docs/mx, tealW=r.docs?100*r.rec/mx:0, greyW=r.docs?100*(r.docs-r.rec)/mx:0, rate=r.docs?Math.round(r.rec/r.docs*100):0;
      return `<div class="sbar"><div class="sl"><b>${r.lib}</b><small>${r.site}</small></div>
        <div class="st"><div class="seg e" style="width:${tealW}%"></div><div class="seg p" style="width:${greyW}%"></div></div>
        <div class="vv"><b>${F(r.docs)}</b><span> docs · ${F(r.rec)} rec · ${rate}%</span></div></div>`;}).join("");
    document.getElementById("decl-pager").innerHTML=pager(rows.length,pageDecl,pages,"libraries");
    wirePager("#decl-pager",v=>{pageDecl=v==="prev"?Math.max(1,pageDecl-1):v==="next"?Math.min(pages,pageDecl+1):+v;drawDecl();});
  }
  function drawStor(){
    const f=rangeFactor("stor-s","stor-e");
    let rows=LIBS.filter(l=>deptStor==="all"||l[2]===deptStor).map(l=>({lib:l[0],site:l[1],docs:Math.round(l[3]*f),gb:l[5]*f}));
    const val={gb:r=>r.gb,docs:r=>r.docs,avg:r=>r.docs?r.gb*1024/r.docs:0};
    rows.sort((a,b)=>dirStor==="desc"?val[fieldStor](b)-val[fieldStor](a):val[fieldStor](a)-val[fieldStor](b));
    paintSeg("#stor-field",fieldStor);
    document.getElementById("stor-dir").innerHTML=(dirStor==="desc"?'▼ Highest first':'▲ Lowest first');
    const mx=Math.max(...rows.map(r=>r.gb),0.1);
    const pages=Math.max(1,Math.ceil(rows.length/10));if(pageStor>pages)pageStor=pages;
    const pg=rows.slice((pageStor-1)*10,pageStor*10);
    document.getElementById("stor-rows").innerHTML=pg.map(r=>{
      const w=100*r.gb/mx, avg=r.docs?(r.gb*1024/r.docs).toFixed(1):"0.0";
      return `<div class="sbar"><div class="sl"><b>${r.lib}</b><small>${r.site}</small></div>
        <div class="st" style="background:#EEF3F8"><div class="single" style="width:${Math.max(4,w)}%"></div></div>
        <div class="vv"><b>${r.gb.toFixed(1)} GB</b><span> · ${F(r.docs)} files · ${avg} MB avg</span></div></div>`;}).join("");
    document.getElementById("stor-pager").innerHTML=pager(rows.length,pageStor,pages,"libraries");
    wirePager("#stor-pager",v=>{pageStor=v==="prev"?Math.max(1,pageStor-1):v==="next"?Math.min(pages,pageStor+1):+v;drawStor();});
  }

  /* ===== site inventory ===== */
  /* Sort keys line up with the SITES columns so the header click needs no
     lookup table. idleDays sorts ascending by default because "most recently
     active first" is what a reader expects from a Last activity column. */
  const SCOLS=[
    {k:"name", i:0, lab:"Site",          num:false},
    {k:"dept", i:1, lab:"Dept",          num:false},
    {k:"owner",i:2, lab:"Site owner",    num:false},
    {k:"libs", i:3, lab:"Libraries",     num:true},
    {k:"users",i:4, lab:"Users",         num:true},
    {k:"visits",i:5,lab:"Visits",        num:true},
    {k:"idle", i:6, lab:"Last activity", num:true},
  ];
  let sortSite="visits",dirSite="desc";
  function renderS3(){
    document.getElementById("s3-detail").innerHTML=`<div class="panel">
      <div class="ptitle">Every compliant site, its owner and its activity</div>
      <div class="psub">Click any column heading to sort. Users counts distinct people who opened something in the site; visits counts page views. A site is inactive once it has had no activity for ${IDLE_DAYS} days.</div>
      <div class="tiles">
        <div class="tile"><div class="tl">Sites listed</div><div class="tv">${F(SITES.length)}</div></div>
        <div class="tile"><div class="tl">Libraries across them</div><div class="tv">${F(SITE_LIBRARIES)}</div></div>
        <div class="tile hi"><div class="tl">Inactive</div><div class="tv">${F(INACTIVE_SITES)}</div></div>
      </div>
      <div class="scrollx"><div class="stab" id="st-table"></div></div></div>`;
    drawSites();
  }
  function drawSites(){
    const col=SCOLS.find(c=>c.k===sortSite);
    const rows=[...SITES].sort((a,b)=>{
      const x=a[col.i],y=b[col.i];
      const cmp=col.num?x-y:String(x).localeCompare(String(y));
      return dirSite==="asc"?cmp:-cmp;
    });
    const mx={};[3,4,5,6].forEach(i=>mx[i]=Math.max(...SITES.map(s=>s[i])));
    let h="";
    SCOLS.forEach(c=>{
      const arrow=sortSite===c.k?(dirSite==="asc"?" ↑":" ↓"):"";
      h+=`<div class="hd${c.num?" num":""}${sortSite===c.k?" on":""}" data-s="${c.k}">${c.lab}${arrow}</div>`;
    });
    h+=`<div class="hd">Status</div>`;
    rows.forEach(s=>{
      const cell=(i,txt)=>`<div class="nc"><div class="nb" style="width:${(s[i]/mx[i]*100).toFixed(1)}%"></div><b>${txt}</b></div>`;
      const idle=s[6]>IDLE_DAYS;
      h+=`<div class="nm" title="${s[0]}">${s[0]}</div>`;
      h+=`<div class="dp">${s[1]}</div>`;
      h+=`<div class="ow" title="${s[2]}">${s[2]}</div>`;
      h+=cell(3,F(s[3]))+cell(4,F(s[4]))+cell(5,F(s[5]))+cell(6,s[6]+"d ago");
      h+=`<div class="pill ${idle?"no":"ok"}">${idle?"Inactive":"Active"}</div>`;
    });
    /* Eight grid columns: the seven sortable ones plus Status, which has no
       sort key of its own because it is derived from idleDays. */
    const t=document.getElementById("st-table");
    t.innerHTML=h;
    t.querySelectorAll(".hd[data-s]").forEach(hd=>hd.onclick=()=>{
      const k=hd.dataset.s;
      if(sortSite===k)dirSite=dirSite==="asc"?"desc":"asc";
      else{sortSite=k;dirSite=(k==="idle"||k==="name"||k==="dept"||k==="owner")?"asc":"desc";}
      drawSites();
    });
  }

  /* ===== library health ===== */
  let sortLib="idle",dirLib="desc";
  const LCOLS=[
    {k:"lib",   i:0,lab:"Library",        num:false},
    {k:"site",  i:1,lab:"Site",           num:false},
    {k:"recs",  i:4,lab:"Records held",   num:true},
    {k:"new",   i:7,lab:"New this period",num:true},
    {k:"idle",  i:6,lab:"Last activity",  num:true},
  ];
  function renderS4(){
    document.getElementById("s4-detail").innerHTML=`<div class="panel">
      <div class="ptitle">Library activity and growth</div>
      <div class="psub">Click any column heading to sort. Last activity is how long ago anything in the library changed. New this period counts records declared during the reporting period, which is what the growth rate divides by the holding at the start.</div>
      <div class="tiles">
        <div class="tile"><div class="tl">Active, under ${LIB_IDLE} days</div><div class="tv">${F(LIBS_ACTIVE)}</div></div>
        <div class="tile hi"><div class="tl">Inactive, over ${LIB_IDLE} days</div><div class="tv">${F(LIBS_INACTIVE)}</div></div>
        <div class="tile"><div class="tl">Long dormant, over ${LIB_DORMANT} days</div><div class="tv">${F(LIBS_DORMANT)}</div></div>
        <div class="tile"><div class="tl">No declared records</div><div class="tv">${F(LIBS_NO_RECORDS)}</div></div>
        <div class="tile"><div class="tl">Growth rate</div><div class="tv">${(GROWTH_RATE*100).toFixed(1)}%</div></div>
      </div>
      <div class="scrollx"><div class="ltab" id="lib-table"></div></div>
      <div class="subtotal">${F(NEW_RECORDS)} records declared this period against ${F(RECORDS_AT_START)} held at the start, a growth rate of ${(GROWTH_RATE*100).toFixed(1)} percent.<br>
        ${F(LIBS_NO_RECORDS)} of the ${F(SITE_LIBRARIES)} libraries hold no declared records at all. Some are genuinely empty; the rest hold documents nobody has declared, and those are the ones worth looking at.</div></div>`;
    drawLibs();
  }
  function drawLibs(){
    const col=LCOLS.find(c=>c.k===sortLib);
    const rows=[...LIBS].sort((a,b)=>{
      const x=a[col.i],y=b[col.i];
      const cmp=col.num?x-y:String(x).localeCompare(String(y));
      return dirLib==="asc"?cmp:-cmp;
    });
    const mx={};[4,7,6].forEach(i=>mx[i]=Math.max(...LIBS.map(l=>l[i]),1));
    let h="";
    LCOLS.forEach(c=>{
      const arrow=sortLib===c.k?(dirLib==="asc"?" ↑":" ↓"):"";
      h+=`<div class="hd${c.num?" num":""}${sortLib===c.k?" on":""}" data-s="${c.k}">${c.lab}${arrow}</div>`;
    });
    h+=`<div class="hd">Status</div>`;
    rows.forEach(l=>{
      const cell=(i,txt)=>`<div class="nc"><div class="nb" style="width:${(l[i]/mx[i]*100).toFixed(1)}%"></div><b>${txt}</b></div>`;
      /* Three states, not two: a library over the dormant threshold is a
         different conversation from one that has merely gone quiet. */
      const state=l[6]>LIB_DORMANT?["no","Long dormant"]:l[6]>LIB_IDLE?["mid","Inactive"]:["ok","Active"];
      h+=`<div class="nm" title="${l[0]}">${l[0]}</div><div class="dp">${l[1]}</div>`;
      h+=cell(4,F(l[4]))+cell(7,F(l[7]))+cell(6,l[6]+"d ago");
      h+=`<div class="pill ${state[0]}">${state[1]}</div>`;
    });
    const t=document.getElementById("lib-table");
    t.innerHTML=h;
    t.querySelectorAll(".hd[data-s]").forEach(hd=>hd.onclick=()=>{
      const k=hd.dataset.s;
      if(sortLib===k)dirLib=dirLib==="asc"?"desc":"asc";
      else{sortLib=k;dirLib=(k==="lib"||k==="site")?"asc":"desc";}
      drawLibs();
    });
  }

  const html=`<section class="dash-sl">
    <div class="band">
      <h2>Compliant site rollout</h2>
      <div class="bd">How many EDRMS compliant sites have been created, and how new site creation is spread across departments.</div>
    </div>
    <div class="kpis" id="s1-kpis">
      <div class="kpi stat"><div class="lab">Total EDRMS Compliant Sites Created</div><div class="val">1,057</div><div class="sub">Across ${SITEDEPTS.length} departments. Placeholder figure, not measured</div></div>
    </div>
    <div id="s1-detail"></div>

    <div class="band">
      <h2>Library adoption and volume</h2>
      <div class="bd">How thoroughly libraries are declaring records, and which libraries hold the most content.</div>
    </div>
    <div class="kpis" id="s2-kpis">
      <div class="kpi on" data-k="decl"><div class="lab">Libraries Declaration Rate</div><div class="val" id="kpi-decl">…</div><div class="tap">▾ Click to open</div></div>
      <div class="kpi" data-k="stor"><div class="lab">Largest Libraries</div><div class="val" id="kpi-stor">…</div><div class="tap">▾ Click to open</div></div>
    </div>
    <div id="s2-detail"></div>

    <div class="band">
      <h2>Site inventory and activity</h2>
      <div class="bd">Who owns each site, how much it holds, how many people use it, and whether it has gone quiet. A site with no activity for ${IDLE_DAYS} days is counted as inactive.</div>
    </div>
    <div class="kpis" id="s3-kpis">
      <div class="kpi stat"><div class="lab">Active Sites</div><div class="val" id="kpi-act">…</div><div class="sub">Of ${SITES.length} listed below</div></div>
      <div class="kpi stat"><div class="lab">Inactive Sites, over ${IDLE_DAYS} days</div><div class="val" id="kpi-orp">…</div><div class="sub">No activity since. Owners are listed so someone can be asked</div></div>
    </div>
    <div id="s3-detail"></div>

    <div class="band">
      <h2>Library health and growth</h2>
      <div class="bd">Which libraries are still in use, which have gone quiet, and how fast the record holding is growing. A library counts as inactive after ${LIB_IDLE} days with no activity and long dormant after ${LIB_DORMANT}.</div>
    </div>
    <div class="kpis" id="s4-kpis">
      <div class="kpi stat"><div class="lab">Active Libraries, last ${LIB_IDLE} days</div><div class="val" id="kpi-libact">…</div><div class="sub">Of ${LIBS.length} sampled. ${LIBS_DORMANT} have been dormant over ${LIB_DORMANT} days</div></div>
      <div class="kpi stat"><div class="lab">Library Growth Rate</div><div class="val" id="kpi-growth">…</div><div class="sub">${F(NEW_RECORDS)} new records against ${F(RECORDS_AT_START)} held at the start</div></div>
    </div>
    <div id="s4-detail"></div>
  </section>`;

  function init(){
    document.getElementById("kpi-decl").textContent=F(TOTAL_RECORDS);
    document.getElementById("kpi-stor").textContent=TOTAL_GB.toFixed(1)+" GB";
    document.getElementById("kpi-act").textContent=F(ACTIVE_SITES);
    document.getElementById("kpi-orp").textContent=F(INACTIVE_SITES);
    document.getElementById("kpi-libact").textContent=F(LIBS_ACTIVE);
    document.getElementById("kpi-growth").textContent=(GROWTH_RATE*100).toFixed(1)+"%";
    document.querySelectorAll("#s2-kpis .kpi").forEach(k=>k.onclick=()=>renderS2(k.dataset.k));
    renderS1();
    renderS2(curS2);
    renderS3();
    renderS4();
  }

  return {
    ver:"Sites and Libraries Dashboard",
    crumb:"Sites and Libraries Dashboard",
    asof:"Data as of Sun 05 Jul 2026 23:59 · refreshed Mon 06 Jul 06:00",
    /* Read by the Overview dashboard. Derived from the same arrays this
       dashboard renders, so a summary figure can never drift from the detail. */
    summary:{
      sitesCreated:ALLTIME_SITES,
      sitesInSample:SITEDEPTS.reduce((a,d)=>a+d[2],0),
      libraryCount:LIBS.length,
      libraryDocuments:LIBS.reduce((a,l)=>a+l[3],0),
      libraryRecords:TOTAL_RECORDS,
      get libraryUndeclared(){return this.libraryDocuments-this.libraryRecords;},
      storageGB:TOTAL_GB,
      topDepartments:[...SITEDEPTS].sort((a,b)=>b[2]-a[2]).slice(0,5).map(d=>({label:d[0],name:d[1],value:d[2]})),
      departmentCount:SITEDEPTS.length,
      sitesListed:SITES.length,
      activeSites:ACTIVE_SITES,
      inactiveSites:INACTIVE_SITES,
      idleDays:IDLE_DAYS,
      librariesAcrossSites:SITE_LIBRARIES,
      librariesWithRecords:LIBS_WITH_RECORDS,
      librariesNoRecords:LIBS_NO_RECORDS,
      distinctOwners:[...new Set(SITES.map(s=>s[2]))].length
    },
    html,init
  };
})();

   Source: EDRMS_Records_Management_Dashboard_v3.html

DASHBOARDS.rm=(function(){
  function split(total,k,seed){
    const w=[];let s=0;for(let i=0;i<k;i++){const x=((seed*(i+3)*7919)%100)/100*0.6+0.55;w.push(x);s+=x;}
    const out=w.map(x=>Math.max(1,Math.round(total*x/s)));
    out[0]+=total-out.reduce((a,b)=>a+b,0);if(out[0]<1)out[0]=1;return out;
  }
  function monthly(total,seed){
    const w=[];for(let m=0;m<12;m++)w.push(0.6+m*0.08+((seed*(m+1))%5)*0.05);
    const s=w.reduce((a,b)=>a+b,0);const out=w.map(x=>Math.round(total*x/s));
    out[11]+=total-out.reduce((a,b)=>a+b,0);return out;
  }
  /* --- pager: this variant hides itself entirely on a single page --- */
  function pager(total,page,pages,noun){
    if(pages<=1)return "";
    const win=[];for(let p=1;p<=pages;p++){if(p===1||p===pages||Math.abs(p-page)<=1)win.push(p);}
    let nums="",last=0;win.forEach(p=>{if(last&&p-last>1)nums+=`<span style="color:var(--mut)">…</span>`;nums+=`<button class="${p===page?'on':''}" data-pg="${p}">${p}</button>`;last=p;});
    const from=(page-1)*10+1,to=Math.min(total,page*10);
    return `<div class="pager"><div class="pinfo">Showing ${from} to ${to} of ${F(total)} ${noun}</div>
      <div class="pbtns"><button data-pg="prev" ${page===1?'disabled':''}>‹ Prev</button>${nums}<button data-pg="next" ${page===pages?'disabled':''}>Next ›</button></div></div>`;
  }

  /* ===== departments (16) ===== */
  const DEPTS=[
   {c:"ITD",n:"Information Technology",rec:2611,phys:470,docs:640000},
   {c:"SARD",n:"South Asia Regional",rec:2240,phys:360,docs:520000},
   {c:"OSFG",n:"Sovereign Operations",rec:2168,phys:300,docs:410000},
   {c:"FIN",n:"Finance",rec:2150,phys:520,docs:300000},
   {c:"PARD",n:"Procurement & Admin",rec:1892,phys:410,docs:290000},
   {c:"HRD",n:"Human Resources",rec:1462,phys:240,docs:205000},
   {c:"SERD",n:"Southeast Asia",rec:1320,phys:180,docs:150000},
   {c:"EARD",n:"East Asia Regional",rec:1180,phys:150,docs:120000},
   {c:"OGC",n:"General Counsel",rec:1074,phys:210,docs:100000},
   {c:"CWRD",n:"Central & West Asia",rec:1150,phys:210,docs:180000},

   {c:"OAS",n:"Administrative Services",rec:620,phys:130,docs:105000},

  ];
  DEPTS.forEach((d,i)=>{d.mrec=monthly(d.rec,d.c.length+i+1);d.mphys=monthly(d.phys,d.c.length+i+2);d.mdocs=monthly(d.docs,d.c.length+i+3);});
  const ANNUAL_REC=DEPTS.reduce((a,d)=>a+d.rec,0);
  /* Declaration over time. Both figures read one column, Records.CreatedDate,
     which is populated today, so neither waits on the scan or the usage feed.
     MONTHS is the current year summed across departments, so it necessarily
     totals ANNUAL_REC and is asserted below rather than typed twice. */
  /* Rolling twelve months ending at the latest closed month, not a calendar
     year. The dashboard is dated 20 Jul 2026, so a Jan to Dec chart would show
     figures for months that have not happened. */
  const MONTHNAMES=["Aug","Sep","Oct","Nov","Dec","Jan","Feb","Mar","Apr","May","Jun","Jul"];
  const MONTHS=MONTHNAMES.map((m,i)=>({label:m,value:DEPTS.reduce((a,d)=>a+d.mrec[i],0)}));
  const THIS_MONTH=MONTHS[MONTHS.length-1];
  const MONTH_AVG=Math.round(ANNUAL_REC/12);
  const VS_AVG=(THIS_MONTH.value-MONTH_AVG)/MONTH_AVG;
  /* The last entry is the same population as the monthly chart, so the two
     agree by construction rather than by coincidence. */
  const YEARS=[
    {label:"2023",value:6480},
    {label:"2024",value:11240},
    {label:"2025",value:17905},
    {label:"Last 12 months",value:ANNUAL_REC},
  ];
  const ANNUAL_DOCS=DEPTS.reduce((a,d)=>a+d.docs,0);
  console.assert(MONTHS.reduce((a,m)=>a+m.value,0)===ANNUAL_REC,
    "Monthly declarations must total the annual figure");
  console.assert(YEARS[YEARS.length-1].value===ANNUAL_REC,
    "The current year in the trend must match Total Declared Records");

  /* Site name stems per department. This used to be DIVNAMES and carried a
     division tier in the drill. Division was cut from the design: ADBMeta holds
     no division for any row, and nothing in the tenant supplies one, so a level
     that can never be populated was removed rather than left to fail at build
     time. The stems survive only as a way to name two sites apiece. */
  const SITESTEMS={ITD:["Digital Services","Infrastructure & Operations"],SARD:["South Asia Operations","South Asia Programs"],
   OSFG:["Country Operations","Safeguards"],FIN:["Treasury","Financial Control"],PARD:["Procurement","Administration"],
   HRD:["People Operations","Talent & Learning"],SERD:["Southeast Asia Operations"],EARD:["East Asia Operations"],
   OGC:["Legal Advisory","Compliance"],CWRD:["Central Asia Operations","West Asia Operations"],PSOD:["Investments","Portfolio Management"],
   BRM:["Budget Operations"],SPD:["Strategy","Partnerships"],SDCC:["Climate Change","Sustainable Development"],
   OAS:["Facilities","Administration"],ERCD:["Macroeconomics","Statistics"]};
  const LIBPOOL=["Final Documents","Board Papers","Loan Agreements","Country Reports","Policies","Correspondence","Minutes","Project Completion"];

  const TREE=DEPTS.map(d=>{
    /* Sites hang directly off the department now. Each stem yields a Site and an
       Annex, so a department with two stems has four sites and one stem has two.
       split() distributes exactly, so the department totals are unchanged by the
       tier removal. */
    const siteNames=[];
    SITESTEMS[d.c].forEach(stem=>{
      const short=stem.split(" ")[0];
      siteNames.push(`${d.c} ${short} Site`,`${d.c} ${short} Annex`);
    });
    const n=siteNames.length;
    const sr=split(d.rec,n,d.c.length+1),sp=split(d.phys,n,d.c.length+2),sd=split(d.docs,n,d.c.length+3);
    const sites=siteNames.map((sn,j)=>{
      const libNames=[LIBPOOL[j%LIBPOOL.length],LIBPOOL[(j+3)%LIBPOOL.length]];
      const lr=split(sr[j],2,j+6),lp=split(sp[j],2,j+7),ld=split(sd[j],2,j+8);
      const libs=libNames.map((ln,k)=>({label:ln,site:sn,rec:lr[k],phys:lp[k],docs:ld[k]}));
      return {label:sn,sub:d.c,rec:sr[j],phys:sp[j],docs:sd[j],children:libs};
    });
    return {label:d.c,sub:d.n,rec:d.rec,phys:d.phys,docs:d.docs,children:sites};
  });
  const LEVELS=["Department","Site","Library"];
  function listAt(path){let lvl=TREE;for(const idx of path)lvl=lvl[idx].children;return lvl;}
  function crumbHTML(path){let lvl=TREE,html=`<a data-i="-1">All departments</a>`;
    path.forEach((idx,i)=>{html+=`<span class="arw">›</span><a data-i="${i}">${lvl[idx].label}</a>`;lvl=lvl[idx].children;});
    html+=`<span class="arw">·</span><span class="cur">${LEVELS[path.length]} level</span>`;return html;}

  /* ===== section 1 ===== */
  let pathRec=[],pageRec=1,pathDocs=[],pageDocs=1;
  let curS1="rec";
  function renderS1(which){

        <div id="rec-bars"></div><div id="rec-pager"></div></div>`;

        <div class="psub">Total documents held in each department's EDRMS compliant sites. Click a bar to drill down from department to site to library.</div>
        <div class="daterow">
          <div class="drill" id="docs-crumb" style="margin:0"></div>

        document.getElementById("docs-s").value="";
        document.getElementById("docs-e").value="";
        pathDocs=[];pageDocs=1;drawDocs();

      drawDocs();

  }
  function rangeMonthsFor(sId,eId){
    const sEl=document.getElementById(sId),eEl=document.getElementById(eId);
    if(!sEl||!eEl)return [0,11];
    const s=new Date(sEl.value+"T00:00:00"),e=new Date(eEl.value+"T00:00:00");
    let sM=isNaN(s)?0:(s.getFullYear()<2026?0:s.getFullYear()>2026?12:s.getMonth());
    let eM=isNaN(e)?11:(e.getFullYear()>2026?11:e.getFullYear()<2026?-1:e.getMonth());
    return [sM,eM];
  }
  function rangeMonths(){return rangeMonthsFor("rec-s","rec-e");}
  /* the range summary line shows only while a date range is actually applied */
  function paintSubtotal(id,blank,full,text){
    const el=document.getElementById(id);
    if(!el)return;
    if(blank||full){el.innerHTML="";el.style.display="none";}
    else{el.innerHTML=text;el.style.display="";}
  }
  function sumMonths(arr,sM,eM){let t=0;for(let m=Math.max(0,sM);m<=Math.min(11,eM);m++)t+=arr[m];return t;}
  function drawRec(){
    const [sM,eM]=rangeMonths();
    const canDrill=pathRec.length<3,atLib=pathRec.length===3;
    document.getElementById("rec-crumb").innerHTML=crumbHTML(pathRec);
    document.querySelectorAll("#rec-crumb a").forEach(a=>a.onclick=()=>{const i=+a.dataset.i;pathRec=i<0?[]:pathRec.slice(0,i+1);pageRec=1;drawRec();});
    let rows;
    if(pathRec.length===0){
      rows=DEPTS.map((d,i)=>({label:d.c,sub:d.n,i,rec:sumMonths(d.mrec,sM,eM),phys:sumMonths(d.mphys,sM,eM)}));
    }else{
      const dd=DEPTS[pathRec[0]];
      const recF=dd.rec?sumMonths(dd.mrec,sM,eM)/dd.rec:0, physF=dd.phys?sumMonths(dd.mphys,sM,eM)/dd.phys:0;
      rows=listAt(pathRec).map((r,i)=>({...r,i,rec:Math.round(r.rec*recF),phys:Math.round(r.phys*physF)}));
    }
    rows=rows.map(r=>({...r,elec:r.rec-r.phys})).sort((a,b)=>b.rec-a.rec);
    const rangeTotal=DEPTS.reduce((a,d)=>a+sumMonths(d.mrec,sM,eM),0);
    const full=(sM<=0&&eM>=11);
    const sVal=(document.getElementById("rec-s")||{}).value||"";
    const eVal=(document.getElementById("rec-e")||{}).value||"";
    const blank=(sVal===""&&eVal==="");
    paintSubtotal("rec-subtotal",blank,full,
      `Declared in selected range: <b>${F(rangeTotal)}</b> of ${F(ANNUAL_REC)} total.`);
    const mx=Math.max(...rows.map(r=>r.rec),1);
    const pages=Math.max(1,Math.ceil(rows.length/10));if(pageRec>pages)pageRec=pages;
    const pg=rows.slice((pageRec-1)*10,pageRec*10);
    document.getElementById("rec-bars").innerHTML=pg.map(r=>{
      const w=100*r.rec/mx,we=r.rec?r.elec/r.rec*w:0,wp=r.rec?r.phys/r.rec*w:0;
      const sub=atLib?`in ${r.site}`:(r.sub||"");
      return `<div class="sbar ${canDrill?'click':''}" data-i="${r.i}"><div class="sl"><b>${r.label}</b>${sub?`<small>${sub}</small>`:""}</div>
        <div class="st"><div class="seg e" style="width:${we}%" title="Without physical: ${F(r.elec)}">${r.elec>110?F(r.elec):""}</div><div class="seg p" style="width:${wp}%" title="With physical: ${F(r.phys)}">${r.phys>70?F(r.phys):""}</div></div>
        <div class="sv">${F(r.rec)}</div></div>`;}).join("");
    if(canDrill)document.querySelectorAll("#rec-bars .sbar.click").forEach(b=>b.onclick=()=>{pathRec=[...pathRec,+b.dataset.i];pageRec=1;drawRec();});
    document.getElementById("rec-pager").innerHTML=pager(rows.length,pageRec,pages,LEVELS[pathRec.length].toLowerCase()+"s");
    wirePager("#rec-pager",v=>{pageRec=v==="prev"?Math.max(1,pageRec-1):v==="next"?Math.min(pages,pageRec+1):+v;drawRec();});
  }
  function drawDocs(){
    const [sM,eM]=rangeMonthsFor("docs-s","docs-e");
    const canDrill=pathDocs.length<3,atLib=pathDocs.length===3;
    document.getElementById("docs-crumb").innerHTML=crumbHTML(pathDocs);
    document.querySelectorAll("#docs-crumb a").forEach(a=>a.onclick=()=>{const i=+a.dataset.i;pathDocs=i<0?[]:pathDocs.slice(0,i+1);pageDocs=1;drawDocs();});
    let rows;
    if(pathDocs.length===0){
      rows=DEPTS.map((d,i)=>({label:d.c,sub:d.n,i,docs:sumMonths(d.mdocs,sM,eM)}));
    }else{
      const dd=DEPTS[pathDocs[0]];
      const docsF=dd.docs?sumMonths(dd.mdocs,sM,eM)/dd.docs:0;
      rows=listAt(pathDocs).map((r,i)=>({...r,i,docs:Math.round(r.docs*docsF)}));

    paintSubtotal("docs-subtotal",blank,full,
      `Documents in selected range: <b>${F(rangeTotal)}</b> of ${F(ANNUAL_DOCS)} total.`);
    const mx=Math.max(...rows.map(r=>r.docs),1);

        <div class="ct"><div class="cf" style="width:${Math.max(6,100*r.docs/mx)}%;background:var(--orange)">${F(r.docs)}</div></div></div>`;}).join("");
    if(canDrill)document.querySelectorAll("#docs-bars .cbar").forEach(b=>b.onclick=()=>{pathDocs=[...pathDocs,+b.dataset.i];pageDocs=1;drawDocs();});

  /* ===== sites / users usage ===== */
  const SITES=[];
  DEPTS.forEach((d,i)=>{
    const seed=d.c.length*7+i*13;
    const prim=(i%2===0)?"Records Site":"Workspace";
    SITES.push({dept:d.c,site:`${d.c} ${prim}`,base:Math.round(d.rec*0.95),last:(seed%7)+1});
    SITES.push({dept:d.c,site:`${d.c} Team Site`,base:Math.round(d.rec*0.5),last:(seed%22)+2});
    if(d.rec>1000)SITES.push({dept:d.c,site:`${d.c} Programs Hub`,base:Math.round(d.rec*0.35),last:(seed%60)+8});
    if(i%3===0)SITES.push({dept:d.c,site:`${d.c} Shared Drive (legacy)`,base:Math.round(d.rec*0.4),last:110+(seed%80)});
  });
  SITES.forEach(s=>{
    s.uv7=s.last<=7?Math.round(s.base*0.42):0;
    s.uv30=s.last<=30?s.base:0;
    s.v7=s.last<=7?Math.round(s.base*0.42*1.5):0;
    s.v30=s.last<=30?Math.round(s.base*1.5):0;
    s.v90=s.last<=90?Math.round(s.base*1.5*2.2):0;
  });

  /* Monthly active users, the client's 1.1.2.
     This is deliberately NOT the sum of the per site unique viewers below.
     Per site figures come from /sites/{id}/analytics, and anyone who works in
     three sites is counted three times, so summing them overstates headcount.
     The bankwide figure comes from a different report,
     getSharePointActivityUserDetail(period='D30'), which returns one row per
     person. Count the rows and you have distinct people.
     The gap between the two is real and is explained on the panel rather than
     hidden, because a reader who adds up the bars will otherwise think the
     total is wrong. */
  const MAU_SITE_SUM=SITES.reduce((a,s)=>a+s.uv30,0);
  const MONTHLY_ACTIVE_USERS=9420;
  console.assert(MONTHLY_ACTIVE_USERS<MAU_SITE_SUM,
    "Distinct monthly users must be below the sum of per site viewers, since sites overlap");

  let winSites=7,deptSites="all",pageSites=1,winUsers=7,deptUsers="all",pageUsers=1;
  let curS2="sites";
  function deptOptions(sel){return `<option value="all">All departments</option>`+DEPTS.map(d=>`<option value="${d.c}" ${sel===d.c?"selected":""}>${d.c} - ${d.n}</option>`).join("");}

  function renderS2(which){
    curS2=which;
    document.querySelectorAll("#s2-kpis .kpi").forEach(k=>k.classList.toggle("on",k.dataset.k===which));
    const box=document.getElementById("s2-detail");
    if(which==="sites"){
      box.innerHTML=`<div class="panel">
        <div class="ptitle">Active Departmental Sites</div>
        <div class="psub">Departmental sites with activity in the selected window, ranked by site visits, with each site's most recent activity.</div>
        <div class="toolbar">
          <div class="dayf" id="sites-win">${[7,30,90].map(dd=>`<button class="${winSites===dd?'on':''}" data-d="${dd}">Last ${dd} days</button>`).join("")}</div>
          <div class="ctl">Department<select id="sites-dept">${deptOptions(deptSites)}</select></div></div>
        <div class="statrow" id="sites-stats"></div>

        <div class="toolbar">
          <div class="dayf" id="users-win">${[7,30].map(dd=>`<button class="${winUsers===dd?'on':''}" data-d="${dd}">Last ${dd} days</button>`).join("")}</div>
          <div class="ctl">Department<select id="users-dept">${deptOptions(deptUsers)}</select></div></div>
        <div class="statrow" id="users-stats"></div>
        <div class="colhead"><span>Site</span><span class="c2" id="users-metric-h">Unique viewers</span><span class="c3">Last activity</span></div>

  }
  function drawSites(){
    const vKey=s=>winSites===7?s.v7:winSites===30?s.v30:s.v90;
    let list=SITES.filter(s=>s.last<=winSites);
    if(deptSites!=="all")list=list.filter(s=>s.dept===deptSites);
    list=list.map(s=>({...s,v:vKey(s)})).sort((a,b)=>b.v-a.v);
    const visits=list.reduce((a,b)=>a+b.v,0);
    document.getElementById("sites-stats").innerHTML=`
      <div class="stat"><div class="sl">Active sites</div><div class="sv">${F(list.length)}</div></div>
      <div class="stat"><div class="sl">Total site visits</div><div class="sv">${F(visits)}</div></div>`;
    const mx=Math.max(...list.map(s=>s.v),1);
    const pages=Math.max(1,Math.ceil(list.length/10));if(pageSites>pages)pageSites=pages;
    const pg=list.slice((pageSites-1)*10,pageSites*10);
    document.getElementById("sites-bars").innerHTML=pg.map(s=>`<div class="cbar act"><div class="cl"><b>${s.site}</b><small>${s.dept}</small></div>
      <div class="ct"><div class="cf" style="width:${Math.max(6,100*s.v/mx)}%;background:var(--green)">${F(s.v)}</div></div>
      <div class="la">${s.last} day${s.last===1?"":"s"} ago</div></div>`).join("");

    wirePager("#sites-pager",v=>{pageSites=v==="prev"?Math.max(1,pageSites-1):v==="next"?Math.min(pages,pageSites+1):+v;drawSites();});
  }
  function drawUsers(){
    const uvKey=s=>winUsers===7?s.uv7:s.uv30;
    let list=SITES.filter(s=>s.last<=winUsers);
    if(deptUsers!=="all")list=list.filter(s=>s.dept===deptUsers);
    list=list.map(s=>({...s,m:uvKey(s)})).sort((a,b)=>b.m-a.m);
    document.getElementById("users-metric-h").textContent="Unique viewers";
    const totUV=list.reduce((a,b)=>a+uvKey(b),0);
    /* Two figures, not one, because they answer different questions. The
       bankwide total counts people; the sum of the bars counts site
       memberships. Showing only the sum would overstate headcount. */
    const bank=(winUsers===30&&deptUsers==="all")
      ? `<div class="stat"><div class="sl">Distinct people, bankwide</div><div class="sv">${F(MONTHLY_ACTIVE_USERS)}</div></div>`:"";
    document.getElementById("users-stats").innerHTML=
      bank+`<div class="stat"><div class="sl">Sum of per site viewers</div><div class="sv">${F(totUV)}</div></div>`;
    const mx=Math.max(...list.map(s=>s.m),1);

    const pg=list.slice((pageUsers-1)*10,pageUsers*10);
    document.getElementById("users-bars").innerHTML=pg.map(s=>`<div class="cbar act"><div class="cl"><b>${s.site}</b><small>${s.dept}</small></div>

  /* ===== declaration over time ===== */
  function renderS3(){

    const ymax=Math.max(...YEARS.map(y=>y.value));
    document.getElementById("s3-detail").innerHTML=`<div class="panel">

      <div class="mrow">${MONTHS.map(m=>`
        <div class="mcol" title="${m.label}: ${F(m.value)} records">

      <div class="subtotal">Latest closed month, ${THIS_MONTH.label} 2026: <b>${F(THIS_MONTH.value)}</b> records declared, against a twelve month average of <b>${F(MONTH_AVG)}</b>.</div>
    </div>
    <div class="panel">
      <div class="ptitle">Records declared by year</div>
      <div class="psub">Declarations per year since the programme began. The last bar is the trailing twelve months rather than a calendar year, which is why it matches the chart above.</div>
      ${YEARS.map(y=>`<div class="ybar"><div class="yl"><b>${y.label}</b></div>
        <div class="yt"><div class="yf" style="width:${Math.max(6,100*y.value/ymax)}%">${F(y.value)}</div></div></div>`).join("")}
    </div>`;
  }

  const html=`<section class="dash-rm">
    <div class="band">
      <h2>Total Declared Records vs Total Documents in EDRMS Compliant Sites</h2>
      <div class="bd">See how much of the content stored in EDRMS compliant sites has been formally declared as an official record, and how that breaks down by department, site, and library.</div>
    </div>
    <div class="kpis" id="s1-kpis">
      <div class="kpi on" data-k="rec"><div class="lab">Total Declared Records</div><div class="val" id="kpi-rec">…</div><div class="tap">▾ Click to open</div></div>
      <div class="kpi" data-k="docs"><div class="lab">Total Documents in EDRMS Compliant Sites</div><div class="val" id="kpi-docs">…</div><div class="tap">▾ Click to open</div></div>
    </div>
    <div id="s1-detail"></div>

    <div class="band">
      <h2>SharePoint Sites and Users Governance</h2>
      <div class="bd">See which departmental sites and users are actively engaging with EDRMS, based on SharePoint usage. Site visits are available at 7, 30 and 90 days; unique viewers only at 7 and 30, which is a Microsoft limit rather than a design choice.</div>
    </div>
    <div class="kpis" id="s2-kpis">

      <div class="kpi" data-k="users"><div class="lab">Total EDRMS Users, monthly active</div><div class="val" id="kpi-users">…</div><div class="tap">▾ Click to open</div></div>
    </div>

    <div class="band">
      <h2>Declaration over time</h2>

    </div>
    <div class="kpis" id="s3-kpis">
      <div class="kpi stat"><div class="lab">Records Declared This Month</div><div class="val" id="kpi-month">…</div><div class="sub" id="sub-month"></div></div>
      <div class="kpi stat"><div class="lab">Monthly Average, last 12 months</div><div class="val" id="kpi-avg">…</div><div class="sub" id="sub-avg"></div></div>

  function init(){

    /* Read by the Overview dashboard. Derived here, from the same arrays this
       dashboard renders, so a summary figure can never drift from the detail
       figure it is summarising. */
    summary:{
      declared:ANNUAL_REC,
      documents:ANNUAL_DOCS,
      withPhysical:DEPTS.reduce((a,d)=>a+d.phys,0),
      get withoutPhysical(){return this.declared-this.withPhysical;},
      activeSites7:SITES.filter(s=>s.last<=7).length,
      totalSitesTracked:SITES.length,
      activeUsers7:SITES.filter(s=>s.last<=7).reduce((a,s)=>a+s.uv7,0),
      monthlyActiveUsers:MONTHLY_ACTIVE_USERS,
      declaredThisMonth:THIS_MONTH.value,

      topDepartments:[...DEPTS].sort((a,b)=>b.rec-a.rec).slice(0,5).map(d=>({label:d.c,name:d.n,value:d.rec})),
      departmentCount:DEPTS.length
    },
    html,init
  };
})();
