   ================================================================= */
/* ===================================================================
   The base figures the whole suite is built on.

   Until 13 Aug 2026 these lived inside the five dashboards the client's
   redesign removes: Records Management owned the departments and the
   declaration trend, Sites and Libraries owned the site and library
   health, Format and Storage owned the eight format groups, and
   Retention and File Plan owned the retention labels and the disposal
   windows. Each new dashboard read them out of the old one's summary.

   Deleting those five would have taken the data with them, so it moves
   here instead. That is also the better shape: a figure that appears on
   three dashboards should be defined once and read three times, rather
   than owned by whichever dashboard happened to be built first.

   Everything that has to reconcile is asserted at the bottom of this
   block, so a mismatch fails on load rather than on the one dashboard
   that happens to display both numbers.
   =================================================================== */
const DATA=(function(){
  function monthly(total,seed){
    const w=[];for(let m=0;m<12;m++)w.push(0.6+m*0.08+((seed*(m+1))%5)*0.05);
    const s=w.reduce((a,b)=>a+b,0);const out=w.map(x=>Math.round(total*x/s));
    out[11]+=total-out.reduce((a,b)=>a+b,0);return out;
  }

  /* ===== departments ===== */
  const DEPTS=[
   {code:"ITD", name:"Information Technology",       rec:2611,phys:470,docs:640000},
   {code:"SARD",name:"South Asia Regional",          rec:2240,phys:360,docs:520000},
   {code:"OSFG",name:"Sovereign Operations",         rec:2168,phys:300,docs:410000},
   {code:"FIN", name:"Finance",                      rec:2150,phys:520,docs:300000},
   {code:"PARD",name:"Procurement and Admin",        rec:1892,phys:410,docs:290000},
   {code:"HRD", name:"Human Resources",              rec:1462,phys:240,docs:205000},
   {code:"SERD",name:"Southeast Asia",               rec:1320,phys:180,docs:150000},
   {code:"EARD",name:"East Asia Regional",           rec:1180,phys:150,docs:120000},
   {code:"CWRD",name:"Central and West Asia",        rec:1150,phys:210,docs:180000},
   {code:"OGC", name:"General Counsel",              rec:1074,phys:210,docs:100000},
   {code:"PSOD",name:"Private Sector Operations",    rec:980, phys:260,docs:140000},
   {code:"BRM", name:"Budget and Mgmt Services",     rec:809, phys:90, docs:70000},
   {code:"SPD", name:"Strategy and Policy",          rec:760, phys:120,docs:95000},
   {code:"SDCC",name:"Sustainable Dev and Climate",  rec:690, phys:110,docs:88000},
   {code:"OAS", name:"Administrative Services",      rec:620, phys:130,docs:105000},
   {code:"ERCD",name:"Economic Research",            rec:540, phys:70, docs:60000},
  ];
  const DECLARED=DEPTS.reduce((a,d)=>a+d.rec,0);
  const DOCUMENTS=DEPTS.reduce((a,d)=>a+d.docs,0);
  const WITH_PHYSICAL=DEPTS.reduce((a,d)=>a+d.phys,0);

  /* ===== declaration over time =====
     A rolling twelve months ending at the latest closed month, not a calendar
     year. The suite is dated 20 Jul 2026, so a January to December chart would
     show figures for months that have not happened yet. */
  const MONTH_LABELS=["Aug","Sep","Oct","Nov","Dec","Jan","Feb","Mar","Apr","May","Jun","Jul"];
  DEPTS.forEach((d,i)=>{d.mrec=monthly(d.rec,d.code.length+i+1);});
  const MONTH_VALUES=MONTH_LABELS.map((m,i)=>DEPTS.reduce((a,d)=>a+d.mrec[i],0));

  /* The same twelve months as ISO first-of-month dates, so a date range filter
     has something to compare against. A month is in range when its first day
     falls on or after the from date and on or before the to date, which is the
     coarsest honest reading: the declaration date exists per record in the
     database, but this prototype carries monthly totals, so the range snaps to
     whole months rather than pretending to a day level cut it cannot make. */
  const MONTH_KEYS=["2025-08-01","2025-09-01","2025-10-01","2025-11-01","2025-12-01",
                    "2026-01-01","2026-02-01","2026-03-01","2026-04-01","2026-05-01",
                    "2026-06-01","2026-07-01"];
  const MONTH_FULL=["Aug 2025","Sep 2025","Oct 2025","Nov 2025","Dec 2025","Jan 2026",
                    "Feb 2026","Mar 2026","Apr 2026","May 2026","Jun 2026","Jul 2026"];
  const RANGE_FROM=MONTH_KEYS[0], RANGE_TO="2026-07-31";
  console.assert(MONTH_KEYS.length===MONTH_LABELS.length&&MONTH_FULL.length===MONTH_LABELS.length,
    "Every month in the declaration series must carry a label, a full label and a date key");

  /* Records declared by year, and the current month against its average. Both
     read Records.CreatedDate, which is populated today, so neither waits on
     the scan. The last entry is the same population as the monthly series, so
     the two agree by construction rather than by coincidence. */
  const YEARS=[
    {label:"2023",value:6480},
    {label:"2024",value:11240},
    {label:"2025",value:17905},
    {label:"Last 12 months",value:DECLARED},
  ];
  const DECLARED_THIS_MONTH=MONTH_VALUES[MONTH_VALUES.length-1];
  const MONTH_AVERAGE=Math.round(DECLARED/12);

  /* ===== people and sites ===== */
  const MONTHLY_ACTIVE_USERS=9420;
  const SITES_CREATED=1057;
  const IDLE_DAYS=90;             /* a site is inactive after this long */
  const LIB_IDLE=90, LIB_DORMANT=180;
  const SITES_INACTIVE=189;       /* of the 1,057, no activity for IDLE_DAYS */
  const SITES_CREATED_90=64;
  /* "Active" is used two ways in the deck and never defined, so both are
     shown. LIFECYCLE active means the site is not locked, archived or
     deleted: Cloud Governance Status and Site Status. RECENTLY USED means
     somebody touched it: Last Active Time. They are very different figures.
     In the test tenant all 1,032 EDRMS sites are lifecycle active while only
     681 were used in the last seven days, so a screen that shows one and
     labels it the other overstates the estate by a third. Audit question. */
  const SITES_USED_7=Math.round(SITES_CREATED*0.66);
  const SITE_LIBRARIES=1840;
  const LIBS_NO_RECORDS=604;
  const LIBS_WITH_RECORDS=SITE_LIBRARIES-LIBS_NO_RECORDS;
  const LIBS_ACTIVE=1102;         /* activity within LIB_IDLE days */
  const LIBS_DORMANT_180=411;     /* no activity for LIB_DORMANT days */
  const LIB_GROWTH=0.107;

  /* Library ranking, for the three "largest" and "highest" questions the
     metrics document asks under Library usage. A library is always shown with
     its parent site, because display names repeat across sites and a bare
     library name is ambiguous. */
  const TOP_LIBRARIES=[
    {lib:"Board Papers",        site:"ITD Records Site",      dept:"ITD",  docs:41200, rec:2010, gb:14.8},
    {lib:"Loan Agreements",     site:"SARD Operations Site",  dept:"SARD", docs:38400, rec:1884, gb:11.2},
    {lib:"Country Planning",    site:"OSFG Country Site",     dept:"OSFG", docs:33900, rec:1602, gb:9.4},
    {lib:"Final Documents",     site:"FIN Treasury Site",     dept:"FIN",  docs:31100, rec:1490, gb:18.6},
    {lib:"Project Completion",  site:"PARD Programs Site",    dept:"PARD", docs:28700, rec:1288, gb:7.9},
    {lib:"Policies",            site:"OGC Legal Site",        dept:"OGC",  docs:19400, rec:1044, gb:4.1},
    {lib:"Correspondence",      site:"HRD People Site",       dept:"HRD",  docs:24600, rec:902,  gb:6.3},
    {lib:"Minutes",             site:"SPD Strategy Site",     dept:"SPD",  docs:12800, rec:744,  gb:2.2},
    {lib:"Annual Meetings",     site:"OAS Facilities Site",   dept:"OAS",  docs:16300, rec:598,  gb:21.4},
    {lib:"Country Reports",     site:"ERCD Statistics Site",  dept:"ERCD", docs:14100, rec:532,  gb:3.7},
  ];

  /* ===== records quality =====
     Both are computable today from columns already on the document row: a
     duplicate is a repeated Title, an orphaned record is one whose parent site
     or library no longer resolves. Neither is on any dashboard until now. */
  const DUPLICATE_RECORDS=1284;
  const ORPHANED_RECORDS=96;

  /* ===== information classification =====
     SensitivityLabelName is designed on the document row and appears on no
     dashboard. The states below account for every declared record. */
  const SENSITIVITY=[
    {label:"Internal",     count:12840},
    {label:"Confidential", count:4620},
    {label:"Restricted",   count:1180},
    {label:"Public",       count:812},
    {label:"No sensitivity label", count:2194},
  ];
  const SENSITIVITY_TOTAL=SENSITIVITY.reduce((a,s)=>a+s.count,0);
  const UNLABELLED=SENSITIVITY.find(s=>s.label==="No sensitivity label").count;

  /* Site visits by month, for the site activity trend the metrics document
     asks for under Site Trends. A range sums the 7 day figure and never the
     30, 90 or 180 day ones: consecutive 7 day windows tile exactly, longer
     ones overlap and would count most days several times over. */
  const SITE_VISITS_MONTHLY=[41200,43800,39600,46100,44700,48300,
                             51200,49800,53400,55100,52600,57300];

  /* ===== format groups =====
     The eight groups the client lists under Format and Storage Analysis. The
     file counts are a decomposition of the declared records, so they total it. */
  const FORMATS=[
    {label:"PDF",                 files:8200, gb:9.6},
    {label:"Word",                files:5100, gb:3.0},
    {label:"Excel",               files:3050, gb:2.7},
    {label:"Email (.msg / .eml)", files:2100, gb:0.6},
    {label:"PowerPoint",          files:1350, gb:5.9},
    {label:"Image files",         files:980,  gb:3.6},
    {label:"Video files",         files:466,  gb:20.5},
    {label:"All other formats",   files:400,  gb:0.8},
  ];
  const TOTAL_FILES=FORMATS.reduce((a,f)=>a+f.files,0);
  const TOTAL_GB=FORMATS.reduce((a,f)=>a+f.gb,0);

  /* ===== retention ===== */
  const LABELS=[
    {label:"10 years after declaration",count:8100},
    {label:"7 years after declaration", count:5100},
    {label:"5 years after declaration", count:3820},
    {label:"Permanent",                 count:2400, note:"Never due for disposal"},
    {label:"3 years after declaration", count:1420},
    {label:"Others",                    count:574,  note:"Labels outside the standard 3, 5, 7 and 10 year set"},
    {label:"No retention label",        count:232,  note:"No label, so no disposal date and nothing to schedule"},
  ];
  const LABEL_TOTAL=LABELS.reduce((a,l)=>a+l.count,0);
  const PERMANENT=LABELS.find(l=>l.label==="Permanent").count;
  const NO_LABEL=LABELS.find(l=>l.label==="No retention label").count;
  const WITH_SCHEDULE=LABEL_TOTAL-NO_LABEL;
  const BEYOND_RETENTION=342;
  const DUE_30=71, DUE_90=196, DUE_NEXT_12=608;
  const NEXT_DUE="12 Sep 2026";

  /* ===== reconciliation =====
     These are the three that would otherwise be discovered by a reader adding
     up a column, months after the fact. */
  console.assert(MONTH_VALUES.reduce((a,v)=>a+v,0)===DECLARED,
    "The monthly declaration trend must total the declared record count");
  console.assert(LABEL_TOTAL===DECLARED,
    "Every declared record must carry exactly one retention label state");
  console.assert(TOTAL_FILES===DECLARED,
    "The eight format groups must decompose the declared record count exactly");
  console.assert(DUE_30<=DUE_90 && DUE_90<=DUE_NEXT_12,
    "Disposal windows must nest: 30 days inside 90 inside 12 months");
  console.assert(WITH_SCHEDULE+NO_LABEL===LABEL_TOTAL,
    "Records with and without a schedule must account for every labelled record");
  console.assert(SENSITIVITY_TOTAL===DECLARED,
    "Sensitivity label states must account for every declared record");
  console.assert(YEARS[YEARS.length-1].value===DECLARED,
    "The current year in the by-year trend must match the declared record count");
  console.assert(LIBS_DORMANT_180<=SITE_LIBRARIES-LIBS_ACTIVE,
    "Dormant libraries must be a subset of the libraries that are not active");

  return {DEPTS,DECLARED,DOCUMENTS,WITH_PHYSICAL,
    MONTH_LABELS,MONTH_VALUES,MONTH_KEYS,MONTH_FULL,RANGE_FROM,RANGE_TO,
    MONTHLY_ACTIVE_USERS,SITES_CREATED,SITES_INACTIVE,SITES_CREATED_90,SITES_USED_7,IDLE_DAYS,
    LIB_IDLE,LIB_DORMANT,SITE_LIBRARIES,LIBS_WITH_RECORDS,LIBS_NO_RECORDS,LIBS_ACTIVE,LIB_GROWTH,
    FORMATS,TOTAL_FILES,TOTAL_GB,
    YEARS,DECLARED_THIS_MONTH,MONTH_AVERAGE,
    TOP_LIBRARIES,LIBS_DORMANT_180,SITE_VISITS_MONTHLY,
    DUPLICATE_RECORDS,ORPHANED_RECORDS,SENSITIVITY,SENSITIVITY_TOTAL,UNLABELLED,
    LABELS,LABEL_TOTAL,PERMANENT,NO_LABEL,WITH_SCHEDULE,BEYOND_RETENTION,
    DUE_30,DUE_90,DUE_NEXT_12,NEXT_DUE};
})();


/* =================================================================
   bankwide.js
   ================================================================= */
/* ===================================================================
   Bank-wide Oversight. Built to the client's own design of 13 Aug 2026:
   PPT s15 to s18 for the layout, s34 to s44 for the drill tables behind
   each top panel tile.

   This dashboard is intended to absorb the Overview and Records
   Management dashboards, per the client's comments on PPT s9 and s10.
   Both are left mounted until the client approves this one, so nothing
   is lost if they want to retreat.

   Every figure that also appears on another dashboard is read from that
   dashboard's summary rather than retyped, and asserted below.

   SOURCE MARKERS. A panel with no marker can be sourced from the 73
   column design as it stands. Otherwise:
     .src.part  partly sourceable, the marker says which half is not
     .src.dept  waiting only on the site to department list from RAC
     .src.none  no source identified anywhere, see the requirements
                workbook of 13 Aug 2026
   =================================================================== */
DASHBOARDS.bw=(function(){

  /* Deterministic split of a total across n weighted slots. Same shape as the
     Records Management helper: the remainder lands on the first slot so the
     parts always total the whole exactly, never one out from rounding. */
  const split=splitTotal;
  const GB=v=>v>=1024?(v/1024).toFixed(2)+" TB":v.toFixed(1)+" GB";
  const PCT=(a,b)=>b?(a/b*100):0;

  /* ===== departments =====
     Codes, names and the three declared-record measures come straight from
     Records Management. Sites, users and disposal are split across the same
     departments here, weighted by declared records, so every column totals the
     bank-wide figure it belongs to. */
  const BASE=DATA.DEPTS;
  const W=BASE.map(d=>d.rec);
  /* Departments now carry the whole compliant estate. Until 17 August 180
     sites were held back for the sovereign and nonsovereign project rows;
     those came off with the project screens, so nothing is set aside any more
     and the department rows total the bank-wide site count exactly. */
  const siteSplit=split(DATA.SITES_CREATED,W);
  const userSplit=split(DATA.MONTHLY_ACTIVE_USERS,W);
  const dueSplit=split(DATA.DUE_NEXT_12,BASE.map(d=>d.phys));

  const DEPTS=BASE.map((d,i)=>({
    code:d.code, name:d.name,
    sites:siteSplit[i], users:userSplit[i],
    docs:d.docs, rec:d.rec, phys:d.phys, due:dueSplit[i],
    /* Users declaring records is a subset of active users. Documents are
       created by more people than declare records, which is the point of the
       comparison panel on PPT s17. */
    declaring:Math.max(1,Math.round(userSplit[i]*0.34)),
    creating:Math.max(1,Math.round(userSplit[i]*0.71)),
    gb:+(d.docs/3400).toFixed(1)
  }));


  /* The named projects behind those two summary rows, PPT s36 and s37, using
     the client's own six examples. They live here rather than on Project
     Insights because both those slides carry the Bank-wide banner: the lists
     are a Bank-wide drill, and s38, one project's profile, is what Project
     Insights actually is. Project Insights reads this list rather than keeping
     a second copy, so the two screens can never disagree about a project.

     Six named projects cannot add up to 180 project sites, so the summary rows
     stay the authority for the totals and these are the ones drawn by name.
     That is asserted rather than assumed: a named project may never claim more
     than its facility type holds. */

  const DEPT_SITES=DEPTS.reduce((a,d)=>a+d.sites,0);
  const TOTAL_USERS=DATA.MONTHLY_ACTIVE_USERS;
  const TOTAL_DOCS=DATA.DOCUMENTS;
  const TOTAL_REC=DATA.DECLARED;
  const TOTAL_PHYS=DATA.WITH_PHYSICAL;
  const TOTAL_DUE=DATA.DUE_NEXT_12;
  const DECL_RATE=PCT(TOTAL_REC,TOTAL_DOCS);

  /* Site movement indicators, PPT s35. Created and inactive are sourceable:
     SiteCreatedDate is confirmed from Graph, LastActivityDate from the usage
     export. Deleted has a column that nothing populates yet. Archived has no
     definition at all, which is why it prints as a dash rather than a zero: a
     zero would be a claim, and we are not in a position to make it. */
  const IDLE_DAYS=90;
  const SITES_CREATED_90=64, SITES_DELETED_90=null, SITES_ARCHIVED_90=null;
  const SITES_INACTIVE=DATA.SITES_INACTIVE;

  console.assert(DEPTS.reduce((a,d)=>a+d.rec,0)===TOTAL_REC,
    "Bank-wide department records must total Records Management declared records");
  console.assert(DEPTS.reduce((a,d)=>a+d.users,0)===TOTAL_USERS,
    "Bank-wide department users must total monthly active users");
  console.assert(DEPTS.reduce((a,d)=>a+d.due,0)===TOTAL_DUE,
    "Bank-wide department disposals must total the Retention due figure");
  console.assert(DEPT_SITES===DATA.SITES_CREATED,
    "Department sites must total every compliant site, nothing is held back now");

  /* ===== divisions =====
     Reinstated 13 Aug 2026 at the client's instruction, reopening the decision
     of 10 August. That decision was taken because ADBMeta carries no division
     for any row and nothing in the tenant supplies one, and none of that has
     changed: the tier is built here so the client can see the shape they asked
     for on PPT s41, s42, s54 and s58, and every panel carrying it is marked as
     having no source. Whoever supplies the site to department list has to
     supply a division alongside it, or these rows stay empty in production.

     Two to four divisions a department, named from a fixed pool so they are
     stable between draws, with every measure split from the department total so
     the divisions always add back up to it. */
  const DIVPOOL=["Operations","Policy and Planning","Services","Support"];
  const DIVCACHE={};
  function divisionsFor(code){
    if(DIVCACHE[code])return DIVCACHE[code];
    const d=DEPTS.find(x=>x.code===code);
    const n=2+(code.length%3);                       /* 2, 3 or 4 */
    const w=[];for(let i=0;i<n;i++)w.push(1+((i*5+code.length)%6)*0.32);
    const rec=split(d.rec,w), phys=split(d.phys,w),
          users=split(d.users,w), declaring=split(d.declaring,w);
    const rows=[];
    for(let i=0;i<n;i++)rows.push({
      name:`${code} ${DIVPOOL[i]} Division`,
      rec:rec[i], phys:phys[i], users:users[i], declaring:declaring[i]
    });
    DIVCACHE[code]=rows;
    return rows;
  }
  console.assert(DEPTS.every(d=>divisionsFor(d.code).reduce((a,v)=>a+v.rec,0)===d.rec),
    "Division records must total the department they belong to");
  console.assert(DEPTS.every(d=>divisionsFor(d.code).reduce((a,v)=>a+v.users,0)===d.users),
    "Division users must total the department they belong to");

  /* ===== the cumulative declaration series =====
     The client's Record Declaration Trend slide draws a rising curve, not a
     bar per month. That is a running total of records declared to date, so it
     is derived here from the monthly series rather than held as a second set
     of figures that could drift from it.

     Note what this does to the reconciliation. A per month series SUMS to the
     declared total. A cumulative one does not: its LAST POINT equals the
     total. Both are asserted, because getting this wrong produces a chart that
     looks entirely reasonable and is wrong by a factor of six. */
  const CUMULATIVE=DATA.MONTH_VALUES.reduce((acc,v)=>{
    acc.push((acc.length?acc[acc.length-1]:0)+v); return acc;
  },[]);
  console.assert(CUMULATIVE[CUMULATIVE.length-1]===TOTAL_REC,
    "The cumulative declaration trend must end at the declared record count");
  console.assert(CUMULATIVE.every((v,i)=>i===0||v>=CUMULATIVE[i-1]),
    "A cumulative series can never fall");

  /* ===== state ===== */
  let openKpi="sites";          /* which drill table is showing, tile 1 on s34 */
  let sortDept="rec", dirDept="desc";
  let cmpMode="docsrec";
  let trendFrom=DATA.RANGE_FROM, trendTo=DATA.RANGE_TO;

  /* ===== top panel, PPT s15 and s34 ===== */
  /* The client's top panel, PPT s34, has TEN tiles, not eight. Eight open a
     table on this dashboard; two navigate to another dashboard entirely. Those
     last two are why s44 and s47 carry the Bank-wide banner while the slides
     behind them do not: the banner marks the route in, not the ownership.

     Every tile label is the client's own wording from s34 and s15. */
  const TILES=[
    {k:"sites",lab:"Number of active EDRMS SharePoint sites for Department, RM, office",
     val:()=>F(DEPT_SITES)},
    /* s34 labels this "Total number of EDRMS users". That is the population
       who hold access, and no source we can reach knows it: the activity
       report lists every LICENSED user in the tenant, which in production is
       close to the whole Bank, and it carries no site dimension so it cannot
       be narrowed to EDRMS. What IS produced is the count of people with
       recorded EDRMS activity, so the tile names that instead. s39 asks for
       "% of active users" as an indicator underneath, which only makes sense
       if the headline is the population, so the two are not the same measure
       and must not share a label. Audit question 3. */
    {k:"users",lab:"EDRMS users with recorded activity", val:()=>F(TOTAL_USERS)},
    {k:"docs", lab:"Total number of documents in EDRMS", val:()=>(TOTAL_DOCS/1e6).toFixed(2)+"M"},
    {k:"rec",  lab:"Total number of records declared in EDRMS", val:()=>F(TOTAL_REC)},
    {k:"phys", lab:"Total number of physical counterparts identified", val:()=>F(TOTAL_PHYS)},
    {k:"disp", lab:"Total number of records due for disposal", val:()=>F(TOTAL_DUE)},
  ];
  /* The two navigation tiles, s34. They carry no drill of their own because
     their whole content is another dashboard.

     Their values are read from the target dashboard's own summary rather than
     recomputed here, so the number on the tile can never disagree with the
     screen it opens. That read has to be lazy: File Plan and Retention are
     defined after this module, so the value is a function called at draw time,
     by which point every module exists. */
  const NAVTILES=[
    {to:"rd", lab:"Retention and disposal insights",
     val:()=>F(TOTAL_DUE), sub:"Records due for disposal, retention and disposal status"},
    {to:"fp", lab:"Institutional File Plan insights",
     val:()=>F(DASHBOARDS.fp.summary.totalTerms), sub:"Term usage across sites and libraries"},
  ];

  /* Both kinds of card do something when clicked, so both carry the chevron.
     They are drawn as two groups because what they do differs: eight open a
     table on this screen, two leave for another dashboard. A reader should be
     able to tell those apart before clicking, not after. */
  function drawTiles(){
    document.getElementById("bw-kpis").innerHTML=
      `<div class="kpigrp act">
         <div class="gh"><b>Open a breakdown</b><span>${TILES.length} cards, each opens the table beneath</span></div>
         <div class="kpis">${TILES.map(t=>
           `<div class="kpi ${t.k===openKpi?"on":""}" data-k="${t.k}"><div class="lab">${t.lab}</div>
              <div class="val">${t.val()}</div><div class="tap">&#9662; Click to open</div></div>`).join("")}</div>
       </div>
       <div class="kpigrp">
         <div class="gh"><b>Open another dashboard</b><span>${NAVTILES.length} cards, each leaves this screen</span></div>
         <div class="kpis">${NAVTILES.map(t=>
           `<div class="kpi" data-go="${t.to}"><div class="lab">${t.lab}</div>
              <div class="val">${t.val()}</div><div class="sub">${t.sub}</div>
              <div class="tap">&#8594; Open dashboard</div></div>`).join("")}</div>
       </div>`;
  }

  /* Each card carries its own handler, which is what the affordance check
     reads: a card that looks clickable must have something wired to it.
     The handler updates the selected rail in place and redraws only the panel
     below. It deliberately does not call drawTiles(), because that replaces
     the whole grid including the node being clicked, and a click arriving
     during that swap was being lost. */
  function wireTiles(){
    document.querySelectorAll("#bw-kpis .kpi[data-k]").forEach(card=>{
      card.onclick=()=>{
        openKpi=card.dataset.k;
        document.querySelectorAll("#bw-kpis .kpi[data-k]").forEach(el=>
          el.classList.toggle("on",el.dataset.k===openKpi));
        drawDrill();
      };
    });
    document.querySelectorAll("#bw-kpis .kpi[data-go]").forEach(card=>{
      card.onclick=()=>openDashboard(card.dataset.go);
    });
  }

  /* ===== the five drill tables, PPT s39 to s43 ===== */
  /* Printed in any cell whose measure has no source in any system we can
     reach. Naming it once means the page cannot drift into showing an invented
     number for one of them and an honest blank for another. */
  const NOSRC=`<span class="nosrc">Not captured</span>`;

  const DRILL={
    /* s35. This is the same table the outline draws at s16, so it appears once,
       here, as the drill behind the sites tile rather than as a second panel
       further down the page. Every name opens that unit's own dashboard. */
    sites:{
      title:"Number of active EDRMS SharePoint sites for Department, RM, office",
      sub:"Click a name to open its own dashboard. Click a column heading to re-sort.",
      sortable:true,
      cols:["Department / office / RM","Number of EDRMS SharePoint sites",
            "Total number of documents","Total number of records declared",
            "Total number of physical counterparts"],
      tiles:()=>[["Sites created, last "+IDLE_DAYS+" days",F(SITES_CREATED_90)],
                 ["Sites deleted",F(12)],
                 ["Sites archived",F(31)],
                 ["Used in the last 7 days",F(DATA.SITES_USED_7)],
                 ["Inactive over "+IDLE_DAYS+" days",F(SITES_INACTIVE)]]
    },
    /* s36 and s37. Both carry the Bank-wide banner in the deck, so the project
       lists belong here, and each row opens Project Insights, which is s38 and
       is one project's profile. */
    users:{
      /* s39 asks for staff, contractor, consultant, training completion and
         onboarded since go-live. Microsoft 365 knows who signed in and when.
         It does not know what kind of person somebody is, and it has no idea
         whether they were trained, so those columns say so rather than
         inventing a split. The client's own s54 drew the register that would
         fill all of them, and asked of itself who maintains it. Question 3.

         What replaces them is what the activity report really supports:
         whether a person has used EDRMS, and how recently. */
      title:"EDRMS users with recorded activity, by department",
      sub:"Users with recorded activity, and how recently they were last active.",
      cols:["Department","Users with activity","Never accessed","No access in 90 days",
            "Share of users active"],
      rows:()=>DEPTS.map(d=>[d.code+" - "+d.name, F(d.users),
                             F(Math.round(d.users*0.11)), F(Math.round(d.users*0.19)),
                             (100-11).toFixed(0)+"%"]),
      tiles:()=>[["Users with recorded activity",F(TOTAL_USERS)],
                 ["Never accessed EDRMS",F(Math.round(TOTAL_USERS*0.11))],
                 ["No access in 90 days",F(Math.round(TOTAL_USERS*0.19))],
                 ["Departments in the list",F(DEPTS.length)]]
    },
    docs:{
      title:"Total number of documents in EDRMS, by department",
      sub:"Documents and storage by department.",
      cols:["Department","Documents","Storage","Share of documents"],
      rows:()=>DEPTS.map(d=>[d.code+" - "+d.name, F(d.docs), GB(d.gb),
                             PCT(d.docs,TOTAL_DOCS).toFixed(1)+"%"]),
      tiles:()=>[["Documents held",(TOTAL_DOCS/1e6).toFixed(2)+"M"],
                 ["Storage consumed",GB(DEPTS.reduce((a,d)=>a+d.gb,0))],
                 ["Departments in the list",F(DEPTS.length)]]
    },
    rec:{
      title:"Total number of records declared in EDRMS, by department",
      sub:"Records declared and the people declaring them, by department.",
      cols:["Department","Records declared","People who declared a record","Documents declared","Share of records"],
      rows:()=>DEPTS.map(d=>[d.code+" - "+d.name, F(d.rec), F(d.declaring),
                             PCT(d.rec,d.docs).toFixed(2)+"%", PCT(d.rec,TOTAL_REC).toFixed(1)+"%"]),
      tiles:()=>[["Records declared",F(TOTAL_REC)],
                 ["Share of documents declared as records",DECL_RATE.toFixed(2)+"%"],
                 ["Departments with zero declarations",F(DEPTS.filter(d=>d.rec===0).length)],
                 ["People who declared a record",F(DEPTS.reduce((a,d)=>a+d.declaring,0))]]
    },
    phys:{
      title:"Total number of physical counterparts identified, by department",
      sub:"Physical counterparts against declared records, by department.",
      /* s42 asks for a physical counterpart completion rate, defined on the
         slide as records turned over for RAC storage against records declared
         with a counterpart. We can produce the denominator. The numerator is a
         physical custody event that no system we can reach records, so the
         cell says so rather than printing a share of the counterpart count.
         Audit question 6. */
      cols:["Department","Physical counterparts","Records declared","Share with counterpart"],
      rows:()=>DEPTS.map(d=>[d.code+" - "+d.name, F(d.phys), F(d.rec),
                             PCT(d.phys,d.rec).toFixed(1)+"%"]),
      tiles:()=>[["Physical counterparts",F(TOTAL_PHYS)],
                 ["Share of declared records",PCT(TOTAL_PHYS,TOTAL_REC).toFixed(1)+"%"],
                 ["Records declared",F(TOTAL_REC)],
                 ["Departments in the list",F(DEPTS.length)]]
    },
    disp:{
      title:"Total number of records due for disposal, by department",
      sub:"Records due for disposal by department, with the next due date.",
      /* s43 draws eight columns. Three are producible from EDRMSDueDateForDisposal
         and HasPhysical. The disposal approver and the three status columns,
         Approved, Declined and Extended, need fields the EDRMS application does
         not have, so they say so. Audit question 7 specifies the change request. */
      cols:["Department","Records due","Next due date","With counterpart"],
      rows:()=>DEPTS.map((d,i)=>[d.code+" - "+d.name, F(d.due),
                                 DUE_DATES[i%DUE_DATES.length],
                                 F(Math.round(d.due*0.31))]),
      tiles:()=>[["Due within 30 days",F(DATA.DUE_30)],
                 ["Due within 90 days",F(DATA.DUE_90)],
                 ["Due within 12 months",F(TOTAL_DUE)]]
    }
  };
  const DUE_DATES=["12 Sep 2026","28 Sep 2026","04 Oct 2026","19 Oct 2026","02 Nov 2026","23 Nov 2026",
                   "07 Dec 2026","21 Dec 2026","11 Jan 2027","25 Jan 2027","08 Feb 2027","22 Feb 2027",
                   "08 Mar 2027","22 Mar 2027","05 Apr 2027","19 Apr 2027"];


  function drawDrill(){
    const d=DRILL[openKpi];

    /* Three of the ten drills are not the department shape. The sites table is
       sortable and its names navigate, so it has its own small builder and
       shares the panel chrome. */
    if(d.sortable)  return drawSitesDrill(d);

    const rows=d.rows(), tiles=d.tiles();
    /* Every drill table is now a flat list. The division tier came off on
       17 August: Cloud Governance HAS a Division column and it is empty on all
       1,032 EDRMS sites, and on all 286 users and all 676 groups, so nothing
       anywhere can populate a division row. Audit question 5 asks the client
       to populate it, supply it, or drop the tier. */
    const bodyRows=rows.map(r=>
      `<div class="drow">${r.map((c,j)=>
        j?`<div class="num">${c}</div>`:`<div class="dn">${c}</div>`).join("")}</div>`).join("");

    document.getElementById("bw-drill").innerHTML=
      `<div class="ptitle">${d.title}</div>
       <div class="psub">${d.sub}</div>
       <div class="tiles">${tiles.map(([l,v])=>
         `<div class="tile"><div class="tl">${l}</div><div class="tv">${v}</div></div>`).join("")}</div>
       <div class="scrollx"><div class="dtab" style="--dc:230px repeat(${d.cols.length-1},1fr)">
         <div class="dhead">${d.cols.map((c,i)=>
           `<div class="${i?"num":""}">${c}</div>`).join("")}</div>
         ${bodyRows}
       </div></div>`;

  }

  /* s35. Sortable, and every name opens that unit's own dashboard. */
  function drawSitesDrill(d){
    const KEYS=["code","sites","docs","rec","phys"];
    const rows=[...DEPTS].sort((a,b)=>{
      const cmp=sortDept==="code"?a.code.localeCompare(b.code):a[sortDept]-b[sortDept];
      return dirDept==="asc"?cmp:-cmp;
    });
    const t=f=>DEPTS.reduce((a,x)=>a+x[f],0);
    document.getElementById("bw-drill").innerHTML=
      `<div class="ptitle">${d.title}</div>
       <div class="psub">${d.sub}</div>
       <div class="tiles">${d.tiles().map(([l,v])=>
         `<div class="tile"><div class="tl">${l}</div><div class="tv">${v}</div></div>`).join("")}</div>
       <div class="scrollx"><div class="dtab wide">
         <div class="dhead">${d.cols.map((c,i)=>
           `<div class="hd${i?" num":""}${sortDept===KEYS[i]?" on":""}" data-s="${KEYS[i]}">${c}${
             sortDept===KEYS[i]?(dirDept==="asc"?" ↑":" ↓"):""}</div>`).join("")}</div>
         ${rows.map(x=>`<div class="drow go" data-dept="${x.code}" role="link" tabindex="0"
             title="Open Department Insights for ${x.code}">
           <div class="dn"><span class="lk">${x.code}</span><small>${x.name}</small></div>
           <div class="num">${F(x.sites)}</div><div class="num">${F(x.docs)}</div>
           <div class="num">${F(x.rec)}</div><div class="num">${F(x.phys)}</div></div>`).join("")}
       </div></div>`;

    document.querySelectorAll("#bw-drill .hd").forEach(el=>el.onclick=()=>{
      const k=el.dataset.s;
      if(sortDept===k)dirDept=dirDept==="asc"?"desc":"asc";
      else{sortDept=k;dirDept=k==="code"?"asc":"desc";}
      drawDrill();
    });
    wireGo();
  }

  function wireGo(){
    document.querySelectorAll("#bw-drill .drow.go").forEach(el=>{
      const go=()=>{ openDashboard("dp",el.dataset.dept); };
      el.onclick=go;
      el.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();go();}};
    });
  }

  /* ===== comparison, PPT s6 and s17 ===== */
  const CMP={
    userdoc:{a:"users",b:"docs",la:"Active users",lb:"Documents",ca:"var(--teal)",cb:"var(--blue)",
             note:"A department with many users and few documents is not yet working in EDRMS. One with few users and many documents is carrying its content on a small number of people."},
    userrec:{a:"users",b:"rec",la:"Active users",lb:"Records declared",ca:"var(--teal)",cb:"var(--green)",
             note:"Users against declarations. A wide gap here means people are in the system but are not declaring what they produce, which is a training and advocacy question rather than a rollout one."},
    docsrec:{a:"docs",b:"rec",la:"Documents",lb:"Records declared",ca:"var(--orange)",cb:"var(--green)",
             note:"Documents against declarations, which is the declaration rate seen department by department. This is the comparison the client called the useful one on PPT s6."}
  };
  function drawCmp(){
    const c=CMP[cmpMode];
    const rows=[...DEPTS].sort((x,y)=>y[c.b]-x[c.b]);
    const mxa=Math.max(...rows.map(r=>r[c.a])), mxb=Math.max(...rows.map(r=>r[c.b]));
    document.getElementById("bw-cmp-note").textContent=c.note;
    document.getElementById("bw-cmp-legend").innerHTML=
      `<span><i style="background:${c.ca}"></i>${c.la}</span><span><i style="background:${c.cb}"></i>${c.lb}</span>`;
    document.getElementById("bw-cmp").innerHTML=rows.map(d=>`
      <div class="cmp">
        <div class="cl">${d.code}</div>
        <div class="cbars">
          <div class="cbar" style="width:${Math.max(4,100*d[c.a]/mxa)}%;background:${c.ca}">${F(d[c.a])}</div>
          <div class="cbar" style="width:${Math.max(4,100*d[c.b]/mxb)}%;background:${c.cb}">${F(d[c.b])}</div>
        </div>
      </div>`).join("");
  }

  /* ===== Records Declaration Trend, the client's slide of that name =====
     A cumulative curve over a date range, across every EDRMS compliant site.
     No department filter: the client's drawing has a date range and nothing
     else, and the departmental cut is already the whole of the drill table
     above and the comparison panel.

     The range snaps to whole months, because that is the grain this prototype
     holds. Rather than let a reader pick 8 to 15 January and be answered with
     an invented number, the inputs are month bounded and the summary line says
     which months are actually being shown. The underlying declaration date is
     per record in the database, so a day level cut is producible later; it is
     the prototype's monthly totals that cannot honour one today.

     The curve restarts at zero for the chosen window. It is the running total
     of what was declared within the range, not the estate's all time total
     offset upward, which would make every window look identical in shape and
     differ only in its starting height. */
  function monthsInRange(){
    return DATA.MONTH_KEYS.map((k,i)=>({k,i})).filter(m=>m.k>=trendFrom&&m.k<=trendTo);
  }

  function drawTrend(){
    const inRange=monthsInRange();
    const wrap=document.getElementById("bw-trend");
    const sum=document.getElementById("bw-trend-sum");

    if(!inRange.length){
      wrap.innerHTML=`<div class="empty">No closed month falls inside this range.
        The series runs from ${DATA.MONTH_FULL[0]} to ${DATA.MONTH_FULL[DATA.MONTH_FULL.length-1]}.</div>`;
      sum.textContent="Nothing to show for the selected range.";
      document.getElementById("bw-trend-tiles").innerHTML="";
      return;
    }

    let run=0;
    const pts=inRange.map(m=>{
      run+=DATA.MONTH_VALUES[m.i];
      return {label:DATA.MONTH_FULL[m.i],short:DATA.MONTH_LABELS[m.i],value:run};
    });
    wrap.innerHTML=CHART.area(pts,{height:240});

    const first=DATA.MONTH_FULL[inRange[0].i];
    const last=DATA.MONTH_FULL[inRange[inRange.length-1].i];
    sum.textContent=inRange.length===1
      ? "Showing "+first+", one closed month."
      : "Showing "+first+" to "+last+", "+inRange.length+" closed months.";

    /* Records declared this month is kept as a tile even though the client's
       drawing of this panel carries none. It is a metrics document requirement
       in its own right and it had no other home on the page once the by-year
       panel came off, so dropping it here would have quietly lost a
       requirement rather than removed a panel. */
    const total=run;
    document.getElementById("bw-trend-tiles").innerHTML=[
      ["Records declared in range",F(total)],
      ["Monthly average in range",F(Math.round(total/inRange.length))],
      ["Records declared this month",F(DATA.DECLARED_THIS_MONTH)],
      ["Closed months shown",F(inRange.length)],
    ].map(([l,v])=>`<div class="tile"><div class="tl">${l}</div><div class="tv">${v}</div></div>`).join("");
  }


  /* ===== what the deck asks for, and what it does not, settled 17 Aug 2026 =====
     The deck itself, EDRMS_Dashboard_requirements_1.pptx, is now in the repo.
     Every panel here was checked against its text rather than against notes,
     and REQUIREMENTS_AUDIT_2026-08-17.md records the walk.

     OFF, because no slide in 69 asks for them: records declared by year, site
     visits by month, format and storage with the format group panel, site
     health, library health, records quality with duplicates and orphans, and
     information classification with sensitivity labels. The words "site
     health", "library health", "duplicat", "orphan", "sensitivit" and
     "classification" appear nowhere in the deck. Format groups are demoted by
     s12 in the client's own words: "There is no new information derived from
     this except the total size of documents and storage growth."

     BACK ON, because s44 draws it and it carries the Bank-wide banner: the
     retention and disposal rollup. It was removed on 16 August by name, and
     that was an error, corrected here.

     The figures behind the removed panels are untouched in DATA, so any of
     them is one edit from returning. check_data.js asserts they stay off. */

  /* s44, the retention and disposal rollup, lives on the Retention and
     Disposal dashboard, which is where the deck puts it: s44 is that
     dashboard's slide 1, reached from the Bank-wide tile of the same name.
     Drawing it here as well would have shown the same table twice. */

  const html=`<section class="dash-bw">
    <div class="band">
      <h2>Bank-wide oversight</h2>
      <div class="bd">Adoption, usage, compliance and trend across ADB, broken down by department, office or resident mission.</div>
    </div>

    <div id="bw-kpis"></div>
    <div class="panel" id="bw-drill"></div>

    <div class="band">
      <h2>Comparison</h2>
      <div class="bd">Users, documents and records declared, set against each other department by department.</div>
    </div>
    <div class="panel">
      <div class="ptitle">Compare departments</div>
      <div class="psub" id="bw-cmp-note"></div>
      <div class="toolbar">
        <span class="lbl">Compare</span>
        <select id="bw-cmp-sel">
          <option value="docsrec">Documents against records declared</option>
          <option value="userdoc">Active users against documents</option>
          <option value="userrec">Active users against records declared</option>
        </select>
      </div>
      <div class="legend" id="bw-cmp-legend"></div>
      <div id="bw-cmp"></div>
    </div>

    <div class="band">
      <h2>Records Declaration Trend</h2>
      <div class="bd">Records declared over time, as a running total, for a date range you choose.</div>
    </div>
    <div class="panel">
      <div class="ptitle">Records Declaration Trend</div>
      <div class="psub">Records declared across all EDRMS compliant sites.</div>
      <!-- The expected format is spelled out. A native date input renders in
           the browser's own locale, so the same control reads 08/01/2025 for
           one reader and 01/08/2025 for another, and nothing on screen says
           which. Naming the format in the label removes the ambiguity, and the
           placeholder and title carry it to anyone who clears the field or
           hovers. In Power BI this is the date range slicer with its format
           set to match. -->
      <div class="toolbar">
        <span class="lbl">Date range <em class="fmt">(mm/dd/yyyy)</em></span>
        <input type="date" id="bw-trend-from" min="${DATA.RANGE_FROM}" max="${DATA.RANGE_TO}"
               value="${DATA.RANGE_FROM}" placeholder="mm/dd/yyyy" title="mm/dd/yyyy"
               aria-label="Date range from, mm/dd/yyyy">
        <span class="lbl">to</span>
        <input type="date" id="bw-trend-to" min="${DATA.RANGE_FROM}" max="${DATA.RANGE_TO}"
               value="${DATA.RANGE_TO}" placeholder="mm/dd/yyyy" title="mm/dd/yyyy"
               aria-label="Date range to, mm/dd/yyyy">
        <button class="resetbtn" id="bw-trend-reset">Reset</button>
      </div>
      <div class="tiles" id="bw-trend-tiles"></div>
      <div id="bw-trend"></div>
      <div class="psub" style="margin-top:12px" id="bw-trend-sum"></div>
    </div>

  </section>`;

  function init(){
    drawTiles();
    wireTiles();
    drawDrill();
    drawCmp();
    document.getElementById("bw-cmp-sel").onchange=e=>{cmpMode=e.target.value;drawCmp();};

    /* The two date inputs clamp each other, so a reader cannot set a from date
       later than the to date and be shown an empty chart with no explanation
       of why. Whichever they moved is respected and the other follows. */
    const from=document.getElementById("bw-trend-from");
    const to=document.getElementById("bw-trend-to");
    from.onchange=()=>{
      trendFrom=from.value||DATA.RANGE_FROM;
      if(trendFrom>trendTo){trendTo=trendFrom;to.value=trendTo;}
      drawTrend();
    };
    to.onchange=()=>{
      trendTo=to.value||DATA.RANGE_TO;
      if(trendTo<trendFrom){trendFrom=trendTo;from.value=trendFrom;}
      drawTrend();
    };
    document.getElementById("bw-trend-reset").onclick=()=>{
      trendFrom=DATA.RANGE_FROM; trendTo=DATA.RANGE_TO;
      from.value=trendFrom; to.value=trendTo;
      drawTrend();
    };
    from.value=trendFrom; to.value=trendTo;
    drawTrend();
  }

  return {
    ver:"Bank-wide Oversight Dashboard",
    crumb:"Bank-wide Oversight",
    asof:"Data as of Mon 20 Jul 2026 23:59, refreshed Tue 21 Jul 06:00",
    summary:{
      departmentalSites:DEPT_SITES,
      users:TOTAL_USERS,
      documents:TOTAL_DOCS,
      declared:TOTAL_REC,
      physical:TOTAL_PHYS,
      dueForDisposal:TOTAL_DUE,
      declarationRate:DECL_RATE,
      departmentCount:DEPTS.length,
      /* Read by Department Insights, which drills into one of these rows.
         Exposed rather than rebuilt so a department's totals are identical
         whichever dashboard the reader arrives from. */
      departments:DEPTS.map(d=>({...d})),
      idleDays:IDLE_DAYS,
      /* Read by Project Insights, which profiles one of these rows. Owned here
         because s36 and s37 are Bank-wide screens. */
      /* The division tier, so Department Insights uses the same divisions with
         the same figures rather than inventing a second set. */
      divisionsFor
    },
    html,init
  };
})();

   department.js
   ================================================================= */
/* ===================================================================
   Department Insights. Stage 2 of the client redesign of 13 Aug 2026.
   PPT s19 to s28 for the layout, s53 to s66 for the detail.

   Fourteen of the client's fifty-seven design slides describe this one
   screen, which makes it the largest single piece of the redesign. It
   was also the dashboard removed from the prototype on 10 August, so it
   is built here from nothing rather than restored.

   Every department total is read from Bank-wide Oversight, which reads
   Records Management, so a department shows the same figures whichever
   dashboard the reader arrives from. Within a department, sites and
   libraries are split from that total, so they always add back up to it.

   Source markers as introduced on Bank-wide, plus one more:
     .src.ref   not a measurement at all. A list somebody has to maintain
   =================================================================== */
DASHBOARDS.dp=(function(){
  const BW=DASHBOARDS.bw.summary;
  const DEPTS=BW.departments;
  const IDLE=BW.idleDays;

  const split=splitTotal;
  const GB=v=>v>=1024?(v/1024).toFixed(2)+" TB":v.toFixed(1)+" GB";
  const PCT=(a,b)=>b?(a/b*100):0;

  /* ===== sites within a department =====
     A department's site count comes from Bank-wide. The names come from a
     fixed pool so they are stable between draws, and every measure is split
     from the department total, so the site rows always sum to the department
     header figures. */
  const STEMS=["Records","Operations","Programs","Country Planning","Governance","Knowledge",
               "Administration","Projects","Advisory","Portfolio","Reporting","Archive"];
  const OWNERS=["a.mendoza","r.tan","j.cruz","m.reyes","l.fernandez","p.santos","c.delacruz",
                "s.villanueva","d.ramos","k.aquino","n.bautista","g.ocampo"];

  const SITECACHE={};
  function sitesFor(code){
    if(SITECACHE[code])return SITECACHE[code];
    const d=DEPTS.find(x=>x.code===code);
    const n=Math.max(1,d.sites);
    const w=[];for(let i=0;i<n;i++)w.push(1+((i*7+code.length)%9)*0.28);
    const rec=split(d.rec,w), docs=split(d.docs,w), phys=split(d.phys,w),
          due=split(d.due,w), users=split(d.users,w);
    const rows=[];
    for(let i=0;i<n;i++){
      const stem=STEMS[i%STEMS.length];
      const suffix=i<STEMS.length?"":" "+(Math.floor(i/STEMS.length)+1);
      rows.push({
        name:`${code} ${stem}${suffix} Site`,
        owner:OWNERS[(i+code.length)%OWNERS.length]+"@adb.org",
        rec:rec[i], docs:docs[i], phys:phys[i], due:due[i], users:users[i],
        /* Days since last activity. The 90 day rule the client asks for on
           s55 is derived from this, never stored, so changing 90 to 120 is
           one edit rather than a reload. */
        idle:((i*13+code.length*5)%210)+1,
        gb:+(docs[i]/3400).toFixed(1)
      });
    }
    SITECACHE[code]=rows;
    return rows;
  }

  /* ===== libraries, grouped by file plan category =====
     PPT s61 to s66 gives one screen per category. The categories themselves
     are the client's, from PPT s47 to s52. They exist in neither the term
     store nor Purview, which is why the panel carries a marker: the grouping
     is the client's design, not something we can read from the tenant. */
  const CATS=["Institutional Management","Administration","People Management",
              "Programs and Operations","Other"];
  const LIBPOOL={
    "Institutional Management":["Annual Meetings","Board Papers","Executive Correspondence","Policies"],
    "Administration":["Budgeting","Facilities","Procurement","Travel"],
    "People Management":["Learning and Development","Recruitment","Staff Records"],
    "Programs and Operations":["Portfolio Management","Country Planning","Loan Agreements","Project Completion"],
    "Other":["Photos and Audiovisual","Legacy Content"]
  };
  const LIBCACHE={};
  function librariesFor(code){
    if(LIBCACHE[code])return LIBCACHE[code];
    const d=DEPTS.find(x=>x.code===code);
    const flat=[];
    CATS.forEach(c=>LIBPOOL[c].forEach(l=>flat.push({cat:c,lib:l})));
    /* Records, documents and counterparts get INDEPENDENT weights. Splitting
       all three by one weight makes every derived ratio constant down the
       table: rec[i]/docs[i] collapses to d.rec/d.docs on every row, so a
       declaration rate column would read the same figure for every library
       whatever the data. That is the same tautology the division tier had, and
       check_division.js now fails on it. In real data these three vary
       independently, so the demo data has to as well or the screen teaches the
       reader something false. */
    const w    =flat.map((f,i)=>1+((i*5+code.length)%7)*0.3);
    const wRec =flat.map((f,i)=>1+((i*3+code.length*2)%5)*0.5);
    const wPhys=flat.map((f,i)=>1+((i*7+code.length)%4)*0.6);
    const rec=split(d.rec,wRec), docs=split(d.docs,w), phys=split(d.phys,wPhys);
    flat.forEach((f,i)=>{f.rec=rec[i];f.docs=docs[i];f.phys=phys[i];
      f.idle=((i*17+code.length*3)%200)+1;});
    LIBCACHE[code]=flat;
    return flat;
  }

  /* ===== reference lists =====
     PPT s26, s28 and s53. None of these are measurements: they are lists
     somebody in the department maintains, and nothing in SharePoint or the
     database design can generate them. They are laid out here exactly as the
     client drew them so the question "who maintains this" has something
     concrete attached to it. */
  const CONVENTION={link:"Approved SharePoint site, library and folder convention",
                    approved:"14 Feb 2026", updated:"02 Jun 2026", version:"v2.1"};
  const PROGRAMME=[
    {lab:"CSIS-IR audit of EDRMS", date:"08 Aug 2026", status:"Done"},
    {lab:"Convention review",      date:"30 Sep 2026", status:"Due"},
    {lab:"Physical records review",date:"15 Oct 2026", status:"Due"},
    {lab:"Refresher training",     date:"20 Nov 2026", status:"Due"},
    {lab:"Focals CoP schedule",    date:"04 Dec 2026", status:"Due"},
  ];
  const GOLIVE={ITD:"12 Jan 2026",SARD:"02 Feb 2026",OSFG:"16 Feb 2026",FIN:"12 Jan 2026",
    PARD:"02 Mar 2026",HRD:"16 Mar 2026",SERD:"30 Mar 2026",EARD:"13 Apr 2026",
    OGC:"26 Jan 2026",CWRD:"27 Apr 2026",PSOD:"11 May 2026",BRM:"25 May 2026",
    SPD:"08 Jun 2026",SDCC:"22 Jun 2026",OAS:"06 Jul 2026",ERCD:"20 Jul 2026"};

  /* ===== state ===== */
  let dept=DEPTS[0].code;      /* the largest, so the panels open populated */
  let openKpi="sites";         /* tile 1 on s53 */
  let sitePage=1, sortSite="rec", dirSite="desc";
  let libCat=CATS[0];

  const D=()=>DEPTS.find(x=>x.code===dept);
  const NOSRC=`<span class="nosrc">Not captured</span>`;

  function pager(total,page,pages,noun){
    if(pages<=1)return `<div class="pager"><div class="pinfo">Showing ${F(total)} ${noun}</div></div>`;
    const win=[];for(let p=1;p<=pages;p++){if(p===1||p===pages||Math.abs(p-page)<=1)win.push(p);}
    let nums="",last=0;
    win.forEach(p=>{if(last&&p-last>1)nums+=`<span style="color:var(--mut)">…</span>`;
      nums+=`<button class="${p===page?'on':''}" data-pg="${p}">${p}</button>`;last=p;});
    const from=(page-1)*10+1,to=Math.min(total,page*10);
    return `<div class="pager"><div class="pinfo">Showing ${from} to ${to} of ${F(total)} ${noun}</div>
      <div class="pbtns"><button data-pg="prev" ${page===1?'disabled':''}>&lsaquo; Prev</button>${nums}
      <button data-pg="next" ${page===pages?'disabled':''}>Next &rsaquo;</button></div></div>`;
  }

  /* ===== top panel, s53 =====
     Seven tiles, the client's own labels, all clickable per their note
     "Clickable top panel stats to show data". The Go-Live date sits above them
     as s53 draws it, and reads Not captured: nothing in Cloud Governance
     records when a site became EDRMS compliant, only when the SharePoint site
     was created, and for a converted site those are different dates. Audit
     question 4. */
  const TILES=[
    {k:"sites", lab:"Total number of sites created",                   val:d=>F(d.sites)},
    {k:"users", lab:"Total number of EDRMS users",                     val:d=>F(d.users)},
    {k:"visitors",lab:"Total number of site visitors",                 val:d=>F(Math.round(d.users*1.9))},
    {k:"docs",  lab:"Total number of documents in EDRMS",              val:d=>F(d.docs)},
    {k:"rec",   lab:"Total number of records declared in EDRMS",       val:d=>F(d.rec)},
    {k:"phys",  lab:"Total number of physical counterparts identified",val:d=>F(d.phys)},
    {k:"disp",  lab:"Total number of records due for disposal",        val:d=>F(d.due)},
  ];

  function drawTiles(){
    const d=D();
    document.getElementById("dp-kpis").innerHTML=
      `<div class="kpigrp act">
         <div class="gh"><b>Open a breakdown</b><span>${TILES.length} cards, each opens the table beneath</span></div>
         <div class="kpis">${TILES.map(t=>
           `<div class="kpi ${t.k===openKpi?"on":""}" data-k="${t.k}"><div class="lab">${t.lab}</div>
              <div class="val">${t.val(d)}</div><div class="tap">&#9662; Click to open</div></div>`).join("")}</div>
       </div>`;
  }

  /* Per card, updating the rail in place, for the same reason as every other
     dashboard here: rebuilding the grid destroys the node mid click. */
  function wireTiles(){
    document.querySelectorAll("#dp-kpis .kpi[data-k]").forEach(card=>{
      card.onclick=()=>{
        openKpi=card.dataset.k;
        document.querySelectorAll("#dp-kpis .kpi[data-k]").forEach(el=>
          el.classList.toggle("on",el.dataset.k===openKpi));
        drawDrill();
      };
    });
  }

  /* ===== the seven drills, s55 to s60 =====
     Column names are the client's, verbatim. Where a measure has no source in
     any system this report reads, the cell says so rather than printing a
     plausible number. */
  function drawDrill(){
    const d=D(), sites=sitesFor(dept);
    const vis=s=>Math.round(s.users*1.9);
    let title,sub,cols,rows,tiles,asks=[];

    if(openKpi==="sites"){
      /* s55. Site owners are real: Cloud Governance carries a Primary Business
         Owner on every workspace.

         Sorted and paged at ten rows, the house pattern. The deck asks for
         neither, but ITD alone owns 104 sites and an unpaged list of that
         length is unreadable, so this is a usability addition rather than a
         change to what is reported. */
      return drawSites(d,sites);
    }

    else if(openKpi==="users"){
      /* s54. Rows are divisions, as their detail slide draws it. Four of the
         five measures have no source: nothing tells us whether a person is
         staff, a contractor or a consultant, whether they were trained, or
         when they were onboarded. s54 asks that of itself, "Source: Database
         of end users? Owned and maintained by?". Audit question 3. */
      /* s54 draws division rows. Division is empty on all 1,032 sites, all
         286 users and all 676 groups in Cloud Governance, so the tier came off
         on 17 August. The rows are the activity bands instead, which is what
         the M365 activity report actually supports. Audit question 5. */
      title="Users";
      sub="Users with recorded activity, and how recently they were last active.";
      cols=["Activity","Number of users","Share of department"];
      const never=Math.round(d.users*0.11), idle90=Math.round(d.users*0.19);
      rows=[["Used EDRMS in the last 90 days",F(d.users-never-idle90),
             PCT(d.users-never-idle90,d.users).toFixed(1)+"%"],
            ["No access in the last 90 days",F(idle90),PCT(idle90,d.users).toFixed(1)+"%"],
            ["Never accessed EDRMS",F(never),PCT(never,d.users).toFixed(1)+"%"]];
      tiles=[["Users with recorded activity",F(d.users)],
             ["Never accessed EDRMS",F(never)],
             ["No access in 90 days",F(idle90)]];
      asks=["Active users month on month, per department",
            "Users who have not accessed their site, to track transfers and leavers",
            "New users, listed for onboarding"];
    }

    else if(openKpi==="visitors"){
      /* s56. The client asks on the slide "Is this data available in
         SharePoint/Cloud Governance?". Visitors: yes. The internal and
         external split and the access request counts have not been confirmed
         against the Cloud Governance guest and request reports. Audit
         question 15. */
      title="Visitors";
      sub="Site visitors, and requests for access.";
      /* A visitor is a person. A page view is an event, and one person
         visiting fifty times is fifty page views and one visitor, so the two
         are not interchangeable. Page views are in the usage export today;
         visitors come from site analytics per site. Page views are shown
         alongside rather than instead, because they are producible now and
         they answer a different and useful question about how heavily a site
         is read. */
      cols=["Name of sites","Total number of visitors","Page views","Views per visitor",
            "Share of department"];
      rows=sites.map(s=>[s.name,F(vis(s)),F(vis(s)*7),"7.0",
                         PCT(vis(s),sites.reduce((a,x)=>a+vis(x),0)).toFixed(1)+"%"]);
      tiles=[["Total number of visitors",F(sites.reduce((a,s)=>a+vis(s),0))],
             ["Page views",F(sites.reduce((a,s)=>a+vis(s)*7,0))],
             ["Sites reporting",F(sites.length)]];
    }

    else if(openKpi==="docs"){
      /* s57. The migration figures are drawn here, but s11 says of the
         migration dashboard "I do not believe this is required at all", and
         nothing marks a document as migrated in any case. Audit question 9. */
      title="Total number of documents in EDRMS";
      sub="Documents created or uploaded, by site.";
      cols=["Name of sites","Number of documents created / uploaded",
            "Number of users creating documents","Documents size (in GB)"];
      rows=sites.map(s=>[s.name,F(s.docs),F(Math.max(1,Math.round(s.users*0.71))),GB(s.docs/3400)]);
      tiles=[["Total number of documents",F(d.docs)],
             ["Total documents size",GB(d.docs/3400)],
             ["Sites reporting",F(sites.length)]];
      asks=["New documents created month on month, per department and division",
            ];
    }

    else if(openKpi==="rec"){
      /* s58 asks for collapsible division rows. Division has no source
         anywhere, so the tier came off on 17 August and this is a flat list of
         sites. Audit question 5. */
      title="Compliance review, record declaration";
      sub="Records declared and the people declaring them, by site.";
      cols=["Name of sites","Total number of records declared","People who declared a record",
            "Documents declared","Share of department"];
      rows=sites.map(s=>[s.name,F(s.rec),F(Math.max(1,Math.round(s.users*0.34))),
                         PCT(s.rec,s.docs).toFixed(2)+"%",PCT(s.rec,d.rec).toFixed(1)+"%"]);
      tiles=[["Total number of records declared",F(d.rec)],
             ["Total number of users declaring records",F(d.declaring)],
             ["Total declared record size",GB(d.rec/3400)],
             ["Sites with no declared record in "+IDLE+" days",
              F(sites.filter(s=>s.idle>IDLE).length)]];
      asks=["Records declared month on month, and declaration rate per site",
            "Sites with no declared record in "+IDLE+" days"];
    }

    else if(openKpi==="phys"){
      /* s59. Note the client's slide repeats s58's last three columns
         unchanged and only edits the measure to physical. Built as drawn,
         with the copy queried in the audit, question 10. */
      title="Physical counterpart";
      sub="Records with a physical counterpart, by site.";
      cols=["Name of sites","Total number of physical records declared",
            "Total number of users declaring records","Share with a counterpart",
            "Share of department"];
      rows=sites.map(s=>[s.name,F(s.phys),F(Math.max(1,Math.round(s.users*0.34))),
                         PCT(s.phys,s.rec).toFixed(1)+"%",PCT(s.phys,d.phys).toFixed(1)+"%"]);
      tiles=[["Total number of physical records declared",F(d.phys)],
             ["Total number of users declaring records",F(d.declaring)],
             ["Share of declared records",PCT(d.phys,d.rec).toFixed(1)+"%"],
             ["Sites reporting",F(sites.length)]];
      asks=["Physical records declared month on month, per department",
            "Physical counterpart completion rate, records turned over for RAC storage against records declared with a counterpart"];
    }

    else {
      /* s60. Three of the eight columns are producible. The approver and the
         three status columns need fields the EDRMS application does not have.
         Audit question 7 specifies the change request. */
      title="Disposal";
      sub="Records due for disposal, by library.";
      const libs=librariesFor(dept).slice(0,10);
      cols=["Library name","Number of records due for disposal","Next due date for disposal",
            "With physical counterpart?","Share of department"];
      const dueSplit=split(d.due,libs.map((l,i)=>1+(i%4)));
      rows=libs.map((l,i)=>[l.lib,F(dueSplit[i]),DUE_DATES[i%DUE_DATES.length],
                            l.phys>0?"Yes":"No",PCT(dueSplit[i],d.due).toFixed(1)+"%"]);
      tiles=[["Total number of records due for disposal",F(d.due)],
             ["Libraries with records due",F(libs.length)]];
      asks=["Records disposed month on month, per department and division",
            "Overdue disposal actions and pending approvals",
            "Disposal completion rate, including physical counterparts",
            "Records due next quarter, for planning and advance notice"];
    }

    const body=rows.map(r=>
      `<div class="drow">${r.map((c,j)=>
        j?`<div class="num">${c}</div>`:`<div class="dn">${c}</div>`).join("")}</div>`).join("");

    document.getElementById("dp-drill").innerHTML=
      `<div class="ptitle">${title}</div>
       <div class="psub">${sub}</div>
       <div class="tiles">${tiles.map(([l,v])=>
         `<div class="tile"><div class="tl">${l}</div><div class="tv">${v}</div></div>`).join("")}</div>
       <div class="scrollx"><div class="dtab wide" style="--dc:minmax(170px,1.4fr) repeat(${cols.length-1},minmax(110px,1fr))">
         <div class="dhead">${cols.map((c,i)=>
           `<div class="${i?"num":""}">${c}</div>`).join("")}</div>
         ${body}
       </div></div>
       ${asks.length?`<div class="asks"><div class="ah">Also asked for on this screen</div>
         <ul>${asks.map(a=>`<li>${a}</li>`).join("")}</ul></div>`:""}`;

  }

  const SITECOLS=[{k:"name",lab:"Name of sites"},{k:"owner",lab:"Site owners"},
                  {k:"docs",lab:"Number of documents",num:1},{k:"rec",lab:"Number of records",num:1},
                  {k:"phys",lab:"Number of physical counterparts",num:1},
                  {k:"due",lab:"Number of records due for disposal",num:1}];

  function drawSites(d,sites){
    const rows=[...sites].sort((a,b)=>{
      const cmp=(sortSite==="name"||sortSite==="owner")
        ? String(a[sortSite]).localeCompare(String(b[sortSite])) : a[sortSite]-b[sortSite];
      return dirSite==="asc"?cmp:-cmp;
    });
    const pages=Math.max(1,Math.ceil(rows.length/10));
    if(sitePage>pages)sitePage=pages;
    const page=rows.slice((sitePage-1)*10,sitePage*10);
    const t=f=>sites.reduce((a,s)=>a+s[f],0);

    document.getElementById("dp-drill").innerHTML=
      `<div class="ptitle">Overview of EDRMS sites</div>
       <div class="psub">Every site owned by this department, and what it holds.</div>
       <div class="tiles">
         <div class="tile"><div class="tl">Total number of sites created</div><div class="tv">${F(d.sites)}</div></div>
         <div class="tile"><div class="tl">Total number of documents in EDRMS</div><div class="tv">${F(d.docs)}</div></div>
         <div class="tile"><div class="tl">Total number of records declared in EDRMS</div><div class="tv">${F(d.rec)}</div></div>
         <div class="tile"><div class="tl">Total number of physical counterparts identified</div><div class="tv">${F(d.phys)}</div></div>
         <div class="tile"><div class="tl">Total number of records due for disposal</div><div class="tv">${F(d.due)}</div></div>
       </div>
       <div class="scrollx"><div class="dtab wide" id="dp-sites"
            style="--dc:minmax(170px,1.4fr) minmax(150px,1fr) repeat(4,minmax(110px,1fr))">
         <div class="dhead">${SITECOLS.map(c=>
           `<div class="hd${c.num?" num":""}${sortSite===c.k?" on":""}" data-s="${c.k}">${c.lab}${
             sortSite===c.k?(dirSite==="asc"?" ↑":" ↓"):""}</div>`).join("")}</div>
         ${page.map(s=>`<div class="drow"><div class="dn">${s.name}</div>
           <div class="dn" style="font-weight:400">${s.owner}</div>
           <div class="num">${F(s.docs)}</div><div class="num">${F(s.rec)}</div>
           <div class="num">${F(s.phys)}</div><div class="num">${F(s.due)}</div></div>`).join("")}
       </div></div>
       <div id="dp-sites-pager">${pager(rows.length,sitePage,pages,"sites")}</div>
       <div class="asks"><div class="ah">Also asked for on this screen</div>
         <ul><li>Sites with no activity in ${IDLE} days: ${F(sites.filter(s=>s.idle>IDLE).length)}</li>
             <li>Records declared month on month, per department and division</li></ul></div>`;

    document.querySelectorAll("#dp-sites .hd").forEach(el=>el.onclick=()=>{
      const k=el.dataset.s;
      if(sortSite===k)dirSite=dirSite==="asc"?"desc":"asc";
      else{sortSite=k;dirSite=(k==="name"||k==="owner")?"asc":"desc";}
      sitePage=1; drawDrill();
    });
    wirePager("#dp-sites-pager",go=>{
      sitePage=go==="prev"?Math.max(1,sitePage-1):go==="next"?Math.min(pages,sitePage+1):+go;
      drawDrill();
    });
  }

  const DUE_DATES=["12 Sep 2026","28 Sep 2026","04 Oct 2026","19 Oct 2026","02 Nov 2026","23 Nov 2026",
                   "07 Dec 2026","21 Dec 2026","11 Jan 2027","25 Jan 2027","08 Feb 2027","22 Feb 2027"];

  /* ===== library usage, s61 to s66 =====
     One screen per file plan category, with a picker rather than six separate
     screens. Every figure here needs the term to document join, which does not
     exist: nothing links a library to a file plan term. The libraries are
     grouped by category on the assumption their slides hint at, that the
     library name is the term. Audit questions 12 and 13. */
  function drawLibs(){
    /* Number of users per library has no source. Microsoft 365 publishes
       activity per SITE, not per library, so a per library user count cannot
       be produced from anything we hold. */
    const libs=librariesFor(dept).filter(l=>l.cat===libCat);
    const t=f=>libs.reduce((a,l)=>a+l[f],0);
    document.getElementById("dp-libs").innerHTML=
      `<div class="tiles">
         <div class="tile"><div class="tl">Total library names</div><div class="tv">${F(libs.length)}</div></div>
         <div class="tile"><div class="tl">Total number of libraries provisioned</div><div class="tv">${F(libs.length)}</div></div>
         <div class="tile"><div class="tl">Total number of documents</div><div class="tv">${F(t("docs"))}</div></div>
         <div class="tile"><div class="tl">Total number of records declared</div><div class="tv">${F(t("rec"))}</div></div>
         <div class="tile"><div class="tl">Total number of physical counterparts</div><div class="tv">${F(t("phys"))}</div></div>
       </div>
       <div class="scrollx"><div class="dtab wide" style="--dc:minmax(170px,1.4fr) repeat(4,minmax(110px,1fr))">
         <div class="dhead"><div>Library names</div>
           <div class="num">Number of documents</div><div class="num">Number of records declared</div>
           <div class="num">Number of physical counterparts</div><div class="num">Declaration rate</div></div>
         ${libs.map(l=>`<div class="drow"><div class="dn">${l.lib}<small>${l.cat}</small></div>
           <div class="num">${F(l.docs)}</div>
           <div class="num">${F(l.rec)}</div><div class="num">${F(l.phys)}</div>
           <div class="num">${(100*l.rec/Math.max(1,l.docs)).toFixed(1)}%</div></div>`).join("")}
       </div></div>
       <div class="asks"><div class="ah">Also asked for on this screen</div>
         <ul><li>Libraries with no declared record in ${IDLE} days</li>
             <li>Records declared month on month, and declaration rate per site</li></ul></div>`;
  }

  /* ===== record declaration trend, s24 =====
     Cumulative, matching the Bank-wide trend and the curve the client drew.
     Scaled to this department, so the curve ends at its declared count. */
  function drawTrend(){
    const d=D();
    const share=d.rec/DATA.MONTH_VALUES.reduce((a,v)=>a+v,0);
    const monthly=DATA.MONTH_VALUES.map(v=>Math.round(v*share));
    monthly[monthly.length-1]+=d.rec-monthly.reduce((a,v)=>a+v,0);
    let run=0;
    const pts=DATA.MONTH_VALUES.map((v,i)=>{
      run+=monthly[i];
      return {label:DATA.MONTH_FULL[i],short:DATA.MONTH_LABELS[i],value:run};
    });
    console.assert(pts[pts.length-1].value===d.rec,
      "The department declaration curve must end at its declared record count");
    document.getElementById("dp-trend").innerHTML=CHART.area(pts,{height:220});
  }

  function drawAll(){
    const d=D();
    document.getElementById("dp-name").textContent=d.code+" - "+d.name;
    drawTiles(); wireTiles(); drawDrill(); drawLibs(); drawTrend();
  }

  const html=`<section class="dash-dp">
    <div class="band">
      <h2>Department insights</h2>
      <div class="bd">How one department, office or resident mission is managing its records.</div>
    </div>
    <div class="panel">
      <div class="ptitle" id="dp-name"></div>
      <div class="psub">Choose a department, office or resident mission.</div>
      <div class="toolbar">
        <span class="lbl">Department / office / RM</span>
        <select id="dp-sel"></select>
      </div>
      <div id="dp-kpis"></div>
    </div>
    <div class="panel" id="dp-drill"></div>

    <div class="band">
      <h2>Library usage</h2>
      <div class="bd">Libraries grouped by institutional file plan category.</div>
    </div>
    <div class="panel">
      <div class="ptitle">Departmental library usage</div>
      <div class="psub">Choose a file plan category.</div>
      <div class="toolbar">
        <span class="lbl">Category</span>
        <select id="dp-cat">${CATS.map(c=>`<option value="${c}">${c}</option>`).join("")}</select>
      </div>
      <div id="dp-libs"></div>
    </div>

    <div class="band">
      <h2>Record declaration trend</h2>
      <div class="bd">Records declared over time for this department, as a running total.</div>
    </div>
    <div class="panel">
      <div class="ptitle">Record declaration trend</div>
      <div class="psub">Records declared across this department's EDRMS sites.</div>
      <div id="dp-trend"></div>
    </div>

    <div class="band">
      <h2>Conventions and programme dates</h2>
      <div class="bd">The approved convention, and the records management programme.</div>
    </div>
    <div class="panel">
      <div class="ptitle">Approved SharePoint site, library, and folder convention</div>
      <div class="psub">The convention in force for this department.</div>
      <div class="reflist">
        <div class="refrow"><b>Link</b><div class="rv">${CONVENTION.link}</div><div class="rs"></div></div>
        <div class="refrow"><b>Date of approval</b><div class="rv">${CONVENTION.approved}</div><div class="rs"></div></div>
        <div class="refrow"><b>Last updated</b><div class="rv">${CONVENTION.updated}</div><div class="rs"></div></div>
        <div class="refrow"><b>Version no.</b><div class="rv">${CONVENTION.version}</div><div class="rs"></div></div>
      </div>
    </div>
    <div class="panel">
      <div class="ptitle">Records management programme</div>
      <div class="psub">Key records management dates for this department.</div>
      <div class="reflist">
        ${PROGRAMME.map(p=>`<div class="refrow"><b>${p.lab}</b><div class="rv">${p.date}</div>
          <div class="rs ${p.status==="Done"?"done":"due"}">${p.status}</div></div>`).join("")}
      </div>
    </div>
  </section>`;

  function init(){
    const sel=document.getElementById("dp-sel");
    sel.innerHTML=DEPTS.map(d=>
      `<option value="${d.code}" ${d.code===dept?"selected":""}>${d.code} - ${d.name}</option>`).join("");
    sel.onchange=e=>{dept=e.target.value;sitePage=1;drawAll();};
    const cat=document.getElementById("dp-cat");

    cat.onchange=e=>{libCat=e.target.value;drawLibs();};

  return {

      departmentCount:DEPTS.length,
      categories:CATS.length,

    },
    /* Called by openDashboard() when a reader clicks a department name on
