<!-- Same as the Floot app: the report is laid out on a fixed 1920px canvas
     and scaled to the window, and a one time password gate (client side
     only, it keeps casual visitors out, it is not real security). -->
<script>
(() => {
  const DESIGN_WIDTH = 1920;
  // Same as the Floot app: the screen's scaling when the report opens is
  // treated as 100%, so every screen opens on the same full-width layout, and
  // browser zoom (Ctrl + / Ctrl -) then enlarges or shrinks it like any page.
  // Zoom is read as the change in devicePixelRatio since the report opened.
  const BASE_DPR = window.devicePixelRatio || 1;
  const fit = () => {
    const zoom = (window.devicePixelRatio || 1) / BASE_DPR;
    const z = (window.innerWidth * zoom) / DESIGN_WIDTH;
    document.documentElement.style.zoom = String(z);
    // Zoom shrinks the sidebar's 100vh, so let it run the full page height instead.
    const side = document.getElementById("side");
    if (side && z !== 1) { side.style.height = "auto"; side.style.alignSelf = "stretch"; }
  };
  fit();
  window.addEventListener("resize", fit);
  const KEY = "edrms-report-access-v1";
  let ok = false;
  try { ok = localStorage.getItem(KEY) === "1"; } catch (_) {}
  if (ok || location.protocol === "file:") return;
  const gate = document.createElement("div");
  gate.id = "access-gate";
  gate.style.cssText = "position:fixed;inset:0;z-index:99999;display:flex;align-items:center;justify-content:center;background:#F4F6F9;font-family:Arial,sans-serif";
  gate.innerHTML = '<form style="background:#fff;border:1px solid #d8e1eb;border-radius:12px;padding:32px;width:380px;box-shadow:0 4px 18px rgba(16,48,80,.12)">' +
    '<h1 style="margin:0 0 8px;font-size:22px;color:#0B2545">EDRMS Reporting Suite</h1>' +
    '<p style="margin:0 0 16px;font-size:14px;color:#5b6b7d">Enter the password to open the report. You will only be asked once on this browser.</p>' +
    '<input type="password" autofocus placeholder="Password" aria-label="Password" style="width:100%;box-sizing:border-box;height:40px;padding:8px 12px;border:1px solid #cfd8e3;border-radius:7px;font-size:14px">' +
    '<p class="err" style="display:none;margin:8px 0 0;font-size:13px;color:#b42318">Incorrect password. Please try again.</p>' +
    '<button type="submit" style="margin-top:14px;height:40px;padding:0 18px;border:0;border-radius:7px;background:#0072BC;color:#fff;font-size:14px;cursor:pointer">Open report</button></form>';
  document.body.appendChild(gate);
  const input = gate.querySelector("input"), err = gate.querySelector(".err");
  input.oninput = () => { err.style.display = "none"; };
  gate.querySelector("form").onsubmit = (e) => {
    e.preventDefault();
    if (input.value.trim().toLowerCase() === "adb") {
      try { localStorage.setItem(KEY, "1"); } catch (_) {}
      gate.remove();
    } else err.style.display = "block";
  };
})();
</script>
